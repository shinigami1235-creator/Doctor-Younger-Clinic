title: 'Facial Treatment: Khun Kai Supranee''s Secret to a Bright, Clear, Lifted Face'
by: Review by Supranee Charoenphol (Khun Kai)
body: <p>First of all, thank you to "Khun Kai Supranee Charoenphol", an actress and presenter, a young mother who is still beautiful. With a job that means losing sleep, wearing a lot of makeup, and being out in the sun and under the lights on a drama set, plus getting older every day, Kai has to keep coming to consult the doctor to keep her facial skin beautiful, fresh, glowing and full of life. Today she came to consult Dr. Boy at the Thanya Park Srinakarin branch and had 2 treatments together, which are <strong>Cry-O Lift Treatment</strong> and <strong>Rubymate Treatment </strong> to nourish her skin fully, ready to go back to filming the drama. </p><p><img src="https://www.doctoryounger.com/img-uploads/DY84%20copy.jpg" alt=""></p><p>Cry-O Lift Treatment is one Kai likes very much. You could say she has to have it almost every time, because it's good for the face and good for the skin. It is one of the top popular treatments because it uses cold to treat the skin, helping stimulate collagen
  production under the skin, making the skin firm and tight, smooth, soft, moisturized, bright and full of life.</p><p><img src="https://www.doctoryounger.com/img-uploads/DY83%20copy.jpg" alt=""></p><p>The other one is Rubymate Treatment, which is important for Kai too, because as she gets older her face starts to sag. This Rubymate treatment lifts and firms the face so it is taut, firm and well-shaped, with skin that looks firm, plump and full of life. Kai likes it very much, and anyone who tries it will like it and get hooked too.</p><p><img src="https://www.doctoryounger.com/img-uploads/DY80%20copy.jpg" alt=""></p>
