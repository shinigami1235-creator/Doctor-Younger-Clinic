title: Treating Acne on the Face
by: Review by Rin
body: <p>My acne was very bad, with big red pimples, and I was starting to lose my confidence. It had been going on for several months, and I had seen doctors in many places without any improvement. A friend recommended Doctor Younger, so I came here for a consultation. That day I came to the Sukhumvit 23 branch and met Dr. Jane, and I decided to become a patient right away.</p><p><img src="https://www.doctoryounger.com/img-uploads/Ryn%20%E0%B8%AA%E0%B8%B4%E0%B8%A74%20copy.jpg" alt=""></p><p>The doctor said... another important problem for young women is acne, and some people have it so severely that they lose their confidence completely. Acne in women may not come from hygiene alone. It can also come from hormones, with abnormally high levels of male hormones in the body. The doctor advised the following treatment steps.</p><p>1.) A blood test to check hormone levels</p><p>2.) Take medicine to balance hormone levels, and anti-inflammatory medicine</p><p>3.) A Clear Light program is recommended,
  which is high-intensity red light therapy to reduce acne inflammation</p><p><img src="https://www.doctoryounger.com/img-uploads/Ryn%20%E0%B8%AA%E0%B8%B4%E0%B8%A72%20copy.jpg" alt=""></p><p>After cleansing the face, it was time for the red light to treat the acne, the culprit that makes us lose confidence. It takes about 15 to 20 minutes.</p><p><img src="https://www.doctoryounger.com/img-uploads/Ryn%20%E0%B8%AA%E0%B8%B4%E0%B8%A73%20copy.jpg" alt=""></p><p>The red light, or Red Light, has properties that help treat inflamed acne. Just lie back and relax for a little while and it's all done. After that I went out to see the doctor again to book a blood test, which I have to go to the hospital for myself, then bring the results back for the doctor to see. The most important advice is absolutely do not press or squeeze the pimples, and do not have any other treatments, because that can cause inflammation and scars, and may lead to pitted acne scars afterwards. You should also follow the doctor's
  instructions strictly throughout the treatment.</p><p><img src="https://www.doctoryounger.com/img-uploads/Ryn%20%E0%B8%AA%E0%B8%B4%E0%B8%A71%20copy.jpg" alt=""></p><p>The doctor said my case was quite severe and would take quite a long time to treat. After 2 weeks, the pimples started to go down and were less red and inflamed. I came for Red Light about 5 to 6 times and applied the medicine the doctor gave me, and I also tried to look after my skin and not be a meddler who presses, squeezes or touches it. That was all. In total, after a month and a half, all those pimples started to disappear from my face. Thank you "Dr. Jane" and thank you Doctor Younger for taking such good care of me.</p>
