title: Removing a Mole at the Corner of the Mouth with CO2 Laser
by: Review by Nipa
body: <p>Today a customer, "Khun Nipa", came in for CO2 Laser to remove a mole at the corner of the mouth. The treatment was handled by Dr. Patcharaporn Wachiranuntasin (Dr. Bee) at the Terminal 21 branch. Thank you to our customer for trusting us to look after you.</p><p><img src="https://www.doctoryounger.com/img-uploads/DY178%20copy.jpg" alt=""></p>
