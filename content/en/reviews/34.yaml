title: Fractional Co2 Laser by Khun Narongwit Techathanawat, Famous Songwriter
by: Review by Narongwit Techathanawat
body: <p>The older we get, the more we need to look after ourselves. "Khun Nueng Narongwit Techathanawat", a songwriter, singer and producer, came for Fractional Co2 Laser at the Thanya Park Srinakarin branch with Dr. Sawang Amphornphan, to care for and refine his facial skin, tighten pores, and make the skin look smoother and healthier, turning back time so that age is just a number.</p><p><img src="https://www.doctoryounger.com/img-uploads/DY319%20copy.jpg" alt=""></p><p>Before the treatment, numbing cream is applied and left on for about 40 minutes, and the treatment itself doesn't take long, only about 15 minutes. It doesn't hurt during the treatment. You just feel a little warmth, because the doctor said it depends on the settings, which are chosen according to each person's skin condition and problems. After the treatment the doctor said there would be slight scabbing, but mine won't be much because the setting used was gentle, to cleanse the face or exfoliate the top layer of cells
  so the facial skin looks smoother. I also must not go out in strong sunlight. Another thing is that the doctor has a light hand and is very skilled, so I trust coming for treatment here.</p><p><img src="https://www.doctoryounger.com/img-uploads/DY321%20copy.jpg" alt=""></p>
