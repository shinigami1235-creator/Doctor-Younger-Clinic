body: <p>Dr. Urairak Sapsarn (Dr. Toey) graduated from the Faculty of Medicine with honors from Thammasat University.</p><h3>Higher education</h3><p>- Doctor of Medicine (Honors), Thammasat University</p><h3>Specialist training in dermatology</h3><p>- M.S. in Clinical Dermatology, Chulabhorn International College of Medicine, Thammasat University</p><h3>Specialist training in dermatologic laser surgery</h3><p>- Fellowship in Dermatologic Surgery and Laser, Faculty of Medicine Ramathibodi Hospital, Mahidol University</p><p>Specialist training in anti-aging medicine and preventive medicine </p><p>- American Board of Anti-Aging and Regenerative Medicine</p><p> - Diploma of Thai Board of Preventive Medicine (Public Health)</p><h3>Current role</h3><p>- Dermatologist at Doctor Younger Clinic</p><h3>Clinic schedule</h3><p>Sukhumvit 23 branch</p><p>- Tuesday and Wednesday, 12:00 to 18:00</p><p>- Sunday, 15:00 to 18:00</p>
