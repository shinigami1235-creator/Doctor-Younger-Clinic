body: <p>Dr. Patcharaporn Wachiranuntasin (Dr. Bee) is a lovely, kind young doctor with extraordinary skill and technique, and holds a Doctor of Medicine degree from the Faculty of Medicine Siriraj Hospital. </p><h3>Specialist training in dermatology</h3><p>- Diploma in Dermatology, Faculty of Medicine Ramathibodi Hospital </p><p>Specialist training in dermatologic laser surgery</p><h3>Specialist training in dermatologic laser surgery</h3><p>- Fellowship in Cutaneous and Laser Surgery, Institute of Dermatology, Anti-Aging Medicine </p><p>- American Board of Anti – Aging and Regenerative Medicine (A 4 M) USA</p><h3>Current role</h3><p>- Dermatologist at Doctor Younger Clinic</p><h3>Clinic schedule</h3><p>Sukhumvit 23 branch</p><p>- Tuesday and Thursday, 12:00 to 18:00</p><p>- Saturday, 12:00 to 18:00</p><p>Thanya Park Srinakarin branch</p><p>- Monday and Wednesday, 12:00 to 18:00</p><p>- Friday, 12:00 to 16:00</p>
