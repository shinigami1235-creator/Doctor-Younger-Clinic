body: <p>Dr. Nopadol Amornpinyokiat (Dr. Boy) is a handsome young doctor with clear, fresh skin and plenty of talent, with an honors degree in Doctor of Medicine from Chulalongkorn University. He has also worked at a leading, well-known private hospital for more than 10 years.</p><h3>Higher education</h3><p>- Doctor of Medicine (Honors), Chulalongkorn University</p><h3>Specialist training in dermatology</h3><p>- M.S. in Dermatology, Chulalongkorn University</p><h3>Specialist training in dermatologic laser surgery</h3><p>- Fellow in Dermatologic laser Surgery, Mahidol University</p><p>- Fellow in Cosmetic and Surgical Dermatology, Miami, USA.</p><p>- Fellow in Dermatological laser Surgery, Mount Sinai Medical Center, USA.</p><h3>Current role</h3><p>- Dermatologist at Doctor Younger Clinic</p><h3>Clinic schedule</h3><p>Sukhumvit 23 branch</p><p>- Sunday and Monday, 12:00 to 17:00</p><p>Thanya Park Srinakarin branch</p><p>- Tuesday, 13:00 to 15:00</p>
