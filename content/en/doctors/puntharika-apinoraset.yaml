body: <p>Dr. Puntharika Apinoraset graduated with a Doctor of Medicine degree from Ramathibodi Hospital, Mahidol University.</p><h3>Higher education</h3><p>- Doctor of Medicine, Ramathibodi Hospital, Mahidol University</p><h3>Specialist training in dermatology</h3><p>- M.S. in Dermatology, University of Hertfordshire, United Kingdom</p><h3>Specialist training in dermatologic laser surgery</h3><p>- Fellowship in Dermatologic Surgery, Faculty of Medicine, Siriraj Hospital, Mahidol University</p><p>Specialist in treating birthmarks</p><p>- Fellowship in Birthmark skin lesion, University of Malmo, Sweden</p><p>- Fellowship in Dermatologic Laser Surgery, SkinCare Physicians, Chestnut Hill, MA, United States</p><h3>Current role</h3><p>- Dermatologist at Doctor Younger Clinic</p><h3>Clinic schedule</h3><p>Sukhumvit 23 branch</p><p>- Tuesday, 14:00 to 18:00</p>
