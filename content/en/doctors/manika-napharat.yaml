body: <p>Dr. Manika Napharat (Dr. Palm) is a lovely, kind doctor with extraordinary skill and technique, and holds a Doctor of Medicine degree from the Faculty of Medicine Ramathibodi Hospital.</p><h3>Higher education</h3><p>- Doctor of Medicine, Faculty of Medicine Ramathibodi Hospital</p><h3>Specialist training in dermatology</h3><p>- Diploma in Dermatology, Institute of Dermatology</p><h3>Specialist training in dermatologic laser surgery</h3><p>- Fellowship in Cutaneous and Laser Surgery, Faculty of Medicine Ramathibodi Hospital</p><p>- Fellowship Anti – Aging Medicine, Dhurakij Pundit University</p><p> Anti-aging medicine</p><p> - American Board of Anti – Aging and Regenerative Medicine ( A4M) US.</p><h3>Current role</h3><p>Dermatologist at Doctor Younger Clinic</p><h3>Clinic schedule</h3><p>Sukhumvit 23 branch</p><p>- Friday (1st and 3rd week of the month), 12:00 to 18:00</p><p>Thanya Park Srinakarin branch</p><p>- Saturday, 12:00 to 18:00</p>
