body: <p>Dr. Wilai Thanasarnaksorn graduated from the Faculty of Medicine Ramathibodi Hospital, Mahidol University. She has worked in public and private hospitals for more than 10 years, combining technique with her own personal experience. </p><h3>Higher education</h3><p>- Faculty of Medicine Ramathibodi Hospital, Mahidol University</p><h3>Specialist training in dermatology</h3><p>- Certificate of Attendance in Dermatological Laser and Facial Cosmetic Surgery, Hong Kong, 2002.</p><p>- Certificate in the Scientific Program, Anti-Aging Award Conference, European Academy of Anti Aging Medicine, Paris-France, March 2004.</p><p>- Diploma in Dermatological Science, University of Wales College of Medicine, UK, 1993.</p><p>- Certificate of Membership International Fellow, American Academy of Dermatology and American Academy of Dermatology Association, 1998.</p><h3>Specialist training in dermatologic laser surgery</h3><p>- Certificate of Attendance The Asian Laser Forum, Hong Kong Surgical Laser
  Association, 2003.</p><p>- Certificate of Attendance in Dermatologic Laser and Surgery in Asians, Cebu, Philippines, 2006.</p><h3>Current role</h3><p>- Adjunct Lecturer, Dermatology Unit, Department of Medicine, Ramathibodi Hospital, Mahidol University</p><p>- Dermatologist at Doctor Younger Clinic</p><h3>Clinic schedule</h3><p>Sukhumvit 23 branch</p><p>- Wednesday, 13:00 to 16:00</p><p>- Saturday (3rd week of the month), 13:00 to 16:00</p><p>Thanya Park Srinakarin branch</p><p>- Saturday (except the 3rd week of the month), 13:00 to 16:00</p>
