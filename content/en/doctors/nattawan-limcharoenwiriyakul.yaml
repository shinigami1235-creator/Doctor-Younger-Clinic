body: <p>Dr. Nattawan Limcharoenwiriyakul (Dr. Maprang) graduated with a Doctor of Medicine degree from Chulalongkorn University and studied anti-aging medicine.</p><h3>Higher education</h3><p>- Doctor of Medicine, Chulalongkorn University</p><h3>Specialist training in dermatology</h3><p>- Postgraduate Diploma (PgDip) in Practical Dermatology, Cardiff University, Wales, UK</p><p>- M.S. in Clinical Dermatology, Srinakharinwirot university, Bangkok, Thailand</p><h3>Specialist training in dermatologic laser surgery</h3><p>- Fellowship in Dermatologic Surgery and Laser, Faculty of Medicine Ramathibodi Hospital, Mahidol University</p><p>Specialist training in anti-aging medicine and preventive medicine</p><p>- American Board of Anti-Aging and Regenerative Medicine</p><h3>Dermatologist specializing in Botox &amp; Filler</h3><h3>Current role</h3><p>Dermatologist at Doctor Younger Clinic</p><h3>Clinic schedule</h3><p>Sukhumvit 23 branch</p><p>- Saturday (1st, 2nd and 4th week of the month), 12:00
  to 15:00</p><p>Thanya Park Srinakarin branch </p><p>- Saturday (3rd week of the month), 11:00 to 15:00</p>
