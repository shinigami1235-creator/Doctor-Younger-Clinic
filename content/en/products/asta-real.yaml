body: '<strong>Results from Asta Real</strong><ul><li>Protects the blood vessels of the brain and helps improve memory and learning</li><li>Relieves tired eyes, good for people who stare at screens for long hours</li><li>Helps prevent premature skin aging, reduces sagging skin and dark spots, and increases skin elasticity</li><li>Increases sperm count and quality</li><li>Stimulates the body''s immunity and improves cell response</li><li>Helps prevent fatty liver</li><li>Reduces inflammation in the digestive system, stomach ulcers, indigestion and acid reflux</li><li>Nourishes the heart, blood vessels and blood circulation, and lowers blood pressure </li><li>Restores the balance between insulin and glucose and increases the metabolic rate</li><li>Beneficial for people with diabetes and kidney disease: reduces glucose toxicity, reduces kidney degeneration and inflammation, improves pancreas function and increases insulin sensitivity</li><li>Muscles recover faster after exercise or injury,
  and muscle wasting is prevented</li></ul><strong>Why use it: </strong><p><strong>Astaxanthin </strong>is already known as the King of Antioxidant on its own, and research shows that astaxathin works best together with Vitamin C and Tocotrienol (a special type of vitamin E). <strong>Asta Real</strong> includes both of them, helping to protect DNA and mitochondria and to fight free radicals from toxins, alcohol, cigarettes, UV rays and chemical residues in the body.</p>'
