name: DOCTOR YOUNGER SUNSCREEN 360⁰ SPF50 PA+++
tagline: Made from many kinds of natural plant extracts to prevent wrinkles and dullness, with a light cream texture and good water resistance.
short: Made from many kinds of natural plant extracts to prevent wrinkles and dullness, with a light cream texture and good water resistance.
body: '<strong>Results from DOCTOR YOUNGER SUNSCREEN 360⁰ SPF50 PA+++ </strong><ul><li>Makes skin look fairer and brighter</li><li>Protects against skin problems such as freckles, melasma, dull skin and sunburn</li><li>Skin stays youthful for longer</li><li>Skin is healthy</li><li>Skin care in one step</li><li>Can be used in place of makeup base</li><li>Even with makeup on, it lasts all day</li></ul><p>Pollution around us makes our skin fight off many things every day, especially ultraviolet (ULTRAVIOLET) rays, or UV rays. UV rays include UVA rays, which can reach the epidermis and the dermis. Getting a lot of UVA creates free radicals in the skin, which damage the elasticity of the cells and make skin wrinkled, prematurely aged, dull and lacking in brightness. UVB rays are normally partly blocked by the atmosphere and cannot reach as deep into the skin as UVA, but UVB still makes skin lose moisture and causes burning, redness and sunburn (within 24 hours of long exposure to strong sunlight).
  </p>There are also infrared (IR) rays, which are heat rays found in sunlight, in the heat from cooking and in hot steam. They can destroy the collagen under the skin, causing premature wrinkles, loss of elasticity and dull skin. There is also the danger of light we can see with the naked eye, or VISIBLE LIGHT, which is light from fluorescent lamps and computer screens, and which can cause dark spots on the skin. <strong>Why use it: </strong> The sunscreen cream <strong>DOCTOR YOUNGER SUNSCREEN 360⁰ SPF50 PA+++</strong> is an innovation made from natural plant extracts, ready to protect the skin from damage by UVA and UVB rays, the causes of many kinds of wrinkles, melasma and freckles. It also helps protect the skin from heat and pollution, which are another cause of premature wrinkles, loss of elasticity and dull skin, as well as from light we can see with the naked eye (Visible Light), the cause of dark spots. Its light cream texture blends into the skin and absorbs well.'
usage: In the morning after applying facial moisturizer, or 15 to 30 minutes before going out in the sun, apply DOCTOR YOUNGER SUNSCREEN 360⁰ SPF50 PA+++ over the face and neck every day.
size: 30 g.
price: 1,200 baht
