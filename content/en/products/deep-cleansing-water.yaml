name: DOCTOR YOUNGER DEEP CLEANSING WATER
tagline: A water-based cleanser for wiping makeup off the face. It cleans well, wipes off easily and leaves the face not dry or tight.
short: A water-based cleanser for wiping makeup off the face. It cleans well, wipes off easily and leaves the face not dry or tight.
body: '<strong>Results from DOCTOR YOUNGER DEEP CLEANSING WATER</strong><ul><li>Helps remove makeup and keep skin clean</li><li>Helps nourish the skin</li><li>Helps skin stay moisturized</li></ul><p>When it comes to removing makeup from the face thoroughly, cleansing products are the answer, because they can clean and remove makeup completely, prevent inflammation and reduce clogged pores. Skin feels clean, fresh, smooth, soft and moisturized. It is gentle on the skin and, above all, does not irritate the eyes or sting the skin.</p><strong>Why use it: </strong><p>The facial cleansing product<strong> DOCTOR YOUNGER DEEP CLEANSING WATER</strong> helps remove makeup and waterproof sunscreen. It can be used around the eyes and on the lips, and it nourishes the skin with various ingredients such as ZEA MAYS (CORN) EXTRACT and SODIUM HYALURONATE, so it helps nourish the face for bright, moisturized skin. </p>'
usage: Soak a cotton pad with DOCTOR YOUNGER DEEP CLEANSING WATER and wipe over the face, around the eyes and on the lips. You can rinse off with water or leave it on.
size: 250 ml.
price: 800 baht
