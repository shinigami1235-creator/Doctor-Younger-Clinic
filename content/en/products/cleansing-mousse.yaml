name: DOCTOR YOUNGER CLEANSING MOUSSE
tagline: A gentle cleansing mousse that does not leave skin dry and tight after washing. Suitable for all skin types.
short: A gentle cleansing mousse that does not leave skin dry and tight after washing. Suitable for all skin types.
body: '<strong>Results from DOCTOR YOUNGER CLEANSING MOUSSE</strong><ul><li>Helps cleanse facial skin gently </li><li>Helps skin stay moisturized and adds brightness and freshness to facial skin</li></ul><p>Facial skin is delicate and SENSITIVE, so it should be cleansed with a face wash that is gentle on the skin.</p><strong>Why use it: </strong><p>The face wash <strong>DOCTOR YOUNGER CLEANSING MOUSSE</strong> contains no irritants and gently washes away dirt and excess oil from the face. Its soft mousse texture reduces friction between your hands and your skin, leaving skin moisturized and not dry or tight after washing.</p>'
usage: Pump DOCTOR YOUNGER CLEANSING MOUSSE onto the palm, gently massage it over the face and neck, then rinse off with clean water.
size: 150 ml.
price: 390 baht
