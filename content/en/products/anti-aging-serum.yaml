name: DOCTOR YOUNGER ANTI AGING SERUM
tagline: A facial serum that helps fade the look of wrinkles and promotes collagen and elastin production, keeping skin moisturized to reduce wrinkles and make it look firm and plump. Suitable for people under 35.
short: A facial serum that helps fade the look of wrinkles and promotes collagen and elastin production, keeping skin moisturized to reduce wrinkles and make it look firm and plump. Suitable for people under 35.
body: '<strong>Results from DOCTOR YOUNGER ANTI AGING SERUM</strong><ul><li>Helps nourish facial skin</li><li>Helps fade the look of wrinkles and delay early signs of aging</li><li>Helps skin stay hydrated, glowing and full of life</li><li>Skin looks firm, plump and youthful</li></ul><p>In today''s environment, our skin is at risk from pollution that makes wrinkles form more easily, whether it comes from sunlight, food or our habits. So we should pay more attention to skin care, to keep skin firm and youthful and looking healthy all the time.</p><strong>Why use it: </strong><p>The facial care product <strong>DOCTOR YOUNGER ANTI AGING SERUM</strong> contains natural extracts that help relax the facial muscles to reduce wrinkles, help prevent skin cells from losing water, and keep skin hydrated and plump. It helps build collagen (COLLAGEN), the protein under the skin that acts as the spring to keep skin firm, and elastin (ELASTIN), which makes skin flexible and holds skin cells in the right
  arrangement. As we get older, elastin breaks down, and wrinkles follow. ANTI AGING SERUM is a product that helps delay and fade the look of wrinkles. </p>'
usage: Apply a thin layer of DOCTOR YOUNGER ANTI AGING SERUM over the face and neck every day.
size: 30 g.
price: 1,200 baht
