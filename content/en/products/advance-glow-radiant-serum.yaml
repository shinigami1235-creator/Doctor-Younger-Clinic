name: DOCTOR YOUNGER Advance Glow Radiant Serum
tagline: A facial care product that helps protect and restore skin to make it stronger, for bright, wrinkle-free skin. Suitable for all skin types.
short: A facial care product that helps protect and restore skin to make it stronger, for bright, wrinkle-free skin. Suitable for all skin types.
body: '<strong>Results from DOCTOR YOUNGER Advance Glow Radiant Serum</strong><ul><li>Helps nourish facial skin to fade the look of wrinkles</li><li>Helps lower the chance of melasma, freckles and dark spots on the face</li><li>Helps skin look fair and bright</li><li>Helps protect skin from PM2.5 dust and pollution</li><li>Suitable for all skin types and all ages</li></ul><strong>Why use it: </strong><p>The facial care product <strong>DOCTOR YOUNGER </strong><strong>Advance Glow Radiant Serum</strong><strong></strong> is suitable for all skin types and all ages. It is a concentrated serum with antioxidants and small-molecule proteins, so it helps restore and nourish facial skin, fade the look of wrinkles and bring back the skin''s elasticity. It also helps fade melasma, freckles and dark marks caused by sun exposure and skin inflammation.</p>'
usage: Apply a thin layer of DOCTOR YOUNGER Advance Glow Radiant Serum over the face and neck every day. Use it regularly and continuously.
size: 30 ml.
price: 1,500 baht
