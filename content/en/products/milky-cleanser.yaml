name: DOCTOR YOUNGER MILKY CLEANSER
tagline: A milk-based cleanser for wiping makeup off the face. It keeps the face moisturized after use. Suitable for all skin types.
short: A milk-based cleanser for wiping makeup off the face. It keeps the face moisturized after use. Suitable for all skin types.
body: '<h3>DOCTOR YOUNGER MILKY CLEANSER </h3><strong>Results from DOCTOR YOUNGER MILKY CLEANSER</strong><ul><li>Used for wiping makeup off the face</li><li>Does not leave skin dry and rough after use, and keeps it smooth, soft and moisturized</li></ul><p>Every day our faces meet pollution from all around, which leaves dust and makeup on the skin. Not cleansing the face thoroughly is another cause of clogged oil glands, which leads to acne. So we should use a cleansing product that cleans the face completely. </p><strong>Why use it: </strong><p>A gentle cleanser like <strong>DOCTOR YOUNGER MILKY CLEANSER</strong> is a soft, light foam that does not irritate the skin. It is rich in JOJOBA OIL, which prevents the skin from losing water, and vitamin E, an antioxidant that reduces inflammation, plus rose flower extract, which helps kill germs. So it helps keep skin moisturized and removes dirt and excess oil from the face thoroughly. </p>'
usage: Use DOCTOR YOUNGER MILKY CLEANSER to cleanse the face by dabbing the lotion onto the face, neck and any areas with makeup. Massage gently all over, then wipe off with a cotton pad soaked in clean water. Use it regularly every day to cleanse the face.
size: 50 ml.
price: 350 baht
