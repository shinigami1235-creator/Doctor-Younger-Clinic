- q: Which treatments do you do regularly, and which would you recommend to others?
  a: The treatments I do regularly are the Endermologie body-shaping course and a new RF machine called RF ADVANCE, because I've seen the results myself. They suit working women who have no time to exercise. For my face, I like the Filler Treatment. You can do it without surgery, and there are no scars. After the treatment you look good and stay beautiful for a long time.
- q: Why did you become a presenter for Doctor Younger Clinic?
  a: After I came in for a consultation with the doctor and had been a customer for several years, I came to trust the quality of the treatments and the service. When Doctor Younger contacted me about being a presenter, I accepted right away. I'm also confident that everyone who comes for a service here won't be disappointed.
- q: Which treatments do you do regularly, and which would you recommend to others?
