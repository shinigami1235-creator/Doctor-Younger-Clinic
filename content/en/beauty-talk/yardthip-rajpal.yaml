  a: The ones I do regularly are TKS Laser, a laser for permanent hair removal, because I have a lot of hair on my shins and hands, so I use that one. Then there is Aramis Laser. I do Aramis Laser on my face. It builds collagen and also helps my facial skin look youthful. And there is another one, Exelo 2 Laser. It removes scars and acne marks and also tightens pores.
