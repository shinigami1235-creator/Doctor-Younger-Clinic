name: NEW A PEEL
tagline: Exfoliate the skin, say goodbye to dark acne marks and blackheads, and reveal smooth, clear skin
body: '<h3>Results of NEW A PEEL TREATMENT</h3><ul><li>Helps remove old skin cells and polishes the skin for a brighter face</li><li>Helps fade dark acne marks</li><li>Helps reduce blackheads for smoother skin</li><li>Helps stimulate and renew skin cells</li><li>Helps tighten pores</li></ul><h3>How NEW A PEEL TREATMENT works</h3><p>A treatment that uses crystals together with vacuum suction to gently remove the dead cells from the upper layer of the skin. The depth of the exfoliation can also be controlled, using the vacuum suction system and the skin polishing method. It therefore helps reduce blackheads, fade dark acne marks and acne scars, and tighten pores, leaving the skin smoother and the face brighter. Because this treatment renews skin cells while reducing blackheads and dark acne marks, the results are clearer, and you can feel softer skin from the first session after treatment.</p><h3>Service rates</h3><ul><li>Price per session: <strong>1,000</strong> baht</li><li>Course of 10
  sessions: <strong>9,000</strong> baht</li></ul>'
closing: To book or ask for more information, contact Doctor Younger Clinic at any branch. Call 02-261-3697-8, or reach us on Facebook or LINE ID @Doctoryounger.
