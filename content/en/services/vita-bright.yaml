name: VITA BRIGHT
tagline: The secret to fair, bright skin
body: <p>Add vitamins to your facial skin with <strong>VITA BRIGHT (COCKTAIL VITAMIN) </strong>to nourish and restore the skin so it looks fresh, glowing and dewy. It helps facial skin look fair, bright, smooth, soft and moisturized, prevents wrinkles and keeps skin from becoming rough. </p><h3>Results of VITA BRIGHT</h3><ul><li>A fair, radiant face </li><li>Skin looks glowing, fresh and healthy</li><li>Helps stimulate new skin cell growth</li><li>Smooth, soft, moisturized skin</li></ul><h3>How VITA BRIGHT works</h3><p>An innovation for fair, bright skin, using natural extracts that contain multivitamins, minerals, enzymes, cell therapy and collagen. The medication is pushed directly into the facial skin, where it spreads well to cover the treated area.<strong> VITA BRIGHT</strong><strong>(COCKTAIL VITAMIN) </strong>helps strengthen the skin, lifts and firms it, and leaves the complexion glowing, dewy, moisturized, fairer and brighter, with healthy skin. </p><h3>VITA BRIGHT is suitable for
  treating</h3><ul><li>Sensitive, weak skin that breaks out easily, or is red, flaky, dry or easily inflamed</li><li>Dry, dehydrated skin</li><li>Dull skin, deep melasma and deep freckles</li><li>People who have neglected their skin care and want their skin to look better</li></ul>
closing: To book or ask for more information, contact Doctor Younger Clinic at any branch. Call 02-261-3697-8, or reach us on Facebook or LINE ID @Doctoryounger.
