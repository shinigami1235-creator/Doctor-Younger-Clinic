name: RUBY MATE
tagline: Lifts and firms the skin, and fades wrinkles and under-eye bags
body: '<h3>How RUBY MATE TREATMENT works</h3><p>A treatment that firms the skin by using low-frequency electric current to press and massage the face and the area under the chin, stimulating the facial muscles and helping the skin lift and tighten. Because of the specific pressing and massage technique of this treatment, it also improves lymphatic circulation, so the skin is lifted, firm and free of excess fat. It also helps fade wrinkles and firm under-eye bags, adding youthfulness to the face.</p><h3>Service rates</h3><ul><li>Price per session: <strong>2,000</strong> baht</li><li>Course of 10 sessions: <strong>18,000</strong> baht</li></ul>'
closing: To book or ask for more information, contact Doctor Younger Clinic at any branch. Call 02-261-3697-8, or reach us on Facebook or LINE ID @Doctoryounger.
