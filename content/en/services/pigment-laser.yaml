name: PIGMENT LASER
tagline: Fades shallow freckles, deep freckles, sun freckles and dark birthmarks, and removes tattoos
body: <p>Say goodbye to freckles, dark birthmarks, uneven skin tone and unwanted tattoos with PIGMENT LASER, which delivers good results and reveals new, fairer, brighter skin. It enhances your personality and boosts your self-confidence. </p><h3>Results of PIGMENT LASER</h3><ul><li>Helps fade shallow freckles, deep freckles and sun freckles</li><li>Dark birthmarks on the skin will lighten</li><li>Helps remove tattoos</li><li>Helps skin look fair and bright</li></ul><h3>How PIGMENT LASER works</h3><p><strong>PIGMENT LASER</strong> is a laser well suited to freckle problems, revealing new skin that is fair and bright. With wavelengths of 532 and 1,064 nanometers, it sends laser energy to destroy the pigment (melanin) in the epidermis and dermis, treating pigment abnormalities. The pigment cells break apart and are gradually cleared from the skin by the body's natural mechanisms. White blood cells then slowly move in to take up the destroyed pigment, so freckles of all kinds, tattoos and dark
  birthmarks gradually fade and eventually disappear, revealing fair, bright skin. Side effects from fading freckles with this laser are very rare. Treatment depends on the diagnosis of the dermatologist at Doctor Younger Clinic. </p><h3>PIGMENT LASER is suitable for treating</h3><ul><li>Helps fade shallow freckles, deep freckles and sun freckles (SOLAR LENTIGINE) and dark birthmarks (a small scab forms after treatment)</li><li>Helps make the skin of the face, under the eyes and underarms fairer and brighter, makes the color of fine hairs lighter, and helps tighten pores (no scab)</li><li>Helps remove tattoos (a scab forms after treatment)</li></ul>
closing: To book or ask for more information, contact Doctor Younger Clinic at any branch. Call 02-261-3697-8, or reach us on Facebook or LINE ID @Doctoryounger.
