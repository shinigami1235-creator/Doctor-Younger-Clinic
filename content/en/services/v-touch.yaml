name: V-TOUCH
tagline: Lifts and firms, helping facial skin look smooth, glowing and youthful
body: '<h3>Results of V-TOUCH</h3><ul><li>Stimulates collagen production and builds new, healthy skin</li><li>Evens out skin tone to look fair and bright</li><li>Reduces wrinkles and dark spots</li><li>Helps make acne pits shallower and skin smoother</li><li>Firms the skin so it is smooth and taut, and looks more youthful</li></ul><h3>How V-TOUCH works</h3><p><strong>V-TOUCH</strong> is another innovation used to treat acne pits for beautiful, youthful-looking skin, with 2 technologies: Fractional RF using SVC™Technology, and Multi-Frequency Bi-Polar RF with CORE™Technology. Together they effectively treat wrinkles, dark spots and acne pits, revealing skin that is smooth, fair, bright and firmer. The process works as follows:</p><p><strong>SVC™Technology</strong> in Fractional RF delivers radio frequency energy through tiny FRACTIONAL electrodes, creating heat beneath the skin surface. This helps skin cell turnover, fades wrinkles and treats acne pits. The radio frequency stimulates the
  growth of new skin cells that are strong and firm, helping the face look smooth and bright.</p><p><strong>Multi-Frequency Bi-Polar RF with CORE™Technology</strong>: Bi-Polar RF sends heat down into the skin layers, and the frequency of the RF waves can be adjusted (Multi-Frequency) to choose the right depth of skin layer. It stimulates collagen production, helps skin look taut and firm, and treats loose, inelastic skin so it looks smoother.</p><p>Skin care with <strong>V-TOUCH</strong> is less painful than other FRACTIONAL treatments. Patients feel warmth on the skin as energy is delivered into the skin layers, and after being treated with <strong>V-TOUCH</strong>, results can be seen from the first session. For treating acne pits, wrinkles and dark spots for fair, bright skin, and for stimulating collagen to lift and firm the skin for a smooth, bright face, treatment should continue regularly. No recovery time is needed after <strong>V-TOUCH</strong>, and patients can carry on with daily
  life as normal, but should avoid strong sunlight and apply moisturizer and sunscreen to protect the skin. Treatment depends on the diagnosis of the dermatologist at Doctor Younger Clinic.</p>'
closing: To book or ask for more information, contact Doctor Younger Clinic at any branch. Call 02-261-3697-8, or reach us on Facebook or LINE ID @Doctoryounger.
