name: SYNERGICA
tagline: Firm, smooth, soft, moisturized skin and a fair, bright face
body: '<h3>Results of SYNERGICA TREATMENT</h3><ul><li>Helps stimulate blood circulation for smooth, soft skin</li><li>Helps skin look taut and firm, restoring a youthful look to the face</li><li>Helps skin look smooth, soft and moisturized</li><li>Helps skin look fair and bright</li><li>Stimulates collagen production</li></ul><h3>How SYNERGICA TREATMENT works</h3><p>A treatment that combines an electrical charge technique with amber light to push vitamins deep into the skin cells and help stimulate new collagen production. Together with a facial massage technique that stimulates blood circulation so it can nourish the skin evenly, it helps skin look moisturized, taut, fairer and brighter, so the complexion looks even more youthful.</p><h3>Service rates</h3><ul><li>Price per session: <strong>2,000</strong> baht</li><li>Course of 10 sessions: <strong>18,000</strong> baht</li></ul>'
closing: To book or ask for more information, contact Doctor Younger Clinic at any branch. Call 02-261-3697-8, or reach us on Facebook or LINE ID @Doctoryounger.
