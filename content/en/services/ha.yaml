name: HA
tagline: Filler
body: <h3>Results from HA (Filler) </h3><ul><li>Solves wrinkle problems on the face</li><li>Helps make the face firm and taut</li><li>Fills areas with deep wrinkles</li><li>The face looks more youthful</li></ul><h3>How HA (Filler) Works </h3><p><strong>Filler, or filling substance,</strong> is a substance injected under the skin at various points on the face to fill those areas, such as under-eye wrinkles, cheek grooves, hollow cheeks, hollow temples, cheekbones and forehead wrinkles. </p><p>Normally our bodies contain HYALURONIC ACID, which stores and absorbs water, keeping the skin firm and moisturized. As we get older, the HA in the skin decreases, which causes wrinkles. Injecting a filler can reduce the wrinkles that have formed.</p><h3>Aftercare Following HA Injection</h3><ul><li>For 24-48 hours after treatment, there may be swelling and redness in the treated area, which will go away in about 30-60 minutes</li><li>For good treatment results, do not apply makeup to the treated area
  right after treatment, and avoid products containing AHA , BHA , and creams or gels containing RETINOID for 2 days</li><li>You can use cosmetics with a LIGHT WATER BASE or OIL FREE cosmetics on other areas</li><li>You can apply a cold wet cloth or a cold gel pack to the injected area to reduce swelling and redness</li><li>Avoid drinking alcohol, since it causes blood vessels to dilate and may make the swelling and redness worse</li><li>Avoid strenuous exercise and exposure to extreme heat or cold, such as spa, sauna and aerobics, for 2 days</li><li>After treatment, drink plenty of room-temperature water so the filler lasts longer. Drink plenty of water for 4 days after the injection</li><li>Avoid facial massage for 1 month</li><li>Avoid massaging, pressing or rubbing the injected area, since it may deform the filler</li></ul>
