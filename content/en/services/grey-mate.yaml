name: GREY MATE
tagline: Helps renew skin cells and fades wrinkles, dark spots and acne scars
body: '<h3>Results from GREY MATE TREATMENT</h3><ul><li>Helps remove old skin cells </li><li>Helps fade wrinkles</li><li>Treats stretch marks</li><li>Fades dark spots</li><li>Helps treat acne scars</li><li>Helps make skin smooth and bright</li><li>Helps tighten pores</li></ul><h3>How GREY MATE TREATMENT Works</h3><p>A treatment that restores beauty to the skin with a skin abrasion machine combined with LED light massage and vibration, using crystal powder as the medium. It therefore helps exfoliate the upper layer of the skin, fades wrinkles, stretch marks and dark spots, including acne scars, and also helps stimulate new collagen production and tighten pores, making the skin smooth and bright, gently. The process works as follows:</p><p><strong>VACUUM : (suction) </strong>Helps increase blood circulation</p><p><strong>EXFOLIATION : (scrubbing) </strong>Helps scrub to exfoliate the skin gently and stimulate new cells, reducing wrinkles (EXCELLENT FOR REDUCING WRINKLES), dark spots (HYPER-PIGMENTATIONS)
  and stretch marks (STRETCH-MASKS) </p><p><strong>PHOTO-VIBRATING MASSAGE : (massage with light and vibration) </strong>The machine has a massaging function that calms the skin, performs DRAIN and DETOX of waste, stimulates tissue, and reduces the force of muscle contraction. It helps treat acne scars.</p><h3>Service Rates</h3><ul><li>Price per session <strong>1,600</strong> baht</li><li>10-session course, priced at <strong>14,400</strong> baht</li></ul>'
closing: To book or ask for more information, contact Doctor Younger Clinic at any branch. Call 02-261-3697-8, or reach us on Facebook or LINE ID @Doctoryounger.
