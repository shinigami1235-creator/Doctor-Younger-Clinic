name: PEELING TREATMENT
tagline: Exfoliate the skin, say goodbye to dark acne marks and dull skin
body: '<h3>Results of PEELING TREATMENT</h3><ul><li>Helps remove old skin cells for fairer, brighter skin</li><li>Helps tighten pores for smoother skin </li><li>Helps fade dark acne marks</li><li>Helps fade dull skin for a brighter look</li><li>Helps renew skin and stimulate the growth of new skin cells</li></ul><h3>How PEELING TREATMENT works</h3><p>A treatment that uses mild fruit acid as a medium to stimulate the shedding of dead skin cells, fading dark acne marks and reducing dull skin to reveal new skin that is fair, bright, glowing and full of life. This treatment also helps tighten pores, so the skin becomes smoother.</p><h3>What are the properties of PEELING TREATMENT? </h3><p>It exfoliates dead skin cells using natural extracts, which reduce the bond between the dead skin cells. When that bond weakens, the dead cells on the topmost layer of skin come off easily, and the new skin cells underneath rise to take their place. This helps fade dark acne marks and reduce dull skin, so you
  see new skin that is brighter and smoother than before.</p><h3>Service rates</h3><ul><li>Price per session: <strong>500</strong> baht</li><li>Course of 10 sessions: <strong>4,500</strong> baht</li></ul>'
closing: To book or ask for more information, contact Doctor Younger Clinic at any branch. Call 02-261-3697-8, or reach us on Facebook or LINE ID @Doctoryounger.
