name: CRY-O LIFT
tagline: Lifted, firm skin, revealing a fair, bright face
body: <h3>Results from CRY-O LIFT TREATMENT</h3><ul><li>Helps lift the skin so it looks firm and taut</li><li>Reshapes the face to be slimmer and better defined</li><li>Tightens pores, making them smaller</li><li>Fades wrinkles and sagging</li><li>Reduces dullness, swelling and bruising</li><li>Restores tired skin to be radiant, refreshed and bright</li></ul><h3>How CRY-O LIFT TREATMENT Works</h3><p>A treatment that uses cold waves to push vitamins and nutrients into the skin, to fade wrinkles, lift the skin, and help stimulate collagen production, increase moisture and tighten pores. In addition, the vitamins and nutrients pushed into the skin also help make the face fairer and brighter, the skin firmer, and the face look smoother.</p><h3>Service Rates</h3><ul><li>Price per session <strong>1,200</strong> baht</li><li>10-session course, priced at <strong>10,800</strong> baht</li></ul>
closing: To book or ask for more information, contact Doctor Younger Clinic at any branch. Call 02-261-3697-8, or reach us on Facebook or LINE ID @Doctoryounger.
