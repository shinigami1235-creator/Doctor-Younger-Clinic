name: ACTIVE BRIGHT
tagline: Restore youthfulness and bring back clear, bright skin
body: <h3>Results from ACTIVE BRIGHT </h3><ul><li>Restores and nourishes the face for smooth, clear skin</li><li>Fades fine lines on the face for smooth skin and helps tighten pores</li><li>Fades dark spots and uneven pigment production, making skin fairer and brighter</li><li>Reduces inflammation and redness from acne on the face </li><li>Helps reduce the symptoms of Rosacea</li></ul><h3>How ACTIVE BRIGHT Works</h3><p><strong>ACTIVE BRIGHT</strong> is a BRIGHT LASER that brightens the skin with high-intensity light energy similar to a camera flash, emitted in short bursts and filtered to give the right range of light frequencies, which can be varied to suit the use. The LASER delivered into the skin focuses on the problems in each skin layer, from treating abnormal pigment, the cause of dark spots and various wrinkles, without damaging the skin layers. It also helps reduce inflammation of blood vessels and the capillaries under the skin, reduces the inflammation of redness from acne, and
  effectively treats dull skin from sun exposure, for smoother, fairer and brighter skin. <strong>ACTIVE BRIGHT</strong> is another laser that helps make the face fairer and brighter, fades dark spots, and visibly tightens pores, increases skin elasticity and fades wrinkles, so the skin looks healthy. It also stimulates collagen and elastin under the skin, giving soft, moisturized skin.</p><p><strong>ACTIVE BRIGHT </strong>is therefore regarded as a skin restoration innovation that is effective and safe for every skin type, bringing the skin back to its former beauty. After <strong>ACTIVE BRIGHT</strong>, there may be slight scabbing at spots with strong color, such as freckles, acne marks or dark spots. The scabs then fall off on their own and the dark spots fade. Avoid strong sunlight for about 1-2 weeks and apply sunscreen regularly. Treatment depends on the diagnosis of the dermatologist at Doctor Younger Clinic</p><h3>When Results Start to Show</h3><p>You can usually see changes in
  your skin from the first treatment, but results become clearly visible after 3-5 continuous sessions (depending on each person's skin condition). Each treatment takes only 15-30 minutes</p>
closing: To book or ask for more information, contact Doctor Younger Clinic at any branch. Call 02-261-3697-8, or reach us on Facebook or LINE ID @Doctoryounger.
