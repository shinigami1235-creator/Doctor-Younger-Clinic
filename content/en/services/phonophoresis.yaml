name: PHONOPHORESIS
tagline: Smooth, soft, moisturized skin, with dark marks and dull skin under the eyes faded
body: '<h3>Results of PHONOPHORESIS TREATMENT</h3><ul><li>Helps nourish skin so it is moisturized and softer</li><li>Helps reduce dullness of the facial skin and the skin under the eyes</li><li>Helps fade dark marks for fair, bright skin </li><li>Helps lighten melasma and freckles for a younger look</li></ul><h3>How PHONOPHORESIS TREATMENT works</h3><p>A treatment that uses high-frequency sound waves as a medium to push Doctor Younger Clinic''s vitamins into the skin. Pushing vitamins in this way lets them sink deeper into the skin than applying them on the surface alone, and with the benefits of the vitamins, skin becomes moisturized, soft and smooth. It also helps fade melasma, freckles, dark marks and dullness across the face and under the eyes, making the skin fairer and brighter.</p><h3>Service rates</h3><ul><li>Price per session: <strong>800</strong> baht</li><li>Course of 10 sessions: <strong>7,200</strong> baht</li></ul>'
closing: To book or ask for more information, contact Doctor Younger Clinic at any branch. Call 02-261-3697-8, or reach us on Facebook or LINE ID @Doctoryounger.
