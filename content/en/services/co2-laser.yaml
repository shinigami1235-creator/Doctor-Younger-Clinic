name: CO2 LASER
tagline: Treats moles, small dark spots, warts, enlarged oil glands, stone acne, seborrheic keratosis and skin tags
body: <p>Deal with annoying skin problems such as small dark spots, moles, warts, enlarged oil glands, seborrheic keratosis, skin tags, and also stone acne and rice-grain acne, with <strong>CO2 LASER</strong></p><p><img src="https://www.doctoryounger.com/img-uploads/011%20copy.jpg" alt=""></p><h3>Results from CO2 LASER</h3><ul><li>Small dark spots (LENTIGINES) and moles will disappear</li><li>Skin in areas with seborrheic keratosis (SEBORRHEIC KERATOSIS) will become smooth</li><li>Treats all types of skin tags (SKIN TAG )</li><li>Treats enlarged oil glands (SSGH)</li><li>Treats stone acne (SYRINGOMA)</li><li>Treats rice-grain acne (MILIA)</li><li>Treats warts (WART) </li></ul><h3>How CO2 LASER Works</h3><p><strong>CO2 LASER</strong> is laser technology with a wavelength of 10,600 nm., produced by amplifying energy from CO2 gas so that it releases energy in the form of light. Today, <strong>CO2 LASER</strong> has been made higher in energy, with the laser exposure time shortened to the MICROSECONDS
  level (ULTRA PULSE), which gives good treatment effectiveness. It can therefore treat small dark spots, moles, warts, enlarged oil glands, stone acne, rice-grain acne, seborrheic keratosis and various skin tags.</p><h3>Safety of Treatment with CO2 LASER </h3><p>With <strong>CO2 LASER</strong>, scabs form on the skin for 7-14 days and fall off on their own</p>
closing: To book or ask for more information, contact Doctor Younger Clinic at any branch. Call 02-261-3697-8, or reach us on Facebook or LINE ID @Doctoryounger.
