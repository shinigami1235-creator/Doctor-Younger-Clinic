name: ACNE CLEAR LIGHT
tagline: Clear up your acne for a bright, beautiful face
body: <p><strong>ACNE CLEAR LIGHT</strong> is an acne treatment program using LIGHT– EMITTING DIODE (LED) light, which quickly and effectively destroys the bacteria that cause clogged pores and inflamed acne. It is a facial detox and is highly safe. It uses 3 colors of light, each of which treats acne in a different way:</p><ul><li><strong>Yellow light (INFRARED)</strong> helps treat acne (ACNE) and helps increase fairness, making the face brighter</li><li><strong>Blue light (BLUE LIGHT)</strong> helps reduce inflammation. The most important point in treating acne (ACNE) is that this light has the energy to kill the bacteria in the skin, and these bacteria are what cause acne</li><li><strong>Red light (RED LIGHT)</strong> helps treat inflamed acne</li></ul><h3>Treatment Duration</h3><p>About 8-12 sessions are recommended (depending on each person's skin condition) to clear acne completely. </p><h3>Causes of Acne (ACNE)</h3><ul><li>Too much oil production in the skin. Normally the sebaceous
  glands produce oil to lubricate the skin, but many factors can stimulate oil production in the glands, such as hormones, weather, some medications and genetics. </li><li>Abnormal thickening of the outermost layer of the skin (STRATUM CORNEUM), caused by abnormal shedding of dead skin cells. This blocks the sebaceous gland ducts and disturbs the flow of oil out of the skin, so the pores become clogged and turn into closed comedones (whiteheads). If the blockage occurs near the pore opening, open comedones (blackheads) form.</li><li>Bacteria that grow around the pores (PROPIONIBACTERIA) cause clogged pores to become inflamed acne, which is swollen, red, or forms pus heads.</li><li>The body's inflammatory process causes swollen, red and inflamed acne. In cases of SEVERE ACNE, the inflammation spreads and goes deeper into the nearby tissue.</li></ul><h3>Basic Practices and First Steps for Treating Acne</h3><ul><li>Choose a facial cleanser that suits your skin type.</li><li>Do not squeeze or
  pick at pimples yourself. Let them subside or heal naturally.</li><li>Choose skincare products and cosmetics that do not clog the pores.</li><li>Clean off your makeup thoroughly every day.</li></ul><h3>Service Rates</h3><ul><li>Price per session <strong>800</strong> baht</li><li>10-session course, priced at <strong>7,200</strong> baht</li></ul>
closing: To book or ask for more information, contact Doctor Younger Clinic at any branch. Call 02-261-3697-8, or reach us on Facebook or LINE ID @Doctoryounger.
