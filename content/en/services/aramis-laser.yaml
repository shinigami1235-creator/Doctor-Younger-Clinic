name: ARAMIS LASER
tagline: Treats scars and tightens pores for smooth, youthful-looking skin
body: <p>Uneven skin, rough skin, early wrinkles and skin that is not firm can be handled with <strong>ARAMIS LASER</strong>, a laser that helps restore and nourish the skin and stimulates collagen production. It tightens the face, slows the formation of wrinkles, and also helps with inflamed acne. </p><h3>Results from ARAMIS LASER</h3><ul><li>Helps stimulate the production of new collagen</li><li>Helps lift and tighten the skin and tighten pores</li><li>Keeps the skin from losing water</li><li>Fades wrinkles and reduces inflamed acne</li></ul><p><strong>How ARAMIS LASER Works </strong><strong></strong></p><p><strong>ARAMIS LASER</strong> is an innovation for lifting the skin and making it fairer and brighter, using the “COOLBURST” cold laser technology, wavelength 1,540, at a temperature of 5 CO, together with 1,540 mm. radiation that can stimulate collagen production for firmer skin. It is delivered into the dermis at a depth of 200-500 micrometers, where the laser light stimulates FIBROBLAST
  cells to produce new collagen. Skin with wide pores becomes tighter, inflamed acne is reduced, the skin is restored to be stronger, and the face becomes fairer and brighter. It repairs the skin to be healthier. </p><h3>Safety of Treatment with ARAMIS LASER</h3><p>After <strong>ARAMIS LASER</strong>, you can put on makeup and go to work as usual right away. One treatment takes only 30 minutes. With just 6 sessions, you can start to see better results, depending on each person's skin condition and problems. Treatment depends on the diagnosis of the dermatologist at Doctor Younger Clinic. </p><h3>ARAMIS LASER Is Suitable for Treating</h3><ul><li>Scars</li><li>Sagging skin </li><li>Stimulating collagen production</li><li>Wide pores</li><li>Inflamed acne</li></ul>
closing: To book or ask for more information, contact Doctor Younger Clinic at any branch. Call 02-261-3697-8, or reach us on Facebook or LINE ID @Doctoryounger.
