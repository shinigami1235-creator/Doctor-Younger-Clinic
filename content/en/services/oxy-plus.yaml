name: OXY PLUS
tagline: Fair, bright, glowing skin that looks full of life
body: '<h3>Results of OXY PLUS TREATMENT</h3><ul><li>Helps skin feel moisturized and refreshed</li><li>Helps skin look fair and bright, with an aura and a glow</li><li>Helps facial skin look younger</li></ul><h3>How OXY PLUS TREATMENT works</h3><p>A treatment that delivers 99% oxygen, vitamins and the nutrients skin needs deep into the skin. The device, vitamins and serums work together effectively to build new collagen and elastin, reduce dry, rough skin, and leave skin smooth, soft, moisturized and brighter, with more aura and freshness. This treatment offers 2 serums to choose from, which are:</p><h3>Service rates</h3><ul><li>Price per session: <strong>2,500</strong> baht</li><li>Course of 10 sessions: <strong>22,500</strong> baht</li></ul>'
closing: To book or ask for more information, contact Doctor Younger Clinic at any branch. Call 02-261-3697-8, or reach us on Facebook or LINE ID @Doctoryounger.
