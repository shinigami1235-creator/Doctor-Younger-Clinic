name: IONTOPHORESIS
tagline: Helps make your face look fairer and brighter
body: '<h3>Results of IONTOPHORESIS TREATMENT</h3><ul><li>Helps fade melasma, freckles and dark spots</li><li>Treats dark marks from acne, scars and acne pits</li><li>Helps make facial skin fair and bright, and look younger</li></ul><h3>How IONTOPHORESIS TREATMENT works</h3><p>A treatment that uses a mild electrical charge to push Doctor Younger Clinic''s vitamin formula into the skin, restoring skin affected by melasma, freckles and dark spots, including dark marks from acne. Your skin feels fair, bright, clean and fresher. </p><h3>Service rates</h3><ul><li>Price per session: <strong>600</strong> baht</li><li>Course of 10 sessions: <strong>5,400</strong> baht</li></ul>'
closing: To book or ask for more information, contact Doctor Younger Clinic at any branch. Call 02-261-3697-8, or reach us on Facebook or LINE ID @Doctoryounger.
