meta:
  title: ULTRA DEEP LIFTING for Wrinkles and Sagging Skin | Doctor Younger Clinic Bangkok
  description: No more worrying about a round, wide or full face, or sagging skin. ULTRA DEEP LIFTING lifts and firms the skin without surgery.

name: ULTRA DEEP LIFTING
tagline: Reduces wrinkles and sagging skin
intro: No more worrying about a round, wide or full face, or even sagging skin. ULTRA DEEP LIFTING can solve these problems.

depth: smas

sections:
  - heading: Results of ULTRA DEEP LIFTING
    list:
      - Lifts and firms the skin
      - Reduces wrinkles across the face
      - Contours the face to look slimmer
      - Reduces facial fat
  - heading: How ULTRA DEEP LIFTING works
    text: ULTRA DEEP LIFTING uses high-frequency sound waves (FOCUSED ULTRASOUND) to deliver small amounts of energy into the deep layers of the skin, the layer beneath the skin, and the junction with the upper muscle layer (SMAS) to lift the skin (TISSUE LIFTING) and reduce wrinkles. During treatment the doctor sees the skin layers on the machine's screen, so each point is treated precisely and the sound waves are adjusted to suit the patient's skin. It also reduces facial fat. The skin is lifted and firmed, giving a slimmer face shape and a more youthful look without surgery.
    diagram: true
  - heading: When results show
    text: ULTRA DEEP LIFTING stimulates the continuous production of new collagen, so sagging skin becomes visibly lifted, firmer and smoother from the first session, and results keep improving for another 3 months. It uses a specific frequency that does not harm the deep layers of the skin or affect the surrounding skin. Treatment depends on the diagnosis of the dermatologist at Doctor Younger Clinic.
  - heading: ULTRA DEEP LIFTING is suitable for
    list:
      - Sagging skin under the chin with layered folds
      - Lifting and firming the face
      - Drooping upper eyelids and sagging lower eyelids
      - Wrinkles
      - Contouring a slimmer, well-shaped face

closing: 'For treatment, contact Doctor Younger Clinic at any branch. Call 02-261-3697-8, or reach us on Facebook and LINE ID @Doctoryounger.'

