title: Turning Back Time to Youth
date: 29 Oct 2013
body: '<h3><em></em> Turning Back Time to Youth</h3><p><img src="https://www.doctoryounger.com/img-uploads/SPG1999.jpg" alt=""><img src="https://www.doctoryounger.com/img-uploads/242-mix1.jpg" alt=""><img src="https://www.doctoryounger.com/img-uploads/Adver-12601.jpg" alt=""></p><p>Following the popular trend for bright, bouncy skin in the Korean and Japanese style, the beauty business today, whether beauty salons, beauty clinics or institutes, or cosmetic surgery clinics, is growing steadily by no less than 10% a year. Beauty clinics and cosmetic surgery clinics are especially hot, with more than 100 businesses opening across the country. The total business value is over 12,000 to 15,000 million baht, an average growth rate of 10 to 50% a year, and it is likely to keep rising.</p><p>Doctor Younger is a beauty clinic managed closely by doctors with international expertise in skin and beauty: Dr. Wilai Thanasarnaksorn, Executive Chairwoman of Doctor Younger, and Dr. Sawang Amphornphan, Managing
  Director of Doctor Younger. The clinic offers a wide range of services together with modern technology certified as safe by the US FDA and the European CE.</p><p>The start of the beauty clinic business came from Dr. Wilai, who graduated from Ramathibodi Hospital and is a specialist in internal medicine. She then trained as a skin specialist in England and went on to study dermatologic laser in America. After returning to Thailand in 1995, she was appointed adjunct lecturer in the dermatology unit of Ramathibodi Hospital, and she still holds that post today. She is also an adjunct lecturer at Samitivej Hospital. She has also always been a Lecturer in Dermatology and cosmetic skin care, both in Thailand and abroad. Dr. Sawang graduated in medicine from Chulalongkorn University and then studied further in Anti–Aging Medicine in England. When he came back to Thailand he opened a clinic, which was then named Derm Clinic. After that he studied the World Anti-Aging course in France for another
  2 years. After returning, he used the knowledge he had gained to look after himself and advised the people around him, including customers, on food and exercise. That was the start of studying beauty, so he went on to study a skin and beauty course in the United States. When he came back, he thought the name should be changed to Doctor Younger.</p><p>Doctor Younger''s strength is that it focuses on meeting what is needed for each customer''s problem, mainly solving the problems the customers want solved, and treating with standard innovations for safety at a fair price. It has a Thai specialist recognized worldwide, Dr. Wilai Thanasarnaksorn, and the experience of Dr. Sawang Amphornphan, who has completed various beauty training courses and also has a wide network of doctors and leaders of new innovation in medicine from all over the world.</p><p>Another strength is caring for patients'' skin to achieve a Look Younger. Doctor Younger says there are both gradual and urgent approaches, depending
  on the person. It starts by solving the problem of wrinkles and sagging with Botox, filler, IPL laser, ultrasound and radio waves, which make the dermis tighten up. These innovations can help people who come for treatment look younger. But because everyone''s skin is different, the doctor must first analyze whether each device suits the client''s skin, including skin color depth and the thickness of the skin structure. Setting up the device settings is something that needs great care and is very important.</p><p>Today, enhancing beauty is nothing to be ashamed of, and it depends on each person. The first person who can decide is you, whether you need it or not, and then you should study the information and consult a specialist doctor about which method to use and how the pros and cons differ. But cosmetic enhancement or surgery done to follow fashion, without thinking, is something we do not support at all.</p><p>In addition, Doctor Younger is decorated differently from other places, so
  it feels like a spa. The atmosphere is comfortable and spacious, with seating for resting, so it doesn''t feel like going to see a doctor, because you aren''t ill. It suits relaxing and relieving stress through beauty enhancement, or treating skin problems in a warm, homelike, friendly atmosphere. There are also new innovations and technologies, with doctors and specialists using the devices who have been trained by Dr. Wilai herself.</p><p>Doctor Younger adds that when choosing a beauty institute, consumers need to research it and first look at how much the procedure affects the skin. If it affects the skin a lot, the risk may be high. For example, there is news these days of young people buying Botox and injecting it themselves at university, which is very dangerous. Choosing an institute with doctors who are experts in both treatment and the use of technology is necessary for the consumers'' own safety.</p><p>Doctor Younger currently has 6 branches in Bangkok: Terminal 21 branch on
  Sukhumvit Soi 19, Jasmine Building branch on Sukhumvit Soi 23, K Village branch on Sukhumvit Soi 26, Mega Bangna branch, Thanya Shopping Park Srinakarin branch, and Ramkhamhaeng Soi 12 branch.</p><p><em>For more information<br></em><em>Doctor Younger Call Center 0-2261-3697-8</em></p>'
