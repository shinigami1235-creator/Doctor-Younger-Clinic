name: DOCTOR YOUNGER SUNSCREEN 360⁰ SPF50 PA+++
tagline: ผลิตจากสารสกัดพืชธรรมชาติหลากชนิด ป้องกันการเกิดริ้วรอยและความหมองคล้ำ ด้วยเนื้อครีมบางเบา กันน้ำได้ดี
short: ผลิตจากสารสกัดพืชธรรมชาติหลากชนิด ป้องกันการเกิดริ้วรอยและความหมองคล้ำ ด้วยเนื้อครีมบางเบา กันน้ำได้ดี
body: '<strong>ผลลัพธ์ที่ได้จาก DOCTOR YOUNGER SUNSCREEN 360⁰ SPF50 PA+++ </strong><ul><li>ปรับผิวให้ขาวใสขึ้น</li><li>ป้องกันปัญหาผิวต่างๆ เช่น กระ ฝ้า ผิวหมองคล้ำ ผิวไหม้แสบแดง</li><li>ผิวคงความอ่อนเยาว์ได้นาน</li><li>ผิวมีสุขภาพดี</li><li>บำรุงผิวจบในขั้นตอนเดียว</li><li>ใช้แทนเบสเมคอัพได้</li><li>ถึงแม้แต่งหน้าก็ติดทนตลอดวัน</li></ul><p>มลภาวะรอบกายทำให้ผิวของเราต้องต่อสู้กับสิ่งที่มารบกวนมากมายในแต่ละวัน โดยเฉพาะรังสีอัลตราไวโอเลต (ULTRAVIOLET) หรือรังสียูวี (UV) ประกอบด้วย รังสียูวีเอ (UVA) ที่สามารถทะลุไปถึงชั้นผิวหนังกำพร้าและชั้นหนังแท้ได้ หากได้รับรังสี UVA มากๆ จะทำให้เกิดอนุมูลอิสระในผิวหนัง ซึ่งจะทำลายความยืดหยุ่นของเซลล์ ทำให้ผิวหนังเหี่ยวย่น เกิดริ้วรอยก่อนวัย ผิวหมองคล้ำ ขาดความสดใส รังสียูวีบี (UVB) ซึ่งปกติจะถูกกั้นโดยชั้นบรรยากาศบางส่วนถึงแม้ไม่สามารถทะลุสู่ชั้นผิวหนังลึกได้เท่ากับรังสี UVA แต่รังสี UVB ก็มีผลทำให้ผิวสูญเสียความชุ่มชื้น เกิดอาการแสบร้อน แดง และไหม้เกรียม (ภายใน 24 ชั่วโมง เมื่อโดนแสงแดดจัดนานๆ) </p>นอกจากนี้ยังมีรังสีอินฟราเรด (IR) คือรังสีความร้อนที่มีอยู่ในแสงแดด
  ความร้อนจากการประกอบอาหาร และไอร้อนต่างๆ ซึ่งจะเป็นตัวทำลายคอลลาเจนใต้ผิวหนังได้ ทำให้ผิวเกิดริ้วรอยก่อนวัย สูญเสียความยืดหยุ่น และทำให้ผิวหมองคล้ำ นอกจากนี้ยังมีอันตรายจากแสงที่มองเห็นได้ด้วยตาเปล่า หรือ VISIBLE LIGHT คือ แสงจากหลอดฟลูออเรสเซนต์ แสงจากจอคอมพิวเตอร์ ที่ทำให้ผิวเกิดจุดด่างดำได้ <strong>ทำไมต้องใช้ : </strong> ผลิตภัณฑ์ครีมกันแดด <strong>DOCTOR YOUNGER SUNSCREEN 360⁰ SPF50 PA+++</strong> นวัตกรรมสารสกัดจากพืชธรรมชาติ ที่พร้อมปกป้องผิวจากการถูกทำร้ายด้วยรังสี UVA และ UVB ต้นเหตุของการเกิดริ้วรอยต่างๆ ฝ้า กระ รวมทั้งช่วยปกป้องผิวจากความร้อนและมลภาวะ ที่เป็นอีกสาเหตุหนึ่งของการเกิดริ้วรอยก่อนวัย และทำให้ผิวสูญเสียความยืดหยุ่น ผิวหมองคล้ำ รวมถึงแสงที่มองเห็นได้ด้วยตาเปล่า (Visible Light ) สาเหตุแห่งจุดด่างดำ ด้วยเนื้อครีมที่บางเบาผสมผสานเป็นเนื้อเดียวกับผิว ทำให้ซึมซับเข้าสู่ผิวได้อย่างดี'
usage: หลังทาครีมบำรุงผิวหน้าแล้วในตอนเช้า หรือก่อนออกไปโดนแสงแดด 15-30 นาที ให้ทา DOCTOR YOUNGER SUNSCREEN 360⁰ SPF50 PA+++ ทั่วใบหน้าและลำคอเป็นประจำทุกวัน
size: 30 g.
price: 1,200 บาท
