name: DOCTOR YOUNGER ASTA REAL
tagline: เป็นผลิตภัณฑ์ต้านอนุมูลอิสระที่ทรงพลัง ต้านอนุมูลอิสระจากสารพิษ แอลกอฮอล์ บุหรี่ รังสี UV และสารเคมีตกค้างในร่างกาย
short: เป็นผลิตภัณฑ์ต้านอนุมูลอิสระที่ทรงพลัง ต้านอนุมูลอิสระจากสารพิษ แอลกอฮอล์ บุหรี่ รังสี UV และสารเคมีตกค้างในร่างกาย
body: '<strong>ผลลัพธ์ที่ได้จาก Asta Real</strong><ul><li>ปกป้องระบบหลอดเลือดสมอง ช่วยพัฒนาความจำและเรียนรู้</li><li>คลายความเหนื่อยลาของดวงตา เหมาะกับผู้ที่จ้องหน้าจอนานๆ</li><li>ช่วยป้องกันไม่ให้ผิวแก่ก่อนวัย ลดการหย่อนคล้อยของผิวหนังและจุดด่างดำ เพิ่มความยืดหยุ่นให้ผิว</li><li>เพิ่มปริมาณและคุณภาพของอสุจิ</li><li>กระตุ้นภูมิร่างกาย การตอบสนองของเซลล์ดีขึ้น</li><li>ป้องกันการเกิดไขมันพอกตับ</li><li>ลดการอักเสบในระบบทางเดินอาหาร กระเพาะเป็นแผล อาหารไม่ย่อย กรดไหลย้อน</li><li>บำรุงหัวใจ หลอดเลือด และระบบหมุนเวียนเลือด ลดความดันโลหิต </li><li>ฟื้นฟูความสมดุลระหว่างอินซูลิน-กลูโคส เพิ่มอัตราการเผาพลาญ</li><li>มีประโยชน์กับผู้ป่วยโรคเบาหวานและโรคไต ลดความเป็นพิษของน้ำตาลกลูโคส ลดความเสื่อมและการอักเสบของไต พัฒนาการทำงานตับอ่อน และเพิ่มความไวต่ออินซูลิน</li><li>กล้ามเนื้อฟื้นฟูได้ไวขึ้นหลังออกกำลังกายหรือบาดเจ็บ ป้องกันภาวะกล้ามเนื้อฝ่อ</li></ul><strong>ทำไมต้องใช้ : </strong><p><strong>Astaxanthin </strong>ได้ชื่อว่าเป็น King of Antioxidant ด้วยตัวเองอยู่แล้ว และมีผลวิจัยแสดงให้เห็นว่า astaxathin
  จะมีประสิทธิภาพสูงสุดเมื่อทำงานร่วมกับ Vitamin C และ Tocotrienol (วิตามินอีชนิดพิเศษ) ซึ่งใน <strong>Asta Real</strong> นั้นได้รวมทั้ง 2 ตัวนั้นมาด้วย ช่วยปกป้อง DNA และไมโตรคอนเดรีย ต้านอนุมูลอิสระจากสารพิษ แอลกอฮอล์ บุหรี่ รังสี UV และสารเคมีตกค้างในร่างกาย</p>'
usage: ขึ้นอยู่กับการรักษา ปรึกษาแพทย์ก่อนใช้
