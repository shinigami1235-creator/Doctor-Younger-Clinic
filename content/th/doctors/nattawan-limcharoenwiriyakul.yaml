body: <p>แพทย์หญิงณัฐวรรณ ลิ้มเจริญวิริยกุล (คุณหมอมะปราง) จบการศีกษาคณะแพทย์ศาสตร์บัณฑิต จากจุฬาลงกรณ์มหาวิทยาลัย และเวชศาสตร์ชะลอวัย</p><h3>ระดับอุดมศึกษา</h3><p>- แพทย์ศาสตร์บัณฑิต จุฬาลงกรณ์มหาวิทยาลัย</p><h3>เชี่ยวชาญเฉพาะทางด้านตจวิทยา</h3><p>- Postgraduate Diploma (PgDip) in Practical Dermatology, Cardiff University, Wales, UK</p><p>- M.S. in Clinical Dermatology, Srinakharinwirot university, Bangkok, Thailand</p><h3>เชี่ยวชาญเฉพาะทางด้านศัลยกรรมเลเซอร์ผิวหนัง</h3><p>- Fellowship in Dermatologic Surgery and Laser, Faculty of Medicine Ramathibodi Hospital, Mahidol University</p><p>เชี่ยวชาญเฉพาะทางด้านเวชศาสตร์ชะลอวัย และเวชศาสตร์ป้องกัน</p><p>- American Board of Anti-Aging and Regenerative Medicine</p><h3>แพทย์ผิวหนังชำนาญการ Botox &amp; Filler</h3><h3>ปัจจุบัน</h3><p>แพทย์ผิวหนังประจำด็อกเตอร์ ยังเกอร์ คลินิก</p><h3>ตารางออกตรวจ</h3><p>สาขาสุขุมวิท 23</p><p>- เสาร์ที่ 1 , 2 , 4 ของเดือน เวลา 12.00 - 15.00 น.</p><p>สาขาธัญญะพาร์ค ศรีนครินทร์ </p><p>- เสาร์ที่ 3 ของเดือน เวลา 11.00
  - 15.00 น.</p>
