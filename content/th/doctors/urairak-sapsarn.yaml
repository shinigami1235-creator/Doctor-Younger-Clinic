body: <p>แพทย์หญิงอุไรรักษ์ ทรัพย์สาร (คุณหมอเตย) จบการศึกษาคณะแพทย์ศาสตร์ เกียรตินิยม จากมหาวิทยาลัยธรรมศาสตร์</p><h3>ระดับอุดมศึกษา</h3><p>- แพทย์ศาสตร์ (เกียรตินิยม) มหาวิทยาลัยธรรมศาสตร์</p><h3>เชี่ยวชาญเฉพาะทางด้านตจวิทยา</h3><p>- M.S. in Clinical Dermatology, Chulabhorn International College of Medicine, Thammasat University</p><h3>เชี่ยวชาญเฉพาะทางด้านศัลยกรรมเลเซอร์ผิวหนัง</h3><p>- Fellowship in Dermatologic Surgery and Laser, Faculty of Medicine Ramathibodi Hospital, Mahidol University</p><p>เชี่ยวชาญเฉพาะทางด้านเวชศาสตร์ชะลอวัย และเวชศาสตร์ป้องกัน </p><p>- American Board of Anti-Aging and Regenerative Medicine</p><p> - Diploma of Thai Board of Preventive Medicine (Public Health)</p><h3>ปัจจุบัน</h3><p>- แพทย์ผิวหนังประจำด็อกเตอร์ ยังเกอร์ คลินิก</p><h3>ตารางออกตรวจ</h3><p>สาขาสุขุมวิท 23</p><p>- วันอังคาร , วันพุธ เวลา 12.00 - 18.00 น.</p><p>- วันอาทิตย์ เวลา 15.00 - 18.00 น.</p>
