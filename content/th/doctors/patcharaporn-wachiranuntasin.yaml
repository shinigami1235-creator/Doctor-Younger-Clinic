body: <p>แพทย์หญิงพัชราภรณ์ วชิรนันทศิลป์ (คุณหมอบี) คุณหมอสาวน่ารัก ใจดี กับความสามารถและเทคนิคที่ไม่ธรรมดา มาพร้อมกับดีกรีแพทย์ศาสตร์บัณฑิต คณะแพทย์ศาสตร์ศิริราชพยาบาล </p><h3>เชี่ยวชาญเฉพาะทางด้านตจวิทยา</h3><p>- Diploma in Dermatology คณะแพทย์ศาสตร์ รามาธิบดี </p><p>เชี่ยวชาญเฉพาะทางด้านศัลยกรรมเลเซอร์ผิวหนัง</p><h3>เชี่ยวชาญเฉพาะทางด้านศัลยกรรมเลเซอร์ผิวหนัง</h3><p>- Fellowship in Cutaneous and Laser Surgery สถาบันโรคผิวหนัง เวชศาสตร์ชลอวัย </p><p>- American Board of Anti – Aging and Regenerative Medicine (A 4 M) USA</p><h3>ปัจจุบัน</h3><p>- แพทย์ผิวหนังประจำด็อกเตอร์ ยังเกอร์ คลินิก</p><h3>ตารางออกตรวจ</h3><p>สาขาสุขุมวิท 23</p><p>- วันอังคาร , พฤหัส เวลา 12.00-18.00 น.</p><p>- วันเสาร์ เวลา 12.00-18.00 น.</p><p>สาขาธัญญะพาร์ค ศรีนครินทร์</p><p>- วันจันทร์ , วันพุธ เวลา 12.00-18.00 น.</p><p>- วันศุกร์ เวลา 12.00-16.00 น.</p>
