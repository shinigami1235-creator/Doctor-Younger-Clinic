body: <p>แพทย์หญิงปุณฑริกา อภินรเศรษฐ์ จบการศึกษาคณะแพทย์ศาสตร์บัณฑิต โรงพยาบาลรามาธิบดี มหาวิทยาลัยมหิดล</p><h3>ระดับอุดมศึกษา</h3><p>- แพทย์ศาสตร์บัณฑิต โรงพยาบาลรามาธิบดี มหาวิทยาลัยมหิดล</p><h3>เชี่ยวชาญเฉพาะทางด้านตจวิทยา</h3><p>- M.S. in Dermatology, University of Hertfordshire, United Kingdom</p><h3>เชี่ยวชาญเฉพาะทางด้านศัลยกรรมเลเซอร์ผิวหนัง</h3><p>- Fellowship in Dermatologic Surgery, Faculty of Medicine, Siriraj Hospital, Mahidol University</p><p>เชี่ยวชาญด้านการรักษาปานแต่กำเนิด</p><p>- Fellowship in Birthmark skin lesion, University of Malmo, Sweden</p><p>- Fellowship in Dermatologic Laser Surgery, SkinCare Physicians, Chestnut Hill, MA, United States</p><h3>ปัจจุบัน</h3><p>- แพทย์ผิวหนังประจำด็อกเตอร์ ยังเกอร์ คลินิก</p><h3>ตารางออกตรวจ</h3><p>สาขาสุขุมวิท 23</p><p>- วันอังคาร เวลา 14.00 - 18.00 น.</p>
