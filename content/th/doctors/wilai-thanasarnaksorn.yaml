body: <p>แพทย์หญิงวิไล ธนสารอักษร จบการศึกษาจากคณะแพทยศาสตร์ โรงพยาบาลรามาธิบดีมหาวิทยาลัยมหิดล ทำงานในโรงพยาบาลรัฐและเอกชน มานานกว่า 10 ปี ด้วยเทคนิคผสมผสานกับประสบการณ์เฉพาะตัว </p><h3>ระดับอุดมศึกษา</h3><p>- คณะแพทยศาสตร์ โรงพยาบาลรามาธิบดี มหาวิทยาลัยมหิดล</p><h3>เชี่ยวชาญเฉพาะทางด้านตจวิทยา</h3><p>- Certificate of Attendance in Dermatological Laser and Facial Cosmetic Surgery, Hong Kong, 2002.</p><p>- Certificate in the Scientific Program, Anti-Aging Award Conference, European Academy of Anti Aging Medicine, Paris-France, March 2004.</p><p>- Diploma in Dermatological Science, University of Wales College of Medicine, UK, 1993.</p><p>- Certificate of Membership International Fellow, American Academy of Dermatology and American Academy of Dermatology Association, 1998.</p><h3>เชี่ยวชาญเฉพาะทางด้านศัลยกรรมเลเซอร์ผิวหนัง</h3><p>- Certificate of Attendance The Asian Laser Forum, Hong Kong Surgical Laser Association, 2003.</p><p>- Certificate of Attendance in Dermatologic Laser and Surgery
  in Asians, Cebu, Philippines, 2006.</p><h3>ปัจจุบัน</h3><p>- อาจารย์พิเศษ หน่วยตรวจโรคผิวหนัง ภาควิชาอายุรศาสตร์ โรงพยาบาลรามาธิบดี มหาวิทยาลัยมหิดล</p><p>- แพทย์ผิวหนังประจำด็อกเตอร์ ยังเกอร์ คลินิก</p><h3>ตารางออกตรวจ</h3><p>สาขาสุขุมวิท 23</p><p>- วันพุธ เวลา 13.00-16.00 น.</p><p>- วันเสาร์ (สัปดาห์ที่ 3) เวลา 13.00-16.00 น.</p><p>สาขาธัญญะพาร์ค ศรีนครินทร์</p><p>- วันเสาร์ (ยกเว้นสัปดาห์ที่ 3) เวลา 13.00-16.00 น.</p>
