body: <p>แพทย์หญิงมานิกา นภารัตน์ (คุณหมอปาล์ม) คุณหมอน่ารัก ใจดีกับความสามารถและเทคนิคที่ไม่ธรรมดา มาพร้อมกับดีกรีแพทย์ศาสตร์บัณฑิต คณะแพทย์ศาสตร์รามาธิบดี</p><h3>ระดับอุดมศึกษา</h3><p>- แพทย์ศาสตร์บัณฑิต คณะแพทย์ศาสตร์รามาธิบดี</p><h3>เชี่ยวชาญเฉพาะทางด้านตจวิทยา</h3><p>- Diploma in Dermatology สถาบันโรคผิวหนัง</p><h3>เชี่ยวชาญเฉพาะทางด้านศัลยกรรมเลเซอร์ผิวหนัง</h3><p>- Fellowship in Cutaneous and Laser Surgery คณะแพทย์ศาสตร์ รามาธิบดี</p><p>- Fellowship Anti – Aging Medicine มหาวิทยาลัยธุรกิจบัณฑิต</p><p> เวชศาสตร์ชะลอวัย</p><p> - American Board of Anti – Aging and Regenerative Medicine ( A4M) US.</p><h3>ปัจจุบัน</h3><p>แพทย์ผิวหนังประจำด็อกเตอร์ ยังเกอร์ คลินิก</p><h3>ตารางออกตรวจ</h3><p>สาขาสุขุมวิท 23</p><p>- วันศุกร์ (สัปดาห์ที่ 1, 3 ของเดือน) เวลา 12.00 - 18.00 น.</p><p>สาขาธัญญะพาร์ค ศรีนครินทร์</p><p>- วันเสาร์ เวลา 12.00 - 18.00 น.</p>
