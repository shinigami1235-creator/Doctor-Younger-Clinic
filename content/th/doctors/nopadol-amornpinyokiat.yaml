body: <p>นายแพทย์นพดล อมรภิญโญเกียรติ (คุณหมอบอย) แพทย์หนุ่มหล่อหน้าใส มากความสามารถกับดีกรีเกียรตินิยม จากคณะแพทยศาสตร์บัณฑิต จุฬาลงกรณ์มหาวิทยาลัย และยังทำงานในโรงพยาบาลเอกชนชั้นนำชื่อดังมานานกว่า 10 ปี</p><h3>ระดับอุดมศึกษา</h3><p>- แพทยศาสตร์บัณฑิต (เกียรตินิยม) จุฬาลงกรณ์มหาวิทยาลัย</p><h3>เชี่ยวชาญเฉพาะทางด้านตจวิทยา</h3><p>- M.S. in Dermatology, Chulalongkorn University</p><h3>เชี่ยวชาญเฉพาะทางด้านศัลยกรรมเลเซอร์ผิวหนัง</h3><p>- Fellow in Dermatologic laser Surgery, Mahidol University</p><p>- Fellow in Cosmetic and Surgical Dermatology, Miami, USA.</p><p>- Fellow in Dermatological laser Surgery, Mount Sinai Medical Center, USA.</p><h3>ปัจจุบัน</h3><p>- แพทย์ผิวหนังประจำด็อกเตอร์ ยังเกอร์ คลินิก</p><h3>ตารางออกตรวจ</h3><p>สาขาสุขุมวิท 23</p><p>- วันอาทิตย์ , วันจันทร์ เวลา 12.00-17.00 น.</p><p>สาขาธัญญะพาร์ค ศรีนครินทร์</p><p>- วันอังคาร เวลา 13.00-15.00 น.</p>
