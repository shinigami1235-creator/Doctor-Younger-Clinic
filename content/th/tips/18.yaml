title: 8 วิธีดูแลผิวหน้าฝน เพื่อผิวสวยปังไม่กลัวเปียก
date: 19 May 2017
source: Kapook
body: '<p>ช่วงนี้ฝนตกเกือบทุกวัน จนเรียกได้ว่าเข้าสู่ฤดูฝน ฤดูแห่งการเปียกปอนอย่างเป็นทางการอีกแล้ว นอกจากสาวๆ จะต้องระวังเรื่องสุขภาพร่างกายแล้ว ก็อย่าลืมดูแลสุขภาพผิวหนังที่อาจเกิดความสกปรกและความอับชื้นที่มากับฝนได้ เพราะในน้ำฝนนั้นมีทั้งฝุ่นละออง สารเคมี รวมถึงเชื้อโรคและสิ่งสกปรกมากมาย รวมถึงฝนในเมืองนั้นยังมีฤทธิ์เป็นกรดอ่อนๆ ยิ่งเราสัมผัสน้ำฝนที่ปนเปื้อนแล้ว อาจทำให้ผิวหนังของเราแพ้และเป็นอันตรายได้ค่ะ วันนี้เรามีวิธีดูแลผิวในหน้าฝนนี้มาฝากให้สาวๆ ทุกคนได้ดูแลสุขภาพผิวของตัวเองให้มีสุขภาพดี เปล่งปลั่ง และเนียนนุ่มชุ่มชื่นตลอดช่วงฤดูกาลแห่งความชุ่มฉ่ำนี้</p><p><img src="https://www.doctoryounger.com/img-uploads/t001.jpg" alt=""></p><h3>1. ชำระล้างร่างกายให้สะอาด</h3><p>ช่วงฤดูฝนแบบนี้ควรหลีกเลี่ยงการโดนฝนจะดีที่สุดนะคะ แต่หากสาวๆ คนไหนที่เพิ่งเปียกฝนมาละก็ เมื่อกลับถึงบ้านให้รีบอาบน้ำล้างหน้า และสระผมด่วนๆ เลยนะคะ เพราะนอกจากจะเสี่ยงเป็นหวัดแล้วยังเสี่ยงต่อผิวเสียอีกด้วย เพราะในน้ำฝนมีทั้งฝุ่นละออง สิ่งสกปรก และเชื้อโรคมากมาย ซึ่งอาจทำให้ผิวเกิดอาการแพ้ได้ค่ะ</p><h3>2. ใช้โทนเนอร์เช็ดหน้า</h3><p>บางครั้งการล้างหน้าอย่างเดียวคงไม่พอ
  เพราะในน้ำฝนนั้นมีแต่ฝุ่นและมลพิษมากมาย จึงแนะนำว่าหลังล้างหน้าเสร็จ ควรเช็ดทำความสะอาดผิวหน้าด้วยโทนเนอร์สูตรปราศจากแอลกอฮอล์ เพื่อขจัดสิ่งตกค้างบนรูขุมขน อันเป็นสาเหตุของสิวอุดตัน และยังช่วยกระชับรุขุมขน และช่วยปรับสภาพผิวหน้าให้พร้อมก่อนการบำรุงในขั้นต่อไปอีกด้วยค่ะ</p><h3>3. บำรุงผิวด้วยมอยส์เจอไรเซอร์</h3><p>ในช่วงฤดูฝนเป็นช่วงที่มีความชื้นในอากาศค่อนข้างมาก อาจทำให้ผิวแห้ง และขาดความชุ่มชื้นได้ สาวๆ จึงควรหมั่นบำรุงผิวด้วยการทามอยส์เจอไรเซอร์อย่างสม่ำเสมอ เพื่อป้องกันผิวแห้งและช่วยรักษาความชุ่มชื้นให้อยู่กับผิวได้นานยิ่งขึ้นค่ะ</p><p><img src="https://www.doctoryounger.com/img-uploads/f3.jpg" alt=""></p><h3>4. ทาครีมกันแดด</h3><p>ถึงแม้ว่าแสงแดดในหน้าฝนจะไม่แรงเท่าแดดในหน้าร้อน เพราะท้องฟ้าดูมืดครึ้มตลอดเวลา แต่จริงๆ แล้วรังสียูวีจากดวงอาทิตย์ก็ยังทะลุผ่านก้อนเมฆมาทำร้ายผิวของสาวๆได้อยู่ดี โดยเฉพาะรังสียูวีเอและยูวีบี ที่ทำให้เกิดริ้วรอยเหี่ยวย่น ฝ้า กระ และจุดด่างดำ ดังนั้นสาวๆ จึงควรทาครีมกันแดดทุกวัน แม้วันนั้นจะมีฝนตกหรือแดดร่มก็ตาม โดยเลือกครีมกันแดดชนิดกันน้ำที่มีความบางเบาและไม่เหนียวเหนอะหนะ</p><h3>5.
  ไม่ต้องแต่งหน้าเยอะ</h3><p>แม้ว่าปัจจุบันจะมีเครื่องสำอางที่กันน้ำได้ดีเยี่ยมออกมาช่วยให้สาวๆ สามารถแต่งหน้าได้โดยไม่ต้องกลัวเมคอัพจะเปียกน้ำจนไหลเยิ้มก็ตาม แต่ในช่วงฤดูฝนจะมีความชื้นในอากาศเยอะ ซึ่งมีผลทำให้รูขุมขนกว้างได้ง่ายๆ กว่าสภาพอากาศแบบปกติ ทางที่ดีสาวๆ ควรแต่งหน้าแบบเบาบาง โดยใช้เครื่องสำอางหรือรองพื้นที่ไม่หนามากเกินไป เพราะอาจทำให้รูขุมขนอดตัน และเกิดสิวได้ง่ายค่ะ</p><h3>6. ขัดสครับผิวและพอกหน้า</h3><p>ความชื้นจากฝนจะทำให้ผิวเกิดการอุดตันได้ง่าย ดังนั้นสาวๆ จึงควรทำความสะอาดผิวด้วยการขัดผิวเบาๆ อย่างน้อยสัปดาห์ละ 1 ครั้ง เพื่อช่วยขจัดสิ่งอุดตันและขัดเซลล์ผิวเก่าให้หลุดออกไป และอาจพอกหน้าอย่างน้อย 1 ครั้งต่อสัปดาห์เพื่อเพิ่มความชุ่มชื้นให้กับผิวหน้า</p><p><img src="https://www.doctoryounger.com/img-uploads/t002.jpg" alt=""><strong><br></strong></p><h3>7. ดื่มน้ำบ่อยๆ</h3><p>ในฤดูฝน อากาศจะค่อนข้างเย็น อาจทำให้สาวๆ หลายคนไม่ค่อยหิวน้ำสักเท่าไรนัก แต่อย่างไรแล้วก็ควรดื่มน้ำบ่อยๆ วันละ 8-10 แก้ว เพื่อเพิ่มความชุ่มชื้นให้กับเซลล์ผิวในร่างกาย และช่วยให้ผิวพรรณดูเปล่งปลั่งสดใสอีกด้วยค่ะ</p><h3>8.
  ทานผักผลไม้ และอาหารที่มีประโยชน์</h3><p>การทานผัก ผลไม้ และอาหารที่ให้วิตามินหลากหลายชนิด จะช่วยให้ผิวพรรณของสาวๆดูสดใสมีสุขภาพดี มีน้ำมีนวล และยังช่วยให้ระบบภูมิคุ้มกันในร่างกายทำงานอย่างมีประสิทธิภาพ ป้องกันการเป็นไข้หวัดได้ดีอีกด้วย</p><p>เพื่อการดูแลผิวให้มีสุขภาพดีตลอดช่วงหน้าฝนนี้ สาวๆทั้งหลายก็อย่าลืมนำวิธีดูแลผิวที่เรานำมาฝากนี้ไปใช้กันนะคะ คราวนี้ต่อให้ฝนจะตกบ่อยแค่ไหน ก็ไม่เป็นอุปสรรคต่อการมีผิวสวยสดใสของเราแล้วล่ะ</p><h3>ที่มา: Kapook</h3>'
