title: ช่วงอายุเท่านี้ควรนอนกี่ชั่วโมง ถึงจะเหมาะสม??
date: 15 Jan 2018
source: มูลนิธินอนหลับแห่งชาติ
body: '<p>จำนวนชั่วโมงของการนอนที่เหมาะสมที่สุดอยู่ที่ 6-8 ชั่วโมง ใครๆ ก็เคยได้ยินมาแบบนี้ แต่รู้ไหมคะว่ามันก็ใช้ไม่ได้กับคนในทุกๆ วัย เพราะช่วงอายุก็มีผลต่อชั่วโมงการนอนเหมือนกัน วันนี้เราจะพามาดูกันค่ะว่า ช่วงอายุเท่านี้ควรจะนอนกี่ชั่วโมง ถึงจะเรียกว่าเหมาะสม มูลนิธินอนหลับแห่งชาติได้ให้ข้อมูลไว้ดังนี้</p><p><img src="https://www.doctoryounger.com/img-uploads/11.jpg" alt=""></p><p><strong>– เด็กแรกเกิด</strong> ช่วงอายุประมาณ 0-3 เดือน ควรนอน 14-17 ชั่วโมง</p><p><strong>– เด็กทารก</strong> ช่วงอายุ 4-11 เดือน ควรนอน 12-15 ชั่วโมง</p><p><strong>– เด็กวัยหัดเดิน</strong> ช่วงอายุ 1-2 ปี ควรนอน 11-14 ชั่วโมง</p><p><strong>– เด็กอนุบาล</strong> ช่วงอายุ 3-5 ปี ควรนอน 10-13 ชั่วโมง</p><p><strong>– เด็กประถม</strong> ช่วงอายุ 6-13 ปี ควรนอน 9-11 ชั่วโมง</p><p><strong>– วัยมัธยม </strong>ช่วงอายุ 14-17 ปี ควรนอน 8-10 ชั่วโมง</p><p><img src="https://www.doctoryounger.com/img-uploads/22.jpg" alt=""></p><p><strong>– วัยรุ่น </strong>หรือวัยมหาวิทยาลัย ช่วงอายุ 18-25 ปี ควรนอน 7-9 ชั่วโมง</p><p><strong>–
  วัยผู้ใหญ่ </strong>หรือวัยทำงาน ช่วงอายุ 26-64 ปี ควรนอน 7-9 ชั่วโมง</p><p><strong>– วัยสูงอายุ </strong>ช่วงอายุมากกว่า 65 ปีขึ้นไป ควรนอน 7-8 ชั่วโมง</p><p>เห็นไหมล่ะแต่ล่ะช่วงอายุ ก็มีชั่วโมงการนอนที่เหมาะสมที่แตกต่างกันออกไป ทั้งนี้ก็เวลาการนอนที่เหมาะสมสามารถ บวกหรือลบ 1 ชั่วโมงได้ในบางกรณี เช่น วัยทำงาน สามารถนอน 6 ชั่วโมง หรือ 10 ชั่วโมงก็ได้ โดยที่ไม่ถือว่าคุณพักผ่อนน้อยหรือมากจนเกินไป รู้แบบนี้แล้วก็อย่าลืมลองนำไปทำตามกันดูนะ อย่าลืมว่าการนอนหลับพักผ่อนก็เป็นสิ่งจำเป็นต่อร่างกายเหมือนกัน</p><h3>ที่มา: มูลนิธินอนหลับแห่งชาติ</h3>'
