title: กิน "ถั่ว" เป็นประจำ ช่วยลดน้ำหนักได้
date: 04 Oct 2017
source: www.studyfinds.org
body: '<p>หลายคนทราบกันดีว่า "ถั่ว" เป็นธัญพืชที่มีประโยชน์ต่อร่างกาย ซึ่งผลการศึกษาล่าสุด พบว่าการบริโภคถั่วเป็นประจำ ช่วยลดความเสี่ยงที่จะมีน้ำหนักตัวเพิ่มได้</p><p>โดยทีมวิจัยจากมหาวิทยาลัย Loma Linda University School of Public Health และศูนย์วิจัยมะเร็ง IARC ในสหรัฐอเมริกา ระบุว่า จากการติดตามผลผู้ร่วมการวิจัยที่มีอายุ 25-70 ปี จากชาติในยุโรป 10 ประเทศ จำนวน 373,000 คน เป็นเวลา 5 ปี พบว่าผู้ที่กินถั่วเป็นประจำมีน้ำหนักตัวที่ลดลงเฉลี่ยแล้วเกือบ 5 เปอร์เซ็นต์ เมื่อเทียบกับกับคนที่ไม่ได้บริโภคถั่วเลย</p><p><img src="https://www.doctoryounger.com/img-uploads/7.jpg" alt=""></p><p>ดอกเตอร์ฆวน ซาบาเต้ ผู้อำนวยการศูนย์โภชนาการที่มหาวิทยาลัย Loma Linda University School of Public Health เผยว่า คนส่วนใหญ่มักเชื่อกันว่า การกินถั่วจะทำให้น้ำหนักตัวเพิ่มขึ้น เพราะอุดมไปด้วยไขมันในปริมาณสูง แต่ความเป็นจริงแล้ว ไขมันเกือบทั้งหมดล้วนเป็นไขมันดี</p><p>ทั้งนี้การกินถั่วหลายๆ ชนิด อาทิ ถั่วลิสง, อัลมอนด์, เฮเซลนัท พิสตาชิโอ และวอลนัท ต่อ 1 หน่วยบริโภค พบว่ามีไขมันอิ่มตัวเพียง 1.5 กรัมเท่านั้น ซึ่งถั่วเหล่านี้ล้วนอุดมไปด้วยโปรตีน,
  วิตามิน, แร่ธาตุ และสารพฤกษเคมี จึงไม่ใช่อาหารที่ทำให้อ้วนแต่อย่างใด และเหมาะที่จะบริโภคระหว่างมื้ออาหาร แทนการกินไขมันที่มาจากสัตว์ด้วย</p><h3>ที่มา: www.studyfinds.org</h3>'
