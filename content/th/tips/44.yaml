title: เห็ดหูหนูขาว สุดยอดของเห็ดเพื่อสุขภาพและผิวพรรณ
date: 15 Sep 2017
source: Lovefitt
body: '<p><strong>เห็ดหูหนู</strong> เป็นเห็ดที่เต็มไปด้วยประโยชน์เพื่อร่างกายและผิวพรรณ มีสารอาหาร วิตามิน และสารต้านอนุมูลอิสระ มีไฮยารูโรนิค แอซิด (Hyaluronic Acid) ที่ช่วยให้ผิวชุ่มชื่น อุ้มน้ำ เต่งตึง ดูอ่อนวัย เห็ดหูหนู เป็นเห็ดที่หาทานได้ง่ายราคาไม่แพง เป็นเห็ดที่นิยมนำมาทำเป็นอาหาร และผลิตเป็นสารสกัด เพื่อช่วยบำรุงร่างกายและผิวพรรณ เห็ดหูหนูสามารถแบ่งชนิดหลักๆ ได้ ตามสีของของเห็ดคือเห็ดหูหนูดำและเห็ดหูหนูขาว โดยทั้งสองชนิดมีประโยชน์คล้ายๆกัน แต่จะให้ประโยชน์แก่อวัยวะภายในร่างกายแต่ละส่วนแตกต่างกัน</p><p><img src="https://www.doctoryounger.com/img-uploads/002.jpg" alt=""></p><p><strong>ประโยชน์โดยรวมของเห็ดหูหนูทั้งขาวและดำ</strong> คือช่วยบำรุงเลือด ช่วยชะลอความเสื่อมถอยของเซลล์ในร่างกาย เสริมสร้างภูมิคุ้มกัน ช่วยลดความเสี่ยงในการเกิดโรคมะเร็ง เป็นยาบำรุงกำลัง บำรุงระบบย่อยอาหาร บำรุงสมอง โดยเฉพาะเห็ดหูหนูขาวที่ได้รับการยกย่องมาอย่างยาวนานว่าเป็นสุดยอดของเห็ดเพื่อสุขภาพอย่างแท้จริง เมื่อพูดถึงเห็ดหูหนูขาว เชื่อว่าน้อยคนนักที่จะไม่รู้จักและไม่เคยทาน เห็ดหูหนูขาว หรือ ชื่อในภาษาอังกฤษว่า
  Tremella Mushroom, Tremella Fuciformis Mushroom (White Jelly Fungus) เป็นเห็ดที่มีลักษณะเหมือนเยลลี่ อุ้มน้ำได้ดี เป็นเห็ดที่รู้จักกันดีในวงการแพทย์แผนจีน โดยมีประวัติอันยาวนาน ถูกใช้ในตำรับอาหารช่วยบำรุงกำลัง และใช้ในตำรับยาภายในพระราชวังหลวง มาตั้งแต่สมัยราชวงศ์ถัง ถึงขนาดมีการจดบันทึกว่า นางสนมหยางกุ้ยเฟย ที่ได้รับการยกย่องและขนานนามว่าเป็นผู้หญิงที่สวยที่สุดคนนึงในประวัติศาสตร์ของจีน มีการใช้เห็ดหูหนูขาวเป็นส่วนประกอบในสูตรยาเพื่อช่วยรักษาผิวพรรณและความงาม</p><p><strong>เห็ดหูหนูขาวกับผิวพรรณ </strong>คุณประโยชน์ของเห็ดหูหนูขาวที่กำลังได้รับความนิยมและพูดถึงมากเรื่องนึงในตอนนี้คือ คุณสมบัติที่ช่วยเรื่องการบำรุงผิวพรรณ การทานเห็ดหูหนูขาวจะช่วยเพิ่มความชุ่มชื่น อิ่มน้ำให้กับผิวพรรณ เนื่องจากเห็ดหูหนูขาว สามารถซับและอุ้มน้ำได้มาก ถือเป็นไฟโต ไฮยาลูโรเนด (Hyaluronate) ตามธรรมชาติ ที่ช่วยจัดการกับอนุมูลอิสระภายในร่างกายอย่างมีประสิทธิภาพ จึงช่วยฟื้นคืนความอ่อนเยาว์ ผิวเรียบเนียน คืนความเต่งตึงให้กับผิวและใบหน้าได้</p><p><img src="https://www.doctoryounger.com/img-uploads/003.jpg" alt=""></p><p><strong>สรรพคุณของเห็ดหูหนูขาว
  </strong>นอกจากเรื่องผิวที่เด่นๆ แล้ว เห็ดหูหนูขาวนั้นยังเป็นพืชที่มีสรรพคุณอื่น ๆ อีกมากมาย ทั้งช่วยบำรุงร่างกาย และยังช่วยในการควบคุมน้ำหนักได้ สำหรับประโยชน์ต่อร่างกายนั้น เห็ดหูหนูขาวจะออกฤทธิ์โดยตรงกับปอด ไต กระเพาะอาหาร และกระดูก จากงานวิจัยสมัยใหม่พบว่าในเห็ดหูหนูขาวประกอบด้วยสารอาหารต่างๆมากมาย ได้แก่ โปรตีน ไขมัน น้ำตาล ใยอาหาร วิตามิน มีกรดอะมิโนสำคัญที่จำเป็นต่อร่างกายหลายตัว มีฤทธิ์เป็นกลาง ไม่ร้อน ไม่เย็น มีรสหวาน จึงจัดอยู่ในคุณสมบัติของยาบำรุง เสริมพลัง</p><p>- ช่วยบำรุงสมอง มีฤทธิ์ช่วยสงบประสาท ช่วยให้นอนหลับได้ดี</p><p>- เสริมและบำรุงสารน้ำของปอด</p><p>- บำรุงไต</p><p>- บรรเทาอาการไอ</p><p>- บำรุงหัวใจ</p><p>เห็ดหูหนูขาวมีสารต้านอนุมูลอิสระซึ่งสูงกว่าเบต้าแคโรทีนในผักสีส้มและเหลือง มีส่วนช่วยในการชะลอความเสื่อมของเซลล์ ช่วยเสริมสร้างภูมิคุ้มกันให้กับร่างกาย จึงเป็นสุดยอดเห็ดอีกชนิดที่มีความโดดเด่นในการช่วยลดความเสี่ยงในการเกิดโรคมะเร็ง นอกจากนี้ยังช่วยให้ระบบการไหลเวียนเลือดดี ลดความดัน ลดอาการหลอดเลือดหัวใจตีบและหลอดเลือดในสมองแตกได้</p><p><img src="https://www.doctoryounger.com/img-uploads/001.jpg"
  alt=""></p><p><strong>รับประทานเห็ดหูหนูขาวกันเถอะ </strong>จากข้อมูลที่ได้เล่าสู่กันฟัง การรับประทานเห็ดหูหนูขาวจึงเป็นทางเลือกนึงในการดูแลสุขภาพร่างกายแบบครบวงจร ทั้งบำรุงกำลัง บำรุงกระดูก ข้อต่อ บำรุงอวัยวะภายใน ช่วยควบคุมน้ำหนัก บำรุงผิวให้เต่งตึง ชุ่มน้ำ ใครสนใจก็ลองไปหาเห็ดหูหนูมารับประทานกัน ซึ่งเห็ดหูหนูขาวถือเป็นเห็ดที่หาซื้อได้ง่าย มีให้เลือกซื้อทั้งแบบแห้ง และแบบแปรรูป ถือเป็นเห็ดที่รับประทานอร่อย สามารถนำมาทำอาหารได้หลากหลายเมนู ทั้งคาวและหวาน ส่วนใครที่อยากเสริม ไฮยารูโรนิค แอซิด (Hyaluronic Acid) จากหูหนูขาวในรูปแบบของสารสกัด ก็ลองปรึกษาเภสัชกร หรือผู้เชี่ยวชาญดู ศึกษาหาข้อมูลเพิ่มเติม เพื่อให้ได้ข้อมูลเชิงลึกที่จะเป็นประโยชน์ ใช้เพื่อประกอบการตัดสินใจอีกทาง</p><h3>ที่มา: Lovefitt</h3>'
