title: ดูแลตัวเองให้ห่างไกล "มะเร็งปากมดลูก"
date: 01 Dec 2017
source: สำนักงานกองทุนสนับสนุนการสร้างเสริมสุขภาพ
body: '<p>มะเร็งปากมดลูกเป็นโรคร้ายที่ไม่ใช่เรื่องไกลตัวของผู้หญิง เพราะเป็นโรคที่พบเป็นอันดับต้นๆ ของโรคมะเร็งในสตรี แต่ผู้หญิงส่วนใหญ่หลายคนก็ยังละเลยที่จะเรียนรู้ และป้องกันโรคร้ายนี้ โดยเฉพาะผู้หญิงวัยสาวที่อาจมองว่าโรคนี้ไม่เกิดขึ้นในวัยเราหรอก หรือคนที่คิดว่าไม่เคยมีเพศสัมพันธ์ หรือไม่ใช่คนเปลี่ยนคู่นอนบ่อยไม่มีทางเป็นโรคนี้ ขอบอกว่าคุณคิดผิด</p><h3>มะเร็งปากมดลูกเกิดขึ้นได้อย่างไร??</h3><p>มะเร็งปากมดลูกเกิดจากการติดเชื้อ HPV ที่เซลล์บริเวณปากมดลูก ซึ่งจะเริ่มเกิดการอักเสบขึ้น แต่ผู้หญิงร้อยละ 60 ที่ติดเชื้อและมีอาการอักเสบนี้ ระบบภูมิคุ้มกันในร่างกายจะสามารถรักษาอาการให้หายได้เองในระยะเวลา 2-4 ปี แต่ก็มีผู้หญิงอีกร้อยละ 15 ที่เกิดความผิดปกติของเซลล์ไปสู่ขั้นที่รุนแรงมากขึ้น และเมื่อมาถึงจุดนี้ ผู้หญิงร้อยละ 30-70 จะมีความผิดปกติของเซลล์รุนแรงมากขึ้นอีกหากไม่ได้รับการตรวจและรักษาให้หายขาด เพราะเชื้อ HPV จะเข้าไปทําให้กลไกควบคุมการเจริญเติบโตของเซลล์เสียไป ขั้นตอนนี้จะใช้ระยะเวลาประมาณ 10 ปี และเข้าสู่การเป็นมะเร็งปากมดลูก</p><p><img src="https://www.doctoryounger.com/img-uploads/1111.jpg"
  alt=""><strong><br></strong></p><h3>ใครๆ ก็สามารถติดเชื้อ HPV ได้</h3><p>ผู้หญิงหลายคนมักคิดว่าตนเองคงไม่ติดเชื้อ HPV เพราะคิดว่าการติดเชื้อ HPV จะเกิดขึ้นกับผู้หญิงที่มีคู่นอนหลายคน หรือมีสุขภาพไม่แข็งแรงเท่านั้น แต่ความจริงแล้ว เชื้อ HPV สามารถเกิดขึ้นได้กับทุกคน และการติดเชื้อ HPV มักไม่แสดงอาการในช่วงแรกเริ่ม และใช้ระยะเวลายาวนานเป็นสิบปีในการค่อยๆ กลายเป็นมะเร็งปากมดลูก</p><h3>คนที่เสี่ยงต่อการติดเชื้อ HPV คือ</h3><p>- คนที่มีคู่นอนติดเชื้อนี้มาก่อน</p><p>- คนที่มีคู่นอนหลายคน</p><p>- คนที่มีคู่นอนและคู่นอนมีเพศสัมพันธ์กับคนอื่นมากกว่า 1 คน</p><p>- คนที่มีระบบภูมิต้านทานในร่างกายอ่อนแอ (เช่น ในช่วงตั้งครรภ์ หรือคนที่มีเชื้อ HIV หรือเอดส์)</p><p>- คนที่มีเพศสัมพันธ์แบบผัวเดียวเมียเดียว แต่คู่ติดเชื้อมาจากการมีเพศสัมพันธ์กับคนอื่นมาก่อน</p><h3>การจะเป็นมะเร็งปากมดลูกหรือไม่นั้น นอกจากการติดเชื้อ HPV บางชนิดแล้ว ยังต้องผนวกกับปัจจัยอื่นๆ ได้แก่</h3><p>- สูบบุหรี่เป็นประจํา</p><p>- ทานอาหารให้โทษกับร่างกายและอาหารที่มีสารเคมีประกอบ</p><p>- ทานยาคุมกําาเนิดมาเป็นเวลานานติดต่อกันกว่า 5
  ปี</p><p>- มีลูกคนแรกตอนอายุน้อยมาก</p><p>- มีลูกหลายคน</p><p>- ติดเชื้อ HIV หรือเอดส์ ซึ่งมีผลทําให้ภูมิคุ้มกันในร่างกายอ่อนแอ</p><p>- ฝ่ายชายมีพฤติกรรมทางเพศที่มีคู่นอนหลายคน ทําให้มีโอกาสนําเชื้อ HPV มาติดฝ่ายหญิงได้มากขึ้น</p><p>- แม่ พี่สาว หรือน้องสาวเคยเป็นมะเร็งปากมดลูกเพราะเชื้อ HPV เกิดขึ้นในระหว่างการมีเพศสัมพันธ์ ดังนั้นผู้ที่มีเพศสัมพันธ์ครั้งแรกตั้งแต่อายุยังน้อยก็จะมีช่วงเวลาที่เสี่ยงต่อการติดเชื้อ HPV ยาวนานกว่า รวมถึงคนที่เปลี่ยนคู่นอนบ่อยก็จะมีโอกาสเสี่ยงต่อการติดเชื้อ HPV มากกว่าคนผัวเดียวเมียเดียว</p><p><img src="https://www.doctoryounger.com/img-uploads/2222.jpg" alt=""><strong><br></strong></p><p><strong>นอกเหนือจากการมีเพศสัมพันธ์ที่ไม่เหมาะสมจะเสี่ยงต่อการเป็นมะเร็งปากมดลูก พฤติกรรมการกินและการใช้ชีวิตก็มีผลต่อโรคมะเร็งเช่นกัน</strong></p><p>- ทานอาหารที่มีประโยชน์ หลีกเลี่ยงอาหารมันและสารเคมีปนเปื้อน</p><p>- ไม่สูบบุหรี่ เคี้ยวยาเส้น ดื่มแอลกอฮอล์หรือเครื่องดื่มมึนเมา</p><p>- ปกป้องตัวเราจากโรคติดต่อทางเพศสัมพันธ์ทุกชนิด</p><p>- หาความรู้เกี่ยวกับธรรมชาติของโรคมะเร็ง
  เพราะการที่เซลล์ในร่างกายจะเปลี่ยนแปลงผิดปกติจนกลายเป็นเนื้อร้ายหรือมะเร็งนั้น เป็นสิ่งที่เกิดขึ้นอย่างช้าๆ ใช้เวลานานนับปีกว่าอาการของโรคจะรุนแรงขึ้นเป็นลําดับจนถึงขั้นสุดท้ายที่รักษาไม่ได้</p><p>หากเราดูแลหมั่นสังเกตตัวเองแต่เนิ่นๆ เราก็จะมีโอกาสค้นพบและกําจัดความผิดปกตินี้ได้ก่อนที่เชื้อจะเติบโตเป็นเนื้อร้ายและกระจายไปทั่วร่างกายของเรา</p><h3>เราควรตรวจมะเร็งปากมดลูกบ่อยแค่ไหน?</h3><p>ผู้หญิงที่เคยมีเพศสัมพันธ์มาแล้ว ควรรับการตรวจภายในทุกคนทุก 1-2 ปี และตรวจคัดกรองเพื่อหามะเร็งในระยะเริ่มแรก และระยะก่อนเป็นมะเร็งอย่างน้อยทุกๆ 3 ปี สําหรับผู้ที่ไม่สะดวกไปรับบริการก็ควรตรวจอย่างน้อยทุกๆ 5 ปี หากผลตรวจปกติ 2-3 ครั้ง ก็สามารถเว้นระยะห่างออกไปได้ สําหรับผู้หญิงที่มีเลือดออกผิดปกติทางช่องคลอด ควรมาพบแพทย์ตรวจ แม้จะหมดประจําเดือนไปแล้วหรือไม่มีเพศสัมพันธ์มานานแล้วก็ตาม</p><h3>ที่มา: สำนักงานกองทุนสนับสนุนการสร้างเสริมสุขภาพ</h3>'
