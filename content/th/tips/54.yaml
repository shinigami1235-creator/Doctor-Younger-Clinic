title: ไม่ค่อยเปลี่ยนผ้าอนามัย เสี่ยงมะเร็งปากมดลูก??
date: 23 Oct 2017
source: Dailynews
body: '<p>จากกรณีมีการแชร์ว่อนโซเชียลให้สาวๆ ระวังให้ดีถ้าใช้ผ้าอนามัยแบบซึมซับมากๆ หรือไม่ค่อยจะเปลี่ยนผ้าอนามัยในแต่ละวัน ไม่ว่าจะด้วยเหตุผลเพราะเลือดยังซึมซับไม่เต็มแผ่น หรือลืมเปลี่ยนในแต่ละวัน ถือว่าอันตรายมาก เพราะว่าเลือดเป็นอาหารของเชื้อแบคทีเรีย จึงเสี่ยงเป็นมะเร็งปากมดลูกอีกปัจจัยหนึ่ง ดังนั้นจึงควรเปลี่ยนผ้าอนามัยทุก2 ชม. เพื่อให้จุดซ่อนเร้นไม่อับชื้น จึงจะช่วยลดโอกาสการเป็นมะเร็งปากมดลูก</p><p><img src="https://www.doctoryounger.com/img-uploads/002.jpg" alt=""></p><p>วันที่ 22 ต.ค. “เดลินิวส์ออนไลน์” ไขคำถามคาใจว่า จริงๆ แล้วการที่สาวๆ ไม่ค่อยเปลี่ยนผ้าอนามัยในแต่ละวันไม่ได้เพิ่มโอกาสการเป็นมะเร็งปากมดลูกแต่อย่างใด จึงถือเป็นข้อมูลที่ผิด และไม่ควรแชร์ต่อ เพราะจริงๆ แล้วสาเหตุที่แท้จริงของการเกิดมะเร็งปากมดลูก คือ การติดเชื้อ HPV ที่เกิดจากการมีเพศสัมพันธ์ ผ่านการสัมผัสผิว หรือเยื่อบุอวัยวะเพศ หรือการที่ปากมดลูกมีรอยถลอกหรือแผลทำให้เชื้อเข้าไปได้ นอกจากนี้ยังมีปัจจัยเสี่ยงอื่นๆ อีก เช่น มีเพศสัมพันธ์ตั้งแต่อายุยังน้อย เปลี่ยนคู่นอนบ่อยๆ สูบบุหรี่จัด มีลูกจำนวนมาก และไม่เคยตรวจภายในเลย
  ดังนั้นเราสามารถป้องกันมะเร็งปากมดลูกได้ด้วยการฉีดวัคซีนป้องกันมะเร็งปากมดลูก แม้จะป้องกันไม่ได้ 100 เปอร์เซ็นต์แต่ก็ยังดีกว่าไม่ป้องกันเลย</p><p><img src="https://www.doctoryounger.com/img-uploads/001.jpg" alt=""></p><p>เพราะสตรีที่แต่งงานหรือมีเพศสัมพันธ์แล้ว มีโอกาสติดเชื้อไวรัสนี้ในช่วงใดช่วงหนึ่งของชีวิต แต่การติดเชื้อส่วนใหญ่มากกว่าร้อยละ 90 จะหายไปได้เอง ภายใน 1-2 ปีโดยไม่ก่ออาการหรือโรค, การใช้ถุงยางอนามัยช่วยป้องกันการติดเชื้อได้แต่ไม่ทั้งหมด, การมีคู่นอนเพียงคนเดียวก็มีโอกาสติดเชื้อได้ ดังนั้นการตรวจคัดกรองมะเร็งปากมดลูกเป็นประจำจึงเป็นสิ่งสำคัญ แม้ว่าจะมีคู่นอนเพียงคนเดียว</p><p>นอกจากนี้ยังมีความรู้เรื่องผ้าอนามัยมากฝากกันด้วยว่า ผ้าอนามัยจะมีสารต้านจุลินทรีย์และลดกลิ่น ส่วนใหญ่จะอยู่ที่ประมาณ 6 ชม. หากมีการออกกำลังกาย หรือมีเหงื่อมากควรเปลี่ยนผ้าอนามัยให้เร็วขึ้นหน่อยหรือเปลี่ยนหลังจากที่ออกกำลังกายทันที สำหรับการล้างชำระทำความสะอาดจุดซ่อนเร้นหลังจากเปลี่ยนผ้าอนามัยแล้วควรล้างด้วยน้ำสะอาดและซับด้วยกระดาษให้แห้งก็เพียงพอแล้ว ส่วนการอาบน้ำให้ใช้สบู่อ่อนๆ ล้างเพียงภายนอก เพราะถ้าใช้สบู่รุนแรงหรือล้างสวนเข้าไปอาจทำให้เกิดการระคายเคือง
  หรือเกิดอันตรายได้</p><h3>ที่มา: Dailynews</h3>'
