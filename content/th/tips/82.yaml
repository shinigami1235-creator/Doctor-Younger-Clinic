title: 6 สูตรพอกหน้าใส เนรมิตผิวสวยดั่งใจจนคุณต้องลอง
date: 25 Feb 2018
source: Sanook
body: '<p>ทั้งแสงแดดและรังสีอัลตร้าไวโอเลต ล้วนเป็นปัจจัยหลักที่ทำลายผิวโดยตรง ทำให้ใบหน้าหมองคล้ำ ซึ่งมีวิธีฟื้นบำรุงให้ผิวหน้าใสได้ไม่ยาก ด้วยการทานอาหารที่อุดมด้วยวิตามินซี เช่น มะนาวและส้ม เพื่อเป็นตัวช่วยเสริมสร้างคอลลาเจน ทำให้ผิวเต่งตึงกระชับขึ้น นอกจากนี้ การดูแลผิวหน้าให้กระจ่างใสด้วยการพอกหน้าเพื่อลดความหมองคล้ำ เช่น พอกหน้าด้วยสูตรหน้าใสจากธรรมชาติที่เรานำมาฝากนี้ ล้วนช่วยดูแลผิวสาวๆ ให้สวยปิ๊งได้อย่างแน่นอน ไปดูกันเลยค่ะว่ามีสูตรใดโดนใจบ้าง</p><h3>1. สูตรมะเขือเทศ</h3><p>เป็นผักที่มีวิตามินซีสูงและมี AHA ที่จะช่วยผลัดเซลล์ผิวให้ขาวขึ้น ให้นำมะเขือเทศสดปั่นรวมกับน้ำผึ้งเล็กน้อย แล้วนำมาขัดและพอกหน้าทิ้งไว้ประมาณ 20-30 นาที ค่อยล้างออก จะช่วยทำให้ผิวหน้าสดใส ดูขาวใสแบบอมชมพู</p><p><img src="https://www.doctoryounger.com/img-uploads/00001.jpg" alt=""></p><h3>2. สูตรมะขามเปียก</h3><p>ในมะขามเปียกมีวิตามินซีสูง จึงช่วยผลัดเซลล์ผิวหมองคล้ำให้ขาวกระจ่างใสขึ้นได้ นำมะขามเปียกมาละลายน้ำ พอได้เนื้อข้นๆ แล้วนำมาขัดหน้าอย่างเบาๆ จากนั้นพอกทิ้งไว้ประมาณ 20 นาที ค่อยล้างออก จะช่วยให้ผิวหน้าเนียนขาวกระจ่างใส
  และช่วยลดเลือนจุดด่างดำบนใบหน้าให้จางลง ซึ่งสูตรหน้าใสโดยส่วนมากก็นิยมใช้มะขามเปียกขัดผิวพอกผิวบ่อยๆ นี่ล่ะค่ะ</p><h3>3. สูตรขมิ้นชัน</h3><p>ขมิ้นชันมีสรรพคุณช่วยปรับสภาพผิวให้ขาวกระจ่างใสขึ้นได้อย่างเป็นธรรมชาติ เป็นอีกหนึ่งสูตรหน้าใสจากธรรมชาติที่อยากแนะนำสาวๆ อย่างมาก เพราะจะช่วยให้ผิวเนียนละเอียด และช่วยรักษาสิวได้เป็นอย่างดี ให้นำขมิ้นสดปอกเปลือกปั่นรวมกับดินสอพองและน้ำมะนาว นำมาพอกหน้าปล่อยทิ้งไว้ประมาณ 10 นาที ค่อยล้างออก</p><h3>4. สูตรไข่ขาว</h3><p>ในไข่ขาวอุดมด้วยโปรตีน วิตามินเอ และมีคุณสมบัติสามารถช่วยดูดซับสิ่งสกปรกบนใบหน้าได้ดี ให้นำไข่ขาวพอกหน้าทิ้งไว้ประมาณ 20 นาที ช่วยให้ผิวหน้าขาวใส เนียนนุ่ม ลดเลือนริ้วรอย ลดความมันบนใบหน้าและช่วยลดการเกิดสิวเสี้ยน</p><p><img src="https://www.doctoryounger.com/img-uploads/00002.jpg" alt=""></p><h3>5. สูตรมะนาว</h3><p>ความเปรี้ยวของมะนาวคือ วิตามินซี ที่มีส่วนช่วยบำรุงให้ผิวหน้าขาวใส ให้นำมะนาว 1/2 ลูกมาปั่นผสมกับหัวไชเท้า 1/2 หัวที่ปอกเปลือกแล้วให้ละเอียด นำส่วนผสมที่ได้มาพอกหน้าทิ้งไว้ประมาณ 15-20 นาที จากนั้นล้างออกให้สะอาด จะช่วยให้ใบหน้าขาวใสเปล่งปลั่งยิ่งขึ้น</p><h3>6.
  สูตรสตรอว์เบอร์รี</h3><p>สตรอว์เบอร์รีมีกรดซาลิไซลิก และกรดแอลฟ่าไฮดรอกแอซิด โดยมีคุณสมบัติในการฟอกสีผิวได้เป็นอย่างดี ให้นำสตรอว์เบอร์รีมาบดละเอียดจำนวน 4-5 ลูก ผสมกับน้ำผึ้ง 1 ช้อนโต๊ะ คนจนเข้ากัน แล้วนำมาพอกหน้าทิ้งไว้ประมาณ 30-40 นาที จากนั้นล้างออก จะช่วยให้ผิวหน้าขาวเปล่งปลั่ง รอยหมองคล้ำลดลง และนี่ก็คืออีกหนึ่งสูตรหน้าใสที่ทำง่ายๆ ด้วยสตรอว์เบอร์รี</p><p>เมื่อดูแลผิวหน้าหมองคล้ำให้กลับมาขาวกระจ่างใสได้แล้ว ก็อย่าลืมหมั่นทาครีมกันแดดเป็นประจำ เพราะแสงแดดเป็นตัวการสำคัญที่ทำให้ผิวหน้าหมองคล้ำได้ง่าย หรือแม้แต่แสงจากหลอดไฟก็ทำให้ผิวหน้าหมองคล้ำได้เช่นกัน ดังนั้นเพื่อการปกป้องผิวหน้าอย่างได้ผล อย่าลืมทาครีมกันแดดทุกวันขาดนะคะ</p><h3>ที่มา: Sanook</h3>'
