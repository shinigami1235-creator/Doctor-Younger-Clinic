title: 9 สัญญาณเตือน...ที่บอกว่าคุณกำลังเป็นโรคซึมเศร้าซะแล้ว!!
date: 01 Aug 2017
source: Mthai
body: '<p>เราอยู่ในยุคที่รอบกายเรามีแต่ความกดดัน ไม่ว่าจะเป็นจากสภาพแวดล้อม สังคม หรือการทำงานก็ดี ทำให้เกิดความผิดหวังขึ้นแบบที่ปฏิเสธไม่ได้ ซึ่งสิ่งเหล่านี้สามารถส่งผลกระทบต่อสภาพจิตใจของเรา ส่งผลป่วยเป็นโรคซึมเศร้าได้ง่าย ทั้งนี้ข้อมูลทางการแพทย์ยังชี้ให้เห็นว่า การถ่ายทอดทางพันธุกรรมก็เป็นสาเหตุสำคัญประการหนึ่งที่กระตุ้นให้เกิดโรคซึมเศร้าอีกด้วย ดังนั้นหากไม่ทำความเข้าใจโรคซึมเศร้าอย่างถ่องแท้ การรับมือกับโรคร้ายที่คุกคามประชากรกว่า 300 ล้านทั่วโลกในขณะนี้ก็คงเป็นเรื่องที่ทำได้ยาก</p><p>น.ต.นพ.บุญเรือง ไตรเรืองวรวัฒน์ อธิบดีกรมสุขภาพจิต กล่าวว่า ภาวะซึมเศร้า เป็นความเจ็บป่วย ไม่ใช่ความอ่อนแอทางจิตใจ โดยทั่วไปผู้ป่วยจะมีความรู้สึกไม่สบายใจ ทุกข์ใจ เศร้า ท้อแท้ ซึม เบื่อ ไม่อยากพูดหรือปฏิบัติกิจกรรมในชีวิตประจำวัน หากไม่รีบรักษาอาการจะรุนแรงขึ้น จากการศึกษาวิจัยสรุปได้ว่า ภาวะซึมเศร้าเกิดจากความผิดปกติของสารสื่อประสาทในสมอง ส่วนหนึ่งเกี่ยวข้องกับพันธุกรรม โดยมีความเครียดทางสังคมเป็นตัวกระตุ้นให้เกิดโรค ส่วนผู้ที่อยู่ในกลุ่มเสี่ยงโรคซึมเศร้า คือ ผู้ป่วยโรคทางกายเรื้อรัง เช่น โรคหัวใจและหลอดเลือด
  โรคหลอดเลือดสมอง โรคเบาหวาน โรคไตวายเรื้อรัง โรคมะเร็ง หญิงตั้งครรภ์หลังคลอด ผู้สูงอายุ ผู้ที่ติดสุราและสารเสพติด และผู้ที่สูญเสียคนที่รักหรือสิ่งของที่รัก</p><p><img src="https://www.doctoryounger.com/img-uploads/00004.jpg" alt=""></p><p>ทั้งนี้ นพ.โสภณ เมฆธน ปลัดกระทรวงสาธารณสุข ได้ให้ข้อมูลไว้ว่า เราสามารถป้องกันและรักษาได้ หากมีความรู้ความเข้าใจสาเหตุและอาการของโรค โดยเฉพาะอย่างยิ่งครอบครัวและชุมชนที่ต้องช่วยเหลือ รับฟัง และทำความเข้าใจ เพื่อให้ผู้ป่วยเอาชนะโรคซึมเศร้า โดยมีมาตรการเผยแพร่แนวทางทางแก้ไขปัญหาโรคซึมเศร้าที่ประกอบด้วย 5 มาตรการสำคัญ ดังต่อไปนี้</p><p>1. ลดอคติ สร้างความตระหนัก สร้างความรู้ความเข้าใจที่ถูกต้อง</p><p>2. ลดการเกิดโรคในผู้ที่เสี่ยงโดยค้นหาและป้องกัน</p><p>3. ลดระยะเวลาและความรุนแรงโรค</p><p>4. ป้องกันการฆ่าตัวตาย</p><p>5. ป้องกันการกลับมาเป็นซ้ำ</p><p><img src="https://www.doctoryounger.com/img-uploads/0005.jpg" alt=""></p><p>จะรู้ได้อย่างไรว่าเสี่ยงต่อการเป็นโรคซึมเศร้า?? มาดู 9 สัญญาณบอกเหตุของโรคซึมเศร้า</p><p>1. ซึมเศร้า หงุดหงิด ก้าวร้าว</p><p>2. ขาดความสนใจสิ่งรอบข้าง</p><p>3.
  ไม่มีสมาธิ</p><p>4. อ่อนเพลีย</p><p>5. เชื่องช้า</p><p>6. รับประทานอาหารมากขึ้นหรือน้อยลง</p><p>7. นอนมากขึ้นหรือน้อยลงจนผิดปกติ</p><p>8. ตำหนิ ตัวเอง</p><p>9. พยายามฆ่าตัวตาย</p><p>หากพบว่าตนเองหรือคนใกล้ตัวมีอาการเหล่านี้เกินกว่า 5 ข้อ และมีอาการติดต่อกันนาน 2 สัปดาห์ ให้สงสัยได้เลยว่า อาจป่วยเป็นโรคซึมเศร้า แต่อย่างไรก็ตาม โรคซึมเศร้าเป็นโรคที่สามารถป้องกันและรักษาได้ โดยอาจจะเริ่มจากการสังเกตอาการของคนรอบข้างก่อน หากพบว่าคนในครอบครัวมีอาการเสี่ยงที่จะเป็นโรคซึมเศร้า พยายามพูดคุยกับเขา และพยายามอย่าให้เขานึกถึงสิ่งที่บันทอนจิตใจ หากมีอาการมาก เช่น ต้องการทำร้ายตัวเอง หรือไม่อยากมีชีวิตอยู่ต่อแล้ว ควรดูแลเขาอย่างใกล้ชิด อย่าปล่อยให้เขาอยู่คนเดียว และที่สำคัญเก็บของมีคม หรืออุปกรณ์ต่างๆ ที่สามารถนำมาใช้ทำร้ายร่างกายไว้ให้มิดชิด</p><p>ทั้งนี้เราสามารถหาวิธีการคลายเครียดได้โดยการเข้าพบแพทย์ หรือจิตแพทย์ และทำตามที่แพทย์ผู้ดูแลอาการบอกอย่างเคร่งครัด รวมทั้งดูแลการกิน การนอนให้เป็นเวลา ออกกำลังกายอย่างสม่ำเสมอ สิ่งเหล่านี้ก็มีส่วนที่จะทำให้สุขภาพจิตดีขึ้น และกลับมาเป็นปกติได้ในที่สุด</p><h3>ที่มา:
  Mthai</h3>'
