title: 3 เคล็ดลับแก้ข้อศอกดำ หมดปัญหากวนใจไม่เกิน 2 สัปดาห์เห็นผล
date: 14 Jun 2017
source: Thaihealth
body: '<p>ข้อศอกดำ อีกหนึ่งปัญหากวนใจของสาวๆ ที่คิดยังไงก็คิดไม่ออกว่าจะทำอย่างไรให้มันหายไป เพราะขืนปล่อยไว้แบบนี้ นอกจากจะดูไม่งามแล้ว ยังทำให้ไม่มั่นใจในการแต่งตัว มัวแต่พะวงเรื่องข้อศอก จนอาจเสียบุคลิกภาพได้ วันนี้ก็มีเคล็ดลับการแก้ข้อศอกดำ มาฝากสาวๆกัน ปัญหาข้อศอกดำ ส่วนใหญ่มักเกิดจากการเสียดสี โดยเฉพาะคนที่ชอบนั่งเท้าคาง หรือเอาแขนเท้าโต๊ะไว้บ่อยๆ ทำให้ผิวหนังบริเวณข้อศอกเกิดการเสียดสี จนส่งผลให้ผิวหนังบริเวณนั้นคล้ำและด้านได้ วิธีการแก้ข้อศอกดำนั้นมีหลากหลายวิธีให้เลือกด้วยกัน ไม่ว่าจะใช้ผลิตภัณฑ์บำรุงผิว การขัดผิว การสครับผิว เป็นต้น แต่วันนี้เรามีเคล็ดลับกำจัดข้อศอกดำที่ทำได้ง่ายๆ จากของใช้ในครัวเรือน แถมยังประหยัดเงินอีกด้วยมาฝากกันด้วยวิธีต่อไปนี้</p><p><img src="https://www.doctoryounger.com/img-uploads/002.jpg" alt=""></p><h3>1. น้ำมันมะพร้าว</h3><p>โดยการนำน้ำมันมะพร้าวมานวดบริเวณข้อศอกเป็นประจำทุกวัน จะช่วยให้ผิวนุ่มชุ่มชื่น แก้ปัญหาข้อศอกดำด้านได้เป็นอย่างดี</p><p><img src="https://www.doctoryounger.com/img-uploads/001.jpg" alt=""></p><h3>2. น้ำมันมะกอก</h3><p>เพียงนำน้ำมันมะกอกมานวดบริเวณข้อศอก
  จะช่วยบำรุงผิวบริเวณข้อศอกให้นุ่ม ไม่แห้งกร้าน ทั้งยังลดความด้านได้ดีอีกด้วย</p><p><img src="https://www.doctoryounger.com/img-uploads/003.jpg" alt=""></p><h3>3. สับปะรด</h3><p>นำสับปะรดไปปั่นให้ละเอียด จากนั้นนำไปแช่ตู้เย็นจนได้ความเย็นคงที่ จึงนำสับปะรดมาขัดและถูบริเวณข้อศอก ประมาณ 5 นาที แล้วจึงล้างออก ซึ่งในสับปะรดนั้นมีเอนไซม์ที่ช่วยผลัดผิวให้ขาวเนียนใส ทั้งยังลดความด้านได้ดีอีกด้วย หมั่นทำเป็นประจำทุกวัน รับรองว่าเห็นผลอย่างแน่นอน</p><p>สาวๆ ที่กำลังกลุ้มใจอยู่ตอนนี้ ก็หายห่วงได้แล้วนะจ๊ะ เพียงแค่ 3 วิธีง่ายๆ จากของใกล้ตัว ก็สามารถช่วยให้ข้อศอกคุณหายดำ หายด้านได้ รับรองว่าไม่เกิน 2 สัปดาห์จะเห็นถึงความเปลี่ยนแปลงอย่างชัดเจนแน่นอน</p><h3>ที่มา: Thaihealth</h3>'
