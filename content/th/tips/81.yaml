title: ไม่อยากหน้าแก่ก่อนวัยต้องฟัง! เลี่ยง 6 อาหารนี้ไว้ ปลอดภัยสุด
date: 21 Feb 2018
source: มูลนิธิสร้างสุขมุสลิมไทย (สสม.)
body: '<p>ต้องยอมรับเลยว่าบ้านเราเป็นประเทศที่อาหารอร่อยเยอะมาก หลายอย่างก็เป็นอาหารที่ดีมีประโยชน์ ทานเข้าไปแล้วก็ไปช่วยบำรุงร่างกาย แต่อาหารบางอย่างนี่สิ ที่มีแค่ความอร่อย แต่ไม่ได้เป็นประโยชน์ใดๆ เลย แถมยังทำให้เราแก่อีก วันนี้เราลิสต์ประเภท อาหารที่ทำให้แก่เร็ว มาให้แล้ว เพราะฉะนั้นถ้าไม่อยากหมดสวยก่อนวัย ก็เลี่ยงไปซะ!!</p><h3>1. อาหารหรือเครื่องดื่มที่มีปริมาณน้ำตาลมาก</h3><p>หากร่างกายของคุณได้รับปริมาณน้ำตาลมากเกินไปนั้น อาจส่งผลให้เกิดปฏิกิริยาที่เรียกว่า glycation ซึ่งปฏิกิริยานี้เป็นสาเหตุที่ทำให้คุณแก่ก่อนวัยได้ เนื่องจากโมเลกุลของน้ำตาลส่วนเกินที่เราได้รับจะไปรวมกับโปรตีน ส่งผลให้เกิดสารประกอบตัวใหม่ที่มีความแข็งยืดหยุ่นน้อยและแตกเปราะได้ง่าย ทำให้เซลล์เสื่อมสภาพ สูญเสียคอลลาเจนและเกิดริ้วรอยได้ง่าย เนื่องจากผิวไม่สามารถยืดหยุ่นได้เหมือนเดิม</p><p><img src="https://www.doctoryounger.com/img-uploads/22.jpg" alt=""></p><h3>2. เครื่องดื่มที่มีแอลกอฮอล์</h3><p>ตับที่มีสุขภาพดี ก็ย่อมส่งผลให้ผิวและร่างกายมีสุขภาพที่ดีตามไปด้วย เพราะตับมีหน้าที่ทำลายสารพิษ กำจัดของเสียที่ร่างกายได้มาจากอาหารหรือสารที่รับเข้าไป
  เช่น ยา แอลกอฮอล์ ฯลฯ เมื่อตับของคุณทำงานได้เป็นอย่างดี ของเสียก็จะถูกขับออกจากร่างกายได้เองตามธรรมชาติ แต่ถ้าสารพิษเข้าไปสะสมในตับมากขึ้นจนเกิดสารพิษตกค้าง จะส่งผลเสียตามมาหลายอย่าง เช่น ผิวพรรณและสุขภาพ ซึ่งแอลกอฮอล์ก็มีส่วนสำคัญที่เป็นตัวการในการทำลายตับอย่างมากไม่ว่าจะทำให้ไขมันสะสมในตับ ,ตับอักเสบ, ตับแข็ง ฯลฯ</p><h3>3. เครื่องดื่มที่มีคาเฟอีน</h3><p>ในคาเฟอีนมีสารอดีนาลีนที่สามารถทำให้ผิวหน้าเหี่ยวย่นได้ อีกทั้งคาเฟอีนยังดูดซึมวิตามินและเเร่ธาตุที่จำเป็นจากร่างกายส่งผลเสียต่อผิวอีกเช่นกัน</p><p><img src="https://www.doctoryounger.com/img-uploads/111.jpg" alt=""></p><h3>4. อาหารปิ้งย่าง</h3><p>ในอาหารปิ้งย่างมักจะพบสารไฮโดรคาร์บอน โดยเฉพาะตรงส่วนที่ไหม้เกรียม ซึ่งก่อให้เกิดสารอนุมูลอิสระ ที่ทำลายเซลล์ต่างๆ ของร่างกาย ได้แก่ ผิวหมองคล้ำ ริ้วรอย และอาจส่งผลทำให้เกิดโรคมะเร็งได้ แต่ก็ไม่ใช่ว่าคุณจะรับทานอาหารจำพวกนี้ไม่ได้เลย เพียงแค่ต้องเลือกรับประทานสักนิด โดยเขี่ยเนื้อบริเวณที่ไหม้เกรียมออกก็สามารถช่วยลดความกังวลตรงนี้ลงไปได้บ้าง</p><h3>5. อาหารรสเค็ม</h3><p>อาหารรสเค็มในที่นี้ไม่ได้หมายถึงอาหารที่ปรุงด้วยเกลือเท่านั้น
  แต่อาหารที่มีปริมาณโซเดียมมากๆ ก็เข้าข่ายด้วยเช่นกัน ซึ่งถ้าร่างกายได้รับโซเดียมมากเกินไป จะทำให้เกิดอาการบวมน้ำ โซเดียมดูดซับน้ำออกจากระบบต่างๆ ของร่างกาย ส่งผลให้ผิวแห้งกร้าน ไม่ชุ่มชื้น แถมการบวมน้ำยังทำให้ตาบวมไม่สดใสอีกด้วย</p><p><img src="https://www.doctoryounger.com/img-uploads/223.jpg" alt=""></p><h3>6. อาหารแปรรูป</h3><p>อาหารแปรรูป อาทิ เนื้อสัตว์แปรรูป เช่น ไส้กรอก เบคอน หมูยอ แฮม ฯลฯ มักเต็มไปด้วยสารในกลุ่มซัลไฟด์ (ใช้เป็นวัตถุเจือปนอาหาร) เช่น สารกันเสีย ใช้ป้องกันสีเปลี่ยน วัตถุกันกลิ่นเหม็นหืน ฯลฯ ซึ่งจะมีส่วนกระตุ้นให้ผิวเกิดการอักเสบและเกิดริ้วรอยได้ ทางที่ดีหันมารับประทานเนื้อสัตว์ไม่ติดมันอย่าง อกไก่ เนื้อปลา จะดีกว่า</p><h3>ที่มา: มูลนิธิสร้างสุขมุสลิมไทย (สสม.)</h3>'
