title: นอนกี่ชั่วโมงถึงจะเรียกได้ว่านอนอย่างเพียงพอ
date: 18 Jul 2017
source: มูลนิธิการนอนหลับแห่งชาติ
body: '<p>เป็นเหมือนกันไหม <strong>"ยิ่งอายุมากก็ยิ่งนอนน้อย"</strong> แต่วันไหนที่นอนมาก ก็อาจจะไม่ได้รู้สึกสดชื่นแจ่มใส 100% เสมอไป เป็นเพราะเมื่อเราโตขึ้น ระยะเวลาในการนอนหลับของเราก็เปลี่ยนไปตามอายุของเราด้วย อายุเท่าไร ควรนอนกี่ชั่วโมง ถึงจะเรียกได้ว่านอนอย่างเพียงพอมาดูกัน</p><p><img src="https://www.doctoryounger.com/img-uploads/001.jpg" alt=""></p><p>มูลนิธิการนอนหลับแห่งชาติ ในสหรัฐอเมริกา ระบุระยะเวลาในการนอนหลับที่เหมาะสมโดยแบ่งตามอายุดังนี้</p><p>- เด็กแรกเกิด (อายุ 0-3 เดือน) ควรนอน 14-17 ชั่วโมงต่อวัน</p><p>- เด็กทารก (อายุ 4-11เดือน) ควรนอน 12-15 ชั่วโมง</p><p>- เด็ก (อายุ 1-2 ปี) ควรนอน 11-14 ชั่วโมง</p><p>- วัยอนุบาล (3-5 ปี) ควรนอน 10-13 ชั่วโมง</p><p>- วัยประถม (6-13 ปี) ควรนอน 9-11 ชั่วโมง</p><p>- วัยมัธยม (14-17 ปี) ควรนอน 8-10 ชั่วโมง</p><p>- วัยรุ่น (18-25 ปี) ควรนอน 7-9 ชั่วโมง</p><p>- วัยทำงาน (26-64 ปี) ควรนอน 7-9 ชั่วโมง เท่ากับตอนวัยรุ่น</p><p>- วัยชรา (65 ปีขึ้นไป) ควรนอน 7-8 ชั่วโมง</p><p><img src="https://www.doctoryounger.com/img-uploads/002.jpg" alt=""></p><p>ทั้งนี้ทั้งนั้น
  นี่คือระยะเวลาที่แนะนำว่าดีต่อร่างกายมากที่สุด สามารถบวกลบ 1 ชั่วโมงได้บ้างในบางกรณีค่ะ เช่น วัยรุ่น วัยทำงาน สามารถนอนได้ 6 หรือ 10 ชั่วโมง โดยที่ไม่ได้แปลว่านอนน้อย หรือมากจนเกินไป จะเห็นได้ว่า ที่เราอาจจะเคยเรียนกันมาแต่ก่อนว่า นอน 6-8 ชั่วโมงจะเพียงพอ จริงๆ แล้วใครที่นอนต่ำกว่า 6 ชั่วโมงอยู่บ่อยๆ อาจจะกลายเป็นว่ากำลังจะนอนไม่เพียงพอ ยิ่งนอนไม่เพียงพอติดต่อกันนานๆ อาจส่งผลถึงสุขภาพในระยะยาวได้</p><h3>ที่มา: มูลนิธิการนอนหลับแห่งชาติ</h3>'
