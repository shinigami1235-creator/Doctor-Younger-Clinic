title: คอกาแฟตามมาฟัง...ดื่มกาแฟแบบนี้สิได้ประโยชน์สูงสุดแน่นอน!!!
date: 25 Nov 2017
source: Mthai
body: '<p>กาแฟ เป็นเครื่องดื่มที่เราคุ้นชิน โดยเฉพาะคนวัยทำงาน ที่มักจะเลือกดื่มในทุกๆ เช้า หรือตอนที่รู้สึกง่วงจนแทบจะลืมตามาทำงานต่อไม่ไหว แต่ถึงอย่างไรก็แล้วแต่ หลายคนก็อาจจะทราบกันดีอยู่แล้วว่าการดื่มกาแฟมากๆ มักไม่เป็นผลดีต่อร่างกายสักเท่าไหร่ แต่วันนี้จะมาบอกเคล็ดลับการดื่มกาแฟให้ว่าต้องดื่มอย่างไร ถึงจะได้ประโยชน์จากกาแฟมากที่สุดค่ะ</p><p>1. คุณควรสังเกตว่าแท้จริงแล้ว ตัวคุณเองมีความไวของการตอบสนองต่อปริมาณกาแฟกี่ถ้วย และมีอาการอย่างไรบ้าง เพื่อหาปริมาณในการดื่มที่เหมาะสมสำหรับตนเอง แต่ทั้งนี้ก็ไม่จำเป็นว่าคุณจะต้องไปทดลองดื่มกาแฟมากๆ ภายในวันเดียว เพื่อเช็กอาการของคุณหรอกนะ เพียงแต่บางวันที่คุณอาจจะดื่มมากกว่าปกติ ร่างกายของคุณมีอาการอย่างอื่มเพิ่มขึ้นมาบ้างหรือเปล่า?</p><p>2. หากรู้ตัวอยู่แล้วว่าตนเองเป็นคนนอนหลับยาก ก็ควรหลีกเลี่ยงการดื่มกาแฟในช่วงบ่ายหรือช่วงหัวค่ำ</p><p>3. ไม่ควรดื่มกาแฟขณะท้องว่าง เนื่องจากกาเฟอีนจะเข้าไปเร่งการหลั่งกรดในกระเพาะอาหาร</p><p><img src="https://www.doctoryounger.com/img-uploads/11.jpg" alt=""></p><p>4. ไม่ควรเลือกดื่มกาแฟ เพื่อต้องการที่จะหักโหมทำงาน
  รวมไปถึงการอดนอนติดต่อกันหลายคืน แม้ว่ากาเฟอีนจะทำให้ร่างกายรู้สึกตื่นตัว แต่สมองก็ต้องการการพักผ่อน เพื่อเพิ่มประสิทธิภาพในการทำงานเช่นกัน</p><p>5. หากคุณเป็นผู้ที่ดื่มกาแฟเป็นประจำ ควรกินอาหารที่เป็นแหล่งของแคลเซียมเพิ่มเติม เช่น นม โยเกิร์ต ปลาเล็กปลาน้อย คะน้า บรอกโคลี เป็นต้น เพื่อทดแทนแคลเซียมที่สูญเสียไปกับปัสสาวะ และลดความเสี่ยงต่อโรคกระดูกพรุน หรืออาจปรับเปลี่ยนโดยการชงกาแฟใส่นมแทนครีมเทียม เป็นต้น</p><p>6. ควรกินผักผลไม้อย่างเพียงพอทุกวัน เนื่องจากในกระบวนการคั่วเมล็ดกาแฟ จะมีอนุมูลอิสระเกิดขึ้น วิตามินซี อี และบีตาแคโรทีนในผักผลไม้ เช่น มะเขือเทศ แครอต ผักใบเขียว ฝรั่ง ส้มเขียวหวาน เป็นต้น จะช่วยกำจัดอนุมูลอิสระในร่างกายได้</p><p>7. ดื่มน้ำสะอาดมากๆ เพื่อชดเชยการสูญเสียน้ำจากฤทธิ์ในการขับปัสสาวะของกาเฟอีน</p><h3>ที่มา: Mthai</h3>'
