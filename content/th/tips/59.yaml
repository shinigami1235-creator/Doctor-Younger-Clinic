title: กัดเล็บ ดึงผม แกะผิว..3 อย่างนี้คือความเป็นเพอร์เฟคชั่นนิสต์ตัวแม่!!!
date: 20 Nov 2017
source: Cleothailand
body: '<p>เรารู้นะ หลายคนชอบกัดเล็บกันใช่มั้ยล่ะ ยิ่งเวลาเจออะไรไม่ถูกใจ กัดอร่อยเลย จนตอนนี้เล็บแทบไม่เหลือ ดึงผมบ่อยจนหัวจะล้าน ผิวไม่สวยเพราะชอบแกะแขน ขาตัวเอง เรื่องนี้มีคำตอบ</p><p><img src="https://www.doctoryounger.com/img-uploads/02222.jpg" alt=""></p><p>มีงานวิจัยชิ้นนึงที่บอกเรามาแล้วว่า นิสัยชอบกัดเล็บมือตัวเอง ดึงผม แกะผิว เป็นนิสัยของคนที่ชอบความสมบูรณ์แบบ เรียกว่าเป็น Perfectionist ตัวแม่เลยก็ว่าได้ จากงานวิจัยของ Sarah Roberts, Kieron O’ Connor, Frederick Aardema และ Claude Belanger ศึกษาเรื่อง The impact of emotions on body-Focused repetitive behaviors: Evidence from a non-treatment-seeking sample ที่ลงใน Journal of Behavior Therapy and Experimental Psychiatry โฟกัสเรื่องนิสัยที่เราชอบหมกมุ่นทำกับตัวเอง (body-focused behaviors) อย่าง กัดเล็บ ชอบดึงผมตัวเอง และแกะผิวหนังตัวเอง ที่อาจเป็นส่วนหนึ่งของความเป็นคนที่ชอบความสมบูรณ์แบบ</p><p>ในงานวิจัยครั้งนี้ศึกษาจากผู้เข้าร่วมทดสอง 43 คน ครึ่งหนึ่งคือคนที่ชอบกัดเล็บ ชอบดึงผม อีกครึ่งไม่มีนิสัยแบบนี้ และแต่ละคนจะถูกถามถึงประสบการณ์ความเบื่อ
  ความโกรธ ความเครียด รวมถึงเรื่องความผ่อนคลายด้วย และจะได้เข้าไปทดลองอยู่กับความรู้สึกนั้นอีกครั้ง อย่างถ้าต้องเจอกับความเบื่อ ผู้เข้าทดลองจะได้อยู่ในห้องคนเดียวเป็นเวลา 6 นาที และจะทำแบบนี้กับทุกคนเพื่อดูรีแอคชั่นของผู้เข้าร่วมทดลอง</p><p>ผลออกมาว่าคนที่ชอบความสมบูรณ์แบบเวลาต้องเจอกับเรื่องเครียดๆ กังวล หรือเห็นว่าใครทำอะไรผิดหูผิดตาจะเริ่มกัดเล็ก ดึงผมเล่น หรือทำอะไรสักอย่างกับผิวหนังตัวเอง แคะ แกะ แต่ถ้าพวกเขากำลังรีแล๊กซ์อยู่หรือทุกอย่างรอบตัวเพอร์เฟคสมใจจะไม่เป็น</p><p><img src="https://www.doctoryounger.com/img-uploads/0111.jpg" alt=""></p><p>ด็อกเตอร์ Kieron O’Connor ศาสตราจารย์ด้านจิตเวชศาสตร์ ผู้นำการศึกษาครั้งนี้พูดถึงนิสัยเหล่านี้กับหนังสือพิมพ์ Huffington Post ว่า พวกเขาเชื่อว่านิสัยชอบกัดเล็บ ชอบดึงผมเหล่านี้เป็นหนึ่งในนิสัยของคนที่ชอบความสมบูรณ์แบบ และนิสัยเหล่านี้เป็นวิธีที่คนแบบนี้ใช้ผ่อนคลายตัวเอง เพราะคนที่ชอบความสมบูรณ์แบบจะรู้สึกผิดหวังเมื่อพวกเขาไม่สามารถไปถึงจุดหมายที่ตัวเองต้องการได้ หรือเห็นว่าคนรอบข้างทำอะไรไม่ถูกใจเรา และคนเหล่านี้จะมีประสบการณ์กับความเบื่อสูงมาก</p><p>ลองสำรวจตัวเองดูหน่อย
  ว่าเรามีนิสัยแบบนี้รึเปล่า เห็นใครทำอะไรไม่ถูกใจแล้วชอบกัดเล็บตัวเอง ดึงผมแก้เบื่อ ถ้ากำลังเป็นแบบนี้ รู้ไว้เลยว่าเธอเป็นคนเพอร์เฟคชั่นนิสต์แล้วจ้า</p><h3>ที่มา: Cleothailand</h3>'
