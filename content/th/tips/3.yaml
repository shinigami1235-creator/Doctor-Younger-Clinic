title: อาหารจากธรรมชาติ ยาดีฟื้นฟูผิว รักษาผิวไหม้แดดได้อย่างดีเยี่ยม
date: 13 Mar 2017
source: Sanook
body: '<p>การเติมอาหารผิวจากภายในด้วยการกินอาหารที่มีประโยชน์ โดยเฉพาะผักผลไม้ย่อมทำให้ผิวสวยสดใสจากภายในได้เป็นอย่างดี แต่สำหรับสาวๆ ที่เจอปัญหาผิวไหม้เสียจากแสงแดดทำลาย งานนี้เราก็ยังสามารถรักษาผิวไหม้แดดจากอาหารดีรอบตัวได้เช่นเดียวกัน จะมีสูตรใดบ้างนั้น ตามมาดูสิคะ</p><p><img src="https://www.doctoryounger.com/img-uploads/Tips2_6x4%20copy.jpg" alt=""></p><h3>ไข่ขาว</h3><p>ไข่ขาวไม่ได้มีดีแต่กับผิวหน้าหรือนำมาใช้เป็นสูตรหน้าใส หรือลอกสิวเสี้ยนแต่เพียงเท่านั้น เพราะหากสาวๆ มีปัญหาผิวไหม้เสียจากแดดก็สามารถใช้ไข่ขาวพอกบรรเทาอาการแสบร้อนได้เช่นเดียวกัน เพราะในไข่ขาวดิบจะมีเอนไซม์ที่มีคุณสมบัติช่วยบรรเทาอาการแสบร้อนและไหม้เกรียมของผิวจากการทำลายของแสงแดดได้เป็นอย่างดี แค่นำไข่ขาวมาทาลงบนผิวจนแห้ง จากนั้นล้างออกให้สะอาดด้วยน้ำเย็น อาการดังกล่าวก็จะค่อยๆ หายไปค่ะ</p><h3>มะเขือเทศ</h3><p>โดยปกติแล้ว เมื่อพูดถึงมะเขือเทศ สาวๆ หลายคนก็มักจะนำมาพอกหน้ากันเป็นประจำ เพราะเป็นสูตรหน้าใสที่ได้รับความนิยมอย่างมากทีเดียว แต่เชื่อมั้ยคะว่ามะเขือเทศนั้นก็มีคุณสมบัติช่วยฟื้นฟูผิวไหม้แดดได้ดีเช่นกัน เพียงหั่นมะเขือเทศเป็นแว่นแล้วนำมาประคบลงบนผิวไหม้เกรียมจากแดด
  หรืออาจจะผสมน้ำมะเขือเทศ 2 ถ้วยตวงลงในอ่างอาบน้ำเย็น จากนั้นจึงลงไปนอนแช่ตัวในอ่างสักพัก หรืออาจจะใช้อีกวิธีหนึ่งก็คือ ให้ปั่นมะเขือเทศ 1 ลูก กับนมเปรี้ยว 1 ขวดจนเข้ากัน จากนั้นนำมาพอกผิว หรือเอาน้ำมะเขือเทศมาผสมกับนมเปรี้ยวแช่เย็นแล้วนำมาทาผิว แห้งแล้วจึงล้างออกด้วยน้ำเย็น ผิวก็จะมีสภาพที่ดีขึ้น</p><p><img src="https://www.doctoryounger.com/img-uploads/Tips_6x4%20copy.jpg" alt=""></p><h3>แตงกวา</h3><p>เนื่องจากแตงกวาเป็นผักที่มีส่วนประกอบของน้ำปริมาณมาก จึงมีคุณสมบัติช่วยฟื้นฟูผิวไหม้เสียจากแดดได้และยังช่วยเติมความชุ่มชื้นให้ผิว ช่วยลดปัญหาผิวแห้งกร้านได้ด้วย วิธีใช้ ให้นำแตงกวามาหั่นแว่นแล้วนำมาประคบลงบนผิวไหม้แดด หรือนำแตงกวาไปปั่นรวมกับนมสดหรือนมเปรี้ยว จากนั้นจึงนำส่วนผสมมาพอกผิว ก็จะยิ่งช่วยรักษาผิวไหม้แดดได้อย่างมีประสิทธิภาพมากยิ่งขึ้น</p><h3>ข้าวโอ๊ต</h3><p>ข้าวโอ๊ต ตัวช่วยในการเยียวยาผิวที่มีปัญหาได้อย่างมีประสิทธิภาพ โดยเฉพาะปัญหาผิวไหม้แดด เพียงผสมข้าวโอ๊ตบดลงในอ่างอาบน้ำเย็น จากนั้นลงไปนอนแช่ตัวในอ่างน้ำสักพัก หรือจะนำข้าวโอ๊ตบดมาผสมกับไข่ขาวดิบด้วยอัตราส่วนเท่าๆ กัน แล้วคลุกเคล้าจนกลายเป็นเนื้อเดียวกัน
  นำส่วนผสมที่ได้มาพอกลงบนผิวไหม้แดด เมื่อส่วนผสมแห้งแล้วจึงล้างออกให้สะอาด</p><p>และนี่ก็คือ วิธีรักษาผิวไหม้แดดจากธรรมชาติง่ายๆ โดยหยิบเอาวัตถุดิบรอบตัวเหล่านี้มาฟื้นฟูผิวตามสะดวกกันได้เลยบ่อยๆ จนกว่าสภาพผิวจะแข็งแรงขึ้น รับรองค่ะว่าหมดปัญหาผิวไหม้แดดอย่างแน่นอน</p><h3>ที่มา: Sanook</h3>'
