title: ประโยชน์ของเซ็กส์ที่มีต่อสุขภาพที่สาวๆ รู้แล้วต้องทึ่ง
date: 23 Aug 2017
source: Sanook
body: '<h3>ประโยชน์ของเซ็กส์ที่มีต่อสุขภาพที่สาวๆ รู้แล้วต้องทึ่ง </h3><p>เซ็กส์ไม่ใช่แค่เรื่องบนเตียง แต่ยังมีอะไรมากกว่าแค่เรื่องความสุขบนเรือนร่างที่สาวๆ ส่วนใหญ่มักจะเขินอายและไม่กล้าเป็นคนเริ่มก่อน ทว่าก่อนที่จะเอาแต่ม้วนตัวเป็นกุลสตรีไทยอยู่แบบนี้ทุกวันจนทำให้ชีวิตคู่กลายเป็นเรื่องน่าเบื่อ ลองมาดูข้อดีของการมีเซ็กส์ที่ให้มากกว่าแค่ความสุขทางกาย หรือความสัมพันธ์ที่เพิ่มมากขึ้นทางใจระหว่างคู่สามีภรรยา</p><p>เพราะเซ็กส์เป็นเรื่องที่ดีต่อสุขภาพ การมีเซ็กส์ในระดับที่พอดีๆ ไม่มากไม่น้อยจนเกินไป จะให้ประโยชน์ที่ดีทั้งสุขภาพกายและสุขภาพใจ สาวๆ รู้แบบนี้แล้ว ลองมาดูข้อมูลเหล่านี้กันดีกว่าค่ะว่า...ประโยชน์ของเซ็กส์จะตรงใจหรือไม่ รู้แล้วอาจจะเปลี่ยนความเขินอาย กลายเป็นฝ่ายกล้าที่จะเริ่มลงมือบุกเข้าหาฝ่ายชายแทนก็เป็นได้ค่ะ</p><p><img src="https://www.doctoryounger.com/img-uploads/001.jpg" alt=""></p><h3>เซ็กส์ช่วยเติมเต็มความสวย</h3><p>ผู้หญิงสวยขึ้นได้เพราะเซ็กส์นะรู้ยัง...เป็นข้อดีอย่างหนึ่งที่สาวๆ ไม่ต้องวิ่งไปเสียเงินเสียทองบำรุงผิว ศัลยกรรม หรือฉีดโบท็อกซ์กันอยู่บ่อยๆ อีกต่อไป เพราะประโยชน์ของเซ็กส์ที่ทำบ่อยแบบพอดี
  จะช่วยกระตุ้นให้ร่างกายหลั่งฮอร์โมนเพศหญิงที่อยู่บริเวณรังไข่ออกมา ซึ่งเราเรียกว่า "ฮอร์โมนเอสโทรเจน" เป็นฮอร์โมนที่จะช่วยเพิ่มความสาวสดใส เติมความมีชีวิตชีวา ให้ผิวเปล่งปลั่ง และดูอ่อนเยาว์มากขึ้น</p><h3>เซ็กส์ช่วยลดอาการปวดท้องประจำเดือน</h3><p>วันนั้นของเดือน มักจะเป็นอะไรที่สาวๆ ไม่ชอบ เพราะไม่ใช่แค่ความอึดอัดไม่สบายตัว แต่สำหรับบางคนมันมาพร้อมกับอาการปวดท้องน้อยอย่างรุนแรง เป็นความทรมานที่อยากให้ผ่านพ้นไปเร็วๆ แต่! เซ็กส์กลับช่วยบรรเทาอาการปวดให้ลดน้อยลง การมีเซ็กส์จะช่วยเพิ่มฮอร์โมนคอร์ติโคสเตอรอยด์จากต่อมหมวกไต ฮอร์โมนตัวนี้มีคุณสมบัติช่วยลดอาการปวด ต้านการอักเสบ และช่วยเพิ่มฮอร์โมนออกซิโตซิน ทำให้ผู้หญิงรู้สึกมีความสุข ลดอาการเจ็บปวดไปได้ แล้วก็ไปโฟกัสอยู่ในห้วงเวลาแห่งรักแทนกันแบบลืมไปเลยว่าเคยปวดท้อง</p><p><img src="https://www.doctoryounger.com/img-uploads/002.jpg" alt=""></p><h3>เซ็กส์ช่วยเผาผลาญพลังงาน</h3><p>เชื่อว่าคนส่วนใหญ่คงทราบกันอยู่แล้วว่าการมีเซ็กส์จำเป็นต้องใช้พลังงาน แต่พลังงานเหล่านี้เป็นสิ่งที่แปรเปลี่ยนกลายเป็นความรู้สึกตื่นเต้น สนุกสนาน ทุกครั้งของการมีเซ็กส์จะช่วยเผาผลาญพลังงานมากกว่าปกติ
  จัดว่าเป็นการออกกำลังกายอีกทางหนึ่ง หากเทียบการมีเซ็กส์ 1 ครั้งเป็นระยะเวลา 30 นาที จะเท่ากับการเผาผลาญแคลอรี่ได้เหมือนการวิ่งเหยาะๆ ในระยะทาง 3-4 กิโลเมตรได้เลยทีเดียว มีเซ็กส์บ่อยๆ ควบคุมอาหาร...ก็ทำให้สาวๆ มีหุ่นผอมเพรียวได้เหมือนกันนะเออ</p><p>เห็นประโยชน์ของเซ็กส์แบบนี้แล้ว ลองเปลี่ยนจากความเขินอายเป็นฝ่ายรุกบ้าง แทนที่จะเป็นฝ่ายรับเพียงอย่างเดียว รับรองว่าได้ทั้งความประทับใจจากฝ่ายชาย และประโยชน์แบบเน้นๆ ที่ผู้หญิงทุกคนจะต้องรู้สึกว่ามันเป็นเรื่องที่น่าสนใจมากขึ้นอย่างแน่นอนเลยล่ะค่ะ</p><h3>ที่มา: Sanook</h3>'
