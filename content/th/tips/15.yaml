title: สวยสุดๆ ต่าย อรทัย เมคอัพดี หรือศัลยกรรมกันแน่
date: 10 May 2017
source: Naatadee
body: '<p>ถึงกับต้องร้องว้าวกันเลยทีเดียว ทันทีที่มีการปล่อยภาพ สาวสวยคนหนึ่ง ที่ใครๆ ก็อาจจะมองว่า คล้ายนางงาม "น้องน้ำตาล ชลิตา" Miss Universe Thailand 2016 จริงๆ แล้วไม่ใช่ใครที่ไหน ก็คือนักร้องลูกทุ่งสาว "ต่าย อรทัย" นั่นเอง</p><p><img src="https://www.doctoryounger.com/img-uploads/00003.jpg" alt=""></p><p>พอรู้ว่า ภาพนี้เป็นภาพของต่าย อรทัย ชาวเน็ตต่างก็อึ้ง!!! ว่าเป็นการเปลี่ยนลุ๊ค สลัดภาพลักษณ์สาวเรียบร้อย สาวอีสานไปอย่างสิ้นเชิง กลายเป็นสาวสุดมั่น อินเตอร์สุดๆไปเลย ซึ่งก็มีคนมาสงสัยอีกว่า หรือว่าคุณต่าย อรทัย จะหันไปพึ่งคุณหมอทำศัลยกรรม โมหน้าใหม่ อัพหน้าใหม่ เพื่อให้สวยขึ้นอย่างที่ภาพที่เห็นนั่นเอง </p><p><img src="https://www.doctoryounger.com/img-uploads/00002.jpg" alt=""></p><p>จริงๆ แล้วภาพที่เห็นว่าต่าย อรทัย สวยได้ขนาดนี้ ไม่ได้ทำศัลยกรรมมาหรอก เพียงแค่ถูกแต่งหน้าโดยช่างแต่งหน้าชื่อดังของเมืองไทย น้องฉัตรนั่นเอง แค่ได้ยินชื่อช่างแต่งหน้าแล้วนั้น ก็คงต้องยอมรับในฝีมือแล้วจริงๆ ที่สามารถดึงความงาม ความเด่นบนใบหน้าของต่าย อรทัย เปลี่ยนลุ๊คให้ดูแซ่บได้ขนาดนี้ ต้องขอปรบมือเลยทีเดียว</p><p><img
  src="https://www.doctoryounger.com/img-uploads/0001.jpg" alt=""></p><h3>ที่มา: Naatadee</h3>'
