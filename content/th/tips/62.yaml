title: สูตรความงามด้วยน้ำมะนาวที่ให้คุณมากกว่าผิวขาวกระจ่างใส
date: 06 Dec 2017
source: Sanook
body: '<p>ประโยชน์ของมะนาวมีด้วยกันมากมาย ดีทั้งต่องานบ้านและดีต่อความสวยความงาม เราเลยมีสูตรความงามด้วยมะนาวมาฝาก เป็นสูตรง่ายๆ ทำได้ในราคาแสนประหยัด ไปติดตามกันเลยนะคะว่ามีสูตรใดบ้าง</p><h3>บำรุงผิวให้กระจ่างใส</h3><p>ผสมน้ำมะนาวกับน้ำมันมะพร้าวอย่างละ 2-3 หยดให้เข้ากัน แล้วนำมาทาลงบนผิวที่มีความแห้งกร้าน นวดเบาๆ ให้ซึมลงสู่ผิว น้ำมันมะพร้าวเป็นดั่งมอยส์เจอไรเซอร์จากธรรมชาติที่จะช่วยบำรุงผิวให้เนียนนุ่มชุ่มชื้น ส่วนน้ำมะนาวจะช่วยผลัดเซลล์ผิวเก่าที่เสื่อมสภาพให้หลุดออกได้อย่างอ่อนโยน จึงทำให้ผิวกระจ่างใสและมีความชุ่มชื้นได้พร้อมกัน หากทำแบบนี้เป็นประจำ สภาพผิวที่แห้งกร้านนั้นก็จะค่อยๆ หายไป เหลือแต่เพียงผิวที่กระจ่างใสและนุ่มนวลน่าสัมผัส</p><p><img src="https://www.doctoryounger.com/img-uploads/0222.jpg" alt=""></p><h3>รักษาสิวเสี้ยนและสิวหัวดำ</h3><p>เนื่องจากมะนาวมีคุณสมบัติในการต่อต้านเชื้อแบคทีเรียได้เป็นอย่างดีจึงช่วยลดสิวได้นั่นเอง ให้ฝานมะนาวเป็นแผ่นบางๆ แล้วนำมาทาลงบนผิวหน้าโดยเน้นถูบริเวณที่มีสิวหัวดำและสิวเสี้ยนบ่อยๆ ปล่อยไว้ประมาณ 5-10 นาที จากนั้นล้างหน้าให้สะอาด รับรองจะช่วยขจัดสิวเสี้ยนและสิวหัวดำให้จางลงได้อย่างแน่นอนค่ะ</p><h3>ปรับสภาพผิวให้ขาวใสขึ้น</h3><p>น้ำมะนาวมีวิตามินซีและกรดซิตริกที่จะช่วยให้ผิวขาวกระจ่างใสขึ้นได้
  ซึ่งวิตามินซีนั้นก็นับเป็นสารต้านอนุมูลอิสระชั้นเยี่ยม ช่วยกระตุ้นในการสร้างคอลลาเจนและช่วยลดเลือนจุดด่างดำได้เป็นอย่างดี ให้สาวๆ บีบน้ำมะนาวใส่ถ้วยไว้ จากนั้นเติมน้ำสะอาดลงไปให้กรดจากน้ำมะนาวเจือจางเล็กน้อย แล้วนำมาทาลงบนผิวหน้าจนทั่ว ปล่อยไว้ 5-10 นาทีแล้วล้างหน้าให้สะอาด ทำเป็นประจำสัปดาห์ละ 2-3 ครั้ง สูตรนี้ถือเป็นสูตรหน้าใสที่สาวๆ ให้ความนิยมอย่างมาก เพราะจะช่วยรักษาสิว ลดรอยสิว ลดเลือนจุดด่างดำ และปรับสภาพผิวที่หมองคล้ำให้ขาวกระจ่างใสขึ้น หากหมั่นทำเป็นประจำ</p><p><img src="https://www.doctoryounger.com/img-uploads/0001.jpg" alt=""></p><h3>ลดความมันส่วนเกินบนผิวหน้า</h3><p>สาวหน้ามันต้องลองสูตรนี้เลยค่ะ เพียงผสมน้ำมะนาว 1 ช้อนชากับไข่ขาว แล้วนำมาพอกหน้าทิ้งไว้จนแห้ง จากนั้นล้างออกให้สะอาด สูตรหน้าใสนี้นอกจากจะช่วยดูดซับสิ่งสกปรก ช่วยลดรอยสิว รักษาสิวและลดจุดด่างดำได้แล้ว ยังช่วยลดความมันส่วนเกินบนใบหน้าลงได้ดีอีกด้วย</p><h3>แก้ปัญหาข้อศอกด้าน หัวเข่าดำ</h3><p>เปลือกมะนาวที่เราใช้เสร็จแล้วห้ามทิ้งเด็ดขาด ให้สาวๆ นำมาขัดถูข้อศอกและหัวเข่าที่ดำกร้าน ทำเป็นประจำ จะช่วยผลัดเซลล์ผิวที่ตายแล้วให้หลุดออก
  ทำให้ผิวบริเวณที่ดำด้านค่อยๆ ขาวกระจ่างใสและเนียนนุ่มขึ้น</p><p>สูตรความงามด้วยมะนาว ทำได้ไม่ยากเลยเห็นมั้ยคะสาวๆ ซึ่งคุณสามารถเลือกทำได้เลยหลากหลายสูตรด้วยกัน รับรองค่ะว่าคุณจะสามารถเนรมิตความงามในแบบง่ายๆ ทำได้อย่างประหยัด โดยไม่ต้องจ่ายแพงเลย แต่กลับได้ผิวสวยขาวกระจ่างใสอย่างคุ้มค่าแท้จริง</p><h3>ที่มา: Sanook</h3>'
