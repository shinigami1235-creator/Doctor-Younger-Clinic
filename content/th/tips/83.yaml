title: ระวัง!! ซื้อ Acnotin ยารักษาสิวทานเอง เสี่ยงตับเป็นพิษแบบไม่รู้ตัว
date: 28 Feb 2018
source: www.pharmacy.mahidol.ac.th
body: '<p>กำลังกลายเป็นที่จับตามองอย่างมากในโลกออนไลน์ สำหรับยารักษาสิวที่ชื่อว่า Acnotin (แอคโนทิน) ที่มีเพจดังได้ออกมาแชร์ว่าบางคลินิกได้จ่ายยาตัวนี้ให้กับคนไข้ที่เป็นสิวอย่างไม่ตรวจสอบอาการให้ละเอียดเสียก่อน แถมยาตัวนี้ยังมีวางขายในโลกออนไลน์ให้ได้กดเลือกช้อปกันอย่างง่ายดาย วันนี้เลยจะมาแชร์ข้อมูลดีๆ ของยาตัวนี้ให้ฟังกันค่ะ</p><p>สิว (acne) จัดเป็นโรคผิวหนังที่พบได้บ่อย โดยเฉพาะวัยรุ่นทั้งผู้ชายและผู้หญิง ซึ่งการเป็นสิวนั้นจะส่งผลต่ออารมณ์ จิตใจ และสังคม ทำให้ผู้ที่เป็น เสียความมั่นใจ เครียดและวิตกกังวล อีกทั้งความเข้าใจของคนส่วนใหญ่เกี่ยวกับสิวมักจะเป็นเรื่องของความสวยงาม ทำให้หลายคนพยายามซื้อยามารักษาด้วยตนเอง แต่แท้จริงแล้วการรักษาสิวจำเป็นที่จะต้องได้รับการดูแลจากแพทย์ผิวหนังอย่างเหมาะสม การใช้ยาโดยไม่จำเป็น หรือไม่เหมาะสม อาจเพิ่มความเสี่ยงในการได้รับอันตรายจากยาได้</p><p><img src="https://www.doctoryounger.com/img-uploads/3.jpg" alt=""></p><p>ยาที่ใช้ในการรักษาสิวมีหลายชนิด หลายรูปแบบ แต่ที่พบว่ามีความนิยมใช้กันเป็นจำนวนมาก และมีแนวโน้มที่จะใช้อย่างผิดวิธีคือ ยาในกลุ่มกรดวิตามินเอ
  ชนิดรับประทานที่มีชื่อสามัญทางยาว่า ไอโสเตรติโนอิน (isotretinoin) หรือ เรติโนอิก แอซิด (retinoic acid) และมีชื่อทางการค้า ที่เป็นที่รู้จักกันดี คือ Roaccutane® (โรแอคคิวเทน), Acnotin® (แอคโนทิน), Sotret® (โสเตรส), Isotane® (ไอโสเทน) เป็นต้น ยาชนิดนี้แม้ว่าจะมีประสิทธิภาพในการรักษาสิวที่ดี แต่ผลข้างเคียงของยานั้นนับว่ามีมากและรุนแรงโดยเฉพาะการใช้ยาอย่างผิดวิธี ทำให้ต้องมีการควบคุมการใช้ ดังนั้น isotretinoin ชนิดรับประทานจึงถูกจัดเป็นยาควบคุมพิเศษ ที่จำเป็นต้องมีใบสั่งแพทย์ก่อนจึงจะสามารถซื้อยาจากร้านขายยาได้</p><h3>Isotretinoin คืออะไร?</h3><p>Isotretinoin เป็นอนุพันธุ์ของกรดวิตามินเอ ที่มีข้อบ่งชี้ในการรักษาสิวที่มีอาการรุนแรง ที่ไม่สามารถควบคุมอาการได้จากการรักษาอื่นๆ หรือสิวชนิดที่มีแผลเป็น กลไกการออกฤทธิ์ของ isotretinoin โดยรวมคือยาจะทำหน้าที่ยับยั้งสาเหตุของ การเกิดสิว เช่น กดการทำงานของต่อมไขมันทำให้ผลิตสารที่เป็นไขมัน (sebum) ลดลง ลดปริมาณเชื้อแบคทีเรีย Propionibacterium acnes (P. acnes) ลดการอักเสบของสิว และยับยั้งการสร้างคอมีโดน (comedone)</p><p><img src="https://www.doctoryounger.com/img-uploads/1.jpg"
  alt=""></p><h3>การใช้ยา Isotretinoin อย่างถูกต้องเป็นอย่างไร?</h3><p>โดยทั่วไปการใช้ยา isotretinoin ในช่วง 1 เดือนแรกอาการของสิวมักจะแย่ลง และจะค่อยๆ ดีขึ้นภายหลัง ในระหว่างที่ใช้ยา isotretinoin อยู่นั้นอาจจำเป็นต้องหลีกเลี่ยงการใช้ยารักษาสิวชนิดอื่น โดยเฉพาะชนิดทาภายนอก เนื่องจากการรับประทาน isotretinoin จะมีผลทำให้ผิวหนังแห้ง หลุดลอก และบางลง จนไม่สามารถทนต่อยารักษาสิวอื่นๆ ได้ นอกจากนี้ควรหลีกเลี่ยงการใช้ยา isotretinoin ร่วมกับยา tetracycline เนื่องจากอาจเสี่ยงต่อการเกิดความดันในสมองสูงขึ้นโดยไม่มีสาเหตุ (idiopathic intracranial hypertension) ได้</p><p>ขนาดยา isotretinoin เริ่มต้น คือ 0.5 มิลลิกรัม ต่อน้ำหนักตัว 1 กิโลกรัม ต่อวัน เป็นเวลา 1 เดือน หลังจากนั้นอาจเพิ่มขนาดยาเป็น 1 มิลลิกรัม ต่อน้ำหนักตัว 1 กิโลกรัม ต่อวันได้ โดยระยะเวลาของการรับประทานยาอาจอยู่ในช่วง 5-6 เดือน (ขนาดยารวมทั้งหมดไม่ควรเกิน 120 – 150 มิลลิกรัมต่อน้ำหนักตัว 1 กิโลกร้ม) และสามารถหยุดการหยุดรับประทานยาได้เลย โดยไม่จำเป็นต้องค่อยๆ ปรับขนาดยาลง (tapering)</p><p><img src="https://www.doctoryounger.com/img-uploads/2.jpg"
  alt=""></p><h3>ข้อห้ามและข้อควรระวังในการใช้ยา Isotretinoin</h3><p>- ยา isotretinoin มีผลทำให้เด็กทารกในครรภ์พิการแต่กำเนิดได้ และแม้ว่าเด็กทารกที่คลอดออกมาจะมีความปกติ แต่ก็มีความเสี่ยงสูงที่จะพบความบกพร่องทางสมองและเชาว์ปัญญาได้เช่นกัน ดังนั้น ผู้ที่ได้รับยา isotretinoin จะต้องคุมกำเนิดก่อนรับประทานยาอย่างน้อย 3 เดือน และคุมกำเนิดตลอดระยะเวลาที่ใช้ยาตัวนี้ในการรักษา และต้องหยุดยาล่วงหน้าอย่างน้อย 3 เดือน ถึง 1 ปี ก่อนจึงจะตั้งครรภ์ได้อย่างปลอดภัย</p><p>- หญิงให้นมบุตรไม่ควรรับประทานยา isotretinoin</p><p>- ผู้รับประทานยา isotretinoin ต้องไม่บริจาคเลือดในระหว่างที่รับประทานยา และจนกระทั่งหลังจากหยุดรับประทานยาไปแล้ว 1 เดือน</p><p>- การรับประทานยา isotretinoin อาจทำให้ผิวหนังแห้ง ลอก และไวต่อแสง ดังนั้นควรหลีกเลี่ยงการถูกแสงแดด นอกจากนี้อาจมีอาการตาแห้ง ปาก-คอแห้ง ได้เช่นกัน</p><p>- การรับประทานยา isotretinoin อาจทำให้เกิดความบกพร่องในการได้ยิน หรือเกิดเสียงหวีดในหู (tinnitus) ได้ ดังนั้นหากมีอาการเหล่านี้ควรรีบพาผู้ป่วยไปพบแพทย์ผู้เชี่ยวชาญโดยด่วน</p><p>- หลีกเลี่ยงการรับประทานยา isotretinoin
  ร่วมกับวิตามิน A, สมุนไพรชื่อ St. John’s Wort และยา tetracycline</p><p>- isotretinoin มีความเป็นพิษต่อตับ (hepatotoxicity) ดังนั้นควรเข้ารับการตรวจค่าการทำงานของตับ (liver function test) อยู่เสมอ หากมีอาการตัวเหลือง ตาเหลืองควรหยุดยาและรีบมาพบแพทย์</p><p>- การรับประทานยา isotretinoin อาจทำให้เกิดภาวะไขมันในเลือดสูง (hyperlipidemia) โดยเฉพาะไตรกลีเซอไรด์ (triglyceride) ดังนั้นควรมีการตรวจระดับไขมันในเลือดอยู่เสมอในระหว่างที่รับประทานยา และหากไม่สามารถควบคุมระดับไขมันที่สูงขึ้นได้ควรหยุดรับประทานยาและไปพบแพทย์</p><p>- การรับประทานยา isotretinoin อาจทำให้เกิด inflammatory bowel disease (IBD), ปวดกล้ามเนื้อ (arthralgia), กล้ามเนื้อถูกทำลายอย่างรุนแรง (rhabdomyolysis) ได้เช่นกัน</p><p>- การรับประทานยา isotretinoin ติดต่อกันเป็นระยะเวลานาน (มากกว่า 6 เดือน) อาจทำให้ความหนาแน่นกระดูก (bone mineral density) ลดลง และอาจทำให้เกิดภาวะกระดูกนุ่ม รวมถึงภาวะกระดูกพรุนด้วย อีกทั้งจำเป็นจะต้องระมัดระวังเป็นอย่างยิ่งเมื่อมีการใช้ยาในเด็ก</p><p>- พบการรายงานเกี่ยวกับความผิดปกติทางจิต เช่น ซึมเศร้า จิตเภท
  มีพฤติกรรมรุนแรง ก้าวร้าว มีความคิดหรือมีความพยายามในการฆ่าตัวตาย (พบได้แต่น้อยมาก) จากการรับประทานยา isotretinoin ดังนั้นผู้รับประทานยาควรได้รับการประเมินความผิดปกติทางด้านจิตใจก่อนการรับประทานยา และผู้รับประทานยาควรแจ้งแพทย์ทันทีเมื่อมีการเปลี่ยนแปลงทางอารมณ์หรือพฤติกรรมที่ต่างไปจากเดิม</p><p><img src="https://www.doctoryounger.com/img-uploads/4.jpg" alt=""></p><p>ข้อห้ามใช้และข้อควรระวังของยา isotretinoin มีเป็นจำนวนมาก และบางอย่างจำเป็นต้องเข้ารับการตรวจทางห้องปฏิบัติการอย่างสม่ำเสมอ เช่น การทำงานของตับ หรือระดับไขมันในเลือด ดังนั้นการซื้อยาจากร้านขายยามาใช้เองโดยมิได้อยู่ภายใต้การดูแลของแพทย์ รวมถึงการได้รับยาจากคลินิกเสริมความงามที่ไม่ได้มีการตรวจร่างกาย ซักประวัติ และสั่งจ่ายยาอย่างเหมาะสมโดยแพทย์ อาจทำให้ผู้ที่รับประทานยาได้รับอันตรายจากยาจนถึงขั้นเสียชีวิตได้</p><h3>ที่มา: www.pharmacy.mahidol.ac.th</h3>'
