title: 3 วิธีลดน้ำหนักแบบผิดๆ ลดให้ตาย ยังไงก็ไม่ผอม
date: 05 Apr 2017
source: Sanook
body: '<h3>3 วิธีลดน้ำหนักแบบผิดๆ ลดให้ตาย ยังไงก็ไม่ผอม </h3><p>เมื่อไรที่มีน้ำหนักเพิ่มขึ้น สาวๆ หลายคนต่างก็ต้องสรรหาวิธีลดน้ำหนักมาใช้กันอย่างเคร่งครัด แต่รู้หรือไม่คะว่าบางวิธีลดน้ำหนักที่คุณใช้อยู่ อาจจะเป็นวิธีที่ทำแล้วผิด ไม่สามารถช่วยให้น้ำหนักตัวลดลงได้ หากที่ผ่านมาพยายามเฝ้าลดมาตลอด แต่กลับยิ่งทำลายสุขภาพและน้ำหนักก็ไม่มีทีท่าจะลดลง มาเช็คดูก่อนสายว่าคุณลดในแบบผิดๆ ตามนี้อยู่หรือเปล่า หากใช่ บอกเลยต้องรีบเปลี่ยนพฤติกรรมใหม่ด่วน</p><h3>1. งดแป้ง</h3><p>การทานไม่ทานแป้ง เพราะต้องการลดน้ำหนักนั้น เป็นหนึ่งในวิธีลดน้ำหนักที่ผิดอย่างมหันต์ทีเดียว เพราะร่างกายยังต้องการคาร์โบไฮเดรตเพื่อใช้เป็นพลังงาน จะเน้นทานเฉพาะโปรตีนจากเนื้อสัตว์ ทานพวกส้มตำ หรือสลัดอย่างเดียวก็จะยิ่งทำให้ร่างกายขาดสารอาหาร จึงทำให้เรารู้สึกว่าต้องหาของหวานมาทานเพื่อทดแทนพลังงานให้กับร่างกาย จึงทำให้ร่างกายได้รับพลังงานจากน้ำตาลแทน ซึ่งยิ่งลดน้ำหนักด้วยวิธีนี้ ก็ยิ่งเป็นทำให้ไม่ผอมลงสักที แถมทำให้หิวมากกว่าเดิมอีกด้วย ที่สำคัญยังเสี่ยงต่อการเกิดไขมันสะสมที่พุงตามมาด้วยเช่นกัน ดังนั้น การงดแป้งจึงไม่ใช่วิธีลดน้ำหนักที่ดี
  แนะนำให้เปลี่ยนมาทานแป้งประเภทไม่ขัดสี เช่น ข้าวกล้อง เผือก หรือขนมปังโฮลวีทจะดีกว่า</p><h3>2. งดไขมัน</h3><p>เป็นความเข้าใจผิดว่า ถ้าอยากจะลดน้ำหนัก เพื่อให้ไขมันในร่างกายถูกนำมาใช้ให้มากขึ้น จะต้องงดการทานไขมัน ซึ่งตามความเป็นจริงแล้ว ความอ้วนนั้นไม่ได้เกิดจากไขมันเพียงส่วนเดียว แต่ปัญหาเกิดจากการทานอาหารมากเกินกว่าปกติ จึงทำให้มีพลังงานสะสมอยู่ในร่างกาย จนกลายเป็นไขมันนั่นเอง ดังนั้นวิธีที่ดีที่สุด คือ หลีกเลี่ยงการทานไขมันที่ไม่ดีต่อสุขภาพ ได้แก่ เนย เนยเทียม มาการีน หรือการใช้น้ำมันที่มาจากสัตว์ อีกทั้งการเปลี่ยนวิธีการปรุงอาหาร จากการทอดมาเป็นการอบ ย่าง ปิ้ง หรือนึ่ง ก็จะช่วยทำให้เราสามารถลดการทานไขมันที่ไม่ดีจากอาหารได้อีกด้วย</p><p><img src="https://www.doctoryounger.com/img-uploads/%E0%B8%AD%E0%B9%89%E0%B8%A7%E0%B8%99.jpg" alt=""></p><h3>3. งดอาหารเย็น</h3><p>จัดว่าเป็นวิธียอดฮิตสำหรับการลดน้ำหนักเลยก็ว่าได้ โดยเฉพาะสาว ๆ หลายคน ที่กำลังกังวลเรื่องน้ำหนักตัวเพิ่มขึ้น รูปร่างเริ่มไม่กระชับ ซึ่งการอดอาหารเย็นนี้นอกจากจะทำให้คุณไม่ผอมแล้วยังทำให้ระบบเผาผลาญในร่างกายเสียไป ทำให้เกิดการเผาผลาญพลังงานน้อยลง
  เมื่อกลับมาทานอาหารเย็นอีกครั้งก็จะยิ่งทำให้อ้วนมากกว่าเดิม เพราะร่างกายลดการเผาผลาญลงในช่วงที่คุณอดอาหารมื้อเย็นนั่นเองค่ะ</p><p>การลดน้ำหนักอย่างถูกวิธี จะช่วยทำให้น้ำหนักของคุณลดลงได้อย่างมีประสิทธิภาพ ซึ่งส่งผลทำให้รูปร่างของคุณผอมเพรียว ทำให้สุขภาพโดยรวมดีขึ้น แถมยังช่วยขจัดไขมันส่วนเกินให้หมดไป แต่หากเมื่อไรที่ลดน้ำหนักแบบผิดๆดังกล่าว รับรองมีแต่สุขภาพพังกับพัง</p><h3>ที่มา: Sanook</h3>'
