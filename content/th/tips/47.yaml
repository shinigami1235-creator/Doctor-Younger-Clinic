title: เรียนรู้...การดูแลผิวหลังทำเลเซอร์
date: 27 Sep 2017
source: www.si.mahidol.ac.th
body: '<p>การทำเลเซอร์ผิวหนัง ไม่ว่าจะทำเพื่อความงามหรือเพื่อรักษาสภาวะของผิวหนังบางอย่าง เราควรจะเรียนรู้วิธีการดูแลผิวหลังการทำเลเซอร์อย่างถูกวิธี เพื่อให้ผลลัพธ์ของการทำเลเซอร์ผิวหนังออกมาดีภายในเวลารวดเร็ว โดยไม่เกิดผลข้างเคียง หรือเกิดน้อยที่สุด</p><p><img src="https://www.doctoryounger.com/img-uploads/003.jpg" alt=""></p><h3>การทำเลเซอร์ผิวหนังคืออะไร</h3><p>การรักษาหรือปรับสภาพผิวโดยการใช้เลเซอร์เป็นการใช้พลังงานจากแสงที่มีความยาวคลื่นเฉพาะ ส่งไปยังเซลล์เป้าหมายบนผิวหนังที่ดูดซับพลังงานแสงได้ดี ทำให้เกิดการทำลายเซลล์เป้าหมายนั้นอย่างเฉพาะเจาะจง โดยมีผลต่อเซลล์อื่นที่อยู่ข้างเคียงน้อยมาก การปรับสภาพผิวโดยการใช้เลเซอร์นี้ไม่จำเป็นแต่เฉพาะในเรื่องความสวยงาม เช่น การลบริ้วรอย จุดด่างดำ หรือแก้ปัญหารูขุมขนกว้างเท่านั้น แต่ยังรวมไปถึงการรักษาภาวะบางอย่างได้ด้วย เช่น เนื้องอกผิวหนังเล็กๆ น้อยๆ หูด กระเนื้อ เป็นต้น</p><h3>การทำเลเซอร์ผิวหนังมีกี่ชนิด</h3><p>การรักษาด้วยเลเซอร์แบ่งออกเป็น 2 ชนิดใหญ่ๆ คือ เลเซอร์ชนิดที่ทำให้เกิดแผล คือทำเลเซอร์เสร็จแล้วเกิดแผล ทั้งแบบเกิดแผลบางส่วน หรือเกิดแผลเต็มพื้นที่ที่ทำการรักษา
  และเลเซอร์ชนิดที่ไม่ทำให้เกิดแผล</p><p><img src="https://www.doctoryounger.com/img-uploads/001.jpg" alt=""></p><h3>เกิดอะไรขึ้นกับผิวหนังระหว่างการทำเลเซอร์</h3><p>เมื่อแสงเลเซอร์มากระทบผิวหนัง เซลล์เป้าหมายจะรับพลังงานแสงไว้ และจะมีการเปลี่ยนแปลงพลังงานที่ได้รับให้เป็นความร้อน ส่งผลให้เกิดการทำลายเซลล์เป้าหมายนั้น ภายหลังการรักษาด้วยเลเซอร์ เซลล์ผิวหนังที่ต้องการทำลายจะถูกทำลายไป โดยกรณีที่ใช้เลเซอร์ที่ทำให้เกิดแผล จะมีการหลุดลอกของเซลล์ผิวหนังชั้นบนออกไปด้วย จากนั้นร่างกายมีกระบวนการซ่อมแซมผิวหนังบริเวณนั้น และมีการหายของแผลเกิดขึ้น ทำให้ผิวกลับสู่สภาพปกติ</p><h3>ทำไมต้องดูแลผิวเป็นพิเศษหลังทำเลเซอร์</h3><p>เนื่องจากภายหลังการรักษาด้วยเลเซอร์ ผิวหนังจะมีสภาพบอบบางกว่าปกติ ระคายเคืองง่าย และไวต่อสิ่งแวดล้อม เช่น ผิวจะมีการสูญเสียน้ำ และไวต่อแสงแดดมากขึ้น บางครั้ง อาจมีแผลซึ่งจะทำให้เกิดรอยคล้ำจากแสงแดด หรืออาการระคายเคืองของผิวจากการรักษา ภายหลังการทำเลเซอร์จึงต้องมีการดูแลผิวหนังเป็นพิเศษ โดยควรให้ความชุ่มชื้นกับผิวเพิ่มขึ้น และปกป้องผิวจากแสงแดดมากเป็นพิเศษ เพราะการดูแลรักษาผิวหลังทำเลเซอร์อย่างไม่ถูกวิธี
  อาจมีผลต่อการหายของแผล หรือทำให้มีผลข้างเคียงเกิดขึ้นตามมาได้</p><h3>วิธีการดูแลผิวหลังทำเลเซอร์</h3><p>ภายหลังการทำเลเซอร์โดยเฉพาะชนิดที่ทำให้เกิดแผลมักจะมีผลทำให้ผิวไวต่อแสงมากขึ้น และมีรอยดำจากการถูกแสงแดดง่ายขึ้น ดังนั้นจึงควรหลีกเลี่ยงการสัมผัสแสงแดด และควรใช้ครีมกันแดดอย่างสม่ำเสมอ ในบางกรณี ผิวอาจจะมีอาการแห้งตึง เกิดการระคายเคืองได้ง่าย จึงควรใช้ครีมที่เพิ่มความชุ่มชื้นแก่ผิวหนัง เพื่อช่วยให้กระบวนการหายของแผลเกิดขึ้นได้ดีอีกด้วย</p><p><img src="https://www.doctoryounger.com/img-uploads/002.jpg" alt=""><strong><br></strong></p><h3>เลือกใช้ผลิตภัณฑ์ดูแลผิวอย่างไร หลังจากทำเลเซอร์</h3><p>ผลิตภัณฑ์ที่ใช้กับผิวภายหลังการทำเลเซอร์ควรเป็นผลิตภัณฑ์ที่เหมาะสมสำหรับผิวแพ้ง่าย และไม่ทำให้เกิดการระคายเคืองต่อผิว รวมถึงให้ความชุ่มชื้นในระดับที่เพียงพอแต่ไม่เหนอะหนะมากจนเกินไป เมื่อให้ความชุ่มชื้นแก่ผิวเป็นอย่างดีแล้ว จึงปกป้องผิวจากรังสี UV ด้วยการใช้ครีมกันแดด ที่เหมาะสมกับผิวบอบบางหลังทำเลเซอร์ ในกรณีที่ไม่แน่ใจว่าควรใช้ผลิตภัณฑ์ใดภายหลังการรักษาด้วยเลเซอร์ ควรปรึกษาแพทย์ผู้เชี่ยวชาญ</p><h3>แน่ใจหรือว่าครีมกันแดดที่คุณใช้ดีพอ</h3><p>ในแสงแดดจะมีทั้งรังสี
  UVA ซึ่งทำให้ผิวคล้ำ และรังสี UVB ซึ่งทำให้ผิวไหม้ โดยรังสี UVB จะมีสูงในช่วงเวลา 10.00-14.00 น. ส่วนรังสี UVA จะมีปริมาณสูงตลอดทั้งวันวิธีการสังเกตว่าครีมกันแดดสามารถปกป้องผิวจาก UVB ได้ดีหรือไม่ ให้ดูที่ค่า SPF โดยครีมกันแดดที่มีค่า SPF อย่างน้อย 30 ขึ้นไปจึงจะสามารถป้องกัน UVB ได้ดีและเหมาะสมกับผิวภายหลังการรักษาด้วยเลเซอร์ ส่วนการป้องกันรังสี UVA ของครีมกันแดดให้ดูที่ค่า PA โดยค่า PA ควรอยู่ที่ ++ จึงจะสามารถปกป้องแสงแดดได้ดี หรือมีสัญลักษณ์ UVA แสดงการรับรองโดยสถาบัน COLIPA ยุโรป เพื่อเป็นการยืนยันว่า ครีมกันแดดดังกล่าวสามารถป้องกันรังสี UVA ได้ตามมาตรฐานในอัตราส่วน UVA:UVB = 1:3 ครีมกันแดดที่ดียังควรกันน้ำได้ดีพอสมควร รวมถึงไม่ควรกระตุ้นให้เกิดสิว สำหรับผู้ที่ได้รับการทำเลเซอร์ควรใช้ครีมกันแดดอย่างสม่ำเสมอเพื่อลดผลข้างเคียง เช่น การเกิดรอยดำภายหลังการทำเลเซอร์ และหากเลือกใช้ครีมกันแดดที่สามารถป้องกันและลดอาการระคายเคืองผิวภายหลังการรักษาด้วยเลเซอร์ ก็จะยิ่งมีประโยชน์ในการดูแลผิวมากยิ่งขึ้น</p><h3>ที่มา: www.si.mahidol.ac.th</h3>'
