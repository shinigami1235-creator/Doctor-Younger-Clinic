title: 10 ประโยชน์ของน้ำมันมะกอก
date: 26 Dec 2017
source: Greenshopcafe
body: '<p>ในกลุ่มคนรักสุขภาพจัดๆมักเลือกรับประทานน้ำมันมะกอกบริสุทธิ์พิเศษ (Extra Virgin Olive Oil) โดยเชื่อว่าการรับประทานเป็นประจำวันละ 25 เกรน (1 เกรน = 65 มิลลิกรัม) ให้วิตามินอีถึงร้อยละ 50 ของปริมาณที่ควรได้รับต่อวันในผู้ชาย และร้อยละ 62.5 ในผู้หญิง อีกทั้งยังอุดมด้วยวิตามินเอ ดี เอฟ และเค ถึงจะเป็นแค่น้ำมันมะกอกธรรมดา มันก็มีประโยชน์ในหลายๆด้านดังนี้</p><h3>1. ควบคุมคอเลสเตอรอล</h3><p>เป็นที่ทราบกันดีอยู่ว่าน้ำมันมะกอกช่วยควบคุมคอเลสเตอรอลชนิดเลวให้อยู่ในระดับต่ำและส่งผลดีต่อหัวใจ แต่ขณะนี้การศึกษาที่ฟิลาเดลเฟียบ่งชี้ว่าสารประกอบในน้ำมันมะกอกชนิดบริสุทธิ์ยังออกฤทธิ์คล้ายกลุ่มยาต้านการอักเสบที่ไม่ใช่สเตียรอยด์ เช่น แอสไพริน ไอบูโพรเฟน แต่ไม่ส่งผลข้างเคียงหรือกัดกระเพาะอาหาร จากการค้นคว้าวิจัยพบว่า น้ำมันมะกอกนั้นสามารถช่วยลดระดับคอเลสเตอรอลชนิดเลว (LDL) ในขณะเดียวกันจะไม่ทำให้คอเลสเตอรอลชนิดดี (HDL) ลดระดับลง</p><h3>2. ช่วยการเผาผลาญอาหารดีขึ้น</h3><p>น้ำมันมะกอกช่วยให้ระบบการเผาผลาญอาหาร (metabolic function) ภายในร่างกายทำงานอย่างมีประสิทธิภาพน้ำมันมะกอกได้กลายเป็นทางเลือกที่ดีที่สุดในการป้องกันและควบคุมระดับน้ำตาลในเลือดของผู้ป่วยโรคเบาหวานจากการศึกษาล่าสุดพบว่าระดับกลูโคสของผู้ที่มีสุขภาพดีจะลดลง12%
  เมื่อรับประทานน้ำมันมะกอก</p><h3>3. ต้านภาวะความเสื่อมถอยของสมอง</h3><p>การที่เรารู้จักหาวิธีการเพื่อต่อต้านอนุมูลอิสระที่เกิดขึ้นภายในร่างกายของเราเพื่อป้องกันภาวะความเสื่อมถอยของสุขภาพอันเนื่องมาจากอายุที่เพิ่มขึ้นนั้นนับว่าเป็นสิ่งสำคัญยิ่งจากการค้นคว้าวิจัยเราได้ทราบว่าน้ำมันมะกอกมีคุณสมบัติในการต่อต้านภาวะความเสื่อมถอยของสมองและยังช่วยยืดอายุของเราให้ยืนยาวขึ้นอีกด้วย</p><p><img src="https://www.doctoryounger.com/img-uploads/Olive%20Art13%20copy.jpg" alt=""></p><h3>4. ดีต่อระบบการหมุนเวียนโลหิต</h3><p>ช่วยป้องกันภาวะหลอดเลือดแดงแข็ง (arteriosclerosis) รวมทั้งภาวะอื่นๆ ที่เกี่ยวข้อง ช่วยป้องกันโรคความดันโลหิตสูง หัวใจล้มเหลว หัวใจวาย ไตวาย และเส้นเลือดในสมองแตก</p><h3>5. ประโยชน์ต่อระบบย่อยอาหารและกระเพาะอาหาร </h3><p>ช่วยให้ระบบการทำงานของส่วนต่างๆ ดีขึ้น ไม่ว่าจะเป็นกระเพาะอาหาร ตับอ่อน ลำไส้ และถุงน้ำดี ช่วยป้องกันการเกิดนิ่ว นอกจากนี้ ยังมีข้อมูลว่า น้ำมันมะกอกช่วยบรรเทาอาการกระเพาะอักเสบ แผลในกระเพาะ และเป็นยาระบายอ่อนๆ ซึ่งการรับประทานน้ำมันมะกอก 2 ช้อนโต๊ะ ในตอนเช้าตอนกระเพาะอาหารว่าง
  จะเป็นผลดีสำหรับผู้ที่เป็นโรคท้องผูกเรื้อรังอีกด้วย</p><h3>6. ประโยชน์ต่อเด็กอ่อน </h3><p>ด้วยสารประกอบและคุณสมบัติในการช่วยย่อยอาหาร ทำให้น้ำมันมะกอกจัดเป็นไขมันธรรมชาติ ที่มีคุณสมบัติใกล้เคียงกับน้ำนมของแม่มากที่สุด แม้ว่าน้ำมันมะกอกจะมีปริมาณของกรดไขมันจำเป็นต่ำ แต่สัดส่วนที่มีความสมดุลระหว่างไลโนเลอิค และไลโนเลนิคนั้น เป็นคุณสมบัติที่เหมือนกับที่พบในนมของแม่นั้นเอง</p><h3>7. ลดภาวะเสี่ยงต่อโรคมะเร็ง </h3><p>ช่วยป้องกันเนื้องอกที่เกิดกับอวัยวะบางส่วน อาทิ เต้านม ต่อมลูกหมาก ลำไส้ใหญ่ ปีกมดลูก เนื่องจากกรดไขมันที่มีอยู่ในน้ำมันมะกอกช่วยยับยั้งอนุมูลอิสระ และช่วยต่อต้านการก่อตัวของติ่งเนื้อในอวัยวะต่างๆ ที่กล่าวมา</p><p><img src="https://www.doctoryounger.com/img-uploads/Olive%20Art29%20copy.jpg" alt=""></p><h3>8. ประโยชน์ต่อระบบน้ำดี </h3><p>เพราะน้ำมันมะกอกเป็นผลดีอย่างมากต่อการอ่อนแอของถุงน้ำดี เนื่องจากน้ำมันมะกอกจะก่อให้เกิดปฏิกิริยาที่รวดเร็ว นุ่มนวลและเนิ่นนานกว่าเมื่อเปรียบเทียบกับยาและอาหารอื่น ๆ ทั้งหลายที่ใช้รักษาอาการดังกล่าว โดยน้ำมันมะกอกจะช่วยยับยั้งการหลั่งน้ำดีจากตับในระหว่างที่ถุงน้ำดีไม่
  เกิดการสะสม จึงทำให้ได้น้ำดีที่บริสุทธิ์และมีคุณสมบัติทางยา</p><h3>9. ช่วยบำรุงผิว</h3><p>น้ำมันมะกอกมีคุณสมบัติพิเศษกว่าน้ำมันอื่นๆคือ เมื่อทาน้ำมันมะกอกแล้วจะซึมสู่ผิวได้อย่างรวดเร็วและไม่ทิ้งความมันบนผิวหน้ามากนัก น้ำมันมะกอกสามารถใช้แต้มสิวฆ่าเชื้อโรคได้ หรือจะใช้ร่วมกับครีมบำรุงผิวต่างๆได้ด้วยเช่นกัน </p><h3>10. ช่วยบำรุงเส้นผม</h3><p>น้ำมันมะกอกอุดมด้วยวิตามิน B และวิตามิน E ที่ช่วยบำรุงผมสวยได้อย่างเห็นผล อีกทั้งโมเลกุลของน้ำมันมะกอกยังใกล้เคียงกับน้ำมันตามธรรมชาติซึมซาบง่าย ช่วยบำรุงหนังศีรษะให้ชุ่มชื่น แข็งแรง ไม่เปราะหรือขาดง่าย</p><h3>ที่มา: Greenshopcafe</h3>'
