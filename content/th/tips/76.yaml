title: วิธีแก้ท้องลายขณะตั้งครรภ์ บอกลาผิวแตกลายง่ายๆ แต่ได้ผล
date: 05 Feb 2018
source: Sanook
body: '<p>ปัญหาหลักๆ ที่คุณแม่มือใหม่มักจะกังวลในขณะที่มีการตั้งครรภ์ อันดับหนึ่งก็คือ ความปลอดภัยของทารกในครรภ์ รวมไปถึงเรื่องการเจริญเติบโตต่างๆ และพัฒนาการตลอดการตั้งครรภ์ 9 เดือน ส่วนอันดับสองย่อมหนีไม่พ้นเรื่องของปัญหาท้องลายที่เกิดจากการขยายตัวของผิวหนัง ยิ่งถ้าหากในช่วงตั้งครรภ์ 3-4 เดือนแรกแล้วคุณแม่เผลอเกาจนผิวแตก อาการท้องลายก็จะยิ่งรุนแรงมากยิ่งขึ้น เราจึงขอแนะนำวิธีดูแลตัวเองเพื่อไม่ให้ท้องลายแบบง่ายๆ ดังต่อไปนี้</p><p><img src="https://www.doctoryounger.com/img-uploads/1222.jpg" alt=""></p><h3>เมื่อรู้ว่าตัวเองเริ่มมีการตั้งครรภ์ ควรรีบหาครีมบำรุงหน้าท้องทันที</h3><p>เมื่อรู้ตัวว่ามีการเปลี่ยนสถานะเป็นคนท้องแล้ว ก็ควรรีบบำรุงหน้าท้องตั้งแต่ระยะแรกๆ เลยจะดีที่สุด ถึงแม้ว่าจะมียังมีปัญหาท้องลายตามมา แต่ก็จะเกิดขึ้นน้อยลง อาการคันก็อาจจะไม่ค่อยเกิดขึ้นด้วย โดยครีมที่ควรนำมาใช้เพื่อการบำรุง ควรจะเป็นครีมที่ป้องการการท้องลายโดยตรงจะดีที่สุด</p><h3>วิธีเลือกครีมบำรุงหน้าท้อง</h3><p>อย่างที่กล่าวไปในข้างต้นแล้วว่า ควรเลือกครีมที่มีการผลิตมาเฉพาะการดูแลหน้าท้องของคนท้องโดยตรง จะเป็นการเหมาะสมที่สุด
  แต่ถ้าหากไม่ค่อยชอบกลิ่น หรือมองว่ามีราคาแพงจนเกินไป ก็สามารถใช้น้ำมันมะพร้าวหรือน้ำมันมะกอกแทนได้ พยายามเลือกครีมที่มีความเหนียวข้นสูง จะช่วยเพิ่มความชุ่มชื้นให้กับผิวได้อย่างยาวนานมากขึ้น อย่างไรก็ตาม ควรระมัดระวังครีมที่มีส่วนผสมของแอลกอฮอล์ ไวท์เทนนิ่ง และน้ำหอม เพราะอาจก่อให้เกิดอาการระคายเคือง รวมไปถึงส่งผลเสียต่อทารกในครรภ์</p><p><img src="https://www.doctoryounger.com/img-uploads/1333.jpg" alt=""></p><h3>ควรทาครีมบำรุงหน้าท้องตอนไหนถึงจะดีที่สุด?</h3><p>เมื่ออาบน้ำเสร็จแล้ว ให้คนท้องเช็ดตัวหมาดๆ แล้วชโลมครีมลงไปบนหน้าท้องได้เลย จะทำให้ไม่ค่อยรู้สึกเหนียวเหนอะหนะตัวมากนัก แต่ถ้ารู้สึกว่ายังไม่เพียงพอต่อการป้องกันการเกิดท้องลาย ก็สามารถทาซ้ำในระหว่างวันได้ ในระหว่างอาบน้ำ ก็ไม่ควรอาบน้ำอุ่นถึงแม้ว่าจะสบายตัวมากกว่าน้ำเย็นก็ตาม เพราะจะทำให้ผิวแห้งมากยิ่งขึ้น ส่งผลให้มีโอกาสท้องลายมากกว่าปกติ</p><p>เมื่อถึงช่วงที่ผิวหนังเริ่มมีการขยายและรู้สึกคันก็ห้ามเกาเด็ดขาด ให้ใช้ครีมหรือน้ำมันมะพร้าวทาบริเวณที่คัน จะช่วยลดอาการคันและช่วยลดปัญหาท้องลายได้ หรือจะลองใช้แป้งละลายน้ำทาให้ทั่ว ก็พอจะช่วยบรรเทาอาการคันได้เช่นกัน</p><p>การดูแลผิวพรรณเป็นอย่างดีตั้งแต่เริ่มมีการตั้งครรภ์
  จะช่วยลดอาการท้องลายได้อย่างเห็นผลแน่นอน ถึงแม้จะทิ้งร่องรอยบางส่วนเอาไว้บ้าง แต่ก็ไม่เยอะพอที่จะทำให้คุณเสียความมั่นใจเมื่อจูงลูกใส่ทูพีซไปเล่นทะเลด้วยกันในอนาคต</p><h3>ที่มา: Sanook</h3>'
