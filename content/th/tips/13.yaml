title: วิธีดูแลผิวให้ห่างไกลจากกระ ป้องกันไว้หน้าสวยใสไร้จุด จุด จุด
date: 03 May 2017
source: Kapook
body: '<p>หน้าขาวเนียนใส ใครๆ ก็อยากมี เพราะใบหน้าก็เปรียบเสมือนปราการด่านแรกที่จะดึงดูดให้ใครๆ หันมาสนใจ แต่ถ้าใบหน้ามีแต่รอยดำ รอยคล้ำ โดยเฉพาะมีแต่รอย <strong>"กระ"</strong> ละก็ บอกเลยว่าหมดเสน่ห์กันเลยทีเดียวนะคะสาวๆ ดังนั้นหากใครที่ไม่อยากจะเสียเซลฟ์เพราะมีจุด จุด จุด อยู่เต็มใบหน้า ก่อนที่มันจะมาเยือนและต้องหาวิธีรักษากระกันให้ยุ่งยาก วันนี้มีวิธีดูแลผิวให้ห่างไกลจากกระตั้งแต่เนิ่นๆ มาให้สาวๆ ได้ปฏิบัติตามกันค่ะ รับรองว่าทำตามนี้อย่างสม่ำเสมอ ใบหน้าของคุณก็จะสวยใสไร้กระ-ฝ้ามากวนใจอย่างแน่นอน</p><p>ทั้งนี้ <strong>"กระ"</strong> ก็คือความผิดปกติของเม็ดสีผิวนั่นเองค่ะ โดยจะมีลักษณะเป็นเม็ดสีๆ ซึ่งอาจจะเป็นสีน้ำตาล สีดำ สีเหลือง หรือสีแดงก็ได้ ขึ้นอยู่กับสภาพผิวของแต่ละคน ซึ่งจะมีขนาดเล็กขึ้นอยู่ตามผิวหนังตามจุดต่างๆ ของร่างกาย เช่น ใบหน้า ลำคอ ลำตัว แขน ขา เป็นต้น โดยปัญหานี้เกิดขึ้นเนื่องจากเม็ดสีเมลานินที่อยู่ในเซลล์ผิวหนังเกิดความผิดปกติ อันเนื่องมาจากกรรมพันธุ์ และถูกปัจจัยกระตุ้นให้เกิด โดยตัวการสำคัญก็คือ "แสงแดด" นั่นเอง และเมื่อรู้สาเหตุหลักที่ทำให้เกิดกระกันไปแล้ว ทีนี้มาดูกันเลยดีกว่าว่าจะทำอย่างไรเพื่อปกป้องให้ผิวสวยใสไร้กระมาเยือนได้บ้าง?</p><p><img
  src="https://www.doctoryounger.com/img-uploads/003.jpg" alt=""></p><p><strong>1. ทาครีมกันแดดทุกวัน </strong>ข้อนี้สำคัญมากๆ เลยนะคะสาวๆ เพราะแสงแดดคือปัจจัยหลักที่ทำให้หน้าเป็นกระ ดังนั้นผิวจึงต้องได้รับการปกป้องจากแสงแดด และวิธีที่ง่ายที่สุดก็คือการทาครีมกันแดดนั่นเองค่ะ ทั้งนี้ก็เพื่อป้องกันอันตรายจากรังสี UV มาทำลายผิว โดยควรเลือกใช้ครีมกันแดดที่มีค่า SPF 30 ขึ้นไป รวมถึงควรมีค่า PA+++ เพื่อป้องกัน UVA และ UVB ด้วยค่ะ</p><p><strong>2. หลีกเลี่ยงการสัมผัสกับแสงแดดเป็นเวลานานๆ</strong> กระ ส่วนใหญ่จะเกิดขึ้นได้ง่ายจากการที่ผิวสัมผัสกับแสงแดดเป็นเวลานานๆ ดังนั้นเมื่อทาครีมกันแดดแล้ว ควรพยายามหลีกเลี่ยงการโดนแสงแดดโดยตรงด้วย โดยเฉพาะแสงแดด เวลา 10.00-16.00 น. เพราะถือเป็นช่วงเวลาที่มีค่ารังสี UV เข้มข้นมากที่สุด</p><p><img src="https://www.doctoryounger.com/img-uploads/004.jpg" alt=""></p><p><strong>3. พกอุปกรณ์ป้องกันแสงแดด </strong>หากหลีกเลี่ยงที่จะต้องสัมผัสกับแสงแดดโดยตรงไม่ได้ สาวๆ ควรพกอุปกรณ์ป้องกันแสงแดดติดตัวเอาไว้ด้วย อย่างน้อยก็สามารถช่วยให้ผิวไม่ต้องโดนกับแสงแดดโดยตรงอย่างเช่น
  ร่ม หมวก หรือเสื้อคลุม เป็นต้น</p><p><img src="https://www.doctoryounger.com/img-uploads/005.jpg" alt=""></p><p><strong>4. รับประทานอาหารที่มีประโยชน์ต่อผิว</strong> อาหารที่มีประโยชน์ต่อผิว ได้แก่ ผักและผลไม้ เนื่องจากผักและผลไม้จะมีวิตามินที่จำเป็นต่อการบำรุงผิวจำพวก วิตามินเอ วิตามินซี และวิตามินอี ซึ่งจะช่วยปกป้องผิวให้มีความแข็งแรง ไม่บอบบางและเกิดปัญหากระได้ง่าย</p><p><img src="https://www.doctoryounger.com/img-uploads/001.jpg" alt=""></p><p><strong>5. ทำทรีตเมนต์หรือมาสก์หน้าบำรุงผิวอย่างสม่ำเสมอ</strong> การบำรุงผิวหน้าด้วยการทำทรีตเมนต์หรือมาสก์หน้าเป็นประจำ จะเป็นการกระตุ้นการผลัดเซลล์ผิวเก่าให้เผยผิวใหม่ที่ขาวกระจ่างใสขึ้น ทั้งยังจะช่วยบำรุงผิวให้มีความแข็งแรงมากขึ้นด้วย โดยควรทำทรีตเมนต์หรือมาสก์หน้าสัปดาห์ละ 1-2 ครั้ง ก็ถือว่าเพียงพอแล้วค่ะ</p><p>แค่ดูแลผิวตามนี้อย่างสม่ำเสมอ ผิวของสาวๆ ก็จะสวยใสเนียนปิ๊ง รับรองกระ-ฝ้า หรือแม้แต่ความหมองคล้ำทั้งหลายก็ไม่มีเฉียดมากวนใจอย่างแน่นอน</p><h3>ที่มา: Kapook</h3>'
