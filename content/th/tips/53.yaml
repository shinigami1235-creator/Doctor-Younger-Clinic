title: สุขภาพดีอยู่ใกล้แค่เอื้อม 5 ทริคเปลี่ยนพฤติกรรมการกิน ทำได้ รับรองเฟิร์มชัวร์!!
date: 18 Oct 2017
source: สำนักงานกองทุนสนับสนุนการสร้างเสริมสุขภาพ (สสส.)
body: '<p>เมื่ออายุเริ่มมากขึ้น เห็นทีคำพูดที่ว่า <strong>"การไม่มีโรคเป็นลาภอันประเสริฐ" </strong>คงจะเป็นเรื่องจริง ก็เพราะว่าไม่ใช่แค่สภาพแวดล้อมเท่านั้นที่สามารถทำร้ายร่างกายเราให้เจ็บป่วยได้ แต่มันยังรวมไปถึง พฤติกรรมการกิน อาหารส่วนบุคคลอีกด้วย และในยุคเฮลตี้ที่คนหันมาดูแลตัวเองแบบนี้ ใครที่อยากจะลองปรับเปลี่ยนวิธีการกินอาหาร วันนี้เราก็มีทริคดีๆ มาฝากกันด้วยค่ะ</p><p><img src="https://www.doctoryounger.com/img-uploads/2.jpg" alt=""></p><h3>หลักปฏิบัติ 5 ประการ เพื่อการปรับเปลี่ยนพฤติกรรมการบริโภค</h3><p>1. รู้จักผ่อนสั้น ผ่อนยาว คือ ไม่จำเป็นจะร้องรับประทานอาหารในปริมาณเท่าๆ กันทุกมื้อ ทุกวัน เพราะในความเป็นจริงแล้วบางมื้ออาจมาก บางมื้ออาจน้อยก็ได้ แต่ในภาพรวมค่าเฉลี่ยของพลังงานที่ได้จากอาหารทั้งสัปดาห์ต้องคงที่</p><p>2. กินอย่างฉลาด คือ อยากลองอะไรก็ได้ แต่ต้องรู้จักปริมาณ</p><p>3. เปลี่ยนนิสัยการบริโภคอย่างค่อยเป็นค่อยไป คือเปลี่ยนนิสัยการรับประทานโดยการรู้จักเลือกอาหารที่มีคุณค่าต่อร่างกาย แม้จะไม่ใช่เรื่องง่าย แต่หากเพียรพยายามทำวันละเล็กละน้อยค่อยเป็นค่อยไป อย่างสม่ำเสมอก็จะประสบผลสำเร็จได้</p><p><img
  src="https://www.doctoryounger.com/img-uploads/1.jpg" alt=""></p><p>4. พยายามทำตัวให้ว่องไวกระฉับกระเฉงอยู่เสมอ เช่น ออกกำลังกายทุกวัน ทำงานบ้าน เดินขึ้นบันไดแทนการใช้ลิฟต์ เป็นต้น เพื่อเพิ่มการใช้พลังงานในชีวิตประจำวัน</p><p>5. อร่อยกับอาหารแปลกใหม่ การมีโภชนาการดีไม่ได้หมายความว่าต้องงดอาหารอร่อย เราสามารถทดลองกับอาหารแปลกๆ ใหม่ๆ เพียงแต่ปรับสัดส่วนของอาหารก็สามารถเอร็ดอร่อยกับอาหารมากมายหลายชนิดได้</p><h3>ที่มา: สำนักงานกองทุนสนับสนุนการสร้างเสริมสุขภาพ (สสส.)</h3>'
