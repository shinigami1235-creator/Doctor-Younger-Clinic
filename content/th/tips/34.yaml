title: คงความสวยหลังปาร์ตี้ด้วยเทคนิคที่สาวๆ ไม่ควรพลาด
date: 27 Jul 2017
source: Sanook
body: '<p>เลิกจากงานเลี้ยงงานปาร์ตี้ทีไร ร่างกายเหมือนจะพังไปทุกส่วน ยิ่งสาวๆ แบบเราจะให้ปล่อยไปอย่างนั้น โดยไม่ใส่ใจดูแลตัวเองก็คงจะไม่ได้ แต่ถ้าจะให้เลิกสนุกกับงานปาร์ตี้คงไม่ได้แน่ๆ งั้นหันมาดูแลตัวเองหลังจากงานปาร์ตี้ด้วยเทคนิคที่ใช้ได้ผลกันดีกว่า</p><h3>ทานผักผลไม้ก่อนไปงานปาร์ตี้</h3><p>ก่อนออกไปงานปาร์ตี้ บ่อยครั้งสาวๆ มักจะไม่ทานอะไรรองท้องก่อน แต่บางคนก็เลือกที่จะรองท้องด้วยอาหารในหมู่อื่นๆ เพื่อป้องกันไม่ให้ท้องหิวได้ แต่เพื่อสุขภาพร่างกายที่ดีและเพื่อป้องกันร่างพัง หันมาทานผักผลไม้ก่อนออกไปงานปาร์ตี้ แทนการกินอาหารมื้ออื่นๆ กันดีกว่า เพราะผักผลไม้ถือเป็นศูนย์รวมของไฟเบอร์ ซึ่งมีส่วนช่วยทำให้สาวๆ รู้สึกอิ่ม แถมยังช่วยลดความอยากอาหารลงได้อีกด้วย รับรองว่าวิธีนี้จะไม่ทำให้สาวๆ เผลอดื่มหนักหรือกินขนมกรุบกรอบหรือกับแกล้มมากจนเกินไปแน่นอน ขอบอกเลยว่าถ้าเผลอปล่อยให้กินตามใจปาก รับรองเลยว่าแคลอรีภายในร่างกายเพิ่มขึ้นสูงถึง 40% เลยทีเดียว</p><h3>หลีกเลี่ยงเครื่องดื่มที่มีแอลกอฮอล์</h3><p>ก็เข้าใจว่าไปงานปาร์ตี้ทีไร คงหนีไม่พ้นเครื่องดื่มที่มีแอลกอฮอล์อย่างแน่นอน แต่หากคุณอยากสนุกไปกับงานปาร์ตี้
  พร้อมทั้งรักษาสุขภาพร่างกายไปด้วยนั้น แนะนำให้หมั่นหลีกเลี่ยงเครื่องดื่มที่มีแอลกอฮอล์กันค่ะ เพราะเครื่องดื่มประเภทนี้จะมีแคลอรีสูง หันมาดื่มน้ำเปล่าหรือน้ำผลไม้คั้นสดจะดีกว่า หรือหากอยากดื่มเครื่องดื่มที่มีแอลกอฮอล์ ก็แนะนำให้ดื่มน้ำเปล่า น้ำผลไม้ หรือน้ำอัดลมแบบไดเอ็ทไปก่อน เพื่อที่จะสามารถจำกัดปริมาณเครื่องดื่มแอลกอฮอล์ได้</p><p><img src="https://www.doctoryounger.com/img-uploads/DY229.jpg" alt=""></p><h3>ลดปริมาณแคลอรีหลังกลับจากงานปาร์ตี้</h3><p>เชื่อว่าสาวๆ หลายคนคงจะเคยรู้สึกว่าร่างกายของตัวเองจะหนักๆ ชอบกล หลังจากกลับจากปาร์ตี้ นั่นเป็นเพราะคุณเผลอกินมากไปนั่นเอง ดังนั้นวิธีแก้ที่ดีที่สุดคือการลดปริมาณแคลอรี่ในมื้อถัดไปให้น้อยลง รวมทั้ง 2-3 วันถัดไปให้ลดปริมาณแคลอรี่ลงด้วย พร้อมทั้งหันมาออกกำลังกาย หากสาวๆ สามารถจำกัดปริมาณพลังงานที่ได้รับได้ เชื่อว่าร่างกายจะกลับมาดีขึ้นอีกครั้ง</p><h3>กำจัดแอลกอฮอล์ให้เร็วที่สุด</h3><p>หลังจากกลับจากปาร์ตี้ สิ่งที่สาวๆ ควรทำอย่างเร่งด่วนนั่นก็คือการกำจัดแอลกอฮอล์ออกจากร่างกายให้เร็วที่สุด และวิธีที่แนะนำก็คือ การทำตามตำรายาไทย ด้วยการดื่มน้ำเมล็ดถั่วแปบ
  เพราะเมล็ดถั่วแปบมีสารโดลิโคสเตอโรน ที่มีส่วนช่วยลดการดูดซึมของแอลกอฮอล์ในกระเพาะอาหาร อีกทั้งยังช่วยเร่งในการกำจัดแอลกอฮอล์จากกระแสเลือดได้เป็นอย่างดี </p><h3>ฟื้นฟูสภาพผิวที่ทรุดโทรมด้วยแตงกวา</h3><p>หลังงานปาร์ตี้สิ่งที่สาวๆ ต้องเผชิญคือร่างกายที่ทรุดโทรม แนะนำให้สาวๆ เพิ่มแตงกวาในมื้อถัดไปกันค่ะ เพราะแตงกวามีน้ำเป็นส่วนประกอบอยู่จำนวนมาก มันมีส่วนช่วยทำให้ผิวพรรณของสาวๆ กลับมาสดใสและมีความชุ่มชื้นขึ้นได้อีกด้วย</p><p>สนุกกับงานปาร์ตี้แล้วก็อย่าลืมดูแลตัวเองกันด้วยนะคะสาวๆ สุขภาพดีไม่มีขาย ถ้าอยากมีและอยากให้สุขภาพดีอยู่กับคุณไปนานๆ ต้องรู้จักดูแลและควบคุมการดื่มเครื่องดื่มแอลกอฮอล์กันด้วยค่ะ</p><h3>ที่มา: Sanook</h3>'
