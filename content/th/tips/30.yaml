title: สาวๆ ระวัง!! สารปนเปื้อนในเครื่องสำอาง เสี่ยงเสียโฉมไม่รู้ตัว
date: 11 Jul 2017
source: Mthai
body: '<p>แม้เครื่องสำอางจะเป็นเหมือนเพื่อนคู่ใจของผู้หญิงอย่างเราๆ แต่คุณก็ต้องระมัดระวังเรื่องความปลอดภัยของส่วนผสมในเครื่องสำอางด้วย ยิ่งในโลกออนไลน์ที่มีการซื้อขายง่าย รวดเร็ว ราคาถูก ยิ่งต้องระวัง เพราะเครื่องสำอางเหล่านั้นอาจเป็นของปลอม หรือมีสารปนเปื้อนอยู่ในเครื่องสำอางก็เป็นได้ หากเผลอไปใช้เข้าแล้วเนี่ย ก็จะเป็นอันตรายต่อผิวและใบหน้าของเราแบบไม่รู้ตัว</p><p>สารอันตรายในเครื่องสำอางนั้น สามารถส่งผลกระทบต่อผิวหนังได้สองรูปแบบด้วยกัน ได้แก่ การระคายเคือง และการเกิดอาการแพ้ โดยการระคายเคืองนั้นเกิดจากฤทธิ์ที่เป็นกรดอ่อนๆ ส่วนอาการแพ้สามารถเกิดได้กับทุกอย่าง เช่น สารกันบูด น้ำหอม เป็นต้น ทั้งสองอาการจะทำให้ผิวหนังเกิดความผิดปกติ เช่น ผิวแดง บวม แสบร้อน หรืออาการอื่นๆ ขึ้นอยู่กับตัวบุคคลและตัวสารที่ได้รับ</p><p><img src="https://www.doctoryounger.com/img-uploads/88888856.jpg" alt=""></p><p>สำหรับสารอันตรายในเครื่องสำอางที่องค์การอาหารและยาสั่งห้ามใช้ในเครื่องสำอาง คือ สารไฮโดรควิโนน กรดวิตามินเอ และสารปรอท สารเหล่านี้ไม่ควรผสมอยู่ในผลิตภัณฑ์ที่ไม่ผ่านการควบคุมโดยแพทย์ ซึ่งอาจก่อให้เกิดอันตรายและผลข้างเคียง
  ส่วนสารที่ได้รับอนุญาตให้ผสมอยู่ในผลิตภัณฑ์ผิวขาว ได้แก่ สารอาร์บูติน สารสกัดชะเอมเทศ สารอนุพันธ์ของวิตามินซี เป็นต้น</p><p>สารปรอทและสารไฮโดรควิโนน ที่อยู่ในเครื่องสำอางจะทำให้เกิดการระคายเคืองได้ ทำให้ผิวแดง บวม แสบร้อน นอกจากนี้สารไฮโดรควิโนนยังทำให้เกิดจุดขาวทั่วใบหน้า เนื่องจากการตายของเซลล์สร้างเม็ดสี ที่เป็นผลข้างเคียงของสารดังกล่าว อีกทั้งยังส่งผลให้เกิดฝ้าถาวรได้อีกด้วย</p><p><img src="https://www.doctoryounger.com/img-uploads/5555.jpg" alt=""></p><p>ส่วนสารปรอท นอกจากจะระคายเคืองต่อผิวแล้ว ยังส่งผลต่อระบบอื่นๆ ในร่างกายได้ด้วย หากมีการดูดซึมเข้าสู่ร่างกาย จะทำให้เกิดอาการเป็นพิษต่อระบบขับถ่ายปัสสาวะ และอันตรายต่อไต ไม่เพียงเท่านั้น สารทั้งสองยังไปยับยั้งการกระตุ้นกระบวนการสร้างเม็ดสีหรือเมลานิน ซึ่งเกี่ยวกับความหมองคล้ำ หากเมลานินถูกยับยั้งจะส่งผลข้างเคียงคือ เกิดอาการแพ้หรือลมพิษ โดยความรุนแรงของผลลัพธ์นั้นขึ้นอยู่กับตัวผลิตภัณฑ์และตัวบุคคล</p><p>สาวๆ สามารถสังเกตอาการแพ้เครื่องสำอางนั้นๆ ได้ด้วยการ ทดลองทาที่ท้องแขน แล้วสังเกต 7 วัน หากมีอาการผิดปกติ ให้รีบไปปรึกษาแพทย์ทันที
  ทั้งนี้เวลาจะเลือกซื้อสินค้า ก็ควรดูเรื่องความปลอดภัยและความน่าเชื่อของแบรนด์เป็นหลักจะดีกว่านะจ๊ะ อย่าหลงเชื่อและซื้อเพียงเพราะคำโฆษณาชวนเชื่อ หรือราคาที่ถูกจนน่าตกใจ เพราะถ้าหากเสียโฉมขึ้นมา มันไม่คุ้มเลยล่ะขอบอก</p><h3>ที่มา: Mthai</h3>'
