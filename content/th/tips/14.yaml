title: สาวๆ แต่ละราศี
date: 07 May 2017
source: FHM Thailand
body: '<h3>สาวๆ แต่ละราศี </h3><p>เธออาจไม่ได้อยู่เหนือเหตุผล หรือเป็นอาร์ตตัวแม่อย่างที่หนุ่มหลายคนวินิจฉัย เมื่อเธอเริ่มตีตัวออกห่าง นั่นอาจเป็นอาการตามพื้นเพของราศีที่หนุ่มๆ ควรศึกษาไว้!!!</p><h3>สาวราศีมังกร (16 ม.ค.-15 ก.พ.)</h3><p>ยี้ : หนุ่มช่างฝัน และไม่ประทับใจอะไรกับหนุ่มหลักลอยที่ไม่มีแผนการในชีวิตอย่างจริงจัง ถ้าเธอเลือกคบใคร เธอหวังว่าจะได้คบกันอย่างยาวนาน และชายหนุ่มผู้โชคดีคนนนั้น ควรเคารพความเป็นส่วนตัวของเธอให้มากๆ ก็จะดีเอง</p><h3>สาวราศีกุมภ์ (16 ก.พ.-15 มี.ค.) </h3><p>ยี้ : หนุ่มวางอำนาจ แม้เธอจะไม่หัวโบราณ แต่ก็ค่อนข้างดื้อ และไม่ยอมเปลี่ยนตัวเองเพื่อใคร ไม่ว่าหนุ่มจะพยายามโน้มน้าวเธอสักเท่าไร ถ้าหนุ่มรายไหนกล้าสั่งให้เธอทำโน่นทำนี่ เธอก็พร้อมที่จะวีนเหวี่ยงอยู่เสมอ</p><h3>สาวราศีมีน (16 มี.ค.-15 เม.ย.) </h3><p>ยี้ : หนุ่มที่แสนธรรมดาสามัญ เพราะเธออาจชอบความคิดสร้างสรรค์พอๆ กับความมั่นคงของหนุ่มๆ แต่ความทื่อและธรรมดา คงไม่เหมาะกับจินตนาการบรรเจิดที่เธอมีเป็นแน่</p><h3>สาวราศีเมษ (16 เม.ย.-15 พ.ค.) </h3><p>ยี้ : คนที่เฟลิตไปทั่ว หนุ่มรวยเสน่ห์และหยอดคนไปทั่ว ปากหวานกับคนทุกคน
  กระทั่งไม่ชอบหนุ่มที่มีชื่อเสียงหรือเนื้อหอม เพราะเธอจะรู้สึกเหนื่อยใจเป็นพิเศษ และไม่ชอบอีกอย่างคือ หนุ่มๆ ประเภทเร่งรัด ใจร้อน วู่วาม</p><h3>สาวราศีพฤษภ (16 พ.ค.- 15 มิ.ย.)</h3><p>ยี้ : หนุ่มฮาร์ดคอร์ มีรอยสัก เพราะเธอจะสนใจภาพลักษณ์ของตัวเองพอๆ กับชายหนุ่ม เธอไม่มีสนใจชายหนุ่มที่ยากจะพาออกงาน ติดหัวโบราณนิดๆ และเธอเกลียดผู้ชายที่ชอบมีความสัมพันธ์แบบชั่วครู่ชั่วยาม และไม่พร้อมจะมีพันธะ หรือจีบแบบแหย่ๆ</p><h3>สาวราศีเมถุน (16 มิ.ย.-15 ก.ค.)</h3><p>ยี้ : ไม่ชอบหนุ่มขี้หึง ขี้หงุดหงิดง่าย เนื่องจากเธอเป็นนักสังคมตัวยง เธอจึงรับไม่ได้ ถ้าหนุ่มไหนจะคาดหวังไม่ให้เธอปฏิสัมพันธ์หรือเป็นฝ่ายทักทายใครก่อน นักสังคมอย่างเธอจะรู้สึกอึดอัด</p><h3>สาวราศีกรกฎ (16 ก.ค.-15 ส.ค.) </h3><p>ยี้ : ชายหนุ่มที่ไม่ชัดเจน และไม่พร้อมที่จะผูกมัด เพราะเธอจะรู้สึกอึดอัดมากกับความสัมพันธ์ที่คลุมเครือ และไม่เป็นระเบียบแบบแผน ดังนั้นเธอจะไม่รีบมีความสัมพันธ์กับใคร จนกว่าเธอจะแน่ใจในความรู้สึกที่คนๆ นั้นที่มันชัดเจนต่อเธอ</p><h3>สาวราศีสิงห์ (16 ส.ค.-15 ก.ย.) </h3><p>ยี้ : หนุ่มที่ไม่มีความเป็นผู้นำ ไม่มีเครือข่าย หรือละเลยไม่ใส่ใจ
  หรือไม่ก็โลกส่วนตัวสูง เธอทนไม่ได้ถ้าหนุ่มคนนั้นไม่ให้เวลากับเธอ และถ้าเขาไม่ทะนุถนอม ช่างเอาใจเธอล่ะก็ เธอพร้อมจะชิ่งไปหาคนอื่นที่พร้อมจะเทิดทูนเธอดั่งราชสีห์!</p><h3>สาวราศีกันย์ (16 ก.ย.-15 ต.ค.) </h3><p>ยี้ : หนุ่มที่ไม่มีเป้าหมายในชีวิต ไร้ระเบียบ ไม่พิถีพิถัน ไม่มีหลักประกันชีวิต หากชายหนุ่มคนไหนไม่ได้มาตรฐานตามที่เธอตั้งไว้ และถ้าหนุ่มคนไหนเกิดอาการเงินขาดมือ ไม่ขยันทำงาน เธอก็จะเกิดอาการตีตัวออกห่างเอาได้ง่ายๆ เลยทีเดียว</p><h3>สาวราศีตุลย์ (16 ต.ค.-15 พ.ย.)</h3><p>ยี้ : หนุ่มเซอร์ๆ หนักไปทางสกปรก หยาบคาย ไร้รูปแบบ ซุ่มซ่าม และถ้ายิ่งเผลอมอบของขวัญที่ไร้ความโรแมนติก หรือนิสัยของหนุ่มคนนั้นไร้ซึ่งความโรแมนติกแล้วล่ะก็ อย่าได้หวังจะได้ไปต่อกับเธอเลย</p><h3>สาวราศีพิจิก (16 พ.ย.-15 ธ.ค.)</h3><p>ยี้ : หนุ่มที่เนี้ยบเกินเหตุ เพราะเธอไม่ชอบอะไรดีดูดีเกินไป เนื่องจากดูไร้ความเป็นธรรมชาติ เธอรับไม่ได้กับความสัมพันธ์ที่ดูสงบราบเรียบเกินไป ไม่ชวนตื่นเต้น รวมทั้งความสัมพันธ์แบบฉาบฉวยด้วย!</p><h3>สาวราศีธนู (16 ธ.ค.-15 ม.ค.) </h3><p>ยี้ : หนุ่มที่มักมองโลกในแง่ร้าย มีทัศนคติในแง่ลบ แววตาขุ่นมัว
  ไม่ค่อยเปิดรับสิ่งใดๆ ได้ง่าย ทำให้มีข้อแม้ในการใช้ชีวิตที่มักติดๆ ขัดๆ มีข้อจำกัดอยู่หลายๆ เรื่อง เพราะเธอนั้นจัดเป็นสาวผู้เปิดกว้างพร้อมรับสิ่งใหม่ๆ อยู่เสมอ</p><h3>ที่มา: FHM Thailand</h3>'
