title: 7 ไอเดียเด็ด ตัดใจจากของหวาน เพื่อหุ่นสวย
date: 22 Dec 2017
source: Kapook
body: '<p>เค้กเอย คุกกี้เอย พาย ลูกกวาด ไอศกรีม...สารพัดของหวานแสนอร่อยแบบนี้ มีสาวๆ คนไหนไม่ชอบทานบ้างนะ ก็ผู้หญิงกับของหวานน่ะเป็นของคู่กันเสมอๆ แต่ถ้าเรากำลังวางแผนไดเอตอยู่ล่ะ ของหวานเหล่านี้ดูจะกลายเป็นศัตรูตัวฉกาจของแผนไดเอตเลยนะนั่น แต่จะทำอย่างไรล่ะ แบบว่าของหวานก็อยากทาน น้ำหนักก็อยากลด มีวิธีอะไรดีๆ บ้างไหมน้าที่จะช่วยให้เราหักห้ามใจจากของหวาน หรือทานของหวานได้แบบไม่เป็นภัยต่อน้ำหนัก เอ..ฟังดูเหมือนยาก แต่ไม่ยากเลยนะขอบอก เพราะเรามีไอเดียดีๆ มาฝากคุณสาวๆ ที่ชอบทานของหวาน แต่อยากลดน้ำหนักกันแล้ว ก็เลื่อนลงไปอ่านกันเลยค่ะ</p><p><img src="https://www.doctoryounger.com/img-uploads/333.jpg" alt=""></p><h3>1. เคลียร์ขนมออกจากครัวซะ</h3><p>วิธีที่ดีที่สุดที่จะทำให้คุณสาวๆ ไม่ต้องทานของหวาน ก็คือ อย่าซื้อมาเก็บไว้ในบ้านนั่นเอง (เอ้า...ใครจะเถียง) หากช่วงนั้นคุณรู้สึกอยากทานของหวานขึ้นมาตะหงิดๆ แต่เปิดตู้เย็นก็แล้ว ตู้กับข้าวก็แล้ว ไม่เห็นของหวานซุกซ่อนอยู่เลย แล้วคุณจะทานได้อย่างไรล่ะจริงไหม เพราะฉะนั้น รีบเคลียร์ขนมนมเนยสารพัดสิ่งในบ้านของคุณออกให้หมดซะ (เอิ่ม...ไม่ได้ให้เคลียร์ลงท้องนะ
  &gt;&lt;) แล้วครั้งหน้าเวลาที่ไปซูเปอร์มาร์เก็ตก็อย่าเผลอไปเดินแถวชั้นขนม หรือแผนกเบเกอรี่ล่ะ รีบเดินผ่านให้ไวเลย</p><h3>2. ทานอาหารจานหลักให้อิ่ม</h3><p>วิธีลดน้ำหนักที่หลายๆ คนแนะนำก็คือ ห้ามอดอาหารเด็ดขาด โดยเฉพาะอาหาร 3 มื้อหลักของวัน เช้า กลางวัน เย็น เพราะยิ่งอดก็จะยิ่งหิว แล้วพลังของความหิวนั่นแหละที่ช่างน่ากลัวยิ่งนัก ถ้าหิวขึ้นมาแล้วไปเห็นอะไรอร่อยๆ ขวางหน้า มีหรือที่คุณสาวๆ จะไม่หยิบมาทานประทังท้อง แบบนี้ไม่เป็นมิตรของแผนไดเอตแน่นอนค่ะ เพราะฉะนั้น ทานอาหารทุกมื้อให้อิ่มซะ จะได้ไม่รู้สึกอยากกินอะไรหวานๆ เพิ่มอีกไงล่ะ แต่ถ้าอยากทานจริงๆ ก็หาผักสด ผลไม้สดๆ กรอบๆ มาทานแทนแล้วกัน</p><p><img src="https://www.doctoryounger.com/img-uploads/222.jpg" alt=""></p><h3>3. ขอเวลา 15 นาที</h3><p>ไม่ได้หมายถึงให้เวลาทานของหวานแค่ 15 นาทีนะ แต่หมายความว่า หลังจากคุณทานอาหารจานหลักคำสุดท้ายเสร็จแล้ว อย่าเพิ่งหยิบของหวานเข้าปากเด็ดขาด นั่งรออีกสัก 15 นาที ซึ่งเป็นระยะเวลาที่สมองได้ทำงานและรับรู้ถึงความอิ่มแล้ว ทีนี้คุณอาจจะไม่รู้สึกอยากทานของหวานตบท้ายมื้อนั้นก็ได้ แต่หากคุณไม่ยอมรอแล้วละก็ รับรองว่า
  คุณสาวๆ สามารถคว้าชีสเค้กก้อนโตเข้าปากแล้วหม่ำจนหมดภายใน 5 นาทีแน่ๆ กว่าสมองจะรับรู้ว่าอิ่มแล้วนะ สงสัยชีสเค้กจะหมดไปหลายชิ้นแล้วล่ะมั้ง</p><h3>4. เลือกขนาดเล็กน่ะดีแล้ว</h3><p>คนชอบของหวานจะให้มาตัดใจแบบหักดิบก็ดูจะใจร้ายไปนิด เพราะฉะนั้น จริงๆ แล้ว สาวๆ สามารถทานของหวานได้นะ แต่ต้องรู้ว่าควรทานปริมาณแค่ไหน แน่นอนว่าต้องเป็นปริมาณที่น้อยที่สุด อย่างช็อกโกแลตเค้กก็ควรเป็นคำเล็กๆ ไม่ใช่ชิ้นโตๆ แบบขนาดพิมพ์ 6 นิ้ว (แบบนี้ก็มากเกิ๊นน) หรือพุดดิ้งในแก้วใบใหญ่ (แบบนี้ก็มากไป) เอาแค่ถ้วยเล็กๆ ขนาดเท่าอุ้งมือของเรานั่นแหละ พอแล้ว</p><h3>5. ระวังเครื่องดื่มด้วยนะ</h3><p>ในเมื่อห้ามทานของหวาน งั้นไปหากาแฟเย็นๆ ดื่มสักแก้วแทนก็แล้วกัน จะได้รู้สึกอิ่ม คิดแบบนี้ใช่ไหมล่ะ แต่ช้าก่อนจ้า รู้ไหมว่าบางทีกาแฟ 1 แก้วของคุณ อาจให้แคลอรีพอๆ กับชีสเบอร์เกอร์ 1 ชิ้นเลยนะ โดยเฉพาะกาแฟเย็นอย่างมอคคาใส่วิปครีม และนมสด เพราะฉะนั้นนอกจากขนมนมเนยทั้งหลายที่เป็นของต้องห้ามแล้ว การดื่มกาแฟตบท้ายมื้ออาหารก็เป็นสิ่งต้องห้ามเหมือนกันนะ</p><p><img src="https://www.doctoryounger.com/img-uploads/1111.jpg" alt=""></p><h3>6.
  แบ่งๆ กันทานแล้วกัน</h3><p>คนเดียวหัวหาย สองคนเพื่อนตาย สามคนช่วยลดความอ้วนกันได้สบายเลย เพราะหากอดรนทนไม่ไหวอยากทานไอติมหวานๆ สักถ้วย แต่กลัวอ้วนละก็ สั่งไอติม 1 ถ้วยเล็ก (ที่สุด) แล้วก็แบ่งให้เพื่อนๆ ช่วยกันหม่ำคนละคำสองคำ แป๊บเดียวก็หมดถ้วยแล้ว แค่นี้ก็ทำให้เราหายอยากในปริมาณเบาๆ ที่ไม่กระทบต่อแผนลดน้ำหนักเท่าไรด้วย</p><h3>7. วางแผนกินของหวาน</h3><p>สำหรับคนที่ชอบทานของหวานมากๆ การเลี่ยงของหวานตลอดเวลาคงเป็นเรื่องที่ทำใจได้แสนยากยิ่ง และเราก็ไม่ได้บอกให้คุณสาวๆ ห้ามทานแบบเบ็ดเสร็จเด็ดขาดด้วย (ไม่งั้นลงแดงแน่ๆ) เมื่อเป็นแบบนี้ ขอให้คุณสาวๆ จัดตารางเวลาสำหรับทานของหวานไว้ เช่น ทานขนมได้สัปดาห์ละ 2 ครั้งหลังอาหาร (อย่างกับทานยาเลยนะนั่น) แล้วปฏิบัติตามกฎที่ตัวเองตั้งไว้ให้ได้ ทีนี้คุณก็ยังยิ้มได้กับขนมสุดโปรดแถมยังไม่อ้วนด้วย (แต่ก็ซื่อสัตย์กับตัวเองด้วยนะคะ ไม่ใช่จัดตารางทานทุกมื้อหลังอาหารล่ะ)</p><p>ของหวานๆ ที่หยิบเข้าปากอาจทำให้คุณผู้หญิงอารมณ์ดีก็จริง แต่ถ้าทานแบบไม่ยั้งคิดก็อาจต้องมานั่งเซ็งกับน้ำหนักที่เพิ่มขึ้นแทน ดังนั้นแล้วใครที่กำลังอยากลดความอ้วน ก็ต้องวางแผนและห้ามใจให้ดีเชียว</p><h3>ที่มา:
  Kapook</h3>'
