title: ใครชอบกินอาหารเสริมระวัง!! พบสารปลอมปนหลายชนิดที่อันตรายถึงชีวิตได้
date: 04 Jun 2017
source: Thaihealth
body: '<p>ในยุคที่คนหันมาดูแลสุขภาพกันมากขึ้น ไม่เพียงแค่การเลือกทานอาหารที่มีประโยชน์ หรือการออกกำลังกายอย่างสม่ำเสมอเท่านั้นที่เป็นตัวช่วยในการเสริมสร้างสุขภาพร่างกายที่ดี แต่มันยังมีอีกหนึ่งทางเลือกที่หลายคนเลือกใช้นั่นก็คือ การเลือกทานอาหารเสริมประเภทต่างๆ และในปัจจุบันนี้กรมวิทยาศาสตร์ทางการแพทย์พบว่าภายในอาหารเสริมหลายชนิดผสมสารปนเปือน ซึ่งจัดว่าเป็นอาหารที่ไม่บริสุทธิ์ ผิดกฎหมาย หากทานเข้าไปอาจก่อให้เกิดอันตรายและอาจทำให้เสียชีวิตได้</p><p>นายแพทย์สุขุม กาญจนพิมาย อธิบดีกรมวิทยาศาสตร์การแพทย์ เปิดเผยว่า ระหว่างปี พ.ศ.2556–2559 กรมวิทยาศาสตร์การแพทย์ ร่วมกับสำนักงานคณะกรรมการอาหารและยา (อย.) และหน่วยงานต่างๆ ในการเฝ้าระวังการใช้ยาแผนปัจจุบันในอาหาร จำนวน 6 กลุ่ม 14 ชนิดตัวยา ได้แก่ กลุ่มยารักษาโรคหย่อนสมรรถภาพทางเพศ (ซิลเดนาฟิล, ทาดาลาฟิล และวาร์เดนาฟิล) กลุ่มยาลดความอ้วน (เอฟีดรีน, ออลิสแตท, เฟนเทอร์มีน และไซบูทรามีน) กลุ่มยาลดความอยากอาหาร (เฟนฟลูรามีน) กลุ่มยาระบาย (ฟีนอล์ฟทาลีน) กลุ่มยาสเตียรอยด์ (เดกซาเมธาโซน และเพรดนิโซโลน) กลุ่มยานอนหลับเบนโซไดอะซีปีนส์ (อัลปราโซแลม, ไดอะซีแพม
  และ ลอราซีแพม) ในตัวอย่างกาแฟสำเร็จรูปชนิดผง ผลิตภัณฑ์เสริมอาหาร เครื่องดื่ม และวัตถุดิบที่เป็นส่วนประกอบของผลิตภัณฑ์อาหาร รวมทั้งสิ้น 1,603 ตัวอย่าง</p><p><img src="https://www.doctoryounger.com/img-uploads/001.jpg" alt=""></p><p>ผลการตรวจวิเคราะห์ทางห้องปฏิบัติการ ยังคงตรวจพบการปนปลอมของยาแผนปัจจุบันเหล่านี้ ผู้บริโภคจึงมีความเสี่ยงที่จะได้รับอันตรายจากผลข้างเคียงของยาที่พบทั้งชนิดเดียวและพบร่วมกัน 2 ชนิด โดยยารักษาโรคหย่อนสมรรถภาพทางเพศ อาจก่อให้เกิดปัญหาเกี่ยวกับระบบหลอดเลือดและหัวใจ เช่น มีอาการหัวใจวาย เส้นโลหิตในสมองแตก หัวใจเต้นผิดปกติ เลือดออก ในสมองหรือปอด ความดันโลหิตสูง และเสียชีวิตเฉียบพลัน ไซบูทรามีนทำให้มีความเสี่ยงต่อการเกิดโรคหัวใจวายและเส้นโลหิตในสมองแตก ส่วนออลิสแตทอาจส่งผลให้เกิดอาการข้างเคียงไม่พึงประสงค์ เช่น มีปัญหาเกี่ยวกับระบบขับถ่าย ไม่สามารถกลั้นอุจจาระและขาดสารอาหาร เป็นต้น</p><p>ขณะที่มีผลการตรวจวิเคราะห์โดยละเอียดออกมา ดังนี้ กาแฟสำเร็จรูปชนิดผง จำนวน 462 ตัวอย่าง จำแนกเป็น กลุ่มยารักษาโรคหย่อนสมรรถภาพทางเพศ ตรวจวิเคราะห์ 130 ตัวอย่าง พบซิลเดนาฟิล 33 ตัวอย่าง
  ทาดาลาฟิล 1 ตัวอย่าง (ร้อยละ 26.2) กลุ่มยาลดความอ้วน ตรวจวิเคราะห์ 344 ตัวอย่าง พบไซบูทรามีน 47 ตัวอย่าง (ร้อยละ 13.7) กลุ่มยานอนหลับเบนโซไดอะซีปีนส์ ตรวจวิเคระห์ 183 ตัวอย่าง พบลอราซีแพม 1 ตัวอย่าง (ร้อยละ 0.5) ผลิตภัณฑ์เสริมอาหาร จำนวน 1,034 ตัวอย่าง จำแนกเป็น กลุ่มยารักษาโรคหย่อนสมรรถภาพทางเพศ ตรวจวิเคราะห์ 287 ตัวอย่าง พบซิลเดนาฟิล 86 ตัวอย่าง ทาดาลาฟิล 6 ตัวอย่าง ซิลเดนาฟิลร่วมกับทาดาลาฟิล 24 ตัวอย่าง และซิลเดนาฟิลร่วมกับวาร์เดนาฟิล 7 ตัวอย่าง รวม 123 ตัวอย่าง (ร้อยละ 42.9)</p><p><img src="https://www.doctoryounger.com/img-uploads/002.jpg" alt=""></p><p>กลุ่มยาลดความอ้วน ตรวจวิเคราะห์ 187 ตัวอย่าง พบออลิสแตท 22 ตัวอย่าง (ร้อยละ 11.8) และตรวจวิเคราะห์ 849 ตัวอย่าง พบไซบูทรามีน 163 ตัวอย่าง (ร้อยละ 19.2) กลุ่มยาลดความอยากอาหาร ตรวจวิเคราะห์ 245 ตัวอย่าง พบเฟนฟลูรามีน 1 ตัวอย่าง (ร้อยละ 0.4) กลุ่มยาระบาย พบฟีนอล์ฟทาลีน1 จาก 245 ตัวอย่าง (ร้อยละ 0.4) กลุ่มยาสเตียรอยด์ ตรวจวิเคราะห์ 103 ตัวอย่าง พบเดกซาเมธาโซน 2 ตัวอย่าง (ร้อยละ 1.9) และมีผลิตภัณฑ์เสริมอาหารที่ตรวจพบว่า มียาแผนปัจจุบัน
  2 กลุ่ม จำนวน 3 ตัวอย่าง ได้แก่ ไซบูทรามีนร่วมกับทาดาลาฟิล 1 ตัวอย่าง และไซบูทรามีนร่วมกับฟีนอล์ฟทาลีน 2 ตัวอย่าง และยากลุ่มเดียวกัน 2 ชนิด ได้แก่ ไซบูทรามีนร่วมกับออลิสแตท 3 ตัวอย่าง เครื่องดื่ม (เครื่องดื่มอื่นนอกเหนือจากกาแฟ ชา ชาสมุนไพร ตามพระราชบัญญัติอาหาร) เช่น โกโก้ผง เครื่องดื่มผงผสมคอลลาเจน เครื่องดื่มคลอโรฟิลล์ เครื่องดื่มสมุนไพร เป็นต้น จำนวน 66 ตัวอย่าง จำแนกเป็น</p><p>กลุ่มยาสเตียรอยด์ ตรวจวิเคราะห์ 41 ตัวอย่าง พบเดกซาเมธาโซน 6 ตัวอย่าง (ร้อยละ 14.6) และอาหารอื่นๆ ได้แก่ ชาสมุนไพร ข้าวกล้องงอก และวัตถุดิบที่เป็นส่วนประกอบของผลิตภัณฑ์อาหาร เช่น สารให้กลิ่นรส น้ำตาลมอลโตส สารโคคิวเท็น เป็นต้น จำนวน 41 ตัวอย่าง จำแนกเป็น กลุ่มยาลดความอ้วน ตรวจวิเคราะห์ 9 ตัวอย่าง พบออลิสแตท 1 ตัวอย่าง (ร้อยละ 11.1)</p><p><img src="https://www.doctoryounger.com/img-uploads/003.jpg" alt=""></p><p>ดังนั้นการดูแลรักษาสุขภาพที่เหมาะสมควรทำด้วยการออกกำลังกายอย่างสม่ำเสมอ 3-5 ครั้งต่อสัปดาห์ ครั้งละอย่างน้อย 30 นาที และปรับเปลี่ยนพฤติกรรมการรับประทานอาหาร งดหวาน มัน เค็ม นอกจากนี้อาหารที่มีการปนปลอม
  ยาแผนปัจจุบันจัดเป็นอาหารไม่บริสุทธิ์และเป็นสิ่งที่ผิดกฎหมายอาจก่อให้เกิดอันตรายต่อร่างกายและทำให้เสียชีวิตได้ ถ้าผู้บริโภคสนใจจะใช้อาหารเสริมดังกล่าว จำเป็นต้องมีความรู้และใช้วิจารณญาณในการเลือกซื้อ เลือกผลิตภัณฑ์จากแหล่งที่เชื่อถือได้ มีคำรับรองจาก อย. และไม่หลงเชื่อคำโฆษณาอวดอ้างสรรพคุณเกินจริง หากมีอาการผิดปกติให้หยุดรับประทานผลิตภัณฑ์เหล่านี้ รีบไปพบแพทย์ทันทีและแจ้งหน่วยงานที่เกี่ยวข้องเพื่อดำเนินการต่อไป</p><h3>ที่มา: Thaihealth</h3>'
