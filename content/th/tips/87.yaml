title: เรื่องสิวๆ ที่ควรรู้!!! กับวิธีรับมือดูแลรักษาและป้องกันอย่างตรงจุด
date: 18 Mar 2018
source: Sanook
body: '<p>ปัญหาโลกแตกที่เกี่ยวข้องกับใบหน้าที่ทุกคนต่างพากันกังวล และเหนื่อยหน่ายในการรักษา นั่นคือ ปัญหาสิว เพราะสิวเป็นสิ่งที่มักเกิดขึ้นได้ง่าย ซ้ำซาก และพบได้ในคนเกือบทุกเพศทุกวัย ส่วนจะมากน้อยแค่ไหนก็ยังมีปัจจัยหลายอย่างเข้ามามีบทบาท ดังนั้น เพื่อเป็นการรักษา และป้องกันการเกิดสิว เราควรที่จะรู้ข้อเท็จจริงของสิวให้กระจ่างเสียก่อน</p><h3>สิว และประเภทของสิว</h3><p>สิว หรือ Acne Vulgaris นั้นเป็นโรคทางผิวหนังที่พบได้บ่อยที่สุดของคนเราเกือบทุกเพศวัย ซึ่งแบ่งออกเป็นสิวอุดตันธรรมดา เช่น สิวหัวดำและหัวขาว สาเหตุจากคอมีโดน และสิวอักเสบ เช่น พวกพาพูล พลัสทูล และโนดูล ที่มีสาเหตุมาจากสิวอุดตันที่อักเสบแล้วทวีความรุนแรงขึ้น</p><p><img src="https://www.doctoryounger.com/img-uploads/33.jpg" alt=""></p><p>สาเหตุของการเกิดสิว</p><p>โดยหลักๆ จะมีอยู่ 3 สาเหตุคือ เซลล์ผิวหนังที่หลุดลอก แต่ไม่สามารถหลุดออกมาได้หมด เนื่องจากโรคผิวหนังบางประเภท เครื่องสำอาง และสารก่อความระคายเคืองผิวหนัง ต่อมาคือ ขนอ่อนที่กระจุกตัวอยู่ตามรูขุมขน และสุดท้ายคือ น้ำมันบนใบหน้าที่เกิดจาก ฮอร์โมนเพศชายที่สูง การรับประทานอาหารที่มีไขมันมาก
  ความเครียด การนอนพักผ่อนไม่เพียงพอ รวมทั้งอากาศที่ร้อนหรือชื้นมากจนเกินไป</p><h3>การรักษาสิว</h3><p>ในการรักษาสิวนั้น อันดับแรกต้องทราบชนิดของสิวที่กำลังเป็นอยู่เพื่อที่จะรักษาได้อย่างตรงจุด และถูกวิธี อย่างเช่น หากเป็นสิวหัวดำ ก็เพียงแค่ใช้คลีนซิ่งออยล์ที่มีส่วนผสมของโจโจ้บา กับน้ำมันมะรุมในการนวดคลึง และใช้น้ำตาล หรือเกลือสครับในการขัดถูออกอย่างแผ่วเบา เท่านี้สิวหัวดำก็หลุดออกทันที แล้วค่อยตามด้วยการทายาละลายสิวและลดความมันบนใบหน้า ซึ่งต่างจากสิวหัวขาวที่ไม่มีรูทางออก สิ่งที่ทำได้คือ การทายาละลายหัวสิวแค่นั้น และห้ามบีบ กดโดยเด็ดขาด เพราะมันจะเป็นการทำให้เกิดสิวอักเสบจากการติดเชื้อภายในตามมา แต่หากเป็นสิวอักเสบที่มีหนอง คุณไม่ควรสครับโดยเด็ดขาดเพราะจะทำให้เกิดการอักเสบที่รุนแรงขึ้น แต่ควรทายาฆ่าเชื้อสิว และทาครีมให้ความชุ่มชื้นแทน</p><p><img src="https://www.doctoryounger.com/img-uploads/11.jpg" alt=""></p><h3>การป้องกันสิว</h3><p>ควรเน้นการรักษาใบหน้าให้สะอาด ไม่ควรแต่งหน้าจัดเป็นประจำ ไม่จับใบหน้าบ่อยเกินไป และควรรักษาความสะอาดของเส้นผมและปลอกหมอนอีกด้วย นอกจากนี้ควรที่จะนอนหลับพักผ่อนให้เพียงพอราว
  6-8 ชั่วโมงต่อวัน ร่วมกับการออกกำลังกายสม่ำเสมอ และรับประทานผักผลไม้ เส้นใยให้มากขึ้นกว่าเดิม</p><p>เมื่อเราทราบข้อเท็จจริงเหล่านี้แล้ว เชื่อว่าสาวๆ ทุกคนเริ่มที่จะมีกำลังใจ และรู้ว่าควรที่จะต้องเริ่มรักษา และป้องกันสิวบนใบหน้าอย่างไรที่จะเหมาะสมกับสภาพผิวหน้าของตนเองที่สุด</p><h3>ที่มา: Sanook</h3>'
