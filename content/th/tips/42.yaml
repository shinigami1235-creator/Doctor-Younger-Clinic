title: 5 วิธิประหยัดเงินค่าเครื่องสำอางค์
date: 04 Sep 2017
source: Stylecaster
body: '<p>ทุกวันนี้ผู้หญิงเราเสียเงินไปกับการซื้อเครื่องสำอางค์มาแต่งหน้ากันเป็นจำนวนมาก หากเราสามารถประหยัดงบประมาณในส่วนนี้ได้ เชื่อว่าสาวๆ หลายๆ คนจะมีเงินเก็บ หรือมีเงินไว้ใช้จ่ายกับส่วนอื่นๆ ได้อีกมากทีเทียว ผู้มีชื่อเสียงบนโลกออนไลน์ ที่รู้จักกันในชื่อ MakeupRehab บอกว่า เธอมีเทคนิคที่จะช่วยให้สาวๆ ประหยัดเงินค่าเครื่องสำอางค์ได้มากอย่างเหลือเชื่อ</p><p><strong>1. สำรวจเครื่องสำอางค์ทั้งหมดที่คุณมี</strong> : ไม่ได้พูดเล่น แต่ต้องทำจริงๆ คุณต้องสำรวจเครื่องสำอางค์ของตัวเองเสียก่อน เอามามาเรียงดู แล้วดูว่าต้องใช้พื้นที่ขนาดไหนถึงจะวางได้หมด หากเรียงกับพื้นพรม ก็ให้หากระดาษมารองกันเปื้อน ลองดูว่าคุณมีผลิตภัณฑ์ชนิดไหนอยู่บ้าง อะไรใหม่ อะไรเก่า จัดเก็บแยกประเภทให้เป็นเรื่องราว อะไรที่ต้องใช้เป็นประจำ อะไรที่ใช้บางโอกาศ จัดเก็บให้หยิบง่าย และรู้ว่าอะไรอยู่ที่ไหน</p><p><strong>2. เครื่องสำอางค์ที่ใช้เฉพาะโอกาสให้จัดเก็บใส่ถุงรวมกัน</strong> : เครื่องสำอางค์ที่คุณมีนั้น แน่นอนว่า คุณต้องรู้จักมันดีและรู้ว่าจะใช้เมื่อไหร่ อันไหนที่ไม่ได้ใช้บ่อย ก็ให้จัดเก็บไว้ในถุงแยก เมื่อไหร่ที่รู้สึกเบื่อชุดเครื่องสำอางค์ที่ใช้อยู่เป็นประจำทุกวัน
  ก็ให้ไปหยิบถุงเครื่องสำอางค์ที่ไม่ค่อยได้ใช้นี้ออกมาเปลี่ยนบรรยากาศ แน่นอนวิธีนี้ จะช่วยให้คุณไม่ต้องตรงดิ่งไปร้านเครื่องสำอางค์เพื่อไปหาซื้อชิ้นใหม่ แค่หยิบถุงใบนี้มาเปิด คุณก็แต่งหน้าเปลี่ยนสไตล์ได้แล้ว แต่ต้องแน่ใจว่า อย่าเก็บนานจนหมดอายุ</p><p><img src="https://www.doctoryounger.com/img-uploads/Untitled-1.jpg" alt=""></p><p><strong>3. สลับสีตลับอาย์แชโดว์ </strong>: เมื่อคุณรู้สึกเบื่ออายแชโดวส์ ในโทนและเฉดสีของตลับเก่า แทนที่จะไปหาซื้อตลับใหม่ เฉดสีใหม่ ก็ให้สลับสีของแต่ละเพลทเอง จับคู่สีเสียใหม่ก็จะได้เฉดใหม่ แล้วแต่ความสร้างสรรค์และที่สำคัญ ช่วยประหยัดเงิน</p><p><strong>4. เครื่องสำอางค์ชิ้นหนึ่งอาจใช้ได้หลายวัตถุประสงค์</strong> : จริงๆ แล้ว เครื่องสำอางค์ชิ้นหนึ่งนั้น เราสามารถนำมาใช้ได้มากกว่า 1 วัตถุประสงค์ แทนที่จะยึดติดกับหน้าที่อย่างใดอย่างหนึ่งเพียงอย่างเดียวของมัน เราอาจจะนำมาใช้อย่างอื่นได้ด้วย เช่น นำลิปสติกมาละลาย ผสมเข้ากับวาสลิน ก็จะได้ลิปปาล์มมาใช้ หรืออาจจะนำเอาตัวไฮไลท์ มาผลมกับโลชั้นทาผิว ก็จะทำให้ได้ครีมทาผิว ที่ทำให้ผิวเปล่งประกาย เป็นต้น</p><p><strong>5. หาข้อมูลก่อนการซื้อ
  </strong>: ก่อนที่จะไปเลือกซื้อเครื่องสำอางค์ เราควรหาข้อมูลเกี่ยวกับผลิตภัณฑ์ก่อนเสมอ เช่น เหมาะกับผิวแบบไหน โทนไหน การหาข้อมูลจะช่วยประหยัดเงินได้มากลดโอกาสเสี่ยงที่จะซื้อผลิตภัณฑ์มาใช้ แล้วต้องทิ้งไปเพราะไม่เหมาะกับสภาพผิวของเรา</p><h3>ที่มา: Stylecaster</h3>'
