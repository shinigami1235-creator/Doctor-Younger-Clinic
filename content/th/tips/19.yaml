title: อย่าเพิ่งทำศัลยกรรม!!! ถ้ายังลังเล...ไม่แน่ใจ แพทย์เตือนควรหาข้อมูลให้ดีก่อน
date: 23 May 2017
source: Mthai
body: '<p>ปัจจุบันนี้การทำศัลยกรรมเป็นเรื่องใกล้ตัวที่ได้รับความนิยม และเริ่มเป็นที่เปิดกว้างมากยิ่งขึ้น ไม่ว่าจะเป็นในเพศหญิงหรือเพศชายเองก็ตาม ใครๆก็ต้องการอยากที่จะมีบุคลิก รูปร่างที่ดีขึ้นทั้งนั้น แต่ถึงอย่างไรการทำศัลยกรรมนั้นต้องพิจารณาและหาข้อมูลอย่างละเอียดถี่ถ้วน ไม่ว่าจะเป็นขั้นตอน วัสดุที่ใช้ทำ เครื่องมือ รวมถึงผลลัพธ์หลังทำที่จะตามมา แต่ถ้าหากใครที่กำลังกลัว ลังเล ไม่มั่นใจ วันนี้เรามีข้อคิดดีๆ จากคุณหมอธนัญชัย อัศดามงคล แพทย์เฉพาะทางด้านศัลยกรรมตกแต่ง โรงพยาบาลบางมด ว่าเพราะเหตุใดเราถึงยังไม่เหมาะที่จะทำศัลยกรรม???</p><h3>1. คนที่สวยหล่อ มั่นใจในใบหน้า รูปร่างตนเองอยู่แล้ว</h3><p>การศัลยกรรมควรทำเฉพาะจุดที่เราบกพร่อง มีปัญหา หรือไม่มั่นใจจริงๆ เท่านั้น ถ้าเรามั่นใจอยู่แล้ว แม้ใบหน้าอาจจะไม่ได้สวยเป๊ะตามหลักการแพทย์ แต่ก็สวยในแบบของเราได้ จึงไม่แนะนำให้ทำศัลยกรรมใดๆ</p><h3>2. คนที่มีความคาดหวังสูงเกินความเป็นจริง</h3><p>บางคนดูรีวิว ดูดารา ดูโฆษณามาก จึงคิดว่าทำศัลยกรรมแล้วจะต้องสวยมากๆ เหมือนในแบบที่เราคาดหวัง ซึ่งในความเป็นจริงการศัลยกรรมขึ้นอยู่กับหลายปัจจัย เช่น โครงสร้างเดิมของแต่ละคนที่ต่างกัน
  เทคนิคการผ่าตัดที่ต่างกัน ความชอบของแต่ละคนที่ต่างกัน หากใครที่กำลังติดสินใจที่จะทำศัลยกรรม แนะนำให้เข้าไปปรึกษาแพทย์ก่อนว่า ลักษณะใบหน้าแบบเรา จะทำศัลยกรรมได้ประมาณไหน อย่าคาดหวังสูงจนเกินไป เอาตามความเป็นจริงที่พอดีกับโครงสร้างเราและปลอดภัยในระยะยาวดีกว่านะ</p><p><img src="https://www.doctoryounger.com/img-uploads/Unti8885.jpg" alt=""></p><h3>3. คนที่ยังกลัว หรือลังเลอยู่</h3><p>ใครที่กลัวเจ็บ กลัวทำออกมาแล้วไม่สวย ลังเลว่าจะทำที่ไหนดี เป็นต้น หากเรายังมีความกลัว ความลังเลอยู่ แสดงว่าเรายังไม่พร้อมที่จะทำศัลยกรรมในขณะนั้น อย่าทำทั้งๆที่ยังกลัวหรือยังลังเลอยู่เด็ดขาด!!! เพราะการทำศัลยกรรมไม่ใช่เรื่องที่จะต้องรีบร้อน หากยังกลัวหรือลังเลอยู่ แนะนำให้ลองมาปรึกษาแพทย์และค่อยๆ ศึกษาหาข้อมูลอย่างละเอียดก่อนว่า ทำอย่างไรจึงจะปลอดภัย หาข้อดีข้อเสียของแต่ละอย่าง ศึกษาวิธีดูแลตัวเองทั้งก่อนและหลังผ่าตัดที่ถูกต้อง เมื่อได้ข้อมูลที่ถูกต้องครบถ้วน เราจะหายกลัวและไม่ลังเล เมื่อนั้นจึงจะพร้อมสำหรับการทำศัลยกรรมครับ</p><p>หากตัดสินใจที่จะทำศัลยกรรมแล้ว ควรคำนึงถึงเรื่องความสะอาด และความปลอดภัยเป็นอันดับแรก
  เพราะการทำศัลยกรรมนั้นเป็นการผ่าตัดกับร่างกายของเรา ไม่ว่าจะเป็นส่วนไหนก็ตาม เราจึงควรเลือกสิ่งที่ดีที่สุด ปลอดภัยและมีคุณภาพให้กับตัวเอง แต่ถึงอย่างไรก็ตามทุกคนล้วนมีความสวย หล่อในแบบที่ไม่เหมือนใคร ขอให้มั่นใจในตัวเอง ยังมีอีกหลายปัจจัยที่จะสามารถช่วยเสริมความมั่นใจให้กับตัวเราเองได้ ไม่ว่าจะเป็นการแต่งหน้า หรือการเลือกเสื้อผ้ามาแต่งตัว ใครจะไปรู้ แค่เราเปลี่ยนลุคแต่งตัวนิดๆ หน่อยๆ อาจทำให้เราดูดีขึ้นมาได้อย่างที่ไม่ต้องพึ่งมีดหมอเลยก็ได้</p><h3>ที่มา: Mthai</h3>'
