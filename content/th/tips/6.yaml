title: 10 ทริคบาลานซ์ชีวิต พิชิตเป้าหมาย
date: 26 Mar 2017
source: Sudsapda
body: '<h3>10 ทริคบาลานซ์ชีวิต พิชิตเป้าหมาย </h3><p>หมดสมัยเวิร์คกิ้งวูแมนที่โหมงานจนหัวฟู-ร่างพังแล้วจ้า ยุค 2017 นี้ผู้หญิงต้องบาลานซ์ชีวิตได้ดีประมาณว่าทำงานเก่งด้วย ดูแลตัวเองเริดด้วยถึงจะ "เจ๋งจริง" ในสภาพสังคมที่เร่งรีบแบบนี้ การที่สาวๆ จะจัดการชีวิตให้ลงตัวได้นั้น จำเป็นต้องมีเทคนิคกันหน่อย และนี่คือเทคนิคการบาลานซ์ชีวิตเริดๆ ที่เราอยากบอกต่อ</p><p>1. ลำดับความสำคัญ ในหนึ่งวันที่มีเรื่องราวมากมาย ถ้าเราไม่รู้จักลำดับความสำคัญ อะไรๆ คงตีกันวุ่นไปหมด เทคนิคง่ายๆ คือ ลิสต์สิ่งที่ต้องทำใน 1 วันออกมา แล้วลำดับว่าอะไรเป็นเรื่อง A สำคัญและเร่งด่วน B ไม่สำคัญแต่เร่งด่วน และ C สำคัญแต่ไม่เร่งด่วน แล้วรีบทำเรื่อง A ก่อน ตามมาด้วย B แล้วค่อย C</p><p>2. แบ่งเวลา นอกจากลำดับความสำคัญแล้ว เราควรแบ่งเวลาสำหรับเรื่องงานและเรื่องส่วนตัวเอาไว้ให้ชัดเจน ไม่อยากนั้นบางคนอาจทุ่มเวลาทั้งหมดไปที่งานจนละเลยตัวเองเป็นที่มาของอาการร่างพัง สมองเบลอ ดูไม่สวยและไม่โปรฯ เอาซะเลย</p><p>3. ใส่ใจสุขภาพ คงจะไม่ดีแน่ถ้าทำงานจนเจ็บป่วย สมัยนี้ค่าหมอแพงมากคิดยังไงก็ไม่คุ้มกับเงินที่ได้มา แถมบางโรคมีเงินก็รักษาไม่ได้อีก
  ความจริงเรื่องนี้ทุกคนในโลกก็รู้อยู่ แต่ยังทำไม่ได้ ใครที่มีปัญหานี้ อ่านข้อถัดไปเลยค่ะ</p><p>4. ทานมื้อเช้า เรารู้กันอยู่ว่ามื้อเช้าสำคัญมาก เพราะเป็นแหล่งพลังงานและอาหารสมอง แต่กลับไม่ค่อยมีเวลาทาน ลองหาอาหารมีประโยชน์แบบง่ายๆ ติดบ้านหรือโต๊ะทำงานไว้ ไม่ว่าจะเป็น ผลไม้ โยเกิร์ต หรือ กราโนล่า ที่กำลังฮิตกันในหมู่คนรักสุขภาพตอนนี้มีบางแบรนด์ทำออกมาได้อร่อย ทานง่ายด้วยนะอย่าง เนสท์เล่ ฟิตเนสส์ กราโนล่าที่ใช้ข้าวโอ๊ตเต็มเมล็ดอบกรอบคัดสรรจากเบลเยี่ยม เป็นส่วนผสมหลัก ซึ่งมีใยอาหาร เพิ่มกากใยในระบบทางเดินอาหาร ช่วยให้อิ่มนานขึ้นจะได้ไม่หิวระหว่างมื้อจนเสียสมาธิทำงานไง พร้อมแคลเซียมสูงจ้าใครยังไม่ลองลองเลย! มีให้เลือกอร่อย 2 แบบ ทั้งรสน้ำผึ้งแท้ หอม หวานนิดๆ และ รสแครนเบอร์รี่ผสมเมล็ดฟักทอง อร่อยกรุบกรอบ</p><p><img src="https://www.doctoryounger.com/img-uploads/002.jpg" alt=""></p><p>5. ขยับร่าง = ทางลัดเผาผลาญแคลอรีถ้าคุณคือหนึ่งในสาวบีซี่ (หรือเลซี่) ที่ไม่มีเวลาไปออกกำลังกายสม่ำเสมอ เราขอแนะนำให้ขยับร่างกายในชีวิตประจำวันแทน เช่น เดินเร็วขึ้น-ลงบันได 1-3 ชั้นแทนการใช้ลิฟต์ ทำงานบ้านเอง ฯลฯ
  จะช่วยเบิร์นได้เล็กๆ น้อยๆ และทำให้ร่างกายกระฉับกระเฉง</p><p>6. ขับถ่ายเป็นเวลา ใครว่าเรื่องนี้ไม่สำคัญ ลองนึกถึงวันที่เราไม่ได้ “เอาออก” สิ ว่ารู้สึกอึดอัดและหงุดหงิดแค่ไหนจนบางทีก็เผลอทำหน้าบูดใส่เพื่อนร่วมงานซะงั้น ใครที่มีปัญหาเรื่องระบบขับถ่ายรีบแก้ไขด่วนก่อนที่คนในออฟฟิศจะเม้าท์ว่าเราขี้เหวี่ยง (ไม่เป็นผลดีกับการทำงานเลย) วิธีง่ายๆ เบื้องต้นคือดื่มน้ำเยอะๆ และทานอาหารที่มีกากใยสูง เช่น ผัก ผลไม้ ธัญพืชไม่ขัดสี ซึ่งกราโนล่าก็เข้าข่ายนี้นะ รู้ยัง?</p><p>7. นอนให้พอ6-8 ชั่วโมง วิชาสุขศึกษาสอนเรามาตั้งแต่เด็ก … ทำด้วยนะเธอ</p><p>8. จัดเวลาทำสวยบุคลิกภาพที่ดีเป็นสิ่งหนึ่งที่ทำให้เรารู้สึกมีความสุขและมั่นใจ เจ้าความมั่นใจนี่แหละที่ทำให้เราดูโปรฯ ขึ้นในการทำงาน ดังนั้นใน 1 สัปดาห์ควรจัดเวลาในการทำสวยสัก 1 ครั้ง ไม่ว่าจะเป็นนวดหน้า ขัดผิว ทำผม … ลองดูแล้วจะติดใจ</p><p><img src="https://www.doctoryounger.com/img-uploads/001.jpg" alt=""></p><p>9. เป็นสาวแอ๊คทีฟ เมื่อถึงเวลาเลิกงานหรือวันหยุดต้องวางเรื่องงานแล้วมาใช้ชีวิตส่วนตัวให้เต็มที่ เพราะการพักผ่อนที่มีคุณภาพจะทำให้คุณมีพลังกายและพลังสมองเต็มเปี่ยมในวันทำงาน
  ถ้ายังตัดความเครียดจากงานไม่ได้ แทนที่จะนั่งกลุ้มใจอยู่บ้าน ลองหากิจกรรมที่น่าสนใจแล้วออกไปลุยเลย เช่น เรียนทำอาหาร เรียนจัดดอกไม้ โยคะ วิ่ง ฯลฯ สิ่งเหล่านี้จะสร้างสมาธิและช่วยดึงความสนใจของคุณออกจากเรื่องเครียดๆ เอง</p><p>10. เข้าใจคำว่า “สมดุล” ถ้าคิดจะสร้างสมดุลชีวิตต้องอย่ากดดันตัวเองมากเกินไปไม่อย่างนั้นอาจไม่มีความสุขและทำไม่ได้จริง ลองปรับวิธีคิดใหม่ มองการใช้ชีวิตให้เป็นเรื่องง่ายๆ ชิลๆ ค่อยเป็นค่อยไป อย่างถ้าอยากทานขนมก็ทานได้แต่อาจจะค่อยๆ ลดปริมาณลง และค่อยๆเติมของที่มีประโยชน์เข้าไป จากปริมาณน้อย ค่อยๆเพิ่มปริมาณมากขึ้น เช่น ครั้งแรกอาจโรยถั่วและกราโนล่าในไอศครีมแทนท็อปปิ้งอื่นๆครั้งต่อไปอาจเพิ่มปริมาณกราโนล่าขึ้นแล้วลดปริมาณไอศครีมลง เป็นต้น</p><h3>ที่มา: Sudsapda</h3>'
