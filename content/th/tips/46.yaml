title: แม่ให้นมลูกฉีดโบท็อกซ์ได้ไหม??
date: 23 Sep 2017
source: Theasianparent
body: '<p>แม่ให้นมลูกฉีดโบท็อกซ์ได้ไหม เป็นคำถามที่คุณแม่หลายคนสงสัย เรามาหาคำตอบพร้อมกัน</p><h3>โบท็อกซ์ คืออะไร??</h3><p>โบท็อกซ์ หรือโบทูลินัม ท็อกซิน คือสารเติมเต็มที่ใช้ฉีดเข้าใต้ผิวหนังเพื่อคงรูปกล้ามเนื้อบางส่วนบนใบหน้าเพื่อลดการแสดงสีหน้าหรือริ้วรอยต่าง ๆ</p><p><img src="https://www.doctoryounger.com/img-uploads/002.jpg" alt=""></p><h3>แม่ให้นมลูกฉีดโบท็อกซ์ได้ไหม??</h3><p>ในปัจจุบันยังไม่มีการศึกษาวิจัยอย่างจริงจัง อีกทั้งยังไม่มีหลักฐานทางการแพทย์ที่สามารถยืนยันได้อย่างแน่ชัดถึงความปลอดภัยจากการฉีดโบท็อกซ์ระหว่างให้นมลูก แต่สำหรับใครที่แพ้ หรือมีประวัติแพ้สารโบทูลินัมอยู่ รวมไปถึงเคยมีประวัติเป็นโรคกล้ามเนื้ออ่อนแรงมาก่อน ไม่ควรฉีดโบท็อกซ์นะครับ เพราะอาจเกิดอันตรายได้</p><p>- ในการฉีดโบท็อกซ์แต่ละครั้งนั้นร่างกายจะได้รับสารโบทูลินั่ม ท็อกซิน ชนิด เอ (botulinum toxin type A) แต่ก็เป็นปริมาณที่น้อย</p><p>- สารที่ถูกฉีดจะตรงไปยังกล้ามเนื้อ และยังไม่มีข้อมูลยืนยันว่าสารที่ถูกฉีดนั้นจะไหลวนเวียนในร่างกายหรือผ่านไปกับน้ำนมของคุณแม่</p><p>- การฉีดโบท็อกซ์นั้นเป็นไปได้ว่าจะไม่เป็นอันตรายโดยตรงต่อลูกน้อย
  แต่ยังไม่มีผลการวิจัยทางวิทยาศาสตร์มายืนยันถึงเรื่องดังกล่าว</p><p>- แม้ว่าการฉีดโบท็อกซ์นั้น ดูเหมือนว่าจะไม่ส่งผลกับลูกผ่านทางการให้นม แต่คุณแม่ควรให้นมลูกก่อนที่จะทำการฉีดโบท็อกซ์และควรเว้นการให้นม 4 – 6 ชั่วโมง หลังจากการฉีดโบท็อกซ์</p><p>- การฉีดโบท็อกซ์นั้นควรทำโดยแพทย์ผู้เชี่ยวชาญเท่านั้น และหากคุณยังอยู่ในช่วงที่ต้องให้นมลูกคุณควรปรึกษาแพทย์ทุกครั้งก่อนทำการฉีดโบท็อกซ์</p><p><img src="https://www.doctoryounger.com/img-uploads/003.jpg" alt=""></p><h3>ผลข้างเคียงจากการฉีดโบท็อกซ์??</h3><p>การฉีดโบท็อกซ์อาจทำให้เกิดผลข้างเคียงเช่น อาการปวด หรือบวมบริเวณที่ทำการฉีดโบท็อกซ์ ปากแห้ง ปวดหัว และอ่อนเพลีย นอกจากนั้นแล้วการฉีดโบท็อกซ์อาจทำให้เกิดผลข้างเคียงอื่นๆตามมาได้ ซึ่งหากคุณมีอาการเหล่านี้ คุณควรเข้าพบแพทย์เพื่อทำการตรวจวินิฉัยครับ ซึ่งอาการที่ว่านั้นได้แก่</p><p>- กลืนลำบาก</p><p>- มีปัญหาในการพูด</p><p>- กล้ามเนื้ออ่อนแรง</p><p>- หายใจลำบาก</p><p>- หนังตาตก</p><p>- มองเห็นไม่ชัด</p><p>- อาการบ่งบอกถึงการแพ้ เช่น อาการคัน มีผื่นขึ้น ลมพิษ หายใจเสียงดัง</p><p><img src="https://www.doctoryounger.com/img-uploads/004.jpg"
  alt=""></p><p>สำหรับผลข้างเคียงต่อลูกน้อยนั้นยังไม่เป็นที่ปรากฏแน่ชัด แต่คุณแม่ควรสังเกตุอาการของลูกน้อยอย่างใกล้ชิด หากลูกน้อยมีอาการอ่อนเพลีย หรือมีปัญหาในเรื่องระบบการย่อยอาหาร ควรรีบพาลูกน้อยไปพบแพทย์เพื่อทำการตรวจรักษาครับ อย่างไรก็ตามคุณแม่สามารถดูแลสุขภาพให้แข็งแรง หันมาออกกำลังกายอย่างสม่ำเสมอ ทานอาหารที่มีประโยชน์ พักผ่อนให้เพียงพอ แล้วรอให้พ้นช่วงให้นมลูกไปก่อนแล้วค่อยฉีดโบท็อกซ์ก็ได้นะอาจจะต้องอดทนรอนานอีกสักนิด แต่นอกจากคุณแม่จะมีสุขภาพดีแล้ว ยังมั่นใจได้ว่าจะไม่มีสารอะไรที่เป็นอันตราย ส่งผ่านไปทำร้ายลูกน้อยได้อย่างแน่นอน</p><h3>ที่มา: Theasianparent</h3>'
