title: ผิวแห้งหน้าหนาว ผิวแตกหน้าหนาว ต้องรับมือด้วย 8 เคล็ดลับต่อไปนี้
date: 04 Nov 2017
source: Kapook
body: '<p>ผิวแห้งหน้าหนาว ผิวแตกหน้าหนาว จะมีวิธีรับมืออย่างไรให้ผิวยังคงความชุ่มชื่นดูมีสุขภาพดีจนใครๆ ต่างพากันอิจฉา ตามมาดูเคล็ดลับดีๆ ที่อยากบอกต่อกันได้เลย หลังจากที่เผชิญกับอากาศร้อนกันมาเป็นเวลานาน เมื่อย่างเข้าสู่ปลายปี อาจทำให้สาวๆ หลายคนรู้สึกสดชื่นไปกับอากาศเย็นสบายเพราะลมหนาวที่พัดผ่านเข้ามา แต่ทราบไหมคะว่าการที่อุณหภูมิลดลงในช่วงหน้าหนาวนั้นก็ส่งผลทำให้ความชุ่มชื่นที่มีอยู่ในผิวของสาวๆ ลดลงด้วยเช่นกัน ซึ่งถือเป็นสาเหตุสำคัญเลยก็ว่าได้ที่ทำให้ผิวแห้งกร้าน ผิวแตก ผิวลอกเป็นขุย และมีอาการคันยิบๆ ตามมา แล้วจะมีวิธีดูแลผิวในช่วงหน้าหนาวอย่างไรให้กลับมาชุ่มชื่นอิ่มน้ำได้เหมือนเดิม ไม่ยากค่ะ วันนี้มีเคล็ดลับดีๆ เกี่ยวกับวิธีรับมือผิวแห้ง ผิวแตกหน้าหนาวมาฝากกันแล้ว จะมีวิธีอะไรบ้าง ไปเตรียมตัวให้พร้อมกันเลย</p><h3>1. ดื่มน้ำเติมความชุ่มชื่นให้ผิว</h3><p>เมื่อสาวๆ เริ่มรู้สึกว่าผิวของตัวเองแห้งแตก ตกสะเก็ดและเริ่มมีอาการคันยิบๆ ขึ้นมาแล้วละก็ อย่านิ่งนอนใจ ควรดื่มน้ำในแต่ละวันให้เพียงพอต่อความต้องการ เพื่อให้น้ำเข้าไปฟื้นบำรุงให้ผิวแห้งกร้านจากการสูญเสียความชุ่มชื่น ช่วยให้ผิวกลับมาอิ่มน้ำได้เหมือนเดิม
  นอกจากนี้สาวๆ ยังสามารถดื่มเครื่องดื่มอุ่นๆ เช่น น้ำอุ่นผสมน้ำมะนาว โกโก้หรือชาร้อนบ่อยๆ ในช่วงหน้าหนาว ก็จะเป็นอีกวิธีหนึ่งที่ช่วยบำรุงทำให้ผิวรู้สึกสดชื่นจากภายในได้ค่ะ</p><p><img src="https://www.doctoryounger.com/img-uploads/1.jpg" alt=""></p><h3>2. รับประทานผัก-ผลไม้ที่มีปริมาณน้ำสูง</h3><p>สาวๆ ทราบไหมคะว่าการกินผักและผลไม้ที่มีปริมาณน้ำมากๆ เช่น แตงกวา มะเขือเทศ แครอท แอปเปิล ส้ม กีวี แตงโม และแคนตาลูป ก็เป็นอีกวิธีหนึ่งที่ช่วยคืนความชุ่มชื้นให้กับผิวแห้งกร้านได้เป็นอย่างดีค่ะ เพราะในผัก-ผลไม้ฉ่ำน้ำเหล่านี้มีสารอาหารสำคัญและวิตามินต่างๆ เช่น วิตามิน C และสารต้านอนุมูลอิสระ ที่จะช่วยบำรุงให้ผิวพรรณของสาวๆ เปล่งปลั่งดูมีสุขภาพดีขึ้นนั่นเอง</p><h3>3. หลีกเลี่ยงการอาบน้ำอุ่นเป็นเวลานานๆ</h3><p>สาวๆ ทราบไหมคะว่าการอาบน้ำอุ่นเป็นเวลานาน เป็นสาเหตุหนึ่งที่ทำให้ผิวสูญเสียความชุ่มชื้นได้พอๆ กับการออกไปเผชิญกับลมหนาวข้างนอกเลยทีเดียว เพราะการอาบน้ำในอุณหภูมิที่สูง ยิ่งมากเท่าไหร่ก็ยิ่งเป็นการดึงความชุ่มชื่นออกไปจากผิวได้มากเท่านั้น และยิ่งไปกว่านั้นน้ำมันธรรมชาติที่มีอยู่ในผิวหนังของเราก็จะถูกขจัดออกไปด้วย
  ทำให้ผิวแห้งกร้านได้ง่ายมากขึ้น ทางที่ดีสาวๆ ควรหลีกเลี่ยงการอาบน้ำที่มีอุณหภูมิสูงเป็นเวลานานในช่วงหน้าหนาวจะดีกว่าค่ะ</p><p><img src="https://www.doctoryounger.com/img-uploads/2.jpg" alt=""></p><h3>4. ทามอยส์เจอไรเซอร์ หรือโลชั่นบำรุงผิวแห้งแตก</h3><p>ผิวที่โดนลมหนาวเป็นเวลานานๆ จะแห้งแตกเป็นขุยและมีอาการคันยิบๆ ตามมา สาวๆ ควรบำรุงผิวกายด้วยมอยส์เจอไรเซอร์ที่อุดมไปด้วยคอลลาเจน หรือสารสกัดจากธรรมชาติ เช่น น้ำแร่ ดอกลาเวนเดอร์ ดอกคาโมมายล์ ทาเป็นประจำทุกวันก็จะช่วยบรรเทาอาการผิวแห้ง คัน และช่วยฟื้นคืนให้ผิวกายของสาวๆ กลับมาอิ่มน้ำ และเนียนนุ่มน่าสัมผัสได้</p><h3>5. DIY มาสก์หน้าบำรุงผิวให้ชุ่มชื่น</h3><p>ผิวหน้าของสาวๆ ที่สัมผัสกับลมหนาว จำเป็นอย่างมากที่ต้องบำรุงให้ชุ่มชื่น โดยสาวๆ สามารถทำมาสก์หน้าบำรุงได้ง่าย ๆ ด้วยการนำไข่แดง 2 ฟองผสมกับน้ำมันมะกอก 3-4 หยด คนให้เข้ากันนำมาพอกหน้าทิ้งไว้ประมาณ 20 นาทีแล้วล้างออก ทำสัปดาห์ละ 2 ครั้ง ไข่แดงที่อุดมไปด้วยวิตามิน A และเลซิติน และน้ำมันมะกอกที่อุดมไปด้วยวิตามิน E , K และสารต้านอนุมูลอิสระ จะช่วยบำรุงผิวรักษาผิวที่แห้งกร้านของสาวๆ ให้กลับมาเนียนนุ่มชุ่มชื่นน่าสัมผัสได้อีกครั้ง</p><p><img
  src="https://www.doctoryounger.com/img-uploads/3.jpg" alt=""></p><h3>6. ปากแห้งแตกเป็นขุยรับมือด้วยลิปบาล์ม</h3><p>ในช่วงหน้าหนาว สาวๆ จะเห็นได้ว่าริมฝีปากมักจะแห้งแตกเป็นขุยดูไม่น่ามอง สาเหตุเกิดจากผิวหนังกำพร้าที่อยู่ชั้นนอกสุดสูญเสียความชุ่มชื่นจากการสัมผัสอากาศเย็นเป็นเวลานาน ดังนั้นสาวๆ จึงควรบำรุงด้วยการทาลิปบาล์มเป็นประจำทุกวัน ส่วนหนังกำพร้าที่แห้งแตกเป็นขุย สามารถขจัดออกได้อย่างอ่อนโยนด้วยการใช้แปรงสีฟันถูเบาๆ ก็จะช่วยให้ริมฝีปากของสาวๆ กลับมาเนียนเรียบได้เหมือนเดิมแล้วค่ะ</p><h3>7. บำรุงผิวส้นเท้าแห้งแตกด้วยการทาครีมบำรุง</h3><p>หากสาวๆ มีปัญหาผิวที่ส้นเท้าแห้งแตกเป็นร่องลึก มีวิธีดูแลรักษาง่ายๆ ค่ะ ด้วยการทาครีมบำรุง เช่น ทาจาระบีที่ทำจากปิโตรเลียมหรือน้ำมันพืช ทาด้วยน้ำมันมะกอก หรือทาด้วยวาสลีนแล้วสวมถุงเท้าเข้านอนทุกคืน ก็จะช่วยบำรุงให้ผิวหนังบริเวณส้นเท้าหายจากอาการแห้งแตกได้ภายในระยะเวลาอันรวดเร็วค่ะ</p><h3>8. หลีกเลี่ยงการใส่เสื้อผ้าที่ทำให้เกิดการระคายเคืองผิว</h3><p>ในช่วงหน้าหนาวสาวๆ ควรหลีกเลี่ยงเสื้อผ้าที่อาจทำให้เกิดอาการระคายเคืองผิวแห้งแตก เช่น เสื้อผ้าที่ทำจากขนสัตว์
  หรือเสื้อผ้าที่ใส่ส่วนผสมของสารเคมีในขั้นตอนการผลิต แล้วหันมาสวมใส่เสื้อผ้าที่ทำจากเส้นใยธรรมชาติแทน เช่น ผ้าฝ้าย ผ้าลินิน หรือผ้าไหมที่สามารถระบายอากาศได้ดี สวมใส่สบาย แล้วค่อยสวมเสื้อกันหนาวทับอีกชั้น ก็จะเป็นการช่วยถนอมผิวของสาวๆ ให้ห่างไกลจากอาการระคายเคืองในช่วงที่ผิวแห้งแตกได้เป็นอย่างดีค่ะ</p><p>เห็นไหมคะว่าวิธีรับมือกับปัญหาผิวแห้ง ผิวแตกในช่วงหน้าหนาวไม่ใช่เรื่องยากเลย เพียงแค่สาวๆ ดูแลและบำรุงผิวให้ชุ่มชื่นอยู่ตลอดเวลาตามเคล็ดลับที่นำมาฝากกันในวันนี้ รับรองว่าลมหนาวจะไม่สามารถพัดพาความชุ่มชื่นออกไปจากผิวสวยของสาวๆ ได้อย่างแน่นอนค่ะ</p><h3>ที่มา: Kapook</h3>'
