title: นอนดึกบ่อยๆ ห้ามพลาดกับ 5 วิธีดูแลสุขภาพให้ฟิตอยู่เสมอ
date: 01 Jul 2017
source: Sanook
body: '<p>การนอนดึกบ่อยๆ อาจทำให้สุขภาพพังได้ เนื่องจากร่างกายได้รับการพักผ่อนและการซ่อมแซมในส่วนที่สึกหรอไม่เต็มที่ ดังนั้นสำหรับใครที่จำเป็นต้องนอนดึก ควรดูแลสุขภาพของตนเองให้มากขึ้น ซึ่งเราก็มี 5 วิธีง่ายๆ มาแนะนำกันดังนี้</p><h3>1. ทานอาหารที่มีประโยชน์</h3><p>เมื่อร่างกายพักผ่อนน้อย ก็ควรเน้นการทานอาหารที่มีประโยชน์เข้าไว้ โดยเฉพาะอาหารที่มีส่วนช่วยในการบำรุงสมอง เช่น ถั่วเหลือง เต้าหู้ ไข่แดง อกไก่และเนื้อปลา เป็นต้น นอกจากนี้ก็ควรทานวิตามินบีเป็นหลัก เพราะวิตามินบีมีส่วนช่วยในการกระตุ้นระบบประสาทและการทำงานของสมองให้ตื่นตัวอยู่เสมอ จึงไม่ทำให้ร่างกายเกิดความอ่อนล้าจนเกินไปนั่นเอง</p><p><img src="https://www.doctoryounger.com/img-uploads/555.jpg" alt=""></p><h3>2. ทานวิตามินแก้เครียด</h3><p>สำหรับคนที่เครียดบ่อยๆ จนส่งผลให้นอนไม่หลับ ควรทานวิตามินที่มีส่วนช่วยในการแก้เครียดโดยเฉพาะ ซึ่งได้แก่วิตามินบีและวิตามินซีนั่นเอง โดยอาจทานในรูปของวิตามินเสริมหรืออาหารที่อุดมไปด้วยวิตามินเหล่านี้ก็ได้ นอกจากนี้แนะนำให้ดื่มน้ำผลไม้คั้นสดเป็นประจำทุกวัน แต่ห้ามใส่น้ำตาลเด็ดขาด เพราะจะทำให้อ้วนได้</p><h3>3.
  ออกกำลังกายเบาๆ หลังตื่นนอน</h3><p>แม้จะนอนดึก แต่ก็ควรออกกำลังกายสักนิดหลังตื่นนอน เพราะจะทำให้ร่างกายมีความตื่นตัวพร้อมสำหรับการใช้ชีวิตประจำวันมากขึ้น และยังช่วยให้สุขภาพดีอีกต่างหาก สำหรับการออกกำลังกายอาจเลือกเป็นการลุกนั่ง วิดพื้นหรือวิ่งเหยาะๆ อยู่กับที่ก็ได้</p><h3>4. งดดื่มกาแฟหลังบ่าย 3 โมง</h3><p>เพราะการดื่มกาแฟหลังจากบ่าย 3 โมงไปแล้ว จะทำให้เกิดอาการนอนไม่หลังและทำให้นอนดึกได้ ดังนั้นในช่วงเวลาดังกล่าวจึงควรงดกาแฟอย่างเด็ดขาด ซึ่งหากต้องการให้ร่างกายมีความกระปรี้กระเปร่าแนะนำให้เลือกดื่มโกโก้ร้อนหรือดาร์กช็อกโกแลตแทน</p><p><img src="https://www.doctoryounger.com/img-uploads/666.jpg" alt=""></p><h3>5. ทำกิจกรรมที่ผ่อนคลาย</h3><p>แค่นอนดึกก็ทำร้ายสุขภาพมากพอแล้ว เพราะฉะนั้นอย่าปล่อยให้ความกังวลหรือความเครียดมาทำลายสุขภาพให้แย่ลงกว่าเดิม ควรหากิจกรรมสนุกๆ ที่จะช่วยให้เกิดความผ่อนคลายทำบ้าง เช่น การฟังเพลง การไปเที่ยวท่ามกลางธรรมชาติหรือการนอนเล่นในวันหยุด เท่านี้ก็จะช่วยให้เกิดความผ่อนคลายและส่งผลดีต่อสุขภาพไม่น้อยเลยทีเดียว</p><p>ไม่ยากเลยใช่ไหมกับวิธีการดูแลสุขภาพสำหรับคนนอนดึก
  ซึ่งจะช่วยเพิ่มความกระปรี้กระเปร่าให้กับร่างกายได้ดีและคลายความอ่อนล้าจากการพักผ่อนน้อยได้อย่างดีเยี่ยมอีกด้วย เพราะฉะนั้นใครที่มักจะนอนดึกบ่อยๆ หรือนอนหลับพักผ่อนน้อยมาก ก็ลองทำตาม 5 วิธีเหล่านี้กันดู รับรองว่าจะช่วยให้สุขภาพของคุณดีขึ้นอย่างแน่นอน แต่อย่างไรก็ตาม หากเป็นไปได้ควรพยายามนอนหลับให้เต็มที่จะดีกว่า</p><h3>ที่มา: Sanook</h3>'
