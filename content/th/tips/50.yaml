title: หมอเตือนแฟชั่น จิ๋ม 3 มิติ ระวังผลแทรกซ้อน พบว่าที่เจ้าสาวนิยมเข้าตัดแต่งน้องสาว!!
date: 08 Oct 2017
source: Khaosod
body: '<p>จากกรณีที่โซเชียลมีเผยแพร่ภาพการทำศัลยกรรมอวัยวะเพศหญิงที่เรียกว่า "จิ๋ม 3 มิติ" ของโรงพยาบาลเสริมความงามแห่งหนึ่ง โดยการใช้ไขมันของตัวเองฉีดเข้าไปยังบริเวณแคมใหญ่ เพื่อให้มีความอูม โหนกนูนมากยิ่งขึ้น จนมีการส่งต่อและพูดถึงเป็นอย่างมากนั้น</p><p><img src="https://www.doctoryounger.com/img-uploads/Untitled-2.jpg" alt=""></p><p>เมื่อวันที่ 5 ต.ค. พญ.ชัญวลี ศรีสุโข สูตินรีแพทย์ รพ.พิจิตร กล่าวถึงเรื่องนี้ ว่า การทำศัลยกรรมอวัยวะเพศหญิงนั้นจริงๆ มีมานานแล้ว เช่น การทำรีแพร์หลังคลอดบุตร หรือการตัดแคมเล็กให้มีขนาดเล็กลง เพราะเชื่อว่าหากแคมเล็กมีขนาดใหญ่คือผ่านการมีเพศสัมพันธ์มามาก ซึ่งผู้หญิงอายุน้อยจะทำกันมากขึ้น โดยเฉพาะผู้หญิงก่อนแต่งงาน เป็นต้น ทั้งนี้ ปัจจุบันมีวิธีการศัลยกรรมเสริมความงามอวัยวะเพศหญิงเพิ่มขึ้น โดยเฉพาะช่วง 3-5 ปีมานี้ เช่น การฉีดเสริมจีสปอต การดูดไขมันที่เนินหัวหน่าว (Mons Pubis) หรือการดูดไขมันที่แคมใหญ่ (Labia Majora) ออก เพราะเนินและแคมใหญ่ที่มีขนาดใหญ่เกินไป รวมถึงการฉีดไขมันตัวเองหรือฟิลเลอร์ที่แคมใหญ่ เป็นต้น</p><p>พญ.ชัญวลี กล่าวว่า แคมใหญ่จะมีไขมันอยู่ภายใน
  หน้าที่คือช่วยป้องกันการกระแทกขณะมีเพศสัมพันธ์ ทำให้ไม่เจ็บ ซึ่งหากผู้หญิงอ้วนขึ้น แคมใหญ่ก็อาจจะนูนขึ้นตาม และเมื่อผอมก็มีขนาดลดลง และโดยธรรมชาติเมื่ออายุมากขึ้นก็จะเหี่ยวลง ไม่เต่งตึงเหมือนเดิมเป็นธรรมดา จึงมีการนำไขมันของตัวเองจากหน้าท้องหรือต้นขา หรือการนำเอาฟิลเลอร์มาฉีดเข้าไปบริเวณดังกล่าว เพื่อให้เกิดความเต่งตึงขึ้น เพราะเชื่อว่าจะช่วยให้มีความสวยงาม ไม่เหี่ยว ไม่มีรอยย่น และช่วยให้มีเพศสัมพันธ์ดีขึ้นไม่เจ็บ ทั้งนี้ ผู้ที่มาทำการฉีดเสริมแคมใหญ่ เท่าที่สอบถามส่วนใหญ่จะขาดความมั่นใจในรูปลักษณ์ของตัวเอง เพราะชอบไปเทียบกับคนแสดงหนังโป๊ที่มีรูปลักษณ์ของแคมใหญ่ที่สวยงาม คือ แคมเล็กมีขนาดเล็ก และแคมใหญ่มีขนาดใหญ่ ก็จะช่วยให้เกิดความมั่นใจขึ้น แต่เบื้องต้นก็มีความปลอดภัยในระดับหนึ่ง</p><p><img src="https://www.doctoryounger.com/img-uploads/Untitled-1.jpg" alt=""></p><p>“การศัลยกรรมเสริมความงามทุกชนิดมีอันตราย นอกจากเรื่องเสียเงิน เสียค่าใช้จ่าย และอาจเสียใจหากไม่เป็นไปตามคาดหวังแล้ว ยังมีเรื่องของข้อแทรกซ้อนต่างๆ ที่อาจเกิดขึ้นได้ วิธีดังกล่าวก็เช่นกัน เช่น อาจเกิดการอักเสบ ติดเชื้อ ห้อเลือด
  เสียเลือด อาการชา เพราะกระทบกับเส้นประสาท เส้นเลือด เป็นต้น นอกจากนี้ บริเวณอวัยวะเพศหญิงซึ่งมีต่อมไขมันมาก ทำให้เกิดรูขุมขนอักเสบได้ง่าย สาเหตุมาจากความอับชื้นหรือคับเกินไป อย่างคนอ้วนหรือคนที่มีเนินใหญ่ เวลานั่งทับขาหนีบตัวเองก็อาจเกิดขึ้นได้ การฉีดให้แคมใหญ่มีขนาดใหญ่ขึ้นก็เช่นกัน หากมีความอับชื้นหรือคับเกินไปก็อาจทำให้เกิดรูขุมขนอักเสบได้เช่นกัน” พญ.ชัญวลี กล่าว</p><p>พญ.ชัญวลี กล่าวว่า จริงๆ แล้วการปล่อยให้เป็นไปตามธรรมชาติถือว่าดีที่สุด อย่าคิดว่าของตัวเองไม่เหมือนคนอื่น เพราะธรรมชาติสร้างมาก็มีความเหมาะสมแล้ว เช่น ขนาด สี ก็เป็นไปตามพันธุกรรม ซึ่งแต่ละประเทศก็มีความแตกต่างกัน รวมไปถึงวัฒนธรรมแต่ละเผ่าพันธุ์ อย่างญี่ปุ่นเขาก็จะชอบแคมเล็กมีที่ขนาดเล็ก แต่ถ้าเป็นกลุ่มคนผิวสีก็จะชอบแคมเล็กที่มีขนาดใหญ่ เพราะเชื่อว่าช่วยให้รู้สึกมีความสุขมากขึ้นขณะมีเพศสัมพันธ์ ดังนั้น การปล่อยให้เป็นไปตามธรรมชาติจะดีที่สุด แต่หากมีเพศสัมพันธ์แล้วเจ็บปวดก็มาพบแพทย์เพื่อรักษาก็จะปลอดภัยกว่า</p><h3>ที่มา: Khaosod</h3>'
