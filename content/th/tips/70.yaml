title: หล่อไม่กลัวแดด 7 วิธีดูแลผิวหน้าร้อน
date: 10 Jan 2018
source: Sanook
body: '<p>บุคลิกภาพที่ดี เป็นสิ่งแรกที่จะสร้างความประทับใจได้แก่ผู้พบเห็น ใบหน้าที่ไร้สิว จุดด่างดำและความหมองคล้ำ ก็เป็นอีกหนึ่งส่วนสำคัญที่จะช่วยเสริมสร้างภาพลักษณ์ของคุณให้ดูดีขึ้น เพิ่มความมั่นใจให้กับตัวเอง ยิ่งอีกไม่กี่อึดใจก็จะเป็นช่วงซัมเมอร์แล้ว การดูแลผิวในช่วงฤดูร้อนแบบนี้ หนุ่มๆ ควรทำอย่างไร วันนี้มีเคล็ดลับการดูแลผิวหน้ามาฝาก</p><p><strong>1. ทาครีมกันแดดในปริมาณที่เหมาะสม</strong> สำคัญมาก คือต้องทาให้หนาพอจึงจะกันแดดได้เท่ากับ SPF ที่ระบุไว้ในผลิตภัณฑ์ จำง่ายๆ แบบครีมขอ 2 ข้อนิ้ว แบบน้ำขอ 1 เหรียญสิบ</p><p><img src="https://www.doctoryounger.com/img-uploads/1111.jpg" alt=""></p><p><strong>2. เข้าใจฉลากครีมกันแดด</strong> ครีมกันแดดที่ดีต้องกันแดดได้ครอบคลุม อย่างน้อยต้องกันแสง UVA และ UVB ได้</p><p>- UVA : มีค่า PA++++ หรือ PPD หรือ สัญลักษณ์ UVA</p><p>- UVB : มีค่า SPF&gt;50</p><p>สำหรับ Visible light เป็นเทรนใหม่ล่าสุด เพราะมีการศึกษาพบว่าแสง Visible light เป็นสาเหตุหนึ่งของการเกิดฝ้า ถ้าเลือกกันแดดแบบเต็มสูตรก็ให้ดูว่ามี Iron oxide เป็นส่วนประกอบด้วยหรือไม่ เพราะสารนี้สามารถช่วยเพิ่มประสิทธิภาพในการกันแสง
  Visible Light</p><p><strong>3. ใช้อุปกรณ์อื่นช่วยกันแดด</strong> นอกจากการทาครีมกันแดดแล้ว ถ้าเราต้องอยู่ในแสงแดดนานๆ หรือเล่นกีฬากลางแจ้ง การสวมหมวกปีกกว้าง กางร่ม สวมใส่เสื้อผ้ากันแดด ที่มีค่า UPF ก็จะช่วยปกป้องผิวได้ดีกว่าทาครีมกันแดดเพียงอย่างเดียว</p><p><img src="https://www.doctoryounger.com/img-uploads/2222.jpg" alt=""></p><p><strong>4. ทาซ้ำ</strong> ถ้าเรามีกิจกรรมที่เหงื่อออกมาก หรือในน้ำครีมกันแดดจะอยู่บนผิวเราไม่นาน จำเป็นต้องทาซ้ำทุกๆ 2 ชั่วโมง เพื่อเพิ่มประสิทธิภาพในการปกป้องผิวของคุณ</p><p><strong>5. หลีกเลี่ยงแดดช่วง 10.00-16.00 น.</strong> แดดในช่วงนี้จะมี UV index สูงที่สุด ถึงแม้ว่าช่วงนั้นจะมีเมฆมากแดดไม่แรง ยังไงแสง UV ก็แรงเหมือนเดิม แดดร่มแบบนี้ถ้าไม่ระวังจะดำกว่าแดดจัด</p><p><strong>6. ปกป้องสายตาด้วยแว่นกันแดด</strong> เลือกแว่นกันแดดที่เลนส์ดีๆ กัน UV100% ขนาด Oversize มาบังหน้าแก้มหน่อย นอกจากจะเพิ่มความเท่ให้กับลุคในวันนั้นแล้ว ยังช่วยถนอมสายตา บังแดดให้หน้าแก้มตำแหน่งที่เป็นฝ้าบ่อยได้อีกด้วย</p><p><strong>7. Antioxidant Boost </strong>ความสวยเริ่มจากภายในสู่ภายนอก
  เมื่อเราปกป้องตัวเองจากแสงแดดด้วยอุปกรณ์ต่างๆแล้ว Antioxidants จะเป็นอีกหนึ่งปราการสำคัญที่จะช่วยปกป้องเซลล์ผิวได้ แนะนำให้ทานอาหารที่มี Antioxidants สูงซึ่งมีอยู่ใน ผัก, ผลไม้สีเข้มๆ และอาจเสริมด้วยวิตามินซี, Polypodium leucotomos extract ฯลฯ”</p><p><img src="https://www.doctoryounger.com/img-uploads/3333.jpg" alt=""></p><p>นอกจากการดูแลผิวภายนอก การดูแลสุขภาพผิวจากภายในก็สำคัญไม่แพ้กัน หนุ่มๆ ควร ได้รับสารอาหารที่มีประโยชน์ ครบทั้ง 5 หมู่ พร้อมพักผ่อนให้เพียงพอ และดื่มน้ำสะอาดวันละ 8-10 แก้วต่อวัน</p><h3>ที่มา: Sanook</h3>'
