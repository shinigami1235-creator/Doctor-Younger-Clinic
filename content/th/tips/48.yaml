title: รู้ได้อย่างไร "ดื่มน้ำ" เพียงพอแล้วหรือยัง
date: 01 Oct 2017
source: Mirror.co.uk
body: '<p>เรามักได้ยินอยู่เสมอว่าควรดื่มน้ำอย่างน้อย 6-8 แก้วต่อวัน ซึ่งเท่ากับปริมาณ 1.2 ลิตร หรือ 1,200 มิลลิลิตร ขณะที่ปริมาณน้ำที่ควรบริโภคตามที่แพทย์แนะนำเพื่อสุขภาพที่ดีนั้นอยู่ที่ 2 ลิตรต่อวัน หรือ 2,000 มิลลิลิตร แต่ให้รวมถึงน้ำที่มาจากอาหาร หรือเครื่องดื่มต่างๆ ด้วย</p><p>นั่นหมายความว่าชาและกาแฟ ก็ถูกนับรวมเป็นน้ำที่ดื่มเข้าไปด้วย แม้ว่าจะมีคาเฟอีนอยู่ แต่ก็จะถูกขับออกทางปัสสาวะอยู่ดี เช่นเดียวกับน้ำผลไม้ และเครื่องดื่มน้ำอัดลมที่นับรวมด้วยเช่นกัน แต่ต้องระวังเรื่องปริมาณน้ำตาล และปริมาณแคลอรี่จากเครื่องดื่มเหล่านี้เป็นพิเศษ หากไม่อยากให้เกิดปัญหาสุขภาพอื่นๆ ตามมา</p><p><img src="https://www.doctoryounger.com/img-uploads/002.jpg" alt=""></p><p>ทั้งนี้สิ่งที่จะเป็นตัวชี้วัดหรือบอกเราได้ว่า ดื่มน้ำในแต่ละวันเพียงพอแล้วหรือยัง คือ "สีของปัสสาวะ" หากดื่มน้ำในปริมาณที่เพียงพอ สีของปัสสาวะจะเป็นสีเหลืองอ่อนๆ แต่ถ้าปัสสาวะเป็นสีเหลืองเข้ม นั่นหมายความว่า เราดื่มน้ำน้อยเกินไป</p><p>นอกจากนี้อาการเหนื่อยล้า ปวดศีรษะ และไม่ค่อยมีสมาธิในการทำงาน ก็เป็นสัญญาณเตือนด้วยเช่นกันว่า ร่างกายอยู่ในสภาวะที่เริ่มขาดน้ำแล้ว
  เพราะฉะนั้นควรจะหากระบอกน้ำไว้ติดตัวเสมอ เพื่อดื่มให้เพียงพอกับที่ร่างกายต้องการ</p><p><img src="https://www.doctoryounger.com/img-uploads/001.jpg" alt=""></p><p>ขณะที่การดื่มน้ำมากเกินไปก็ต้องระวังด้วยเหมือนกัน เพราะอาจทำให้เกิดภาวะ "น้ำเป็นพิษ" ได้ ซึ่งจะทำให้เกลือโซเดียมในเลือดต่ำกว่าระดับปกติ ส่งผลให้มีน้ำส่วนเกินคั่งค้างอยู่ในร่างกายมากเกินกว่าที่ขับออกได้</p><h3>ที่มา: Mirror.co.uk</h3>'
