title: ใบหน้าของชายที่โดนแสงแดดข้างเดียว 28 ปี แสงแดดทำร้ายมากกว่าที่คิด
date: 02 Feb 2018
source: Thestandard
body: '<ul><li>การที่ผิวหนังสัมผัสกับรังสี UVA เป็นเวลานานต่อเนื่อง จะเพิ่มความเสี่ยงเกิดภาวะแก่แดด (Dermatoheliosis) ในวัยชรา</li><li>Skincancer.org ระบุว่า รังสี UV ในแสงแดดที่ทะลุผ่านชั้นบรรยากาศลงมาถึงพื้นโลกจะมี UVA มากถึง 95%</li></ul><p>เมื่อเร็วๆ นี้เว็บไซต์ของ Independent สื่อชั้นนำของอังกฤษได้เผยแพร่รูปถ่ายของชายชราคนหนึ่งซึ่งมีผิวหน้าข้างซ้ายเหี่ยวย่นกว่าข้างขวา เพื่อย้ำเตือนถึงพิษภัยจากการสัมผัสกับรังสี UV ในแสงแดดเป็นเวลานาน โดยภาพดังกล่าวได้รับการตีพิมพ์ครั้งแรกในวารสารการแพทย์นิวอิงแลนด์ (New England Journal of Medicine) เมื่อปี 2012</p><p><img src="https://www.doctoryounger.com/img-uploads/121.jpg" alt=""></p><p>ชายในรูปมีอาชีพขับรถบรรทุกมานาน 28 ปี ส่งผลให้ใบหน้าข้างหนึ่งของเขาต้องสัมผัสกับแสงแดดต่อเนื่องเป็นเวลานาน และจากการศึกษาพบว่า ใบหน้าของเขาเกิดสิวผู้สูงอายุ (Favre-Racouchot syndrome) หรือ ภาวะแก่แดด (Dermatoheliosis) ซึ่งเป็นความผิดปกติของสิวหัวเปิดจำนวนมากที่เกิดจากการตากแดดเป็นเวลานาน</p><p>และในเคสของชายชราผู้นี้ถือเป็น Unilateral Dermatoheliosis หรือภาวะแก่แดดข้างเดียว
  เพราะตอนที่ขับรถ ใบหน้าข้างซ้ายของเขาจะสัมผัสกับรังสีอัลตร้าไวโอเลต เอ (UVA) ที่ทะลุผ่านกระจกรถและกระทบผิวหนังโดยตรง ขณะที่ใบหน้าข้างขวาไม่ถูกแดด ดังนั้นจึงไม่ได้รับอันตรายมากนัก</p><p><img src="https://www.doctoryounger.com/img-uploads/122.jpg" alt=""></p><p>อย่างที่ทราบกันว่ารังสี UVA สามารถทะลุก้อนเมฆ กระจก หน้าต่าง และผ่านเข้าสู่ผิวหนังกำพร้าและหนังแท้ของมนุษย์ได้ แตกต่างจากรังสี UVB ที่ไม่สามารถทะลุกระจก ดังนั้นเราจึงสามารถหลีกเลี่ยงรังสี UVB ที่มีช่วงคลื่นสั้นได้ง่าย แต่หลบรังสี UVA ได้ยากแม้จะอยู่ภายในอาคารก็ตาม และข่าวร้ายจาก Skincancer.org ก็คือ รังสี UV ในแสงแดดที่ทะลุผ่านชั้นบรรยากาศลงมาถึงพื้นผิวโลกจะมี UVA มากถึง 95% ส่วน UVB จะมีเพียง 5% เท่านั้น</p><p><img src="https://www.doctoryounger.com/img-uploads/123.jpg" alt=""></p><p>วารสารการแพทย์นิวอิงแลนด์ระบุด้วยว่า นอกจากริ้วรอยเหี่ยวย่นแล้ว การสัมผัสรังสี UVA เป็นเวลานาน ยังเพิ่มความเสี่ยงในการเป็นโรคมะเร็งผิวหนังอีกด้วย สำหรับชายชราผู้นี้ แม้ว่าจะเกิดภาวะแก่แดดข้างเดียวแล้ว แต่แพทย์ยังคงแนะนำให้เขาทาครีมกันแดดและใช้ยาทากลุ่มวิตามินเออยู่เสมอ
  นอกจากนี้ยังแนะนำให้เขาไปตรวจสุขภาพเป็นประจำเพื่อเฝ้าระวังมะเร็งผิวหนังอีกด้วย</p><p>แล้วคุณล่ะ ก่อนออกจากบ้านทาครีมกันแดดหรือยัง?</p><h3>ที่มา: Thestandard</h3>'
