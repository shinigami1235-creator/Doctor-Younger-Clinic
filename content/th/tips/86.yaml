title: มาสก์หน้าด้วยไข่ขาวกับ 7 ประโยชน์ดี๊ดี ที่รู้แล้วคุณจะปลื้ม
date: 13 Mar 2018
source: Kapook
body: '<p>หากถามว่าสูตรมาสก์หน้าสูตรไหนที่สาวๆ นิยมทำกันมากที่สุด คำตอบส่วนใหญ่คงจะไม่พ้นบอกกันเป็นเสียงเดียวว่า "สูตรมาสก์หน้าด้วยไข่ขาว" อย่างแน่นอน เพราะเป็นวัตถุดิบที่สามารถหาได้ง่าย ๆ จากในครัว และทุกบ้านจะต้องมี อีกทั้งยังประหยัดและสามารถทำได้ง่ายๆ ไม่ว่าจะพอกหน้าด้วยไข่ขาวเพียวๆ หรือจะนำมาผสมกับส่วนประกอบอื่นๆ อย่างน้ำผึ้ง มะนาว นมสด แตงกวา ข้าวโอ๊ต และอีกสารพัด วันนี้จะมาบอกถึงประโยชน์ของการมาสก์หน้าด้วยไข่ขาวกันค่ะ ว่าทำแล้วจะดีอย่างไร ช่วยอะไรได้บ้าง บอกเลยถ้ารู้แล้วคุณจะยิ่งหลงรักการมาสก์หน้าด้วยไข่ขาวมากขึ้นอย่างแน่นอน ไปดูกันเลย</p><h3>1. ช่วยลดความมันบนใบหน้า และกระชับรูขุมขนให้เล็กลง</h3><p>สาวๆ คนไหนมีปัญหาหน้ามันอันเกิดจากต่อมน้ำมันใต้ผิวหนังผลิตน้ำมันออกมามากจนเกินไป ส่งผลให้มีปัญหารูขุมขนกว้างตามมา สามารถใช้ไข่ขาวช่วยแก้ปัญหานี้ได้ค่ะ เพียงแค่นำไข่ขาวมาพอกหน้าเป็นประจำ ครั้งละประมาณ 5-10 นาที แล้วล้างออกให้สะอาดด้วยน้ำเย็น หากทำบ่อยๆ ความมันบนใบหน้าจะค่อยๆ ลดน้อยลง รวมไปถึงช่วยให้รูขุมขนค่อยๆ เล็กลงตามไปด้วย</p><p><img src="https://www.doctoryounger.com/img-uploads/2.jpg"
  alt=""></p><h3>2. ช่วยลดฝ้า กระ รอยสิว และจุดด่างดำให้จางลง</h3><p>ฝ้า กระ รอยสิว และจุดด่างดำ ถือเป็นศัตรูทำลายผิวที่สาวๆ ร้องยี้ และหาวิธีแก้ปัญหาไม่ตก แต่บอกเลยว่าวิธีนี้ช่วยได้ค่ะ เพียงแค่นำไข่ขาวมาผสมกับน้ำมะนาวเล็กน้อย คนให้เข้ากันแล้วนำมาพอกหน้าทิ้งไว้ประมาณครึ่งชั่วโมง เสร็จแล้วล้างออกให้สะอาด ทำอย่างน้อยสัปดาห์ละ 1-2 ครั้ง ทั้งรอยสิว จุดด่างดำ รวมไปถึงฝ้าและกระก็จะค่อยๆ จางลงอย่างเป็นธรรมชาติ จนหายไปในที่สุด</p><h3>3. ช่วยปราบสิวเสี้ยน</h3><p>ไข่ขาวนี่แหละตัวช่วยลดสิวเสี้ยนได้เป็นอย่างดี เพียงแค่นำไข่ขาวมาผสมกับน้ำมะนาวเล็กน้อย จากนั้นให้นำสำลีแผ่นบางๆ มาชุบแล้วนำมาแปะบริเวณใบหน้าที่มีสิวเสี้ยน เสร็จแล้วปล่อยทิ้งไว้ เมื่อไข่ขาวเริ่มแห้งให้ค่อยๆ ลอกแผ่นสำลีออก โดยลอกจากล่างขึ้นบน วิธีนี้หากสาวๆ หมั่นทำเป็นประจำสิวเสี้ยนที่เคยมีก็จะค่อยๆ ลดน้อยลงอย่างเห็นได้ชัด และจะช่วยให้ผิวหน้าเรียบเนียนขึ้นอีกด้วย</p><h3>4. ช่วยให้ผิวขาวกระจ่างใส</h3><p>เนื่องจากไข่ขาวมีโปรตีนสูงมาก จึงทำให้ผิวสามารถสร้างเซลล์ผิวใหม่ได้ดี ส่งผลให้ผิวดูขาวกระจ่างใสขึ้นได้ และยิ่งถ้ามาสก์หน้าด้วยไข่ขาวผสมกับน้ำมะนาวเป็นประจำ
  ผิวก็จะยิ่งดูขาวใสมากขึ้นกว่าเดิม เพราะนอกจากประโยชน์จากไข่ขาวดังที่กล่าวไปแล้ว กรด AHA จากน้ำมะนาวยังจะช่วยกระตุ้นการผลัดเซลล์ผิว ทำให้ผิวที่หมองคล้ำ สามารถกลับมาดูขาวขึ้นได้ในเร็ววันอีกด้วย</p><p><img src="https://www.doctoryounger.com/img-uploads/1.jpg" alt=""></p><h3>5. ช่วยให้ผิวดูอ่อนเยาว์</h3><p>ในไข่ขาวนอกจากจะมีโปรตีนสูงแล้ว ยังมีวิตามินเอสูงอีกด้วย ซึ่งวิตามินเอนี่แหละที่จะช่วยลดเลือนริ้วรอยต่าง ๆ บนใบหน้าได้ดี เพียงแค่บำรุงผิวหน้าด้วยไข่ขาวเป็นประจำด้วยการพอกหน้าทิ้งไว้ครั้งละประมาณ 5-10 นาที แล้วล้างออก นอกจากไข่ขาวจะช่วยกำจัดสิ่งสกปรกตกค้างแล้ว ยังจะช่วยทำให้ผิวหน้าดูเต่งตึง ริ้วรอยลดลง และดูอ่อนเยาว์มากขึ้นด้วย</p><h3>6. ช่วยดีท็อกซ์ผิว</h3><p>ในแต่ละวันผิวหน้าของเราต้องเผชิญทั้งมลภาวะ ฝุ่นควัน และไหนจะเครื่องสำอางที่ใช้ ซึ่งอาจจะทำให้มีสิ่งสกปรกและสารเคมีตกค้าง อันเป็นสาเหตุที่ทำให้เกิดปัญหาผิวอื่นๆ ตามมา ดังนั้นในแต่ละสัปดาห์สาวๆ จึงควรดีท็อกซ์ผิวเพื่อคืนสมดุลให้กับผิวกันบ้าง โดยไข่ขาวสามารถช่วยได้ค่ะ เพียงแค่พอกหน้าด้วยไข่ขาวทิ้งไว้ 1 คืน ทั้งสารเคมีจากเครื่องสำอางและมลภาวะ
  สิ่งสกปรกต่างๆ ที่ตกค้างก็จะถูกไข่ขาวดูดซับออกไป ทำให้ผิวหน้ากลับมาสมดุลเหมือนเดิม สำหรับวิธีนี้สามารถใช้ก่อนเปลี่ยนครีมตัวใหม่ได้อีกด้วยนะคะ ซึ่งจะช่วยทำให้ผิวสามารถรับการบำรุงจากครีมตัวใหม่ได้อย่างมีประสิทธิภาพมากขึ้นด้วย</p><p><img src="https://www.doctoryounger.com/img-uploads/3.jpg" alt=""></p><h3>7. ช่วยให้ผิวแข็งแรงและลดอาการแพ้</h3><p>สาวๆ คนไหนที่มีปัญหาผิวแพ้ง่าย มีผดผื่นขึ้นผิวหน้าบ่อยๆ ให้นำไข่ขาวมาทาให้ทั่วผิวหน้า พอกทิ้งไว้ประมาณ 10-15 นาที แล้วล้างออก ทำเป็นประจำทุกวันต่อเนื่องกันประมาณ 3-4 สัปดาห์ ผิวหน้าของคุณจะค่อยๆ แข็งแรงขึ้น รวมไปถึงผื่นแพ้ต่างๆ ก็จะหายไป และอาการแพ้ง่ายก็จะลดลงอีกด้วย</p><p>ว้าวมาสก์หน้าด้วยไข่ขาวมันดีอย่างนี้นี่เอง เห็นประโยชน์ดีๆ แบบนี้แล้วบอกเลยว่าถ้าหากคุณสาวๆ คิดจะพอกหน้าในครั้งต่อไปแล้วละก็ ไข่ขาวถือเป็นตัวเลือกอันดับแรกๆ ที่คุณจะพลาดไม่ได้เลยล่ะค่ะ</p><h3>ที่มา: Kapook</h3>'
