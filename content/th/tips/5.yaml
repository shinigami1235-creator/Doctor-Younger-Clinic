title: 13 เทคนิคพิชิตอากาศร้อน เอาตัวรอดช่วงซัมเมอร์
date: 20 Mar 2017
source: Kapook
body: '<p>วิธีดูแลสุขภาพในช่วงหน้าร้อน ป้องกันโรคที่มากับหน้าร้อน ไม่ให้ล้มหมอนนอนเสื่อในช่วงซัมเมอร์ ย่างก้าวเข้าเดือนเมษายน เข้าสู่หน้าร้อนของประเทศไทยอย่างเต็มตัว มีการคาดการณ์ว่าในปีนี้เดือนเมษายนจะเป็นเดือนที่อากาศร้อนที่สุดของปี และอาจมีอุณหภูมิสูงถึง 43 องศาเซลเซียส ซึ่งอากาศร้อนจัดนี่แหละค่ะ จะทำให้ร่างกายของเราทรุดลงหรือเจ็บป่วยได้ง่าย ถ้าเพื่อนๆ ไม่อยากหมดสนุกในช่วงหน้าร้อน ก็มาดู 13 เทคนิคการดูแลสุขภาพสู่หน้าร้อนพร้อมวิธีคลายร้อนที่ สสส. รวบรวมมาฝากกันค่ะ</p><p><img src="https://www.doctoryounger.com/img-uploads/000.jpg" alt=""></p><h3>1. ดื่มน้ำให้เพียงพอ </h3><p>ควรมีแก้วหรือขวดน้ำวางไว้ข้างกาย โดยดื่มทีละน้อยๆ และควรเป็นน้ำอุณหภูมิห้อง</p><h3>2. กินของสุกใหม่ </h3><p>เพราะอากาศร้อน เหมาะแก่การเติบโตของเชื้อโรคบางชนิด โดยเฉพาะเชื้อแบคทีเรีย ดังนั้นถ้าเป็นไปได้อย่ากินอาหารที่ค้างคืน หรือสุกๆ ดิบๆ</p><h3>3. ใส่เสื้อผ้าเนื้อบาง</h3><p>เนื่องจากอากาศร้อน เหงื่อออกง่าย เพื่อปรับอุณหภูมิในร่างกายให้อยู่ในระดับปกติ ดังนั้นการใส่เสื้อผ้าบางเบาและสีอ่อน จะทำให้ลมพัดผ่าน ระบายความร้อนออกได้ดี</p><h3>4.
  อยู่ในห้องที่มีอุณหภูมิปกติ </h3><p>พยายามอย่าเปิดแอร์ต่างจากอุณหภูมิข้างนอกมากเกินไป อาจจะทำให้เจ็บป่วยง่าย เพราะลมจากแอร์ จะทำให้อากาศแห้งจนทางเดินหายใจอักเสบได้</p><h3>5. เข้านอนแต่หัวค่ำ </h3><p>ฤดูร้อนจะมีกลางวันยาวนานกว่ากลางคืน จึงต้องนอนหลับให้เพียงพอ เพื่อให้ร่างกายได้ซ่อมแซมตัวเองหลังสูญเสียเหงื่อและพลังงานทั้งวัน</p><p><img src="https://www.doctoryounger.com/img-uploads/Untitled-2.jpg" alt=""></p><h3>6. ทาครีมกันแดด </h3><p>แสงแดดเป็นตัวการที่สำคัญในการทำลายผิวหนัง ทำให้ผิวไหม้ คล้ำ เกิดริ้วรอย และอาจเป็นปัจจัยที่เพิ่มความเสี่ยงของการเป็นมะเร็งผิวหนัง แม้ใส่เสื้อแขนยาว ไม่ได้ออกจากบ้าน ก็ควรทาครีมป้องกันไว้ดีที่สุด</p><h3>7. แป้งเย็น/สเปรย์คลายร้อน </h3><p>เป็นอีกหนึ่งทางเลือกอันดับต้นๆ เนื่องจากมีราคาที่ไม่แพงจนเกินไปและใช้ง่าย ช่วยให้เย็นสบายสร้างความสดชื่นได้ทั้งวัน</p><h3>8. ยาดม ยาหม่อง </h3><p>พกไว้ก็ไม่เสียหาย เพื่อไว้ป้องกันหรือใช้หากเกิดอาการวิงเวียนศีรษะ</p><h3>9. อุปกรณ์กันแดดต่างๆ </h3><p>ไม่ว่าจะเป็นร่ม เสื้อแขนยาว แว่นตาดำ หมวก พัด ยางมัดผม เป็นต้น มีติดตัวไว้สักนิดอย่าเขินอายหากใครมองว่าแต่งตัวเยอะเหมือนอยู่เมืองทะเลทราย
  เพราะร่างกายของเราต้องปกป้องอย่างดีที่สุด</p><h3>10. ลดของหวาน </h3><p>เนื่องจากอาหารที่มีน้ำตาลสูง เมื่อกินเข้าไป จะส่งผลให้ร่างกายเพิ่มการเผาผลาญ จนทำให้อุณหภูมิในร่างกายสูงขึ้น ควรกินแต่พอเหมาะพอดี</p><p><img src="https://www.doctoryounger.com/img-uploads/Untitled-1.jpg" alt=""></p><h3>11. งดดื่มแอลกอฮอล์ </h3><p>เพราะอากาศร้อนทำให้แอลกอฮอล์ซึมเข้ากระแสเลือดเร็วมากขึ้น จนอาจทำให้เกิดอาการช็อกได้</p><h3>12. ให้อากาศภายในบ้านถ่ายเท </h3><p>โดยเปิดประตู หน้าต่างภายในบ้าน เพื่อให้ลมสามารถถ่ายเทได้สะดวก แนะนำควรจัดบ้านให้โล่งๆ และเลือกใช้สีโทนเย็น เช่น สีเขียว สีขาว สีฟ้า หรือสีพาสเทล จะช่วยเพิ่มความรู้สึกเย็นสบายมากขึ้น</p><h3>13. อย่าออกกำลังกายหักโหม </h3><p>การออกกำลังกายเป็นสิ่งที่ดี แต่ควรออกให้เหมาะสมอย่าหนักจนเกินไป และควรเลือกออกในช่วงเช้าหรือช่วงเย็น เพื่อเป็นการหลบเลี่ยงแสงแดด</p><p>ดูแลตนเองแล้วก็อย่าลืมดูแลคนข้างๆ โดยเฉพาะกับเด็กและผู้สูงอายุที่เราต้องดูแลเป็นพิเศษ ที่สำคัญนอกจากทำตาม 13 ข้อข้างบนแล้ว ก็อย่าลืมยึดหลักปฏิบัติในชีวิตประจำวันง่ายๆ ที่ สสส. เคยบอกไว้ว่า "กินร้อน
  ใช้ช้อนกลาง ล้างมือ" แค่นี้หน้าร้อนก็จะไม่น่ากลัวสำหรับเราอีกต่อไปแล้วค่ะ </p><h3>ที่มา: Kapook</h3>'
