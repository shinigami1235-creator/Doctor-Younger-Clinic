title: หน้าสด ก็สวยได้ 5 เทคนิคง่ายๆ ไม่ต้องโบ๊ะเครื่องสำอางตลอดเวลา
date: 08 Aug 2017
source: Mthai
body: '<p>จริงอยู่ที่โบราณว่าไว้ ไก่งามเพราะขน คนงามเพราะแต่ง เกิดเป็นผู้หญิงก็ต้องแต่งหน้า แต่งตัว จะได้ดูดี มีเสน่ห์ แต่ก็อย่างว่าแหละคุณขา บางครั้งถ้าเลือกได้ ก็อยากจะสวยแบบใสๆ ไม่ต้องแต่งหน้าดูบ้าง แต่ครั้นจะให้หน้าสด แบบล้วนๆ ไม่มีอะไรแต่งแต้มเลยก็กลัวคนอื่นๆ จะแตกตื่นตกใจ งั้นลองมาดูเทคนิคกันหน่อยดีกว่า จะได้สวยแบบใสๆ เหมือนคนอื่นบ้าง</p><h3>1. แต่งคิ้วและดัดขนตาแบบเจลใส</h3><p>นี่ไม่ได้แนะนำให้แต่งหน้านะคะ แต่แนะนำให้แต่งคิ้ว และขนตา โดยเฉพาะคิ้ว ที่เป็นเหมือนมงกุฏของใบหน้า อย่าได้ปล่อยให้คิ้วรกรุงรังเชียวนะ ควรกันคิ้วให้ได้ทรงสวย สำหรับคนที่คิ้วบาง แนะนำให้ลองทาน้ำมันละหุ่งที่คิ้วดู จะช่วยให้คิ้วดกดำขึ้น หลังจากที่คิ้วสวยแล้ว ก็มาในส่วนของดวงตา ควรดัดขนตาให้งอนงาม และใช้มาสคาร่าแบบเจลใส ปัดตามไปอีกที แค่นี้หน้าสดก็สวยได้แล้ว</p><h3>2. บำรุงเส้นผมสม่ำเสมอ</h3><p>ไม่ว่าคุณจะทำสีผมหรือไม่ทำ ก็ควรบำรุงผมให้ดูสุขภาพดีอยู่เสมอ ตัดเล็มปลายผมบ้าง หมักผมบ้าง อะไรก็แล้วแต่ที่จะทำให้ผมคุณดูสวย จงทำซะ เพราะจะช่วยเสริมให้มีบุคลิกภาพ และทำให้หน้าของคุณน่ามองมากขึ้น</p><p><img src="https://www.doctoryounger.com/img-uploads/Untitled-1.jpg"
  alt=""></p><h3>3. ฟันต้องขาว</h3><p>ยิ้มของคนเรา ทำให้โลกสดใสได้จริงๆ นะ จงเพิ่มความมั่นใจให้ตัวเอง ด้วยการดูแลสุขภาพช่องฟันให้ดีๆ ฟอกสีฟัน ขูดหินปูน ดูบ้าง อย่าปล่อยให้ฟันเหลือง แล้วก็ระวังเรื่องชา กาแฟ เพราะมีส่วนทำให้ฟันเหลืองสุดๆ</p><h3>4. ดูแลผิวหน้า และครีมกันแดดอย่าให้ขาด</h3><p>อยากมี หน้าสด ที่สวยเป็นธรรมชาติ ก็ต้องดูแลผิวหน้าให้ดี ไม่ว่าจะเป็นครีมบำรุง หรือโฟมล้างหน้า เลือกให้เหมาะกับสภาพผิว มาส์กหน้าบ้าง สัปดาห์ละครั้งก็ยังดี หรือจะทาด้วยน้ำมันมะพร้าวก็เริ่ดไม่แพ้กัน ตื่นมาหน้านิ่มสุดๆ และที่ขาดไม่ได้ ห้ามละเลยเด็ดขาด นั่นก็คือครีมกันแดด ทาไปเถอะ แม้ว่าคุณจะทำงานอยู่ในห้องแอร์ แต่อันตรายจากแสงยูวี มีรอบตัว อย่าได้ชะล่าใจ หน้าแก่ก่อนวัยไม่รู้ด้วยนะ</p><h3>5. พักผ่อนให้เพียงพอ</h3><p>ดูเหมือนจะเป็นข้อที่ดูนางเอกที่สุด แต่เป็นสิ่งสำคัญที่ควรทำมากที่สุด แม้ว่าคุณจะประโคมครีมบำรุงมากแค่ไหน แต่ถ้าขาดการพักผ่อนที่เพียงพอ ก็ไม่มีประโยชน์อะไร นอนให้เต็มอิ่ม อย่างน้อย 6-8 ชั่วโมง ตื่นมาหน้าคุณก็จะสดใส ไม่หมองคล้ำแน่นอน</p><h3>ที่มา: Mthai</h3>'
