title: 14 เคล็ดลับความอ่อนเยาว์ ไลฟ์สไตล์ที่ควรเปลี่ยนแปลง
date: 18 Dec 2017
source: www.health-th.com
body: '<p>คุณไม่สามารถหยุดเวลาได้ แต่คุณสามารถย้อนเข็มนาฬิกากลับไปมีเส้นผม มือ และผิวพรรณที่ดูอ่อนเยาว์ได้ โดยไม่ต้องเข้ารับการผ่าตัดศัลยกรรม ทำทรีตเม้นต์ ตลอดจนใช้ครีมและซีรั่มเป็นตะกร้าด้วย สิ่งที่คุณต้องทำก็แค่พิจารณาพฤติกรรมบางอย่างและปรับเปลี่ยนเป็นประจำเพื่อช่วยต่อต้านริ้วรอยแห่งวัยนั่นเอง</p><h3>1. เลี่ยงการจัดแต่งทรงผมด้วยความร้อน</h3><p>เส้นผมอ่อนเยาว์ดูสุขสภาพดีจะสปริงตัวและเงางาม แต่การใช้เครื่องหนีบผม แกนม้วนผม หรือไดร์เป่าผมก็อาจทำให้ผมลีบแบนไม่มีชีวิตชีวา ยิ่งทำให้คุณดูแก่กว่าวัยด้วย Francesca J. Fusco ผู้ช่วยศาสตราจารย์คลินิกโรคผิวหนังที่ Icahn School of Medicine แห่ง Mount Sinai ได้กล่าวว่า “ผมได้พบเจอกับเส้นผมที่เสียหายและหักขาดจากผู้หญิงจำนวนมากที่ใช้เครื่องมือจัดแต่งทรงผมด้วยความร้อน”</p><p><strong>ย้อนความอ่อนเยาว์ :</strong> ให้เส้นผมของคุณได้พักผ่อนบ้างแค่ทำตามคำแนะนำของ Dr. Fusco โดยในแต่ละสัปดาห์ ควรพักเส้นผมจากการจัดแต่งโดยใช้เครื่องมือร้อนๆ เหล่านี้ แล้วปล่อยให้ผมแห้งด้วยลมธรรมชาติ หรือเว้นระยะการสระผมออกไปแล้วเลือกใช้ Dry Shampoo แทน</p><h3>2. ทาครีมกันแดดทุกวัน</h3><p>แพทย์ผิวหนังจะแนะนำให้เราใช้ครีมกันแดดทุกวันเพื่อป้องกันมะเร็วผิวหนัง
  แต่การใช้ครีมกันแดดที่มี SPF ยังเป็นอาวุธที่มีประสิทธิภาพในการป้องกันริ้วรอยแห่งวัยได้ด้วย ผลการศึกษาในปี 2013 ในวารสาร Internal Medicine ซึ่งติดตามผลมากว่า 4 ปีครึ่ง พบว่าผู้ที่ใช้ครีมกันแดด SPF สัปดาห์ละ 3-4 วันมีโอกาสน้อยกว่าที่ผิวจะแก่กว่าวัย เมื่อเทียบกับคนที่ใช้ครีมกันแดดตามอำเภอใจ</p><p><strong>ย้อนความอ่อนเยาว์ : </strong>ครีมกันแดดที่แพทย์ผิวหนังแนะนำ จะมีค่า SPF 30 เป็นมาตรฐาน ควรทาให้ทุกวันไม่ว่าฝนจะตกหรือแดดจะออก และทาเพิ่มได้หากต้องการ คนส่วนมากแล้วจะใช้แค่หนึ่งในสี่ของปริมาณที่แนะนำเท่านั้น ซึ่งสถาบันโรคผิวหนังแห่งสหรัฐอเมริกาได้แนะนำว่า กฎของการทาครีมกันแดดคือ ต้องบีบออกมาทาปริมาณ 2 ช้อนโต๊ะทุกๆ ครั้ง</p><h3>3. ทาโลชั่นบนมือของคุณด้วย</h3><p>ผิวบริเวณหลังมือบอบบางมาก ซึ่งบริเวณนี้มีแนวโน้มจะเกิดริ้วรอยดูแก่กว่าวัยได้มากกว่าเมื่อเทียบกับส่วนอื่นของร่างกาย และเมื่ออากาศแห้งก็จะถูกดึงความชุ่มชื้นออกไป ผิวมือคุณจะดูแก่กว่าที่ควรจะเป็น การใช้โลชั่นช่วยได้ เลือกชนิดที่ผสมครีมกันแดดด้วย ซึ่ง Dr. Fusco ได้แนะนำว่า “มันจะช่วยลดความเสียหายจากแสงอาทิตย์ ซึ่งเป็นสาเหตุของจุดด่างดำและริ้วรอยเหี่ยวย่น”</p><p><strong>ย้อนความอ่อนเยาว์
  :</strong> ทาครีมกันแดด SPF 30 ลงบนหลังมือคุณทุกเช้า</p><h3>4. หลีกเลี่ยงอาหารที่ทำให้ฟันเป็นคราบ</h3><p>ฟันขาวๆ เป็นสัญญาณของสุขภาพและความเยาว์วัย Emanuel Layliev ทันตแพทย์แห่งศูนย์ทันตกรรมนิวยอร์คเซนเตอร์ ได้กล่าวอีกว่า อาหารที่มีสีเข้ม ร้อน เหนียวหนืด อย่างเช่นซอสบาร์บีคิวหรือซอสถั่วเหลือง เป็นแหล่งของคราบสกปรกที่ร้ายกาจ รวมไปถึงไวน์แดง กาแฟ และโคล่าก็ทำให้เกิดคราบได้ไม่แพ้กันด้วย</p><p><strong>ย้อนความอ่อนเยาว์ : </strong>การป้องกันคราบบนผิวฟันนั้นง่ายและอร่อยด้วย แค่เปลี่ยนจากซอสบาร์บีคิวราดอกไก่เป็นซอสอื่นแทน เช่น อาจจะราดด้วยซัลซามะม่วงหรือสมุนไพรสด เลิกกินน้ำอัดลมสีเข้มๆ แล้วดื่มโซดาเปล่าแทน (คุณไม่ควรดื่มน้ำอัดลมเลยด้วยซ้ำแม้จะเป็นแบบไดเอ็ตก็ตาม)</p><p><img src="https://www.doctoryounger.com/img-uploads/22.jpg" alt=""></p><h3>5. ทาสีเล็บของคุณ</h3><p>ส่วนของร่างกายที่เปิดเผยอายุจริงออกมาได้มากที่สุดไม่ใช่ใบหน้า แต่คือมือของคุณนั่นเอง อ้างอิงจากการศึกษาของ American Society of Plastic Surgeons สมาคมศัลยกรรมพลาสติกแห่งสหรัฐอเมริกาได้บอกว่า เทคนิคหนึ่งในการหลอกผู้อื่นว่าคุณอ่อนเยาว์กว่าอายุจริงก็คือ
  การทาเล็บ พร้อมกับการสวมเครื่องประดับ การทาเล็บช่วงเบี่ยงเบนความสนใจจากผิวพรรณที่ไม่สมบูรณ์หรือเหี่ยวย่นได้</p><p><strong>ย้อนความอ่อนเยาว์ :</strong> Lynette Cenée สไตล์ลิชมืออาชีพในเบเวอร์ลีฮิลส์ได้แนะนำว่า หากต้องการทำเล็บให้ดูอ่อนกว่าวัย ให้เลือกใช้โทนสีที่ดูระยิบระยับ (อย่างสีม่วงเข้มหรือสีแดง) มันจะให้สีที่โดดเด่นแต่ไม่เข้มหรือแรงเกินไปนัก</p><h3>6. ออกกำลังกายเป็นประจำ</h3><p>Dr. Fusco กล่าวว่า “การออกกำลังกายช่วยเพิ่มการหมุนเวียนโลหิต ซึ่งช่วยให้ผิวดูเปล่งปลั่งมากขึ้น” (และยังช่วยลดการเกิดถุงใต้ตาด้วย) นอกจากนี้จากการศึกษาจากมหาวิทยาลัย McMaster ในแคนาดา ยังพบว่าการออกกำลังกายยังช่วยย้อนเวลาให้ดูผิวพรรณอ่อนเยาว์ได้ เมื่อคุณมีรูปร่างได้สัดส่วน คุณก็จะดูเด็กลง</p><p><strong>ย้อนความอ่อนเยาว์ :</strong> หาเวลาออกกำลังกายให้ได้ทุกวัน วันละ 30 นาที แล้วทำให้มันกลายเป็นกิจวัตรที่คุณขาดไม่ได้</p><h3>7. ระมัดระวังการบริโภคโซเดียม</h3><p>การทานอาหารที่มีรสเค็มทำให้ร่างกายขาดน้ำ โดยจะสังเกตุได้ง่ายบริเวณที่ผิวอ่อนนุ่มอย่างบริเวณใต้ตา</p><p><strong>ย้อนความอ่อนเยาว์ :</strong> สังเกตดูว่าอาหารที่คุณกินมีโซเดียมซ่อนอยู่หรือเปล่า
  ทั้งเกลือที่มีอยู่ในอาหารแทบทุกชนิด, ขนมปัง, ซีเรียล, เครื่องปรุงรส, ซอส, เนื้อสัตว์ปรุงสำเร็จ รวมไปถึงขนมอบทั้งหลายก็เต็มไปด้วยโซเดียม</p><h3>8. พยายามควบคุมสรีระในขณะใช้สมาร์ทโฟน</h3><p>ยิ่งคุณใช้งานส่งข้อความหรือเลื่อนหน้าจอเฟซบุ๊กไปนานๆ ก็จะยิ่งทำให้คอคุณก้มลงๆ ไปเรื่อยๆ ทำให้เกิดริ้วรอยขึ้นได้ง่าย ซึ่ง Dr. Fusco ได้บอกว่าทุกการเคลื่อนไหวที่ทำซ้ำๆ จะสร้างริ้วรอยให้เกิดขึ้นได้</p><p><strong>ย้อนความอ่อนเยาว์ :</strong> ให้นึกถึงที่ๆ คุณมักจะนั่งส่งข้อความมากที่สุดทั้งในออฟฟิศหรือบนโซฟา ให้แขวนรูปภาพ (รูปครอบครัว, เพื่อน หรือสถานที่อื่นๆ) ไว้ใกล้ๆ ในระดับสายตา เพื่อเตือนให้คุณเงยหน้าขึ้นบ่อยๆ เวลาใช้งานสมาร์ทโฟน</p><h3>9. บ้วนปากทุกวัน</h3><p>หากคุณเป็นคนที่บ้วนปากทุกวันอยู่แล้วก็นับว่าคุณมาถูกทาง น้ำยาบ้วนปากเหล่านี้จะช่วยฆ่าเชื้อแบคทีเรีย และนำพาเอาเศษอาหารในซอกฟันออกมา รวมทั้งยังช่วยทำความสะอาดเหงือกได้ด้วย ซึ่งผลก็คือจะช่วยให้ฟันสะอาด ปราศจากคราบเหลือง เหงือกเป็นสีชมพูมากขึ้น (หากเป็นสีแดง เป็นสัญญาณของโรคเหงือก) Dr. Layliev กล่าวไว้</p><p><strong>ย้อนความอ่อนเยาว์ :</strong> บ้วนปากด้วยน้ำยาบ้วนปากที่ปราศจากแอลกอฮอล์และการย้อมสีใดๆ
  หลังมื้ออาหาร</p><p><img src="https://www.doctoryounger.com/img-uploads/44.jpg" alt=""></p><h3>10. กินอาหารที่มีโปรตีนสูง</h3><p>เมื่อคุณอยากให้เส้นผมดูหนาสุขภาพดี ก็ต้องเริ่มจากพื้นฐานก่อน และนั่นหมายถึงการกินอาหารที่มีโปรตีนซึ่งช่วยในกระบวนการสร้างเส้นผม สารอาหารจะช่วยสร้างแกนเส้นผมที่แข็งแรงได้ นายแพทย์ Kevin Pinski แพทย์ผิวหนังประจำสถาบันผิวหนังและศัลยกรรม Pinski ในชิคาโก้ได้กล่าวไว้</p><p><strong>ย้อนความอ่อนเยาว์ : </strong>ผู้หญิงทุกคนควรทานโปรตีนให้ได้ 46 กรัมต่อวัน (และต้องทานให้มากขึ้นหากอยู่ในช่วงตั้งครรภ์, ให้นมบุตร หรือเป็นนักกีฬา) เปรียบเทียบง่ายๆ ก็คือ เท่ากับปลาแซลมอน 3 ออนซ์ จะให้โปรตีน 22 กรัม ในขณะที่นมไขมันต่ำ 1 แก้ว จะมีโปรตีน 8 กรัม</p><h3>11. ดูแลผมเปียกให้ดี</h3><p>ถ้าคุณหลีกเลี่ยงการใช้ความร้อนจัดทรงก็แล้ว หรือทานโปรตีนเพิ่มก็แล้ว แต่เส้นผมก็ยังลีบแบนและบางอยู่ อาจเกิดจากการดูแลผมหลังสระไม่ถูกวิธีก็เป็นได้ การหวีผมขณะที่กำลังเปียก จะทำให้แกนเส้นผมยิ่งอ่อนแอ และเป็นสาเหตุให้ผมแตกปลาย ชี้ฟู และจัดทรงได้ยาก</p><p><strong>ย้อนความอ่อนเยาว์ :</strong> อย่าหวีผมตอนเปียก
  เมื่อสระผมเสร็จแล้วให้ใช้หวีซี่ห่างและปลายมนค่อยๆ สางเบาๆ Dr. Pinski แนะนำ</p><h3>12. ทานผักใบเขียว</h3><p>ผักใบเขียวทำหน้าที่เป็นแปรงสีฟันตามธรรมชาติ Dr. Layliev กล่าวว่า “ผักที่มีเส้นใยจำนวนมากอย่างผักโขม, ผักกาดหอม และบรอกโคลี ช่วยทำความสะอาดฟันได้” โดยเส้นใยเหล่านี้จะช่วยกำจัดหินปูนจากอาหารเหนียวๆ ทั้งหลัง (แน่ล่ะ แม้คุณจะแปรงฟันทุกเช้ารวมทั้งใช้ไหมขัดฟันทุกวันด้วย) นอกจากนี้ อาหารที่มีผักเยอะๆ ยังช่วยให้ผิวพรรณดีขึ้น ซึ่งจากผลการศึกษาพบว่าผู้ที่ทานอาหารที่มีแคโรทีนอยด์ 3 ส่วน (ซึ่งพบได้มากในผักใบเขียว และบรอกโคลี) จะมีสุขภาพที่ดีกว่า และสีผิวยังดูสม่ำเสมอเรียบเนียบน่ามองกว่าด้วย</p><p><strong>ย้อนความอ่อนเยาว์ :</strong> กระทรวงเกษตรของสหรัฐอเมริกาแนะนำว่า ควรทานผักอย่างน้อยครึ่งหนึ่งของอาหารในแต่ละมื้อ จะช่วยให้คุณได้รับสารอาหารจากผักถึง 2.5 ถ้วย ซึ่งเป็นปริมาณที่แนะนำสำหรับผู้หญิงที่มีอายุน้อยกว่า 50 ปี</p><h3>13. จัดการกับความเครียด</h3><p>จากรายงานของวารสารการสัมมนาแพทย์ผิวหนังและศัลยกรรม ได้กล่าวไว้ว่าความเครียดไม่ได้แค่ทำให้คุณรู้สึกแย่ภายในเท่านั้น แต่มันยังแสดงผลออกมาภายนอกด้วย
  มันทำให้ผิวเกิดการอักเสบรุนแรง ซึ่งเป็นสาเหตุของโรคสะเก็ดเงิน, สิว และแผลเปื่อยเน่าได้</p><p><strong>ย้อนความอ่อนเยาว์ :</strong> นักวิจัยได้บันทึกเอาไว้ว่า สังคมภายนอกมีบทบาทสำคัญกับระดับของความเครียด ดังนั้นเราจึงควรแวดล้อมด้วยเพื่อนฝูงและคนที่เป็นมิตร รวมทั้งยังต้องศึกษาเทคนิคการหายใจ หรือการจดบันทึกเพื่อระบายความเครียดด้วย</p><p><img src="https://www.doctoryounger.com/img-uploads/33.jpg" alt=""></p><h3>14. นอนหลับให้เพียงพอ</h3><p>Dr. Pinski ได้กล่าว่า “ในระหว่างที่กำลังนอนหลับ ร่างกายจะผลิตฮอร์โมนเอสโตรเจนและโพรเจสเทอโรนออกมาจำนวนมาก ซึ่งจะช่วยให้ผิวพรรณของคุณฟื้นฟูตัวเอง ทำให้ผิวดูเปล่งประกายเมื่อคุณตื่นขึ้น โดยฮอร์โมนเหล่านี้จะช่วยป้องกันสิวได้อีกด้วย”</p><p><strong>ย้อนความอ่อนเยาว์ :</strong> Dr.Pinski ได้แนะนำว่า หากคุณเป็นที่ชอบดูซีรี่ส์จนดึกดื่นค่อนคืน คงต้องหันมาเข้มงวดกับเวลาเข้านอนแล้วล่ะ แล้วหันมาทำอะไรที่ช่วยให้ผ่อนคลายก่อนนอน อย่างการดื่มนมผสมน้ำผึ้งร้อนๆ สักถ้วย ที่จะช่วยให้หลับได้ดีขึ้นนั่นเอง</p><h3>ที่มา: www.health-th.com</h3>'
