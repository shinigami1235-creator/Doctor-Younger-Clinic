title: 10 ท่า 10 นาที ออกกำลังกายง่ายๆ รับประกันพุงหาย ขาเล็ก
date: 14 Dec 2017
source: Sanook
body: '<p>อยากมีหุ่นสวยสุดเฟิร์ม แค่จำกัดอาหารยังไม่พอ ต้องออกกำลังกายด้วย แต่ถ้าใครมีเวลาน้อย เราขอแค่ 10 นาทีต่อวัน รับรองว่าน้ำหนักลด ร่างกายฟิตแอนด์เฟิร์มทุกสัดส่วนได้แน่นอน ออกกำลังกายตามท่าดังกล่าวเป็นเวลา 45 วินาที ไม่จำกัดจำนวนครั้ง (แต่พยายามทำให้เร็ว) จากนั้นพัก 15 วินาที ก่อนเริ่มท่าต่อไป</p><h3>กระโดดตบ</h3><p>ทำท่ากระโดดตบด้วยการยืนตัวตรงเข่าชิด แล้วกระโดดแยกขากว้างกว่าไหล่เล็กน้อย พร้อมยกมือขึ้นตบเหนือศีรษะ ยืดแขนให้ตึง จากนั้นกลับมาที่ท่ายืนตรงแขนแนบลำตัวเหมือนเดิม กระโดดตบไปเรื่อยๆ ไม่จำกัดจำนวนครั้ง</p><p><img src="https://www.doctoryounger.com/img-uploads/11.jpg" alt=""></p><h3>นอนบิดตัว</h3><p>นอนคว่ำกับพื้น (ควรมีเสื่อออกกำลังกาย หรือเสื่อโยคะมาปูรองไว้ด้วย) เอามือวางไว้บริเวณหน้าอก ยืนแขนให้ตรงทั้งสองข้าง ดันลำตัวให้ลอยอยู่เหนือพื้น แล้วบิดตัวไปด้านซ้าย พร้อมยกแขนขวาให้ตึง จากนั้นหันมาสลับเอียงข้าง บิดตัวไปทางขวา ยกแขนซ้ายขึ้นให้ตึง บิดตัวยกแขนสลับไปเรื่อยๆ</p><h3>เตะกลางอากาศ</h3><p>เคลียร์พื้นที่รอบตัว ยกแขนมาตั้งการ์ดบริเวณคาง วางเท้าซ้ายไปด้านหน้าเล็กน้อย แล้วค่อยยกขาขึ้นเตะกลางอากาศ
  ไม่ต้องเตะแรงมาก แต่ยกขาให้รู้สึกตึงๆ ขณะเตะยืดขาให้ตึง จากนั้นสลับมาเตะที่ขาข้างขวา สลับข้างไปเรื่อยๆ</p><h3>สควอท</h3><p>ยืนตัวตรง จากนั้นยืดแขนตรงไปข้างหน้าทั้งสองข้าง พร้อมค่อยๆ ย่อเขาลง พยายามให้ต้นขาทำมุมขนานไปกับพื้นที่เท้า ค้างไว้เล็กน้อยก่อนลุกขึ้นแล้วทำซ้ำไปเรื่อยๆ</p><p>วิดพื้น</p><p>ลงไปนอนคว่ำกับพื้น เอาแขนยันพื้นไว้ข้างๆ ตัวในช่วงระดับอก ยกตัวขึ้นด้วยแขนทั้งสองข้าง ก่อนจะค่อยๆ ลดแขนลงโดยที่ลำตัวเกร็งให้ท้องกับขาตรงกัน ทำไปเรื่อยๆ จนกว่าจะหมดเวลา</p><p><img src="https://www.doctoryounger.com/img-uploads/22.jpg" alt=""></p><h3>คุกเข่าวิดพื้น</h3><p>ทำท่าวิดพื้นเหมือนเดิม แต่เปลี่ยนจากที่ขาตรง เป็นคุกเข่าขาตั้งฉากกับพื้น แขนยังคงดันตัวและหน้าอกขึ้นจากพื้น และปล่อยลงสู่พื้นเหมือนเดิม</p><h3>เหยียดท้อง</h3><p>นอนหงายลงไปกับพื้น ชันเข่าขึ้นมา เท้าติดพื้น ดันสะโพกขึ้นให้ท้องลอยขึ้นเหนือพื้น ให้ระดับต้นขา ท้อง และอกอยู่ในระดับเดียวกัน ค้างไว้เล็กน้อย ก่อนลดสะโพกลง แล้วดันขึ้นใหม่ไปเรื่อยๆ</p><h3>ย่อขา</h3><p>เริ่มจากยืนตัวตรง แขนชิดแนบลำตัว จากนั้นก้าวขาขวาไปข้างหน้า 1 ก้าว พร้อมงอเข่าซ้ายลงจนเข่าเกือบแตะพื้น
  แล้วดันตัวลุกขึ้นยืนตรง สลับเป็นก้าวขาซ้าย งอเข่าขวาลง แล้วยืดตัวกลับ สลับข้างไปเรื่อยๆ</p><h3>ก้าวขึ้นเก้าอี้</h3><p>เอาเก้าอี้ที่ไม่มีเบาะนุ่มๆ และไม่สูงมาก (อยู่ที่ระดับต่ำกว่าเข่า) มาตั้งไว้ข้างหน้า หันหน้าเก้าอี้เข้าหาตัวเอง ยืนตรง ก้าวขาขวา ตามด้วยขาซ้ายขึ้นไปยืนบนเก้าอี้ จากนั้นก้าวขาขวาไปด้านหลังเพื่อลงจากเก้าอี้ ชักเท้าซ้ายกลับ จากนั้นสลับข้างเป็นก้าวขาซ้ายขึ้นก่อน ตามด้วยขาขวา แล้วค่อยก้าวขาซ้ายไปข้างหลัง ชักเท้าขวากลับ สลับไปเรื่อยๆ</p><p><img src="https://www.doctoryounger.com/img-uploads/33.jpg" alt=""></p><h3>เก้าอี้ล่องหน</h3><p>คราวนี้เราจะทำท่านั่งเก้าอี้ โดยไม่มีเก้าอี้ หันหลังชนกำแพง แยกเท้าออกจากกันในระยะไม่เกินไหล่ตัวเอง จากนั้นค่อยๆ ย่อเข่าลงไปทำท่าเหมือนนั่งเก้าอี้ และดันหลังตัวเองให้ติดกำแพงเข้าไว้ ค้างเอาไว้ในท่านั่งเก้าอี้เล็กน้อย ก่อนจะยืดตัวขึ้นมา แล้วค่อยๆ ย่อเข่าทำท่านั่งอีก</p><p>รวมทั้งหมดใช้ท่าออกกำลังกาย 10 ท่า ในเวลา 10 นาที เป็นท่าง่ายๆ ที่ทุกคนทำได้ อาจจะเมื่อย อาจจะเหนื่อย หรือว่าท่าทางที่ออกมาอาจจะยังไม่เป๊ะนัก บางคนก็ทำไม่ครบ 45 วินาทีก็ต้องพักเสียก่อน
  แต่อย่างไรก็ตามทั้งหมดทั้งมวลนี้เราใช้เวลาแค่ 10 นาที วันแรกๆ อาจจะเหนื่อยมากจนไม่ไหว แต่หากทนทำไปเรื่อยๆ รับรองว่านอกจากเราจะทนเหนื่อยได้มากขึ้นแล้ว ของแถมคือกล้ามท้องสวยๆ ต้นขาสุดเฟิร์มจะเป็นของคุณแน่นอน</p><h3>ที่มา: Sanook</h3>'
