title: 11 เทคนิคกินอย่างพอเพียง
date: 16 Oct 2017
source: Thaihealth
body: '<p>เรื่องโดย ชมนภัส วังอินทร์ เรียบเรียงจากหนังสือ กินดีมีสุขในยุคเศรษฐกิจพอเพียง โดยสำนักโภชนาการ กรมอนามัย กระทรวงสาธารณสุข</p><p><strong>"...คำว่าพอเพียงมีความหมายอีกอย่างหนึ่ง มีความหมายกว้างออกไปอีก ไม่ได้หมายถึงการมีพอสำหรับใช้เองเท่านั้น แต่มีความหมายว่าพอมีพอกิน พอมีพอกินนี้ก็แปลว่า เศรษฐกิจพอเพียงนั่นเอง..."</strong></p><p><strong>"...พอเพียงนี้ก็หมายความว่า มีกินมีอยู่ ไม่ฟุ่มเฟือย ไม่หรูหราก็ได้ แต่ว่าพอแม้บางอย่างอาจจะดูฟุ่มเฟือย แต่ถ้าทำให้มีความสุข ถ้าทำได้ก็สมควรที่จะทำ สมควรที่จะปฏิบัติ..."</strong></p><p>พระราชดำรัสในพระบาทสมเด็จพระเจ้าอยู่หัว พระราชทานเนื่องในโอกาสวันเฉลิมพระชนมพรรษา ณ ศาลาดุสิดาลัย สวนจิตรลดา พระราชวังดุสิต ๔ ธันวาคม ๒๕๔๐</p><p>การน้อมนำหลักปรัชญาเศรษฐกิจพอเพียง ตามแนวพระราชดำรัสของ พระบาทสมเด็จพระปรมินทรมหาภูมิพลอดุลยเดช บรมนาถบพิตร มาเป็นหลักยึดเหนี่ยวจิตใจและเป็นแนวปฏิบัติในการดำเนินชีวิตได้อย่างลงตัว ไม่ว่าจะยุคสมัยไหนก็ตาม หากเราต่างใช้หลักเศรษฐกิจพอเพียงเป็นตัวตั้ง ดังเช่น เรื่องการกิน ก็จะทำให้เรารู้จักกินอย่างฉลาดได้</p><p><img src="https://www.doctoryounger.com/img-uploads/11.jpg"
  alt=""></p><p>ดังเช่นที่ อ.สง่า ดามาพงษ์ ที่ปรึกษากรมอนามัย และผู้ทรงคุณวุฒิด้านโภชนาการ สำนักงานกองทุนสนับสนุนการสร้างเสริมสุขภาพ (สสส.) กล่าวไว้ว่า “การนำหลักปรัชญาเศรษฐกิจพอเพียงมาประยุกต์ใช้ให้เกิดความยั่งยืนทางอาหาร ก็เป็นการก่อให้เกิดสุขภาพที่ดีมีภูมิคุ้มกันด้านโภชนาการที่ดีขึ้น”</p><p>สำหรับวิธีการเลือกอาหารแบบฉลาดกินนั้นสามารถเลือกได้ทั้ง การทำอาหารกินเองภายในบ้าน ที่นับว่าเป็นการประหยัดอีกรูปแบบหนึ่ง เพราะเราสามารถเลือกซื้อวัตถุดิบในการประกอบอาหารที่มีโภชนาการที่ดี ในราคาไม่สูง ปลอดภัยมีคุณภาพ และการกินอาหารนอกบ้าน ที่เราสามารถเลือกร้านอาหารที่มีคุณภาพความปลอดภัยด้วยตัวเองได้</p><p><img src="https://www.doctoryounger.com/img-uploads/22.jpg" alt=""></p><h3>11 เทคนิคกินอย่างพอเพียง</h3><p>ด้วยภาวะเศรษฐกิจที่ยุคอาหารแพง เราควรเลือกกินอย่างพอเพียง เพื่อการมีสุขภาพที่ดี ไม่เกิดภาวะขาดสารอาหารหรือภาวะโภชนาการเกินด้วย 11 เทคนิคต่อไปนี้</p><p>1. กินพออิ่ม ควรกินแค่พออิ่มในแต่ละมื้อ โดยตักอาหารที่พอดีจนเกิดเป็นนิสัย ไม่เยอะจนเกินไป</p><p>2. ไม่กินทิ้งกินขว้าง ต้องคำนวณให้ดีในการซื้อแต่ละครั้ง
  เพราะหากซื้อมากเกินไป กินไม่หมด ก็ทำให้เราเสียเงินโดยเปล่าประโยชน์</p><p>3. อาหารที่มีคุณค่าราคาถูก อาหารประเภทเนื้อสัตว์ อาจใช้เต้าหู้ หรือถั่วเมล็ดแห้งผสม ซึ่งมีโปรตีนและใยอาหารสูง หรือเลือกกินปลาน้ำจืดสลับกับปลาทะเล และกินผักผลไม้อย่างน้อยวันละ 400 กรัม โดยเลือกเป็นผักผลไม้พื้นบ้าน ที่หาได้ง่ายและราคาถูก รวมไปถึงการกินไข่ ที่ให้โปรตีนคุณภาพดี ราคาไม่แพงแถมได้สุขภาพดีอีกด้วย</p><p>4. กินผลไม้แทนขนมหวาน ควรเลือกผลไม้ที่มีตามฤดูกาล เนื่องจากหาซื้อง่าย ราคาถูก ที่สำคัญคือร่างกายได้รับใยอาหารที่มีประโยชน์ต่อร่างกาย แทนความหวานและไขมันจากน้ำตาล และกะทิในขนมหวาน</p><p>5. ลดการกินจุบจิบ ของกินส่วนใหญ่ที่นอกเหนือจากผักผลไม้ที่เรากินแล้ว บางชนิดก็ยังให้พลังงานเกินกว่าที่ร่างกายต้องการ จนทำให้เกิด ภาวะอ้วนลงพุงได้ และไม่ควรกินวันละหลายๆ มื้อ เพราะหากติดเป็นนิสัยแล้วผลที่ตามมาคือ ภาวะโรคอ้วน</p><p>6. ดื่มน้ำเปล่าดีที่สุด เพราะดื่มเท่าไหร่ก็ไม่อ้วน สิ่งสำคัญคือต้องเลือกน้ำสะอาด เพราะน้ำจะช่วยให้ร่างกายขับของเสียออกมาทางเหงื่อ หรือปัสสาวะ และยังช่วยลดอาการอ่อนเพลียของร่ายกายได้</p><p><img src="https://www.doctoryounger.com/img-uploads/33.jpg"
  alt=""></p><p>7. กินอาหารไทย เพราะอาหารไทยเลือกใช้วัตถุดิบภายในประเทศ คุณค่าทางอาหารถือว่าครบถ้วนใน 1 เมนู และถือว่าเป็นการช่วยเศรษฐกิจชาติอีกด้วย</p><p>8. ลดการสั่งอาหารราคาพิเศษ เช่น เพิ่มข้าว เพิ่มกับข้าว แต่กินไม่หมด จึงสิ้นเปลืองทั้งเงินและเสียดายอาหารที่เหลือด้วย</p><p>9. งดกินอาหารมื้อดึก เมื่อกินอาหารแล้วเข้านอนทันที ทำให้ร่างกายไม่ได้เผาผลาญพลังงาน สะสมเป็นไขมัน จึงทำให้เกิดภาวะอ้วนได้</p><p>10. เคี้ยวอาหารช้าๆ อย่ารีบร้อน เพราะการเคี้ยวอาหารแบบช้าๆ จะทำให้เรารู้สึกอิ่มเร็ว ลดปัญหาของระบบย่อยอาหาร และการกินอาหารแบบเร่งรีบจะทำให้เราจุกและกินอาหารมากขึ้นกว่าเดิม</p><p>11.การเลี้ยงลูกด้วยนมแม่แทนนมผง ซึ่งการเลี้ยงลูกด้วยนมแม่นอกจากจะมีสารอาหารครบถ้วน ปกป้องลูกน้อยจากโรคภัยต่างๆ แล้ว ยังช่วยลดค่าใช้จ่ายในการซื้อนมผงได้อีกด้วย</p><p>การเลือกปฏิบัติตัวตามหลักปรัชญาเศรษฐกิจพอเพียงในด้านการกินอาหาร นั่นคือ การประมาณตน กินเท่าที่อิ่ม และเพียงพอต่อปริมาณที่ร่างกายจะได้รับในแต่ละวัน และเลือกกินอาหารที่มีประโยชน์ต่อร่างกาย เพียงเท่านี้ก็ทำให้เรามีสุขภาพที่ดี และยังเห็นคุณค่าของการใช้จ่ายในชีวิตประจำวันมากขึ้น</p><h3>ที่มา:
  Thaihealth</h3>'
