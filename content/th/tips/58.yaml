title: สังคมก้มหน้ามาฟัง!! 7 โรคยอดฮิต ที่คนติดสมาร์ทโฟนต้องระวัง
date: 15 Nov 2017
source: Lisaguru
body: '<p>ปฏิเสธไม่ได้เลยว่าในปัจจุบันนี้ สมาร์ทโฟนกลายเป็นปัจจัยที่ 5 ที่สำคัญต่อการดำรงชีวิตของมนุษย์ยุคไอทีไปแล้ว ไม่ว่าจะติดต่อสื่อสาร อัปเดตข้อมูลเหตุการณ์บ้านเมือง เราก็มักเช็กผ่านหน้าจอสมาร์ทโฟนของเราทั้งนั้น แม้เทคโนโลยีจะอำนวยความสะดวกให้กับเรามากแค่ไหน แต่มันก็คงยังมีข้อเสียแอบแฝงอยู่เสมอ หากเราไม่ใช้มันให้อยู่ในความพอดี</p><h3>1. ตาแห้ง ประสาทตาล้า</h3><p>การจ้องหน้าจอโทรศัพท์นานๆ จะทำให้ดวงตาของเราแห้ง และรู้สึกตาพร่ามัว ประสาทตาล้า นอกจากนี้หน้าจอสมาร์ทโฟนจะมีแสงสีฟ้าที่คอยทำลายประสาทตาของเรา หากจ้องโทรศัพท์ติดต่อกันเป็นระยะเวลานาน ย่อมไม่เป็นผลดีต่อดวงตาของเราแน่</p><h3>2. นิ้วล็อก</h3><p>การที่เราเล่นโทรศัพท์ติดต่อกันนานๆ จะทำให้เราใช้งานนิ้วหนักโดยที่เราไม่รู้ตัว นิ้วของเราจะต้องเกร็งและงออยู่ตลอดเลาที่เราจับโทรศัพท์ เพราะฉะนั้นใครที่เป็นสายแชท ว่างเป็นแชท หรือต้องเช็กโซเชียลตลอด ระวังจะเป็นโรคนิ้วล็อกนะจะบอกให้</p><p><img src="https://www.doctoryounger.com/img-uploads/23.jpg" alt=""></p><h3>3. สิว</h3><p>เมื่อไหร่ก็ตามที่เราเล่นโทรศัพท์ เราจะต้องใช้มือและนิ้วของเราสัมผัสลงไปบนหน้าจออย่างแน่นอน
  แล้วเคยสังเกตหรือไม่ว่าระหว่างวันนั้นเราใช้มือของเราสัมผัสกับสิ่งใดมาบ้าง พอเรายกโทรศัพท์ขึ้นมาแนบกับใบหน้า สิ่งสกปรกบนโทรศัพท์เหล่านั้นก็จะมาอยู่บนใบหน้าของเรา จากนั้นสิวก็จะขึ้นโดยปริยาย</p><h3>4. ปวดคอ</h3><p>ไม่ว่าจะเป็นการเอียงคอหนีบโทรศัพท์เวลาคุย หรือการก้มหน้าลงมองจอโทรศัพท์ ก็ล้วนทำให้เราปวดคอได้ทั้งนั้น สำหรับใครที่รู้สึกปวดคออยู่ตอนนี้ ลองสังเกตพฤติกรรมการใช้โทรศัพท์ของคุณดู ว่าคุณทำแบบที่เราพูดจริงหรือเปล่า?</p><h3>5. อยู่ในภาวะเครียด กังวลเกินกว่าเหตุ</h3><p>ในโลกของอินเทอร์เน็ตมีความรู้ รวมถึงข้อมูลมากมาย ไม่ว่าจะสงสัยอะไร แค่คลิ๊กเข้าไปคุณก็ได้รู้คำตอบแล้ว อย่างเช่น เมื่อคุณป่วยหรือมีอาการผิดปกติของร่างกายเกิดขึ้น สิ่งแรกที่คุณจะทำไม่ใช่การไปพบแพทย์ แต่คือการเสิร์ชหาข้อมูลว่าอาการที่เป็นอยู่คืออะไร และหากคุณพบข้อมูลที่เป็นเท็จขึ้นมา จะทำให้คุณวิตกกังวล จนกลายเป็นความเครียดขึ้นมา</p><h3>6. โรคซึมเศร้า</h3><p>ในสังคมออนไลน์ทุกวันนี้ ล้วนเต็มไปด้วยการโพสต์เรื่องราวดีๆ แข่งกัน ทำให้เราต้องเก็บเรื่องที่ไม่ดีเอาไว้ในใจ เมื่อเสพเรื่องราวของคนอื่นผ่านโซเชียลทุกวัน จะทำให้คุณนำเรื่องดีๆ
  ของคนอื่นมาเปรียบเทียบกับเรื่องของตัวเองอย่างไม่รู้ตัว สุดท้ายคุณก็จะกลายเป็นโรคซึมเศร้า เพียงเพราะว่าชีวิตของเรานั้นไม่ดีเท่าคนอื่น</p><p><img src="https://www.doctoryounger.com/img-uploads/36.jpg" alt=""></p><h3>7. พักผ่อนไม่เพียงพอ</h3><p>แม้ว่าจะเล่นโทรศัพท์มาทั้งวันแล้ว ตอนนอนก็ยังขอเอาโทรศัพท์ขึ้นไปเล่นต่ออีก และด้วยความที่สมาร์ทโฟนถูกออกแบบมาเพื่อความสะดวกสบาย มีแอปพลิเคชั่นมากมายที่พร้อมจะแจ้งเตือนเราอยู่ตลอดเวลา นั่นเป็นสาเหตุที่จะทำให้เรานอนไม่หลับ และพักผ่อนไม่เพียงพอ บางคนถึงขั้นละเมอลุกขึ้นมาตอบแชทก็มี เพราะฉะนั้นก่อนนอนแนะนำว่าให้ปิดเครื่อง ปิดเสียง หรือเปิด Airplane Mode ไปเลยจะดีกว่านะ</p><p>เทคโนโลยีถูกพัฒนาขึ้นมาเพื่ออำนวยความสะดวกให้กับมนุษย์ หากเรารู้จักใช้ไปในทางที่ถูกต้องและอยู่ในปริมาณที่เหมาะสม ก็ย่อมส่งผลดีกับผู้ใช้ แต่ถ้าเราใช้มากเกินจนกลายเป็นเสพติด สิ่งเหล่านั้นก็จะกลายเป็นโทษ ที่ย้อนกลับมาทำลายสุขภาพของคุณได้อย่างแน่นอน</p><h3>ที่มา: Lisaguru</h3>'
