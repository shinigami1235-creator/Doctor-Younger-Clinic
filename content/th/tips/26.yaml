title: อาหารบำรุงสุขภาพดี 9 ชนิด ของดีที่หญิงสาวทุกคนไม่ควรพลาด
date: 26 Jun 2017
source: Sanook
body: '<p>อาหารรอบตัวเรามีด้วยกันหลายอย่าง สาวๆ คนไหนอยากมีสุขภาพดี แข็งแรง ห่างไกลจากอาการเจ็บป่วย ทั้งยังมาพร้อมสุขภาพผิวพรรณและเส้นผมสวย อีกทั้งยังมีหุ่นดีไปพร้อมๆกัน คงถึงเวลาแล้วที่จะต้องหันมากินอาหารบำรุงสุขภาพเหล่านี้ที่จะตอบแทนความงามและสุขภาพดีอย่างครบวงจร</p><h3>1. ไฟเบอร์ </h3><p>ประโยชน์ของไฟเบอร์จะช่วยในเรื่องระบบการย่อยอาหาร ทำให้อิ่มท้องเร็วและอิ่มนาน ลดอาการหิวจุบจิบได้เป็นอย่างดี เหมาะสำหรับคนที่อยู่ในช่วงลดน้ำหนักอย่างมากทีเดียว นอกจากนี้ ไฟเบอร์ยังช่วยในเรื่องระบบขับถ่าย ช่วยชะลอความแก่ ลดความเสี่ยงของการเกิดโรคหัวใจและลดปริมาณของแอสโตรเจนในเลือด อันเป็นสาเหตุของโรคมะเร็งได้อีกด้วย ซึ่งอาหารที่มีไฟเบอร์ก็ได้แก่ ผักผลไม้ ธัญพืช มันฝรั่ง ข้าวโอ๊ตและขนมปังโฮลวีท อย่างไรก็ตามไม่ควรทานมากจนเกินไปทเพราะอาจทำให้มีอาการท้องอืดและมีผลกระทบยังระบบลำไส้ได้ </p><h3>2. ผักสดหลากหลายชนิด</h3><p>ผักสดชนิดต่างๆ อุดมด้วยสารอาหารหลายชนิดที่ดีต่อการบำรุงเส้นผม ผิวหนัง บำรุงสุขภาพดวงตาและดูแลระบบต่างๆ ภายในร่างกาย โดยเฉพาะผักใบเขียวเข้มและผักสดหลากหลายสีสัน กินแล้วยังช่วยในเรื่องการลดน้ำหนัก
  เพราะเป็นแหล่งของไฟเบอร์ นอกจากนี้หากใครต้องการพัฒนาระบบความจำ แนะนำให้ทานกะหล่ำปลีต้มทุกมื้ออาหารกลางวันและเย็นจะให้ผลลัพธ์ที่ดีอย่างมากทีเดียว</p><h3>3. มันฝรั่ง</h3><p>มันฝรั่ง อาหารที่เป็นแหล่งของไฟเบอร์ วิตามินบี 3 วิตามินซีและโพแทสเซียม แนะนำให้นำมันฝรั่งมาผ่านกรรมวิธีการอบและทานแบบทั้งเปลือกจะดีที่สุด เพราะให้คุณค่าทางโภชนาการดีกว่า อีกทั้งยังไม่ทำให้สาวๆ อ้วนขึ้นอีกด้วย</p><p><img src="https://www.doctoryounger.com/img-uploads/Untitled-1.jpg" alt=""></p><h3>4. แอปเปิล</h3><p>แอปเปิล ผลไม้ลดน้ำหนักที่ว่ากันว่าหากทานวันละผลจะดีต่อสุขภาพและหุ่นสวยแบบครบวงจร แอปเปิลยังมีสารอาหารที่เป็นประโยชน์หลายอย่าง เช่น แคลเซียม วิตามินซี ฟอสฟอรัส แมกนีเซียมและเพคติน โดยจะช่วยกำจัดสารพิษ ช่วยลดคอเลสเตอรอลและดีต่อระบบการทำงานของปอดอีกด้วย</p><h3>5. ถั่ว</h3><p>ถั่วเป็นของว่างกินเล่นที่มีประโยชน์ต่อร่างกาย เป็นแหล่งของวิตามินบี1 โปรตีนและแมกนีเซียมที่มีดีต่อระบบประสาท สำหรับใครที่ไม่ชอบกินถั่ว หันมากินเนยถั่วหรือดื่มนมถั่วเหลืองแทนก็ให้ประโยชน์ได้ดีไม่แพ้กันทีเดียว แนะนำถั่วฮาเซลนัทเพราะมีโปรตีนสูงที่สุด
  บราซิลนัทเพราะมีเซเลเนียมสูง โดยจะช่วยชะลอความแก่ชราได้</p><h3>6. กล้วย</h3><p>กล้วย ผลไม้ลดน้ำหนักที่อุดมไปด้วยไฟเบอร์สูง นอกจากนี้ ยังเป็นแหล่งของโพแทสเซียมและวิตามินซีที่จะช่วยป้องกันแผลพุพองบนผิวหนัง ช่วยลดระดับคอเลสเตอรอลและขจัดพิษจากโลหะที่ตกค้างอยู่ในร่างกายได้เป็นอย่างดี</p><h3>7. บร็อคโคลี่</h3><p>บร็อคโคลี่ ผักที่ช่วยป้องกันมะเร็งได้ดี กินแล้วยังช่วยทำความสะอาดร่างกายภายใน และมีธาตุเหล็กรวมถึงสารต้านอนุมูลอิสระที่เป็นประโยชน์ต่อสุขภาพอีกด้วย</p><h3>8. หอม กระเทียม</h3><p>มีคุณสมบัติช่วยฟื้นฟูระบบการไหลเวียนของเลือด ล้างสารพิษออกจากร่างกายและป้องกันโรคหอบหืดได้</p><h3>9. พริก</h3><p>ประโยชน์ของพริกไม่ใช่แค่มีสารแคปไซซินที่ให้ความเผ็ดร้อนเท่านั้น แต่พริกยังมีวิตามินซีสูง โดยเฉพาะพริกสีแดงและพริกสีเหลือง ซึ่งอุดมด้วยวิตามินซีมากกว่าส้มถึง 4 เท่าเลยทีเดียว กินแบบสดเป็นประจำจะช่วยบำรุงสุขภาพผิว เหงือกและเส้นผม</p><p>9 อาหารบำรุงสุขภาพเหล่านี้ ล้วนมีประโยชน์ต่อสุขภาพร่างกายมากมาย ใครที่ไม่อยากเจ็บป่วยง่าย แถมยังมีผิวพรรณ เส้นผมและหุ่นสวย ต้องหันมาทานอาหารเหล่านี้บ่อยๆ นะคะ</p><h3>ที่มา:
  Sanook</h3>'
