title: Trampoline กระโดดแล้วผอม เทรนด์ออกกำลังกายแนวใหม่ที่กำลังมา
date: 16 Mar 2016
source: Mthai
body: 'Trampoline เคยถูกจัดเป็นเครื่องเล่นสำหรับกระโดด และเครื่องออกกำลังสำหรับยิมนาสติกประเภทหนึ่ง ที่มีผืนผ้าใบขึงตึงคาดอยู่กับเหล็กและสปริงที่ทำหน้าที่ในการขึง โดย Trampoline มีต้นกำเนิดมาจากการละเล่นของชาวเอสกิโมที่มักเล่นโยนกันโดยอาศัยหนังสัตว์ขึงตึงมาเป็นตัวช่วยจากนั้นก็เริ่มถูกนำมาประยุกต์ใช้ในกลุ่มนักดับเพลิงเพื่อช่วยชีวิตคน นำไปใช้เป็นกีฬาในการแข่งขันโอลิมปิก และกลายเป็นเครื่องเล่นที่ได้รับความนิยมมากในกลุ่มเด็กและนักกระโดดทั้งหลาย<br><img src="https://www.doctoryounger.com/img-uploads/Tips3_6x4%20copy.jpg" alt=""><br><br>ในปัจจุบัน Trampoline ยังได้กลายเป็นเครื่องออกกำลังกายที่ถูกนำมาใช้ในฟิตเนสมากขึ้นอีกด้วย เนื่องจากประโยชน์จากการกระโดดบน Trampoline ซึ่งเป็นอุปกรณ์ที่ส่งผลกระทบต่ำที่เสี่ยงต่อการบาดเจ็บของกล้ามเนื้อและช่วยเพิ่มการประสานงานของร่างกายในส่วนต่าง ๆ ให้สามารถทำงานได้อย่างมีประสิทธิภาพมากขึ้น หากใครกำลังติดตามกระแสการออกกำลัง ที่กำลังมาแรง คงต้องเห็นคลิปการกระโดดโลดเต้นอย่างสนุกสนานอย่บน Trampoline อย่างแน่นอน ซึ่งนอกจากกระแสการออกกำลังด้วย Trampoline กำลังเป็นที่ฮิตกัน
  ขึ้นเรื่อยๆ ประโยชน์จากอุปกรณ์ประเภทนี้ ยังจัดว่าดีต่อสุขภาพกาย สุขภาพใจ และสุขภาพสมองอีกด้วย<br><strong>Trampoline กับการเผาผลาญแคลอรี</strong>ถ้าคุณมีน้ำหนักตัวอยู่ที่ประมาณ 69 กิโลกรัม หลังจากกระโดดบน Trampoline ประมาณ 10 นาที จะพบว่าร่างกายสามารถเผาผลาญแคลอรีได้ถึง 42 แคลอรี ซึ่งหากกระโดดบน Trampoline นานถึง 30 นาที จะเผาผลาญได้ถึง 142 แคลอรี ดังนั้นหากกระโดดบน Trampoline บวกกับการเดินและท่าแอโรบิกต่างๆ ร่างกายจะสามารถเผาผลาญแคลอรีได้มากยิ่งขึ้น<br><img src="https://www.doctoryounger.com/img-uploads/4x6%20copy.jpg" alt=""><br><strong><br></strong><strong>การเตรียมพร้อมก่อนออกกำลังกาย</strong>Trampoline ควรมีขนาดเส้นผ่าศูนย์กลางอยู่ที่ 28-44 นิ้ว สวมรองเท้ากีฬา ทุกครั้งเมื่อต้องใช้ Trampoline เพื่อหลีกเลี่ยงการลื่นไถล เริ่มทำความคุ้นเคยกับ Trampoline ด้วยการเดินยกเข่าสูงกว่า การเดินปกติ พร้อมกับการแกว่งมือเคลื่อนตามจังหวะเดิน เพื่อให้รู้สึกผ่อนคลาย แล้วจึงเริ่มวิ่งจ๊อกกิ้งช้าๆ เพื่อรักษาสมดุลของร่างกาย และค่อยๆเพิ่มจังหวะพร้อมกับระดับการออกกำลังขึ้นเรื่อยๆ ซึ่งการออกกำลังบน Trampoline
  ควรมีท่าเดินสลับกับท่าวิ่ง 3 ครั้งต่อสัปดาห์<br><strong>Trampoline ดีต่อร่างกายและใจอย่างไร</strong>ช่วยสร้างความสมดุลของร่างกาย โดยเฉพาะเด็กๆ จะช่วยให้สมองสร้างการเรียนรู้ใหม่ๆ และยังทำให้เด็กเรียนเก่งขึ้นอีกด้วย แถมยังช่วยให้เด็กเกิดความมั่นใจในตัวเอง และเสริมสร้างบุคลิกที่ดีให้แก่เด็กได้เช่นกัน นอกจากนี้ Trampoline ยังมีส่วนทำให้กล้ามเนื้อหน้าท้องแข็งแรง ช่วยปรับปรุงสุขภาพหัวใจและหลอดเลือดให้ทำงานปกติมากยิ่งขึ้น อีกทั้งยังลดอาการปวดตามข้อต่อ หัวใจ และต้นขาได้เป็นอย่างดี แถมใครที่กำลังลดน้ำหนัก หากเต้นแอโรบิกบน Trampoline เป็นประจำ นอกจากจะมีสุขภาพที่แข็งแรงแล้ว ยังสามารถเผาผลาญแคลอรีได้มากถึง 3,500-7,000 แคลอรีเลยทีเดียว <h3>ที่มา: Mthai</h3>'
