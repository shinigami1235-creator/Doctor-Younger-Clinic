title: เคล็ดลับจากเบบี้ออยล์ ตัวช่วยด้านความงาม
date: 08 Feb 2018
source: Healthandtrend
body: '<p>เบบี้ออยล์ (Baby Oil) ถึงจะดูเป็นผลิตภัณฑ์สำหรับเด็ก แต่ประโยชน์ของมันไม่เด็กอย่างที่คิดเลยนะคะ สาวๆ สามารถนำเบบี้ออยล์มาใช้เป็นเครื่องบำรุงความสวยความงามได้หลายประเภทตั้งแต่หัวจรดเท้า ประโยชน์ของการใช้เบบี้ออยล์อยู่ที่นี่แล้วค่ะมาดูกันเลยว่ามีอะไรบ้าง</p><h3>เช็ดเครื่องสำอาง</h3><p>เพราะเบบี้ออยล์ก็เป็นน้ำมันชนิดหนึ่ง จึงมีคุณสมบัติในการเช็ดล้างเครื่องสำอางออกจากใบหน้าได้ ไม่แพ้ผลิตภัณฑ์ตัวอื่น ๆ เลย แต่ข้อดีก็คือมีความอ่อนโยนกว่า และไม่ทำให้เกิดการระคายเคืองต่อผิวค่ะ</p><h3>บำรุงผิวใต้ตา</h3><p>เบบี้ออยล์ช่วยลดริ้วรอยบริเวณใต้ตาได้นะ เพียงแค่ใช้เบบี้ออยล์หยดลงปลายนิ้วบาง ๆ แล้วนวดบริเวณใต้ตาประมาณ 1-2 นาที แล้วเอาทิชชู่หรือสำลีซับส่วนที่เกินหรือเหนียวเหนอะหนะออก ทำเป็นประจำก็จะสามารถป้องกันการเกิดริ้วรอยในส่วนนี้ได้ค่ะ</p><p><img src="https://www.doctoryounger.com/img-uploads/001.jpg" alt=""></p><h3>บำรุงรักษาขอบเล็บ</h3><p>เวลาที่เราทาเล็บมักจะเจอปัญหาสีเลอะอยู่ที่ขอบเล็บอยู่เสมอ วิธีแก้ปัญหานี้ก็เพียงแค่หยดเบบี้ออยล์ลงบนขอบเล็บมาก ๆ แล้วทาสีทับ เมื่อพบว่ามีสีส่วนเกินก็สามารถเช็ดออกได้ง่าย
  หากทำบ่อย ๆ จะพบว่าเนื้อบริเวณดังกล่าวจะนุ่มลงกว่าเดิมด้วยนะคะ</p><h3>ลดผิวหยาบกระด้าง</h3><p>ผสมเบเบี้ออยล์กับน้ำตาลทรายแดงในปริมาณ 2:1 แล้วบีบน้ำมะนาวใส่ลงไปเล็กน้อย แล้วน้ำไปสครับในบริเวณข้อศอก ตาตุ่ม หัวเข่า ประมาณ 10 นาทีแล้วล้างออก จะรู้สึกได้ทันทีว่าผิวมีความเนียนนุ่มมากกว่าเดิม</p><h3>ลดการระคายเคืองจากการโกน</h3><p>ทาเบบี้ออยล์ก่อนโกนขน จะช่วยให้ผิวอ่อนนุ่มขึ้น ทำให้สามารถโกนขนได้ง่าย ไม่เจ็บเหมือนที่เคยเป็น และไม่ทิ้งความระคายเคืองเอาไว้หลังจากโกนขนเสร็จแล้ว ดีกว่าใช้โฟมโกนหนวดอีกนะคะ</p><h3>ที่มา: Healthandtrend</h3>'
