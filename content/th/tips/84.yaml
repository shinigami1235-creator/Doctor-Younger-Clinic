title: ผู้ชายต้องรู้ อาหารเพิ่มพลัง
date: 05 Mar 2018
source: Penthouse
body: '<p>เป็นอาหารจริงๆ ไม่ใช่อาหารเสริมหรือเครื่องดื่มชูกำลัง อีกทั้งยังหารับประทานได้ง่าย และถ้าเลือกให้ถูกกับอาการ ก็จะเสริมสร้างพลังและนำชีวิตชีวากลับมาอย่างรวดเร็ว มีอะไรบ้างมาดูกัน</p><h3>อาการ : เครียด</h3><p>สิ่งที่ควรกิน : โยเกิร์ตไขมันต่ำหนึ่งถ้วยหรือ 2 ช้อนโต๊ะ จะช่วยคลายเครียดได้ งานวิจัยจากประเทศสโลวาเกีย พบว่าการกินอาหารที่อุดมไปด้วยกรดอะมิโนอย่างโยเกิร์ตและถั่ว จะทำให้สภาวะความเครียดมีน้อยลงเมื่อเทียบกับคนที่ไม่ได้กินอาหารจำพวกกรดอะมิโน ฉะนั้นลองกินโยเกิร์ตกับถั่วบ้างก็จะดี</p><p><img src="https://www.doctoryounger.com/img-uploads/22.jpg" alt=""></p><h3>อาการ : พลังงานถดถอย</h3><p>สิ่งที่ควรกิน : ลูกเกดและถั่วรวมทั้งธัญพืช สามารถช่วยให้เรามีพลังวังชาขึ้นมาได้ เพราะลูกเกดอุดมไปด้วยโพแทสเซียม ซึ่งร่างกายจะใช้เปลี่ยนจากน้ำตาลไปเป็นพลังงาน ส่วนถั่วอุดมไปด้วยแมกนีเซียมที่ช่วยให้ร่างกายเผาผลาญได้ดีขึ้น แถมยังช่วยให้ระบบประสาทและกล้ามเนื้อแข็งแรง ในทางกลับกัน ถ้าร่างกายมีระดับแมกนีเซียมในระดับต่ำจะทำให้เกิดกรดแล็กติกซึ่งทำให้ร่างกายรู้สึกอ่อนเพลียได้</p><h3>อาการ : สมองอ่อนล้า</h3><p>สิ่งที่ควรกิน
  : บลูเบอร์รี่ เพราะมีสารป้องกันมิให้สมองเกิดอนุมูลอิสระ อันนำไปสู่ความเสื่อมของเซลล์สมอง ที่อาจส่งผลให้เกิดโรคอัลไซเมอร์และพาร์กินสัน</p><p><img src="https://www.doctoryounger.com/img-uploads/11.jpg" alt=""></p><h3>อาการ : งัวเงีย…ลุกไปทำงานไม่ไหว</h3><p>สิ่งที่ควรกิน : ไข่และขนมปังโฮลวีตสำหรับมื้อเช้าจะช่วยให้กระปรี้กระเปร่ายิ่งขึ้น เพราะไข่อุดมไปด้วยโปรตีน ถ้าได้กินเป็นอาหารเช้า นอกจากจะให้พลังงานแก่เรา ยังช่วยให้เรากินอาหารมื้ออื่นๆ ลดน้อยลง ฉะนั้นใครที่กำลังรักษาหุ่นก็สามารถเลือกไข่และขนมปังโฮลวีตเป็นอาหารเช้าได้เช่นกัน</p><h3>อาการ : อารมณ์เสียหรือหงุดหงิด</h3><p>สิ่งที่ควรกิน : ช็อกโกแลต งานวิจัยในอิตาลีพบว่าคนที่กินช็อกโกแลตบ่อยๆ จะมีแรงขับทางเพศสูง และกระตือรือร้น ซึ่งความกระตือรือร้นของคนเรามักทำให้มองโลกสดใสอยู่เสมอ</p><h3>ที่มา: Penthouse</h3>'
