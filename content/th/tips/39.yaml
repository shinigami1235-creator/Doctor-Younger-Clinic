title: ตาบอด-เนื้อตาย ภัยร้ายฟิลเลอร์
date: 17 Aug 2017
source: Wongkarnpat
body: '<p>สารเติมเต็ม หรือฟิลเลอร์ ถูกนำมาใช้รักษาทางการแพทย์อย่างแพร่หลาย สามารถใช้ในการรักษาปัญหาผิวพรรณและริ้วรอยอันเนื่องมาจากวัย เช่น ริ้วรอยบริเวณหน้าผาก หางตา และร่องแก้ม โดยการฉีดฟิลเลอร์จะสามารถเติมเต็มใยคอลลาเจนที่หายไป ทำให้บริเวณดังกล่าวตื้นขึ้น สภาพผิวดูดีขึ้น ใช้ในการแก้ไขปัญหาแผลเป็นชนิดผิวบุ๋ม เช่น การเกิดแผลบุ๋มจากสิวอักเสบ ซึ่งสามารถใช้ฟิลเลอร์เติมเต็มทำให้แผลบุ๋มดีขึ้น แต่ต้องเลือกชนิดแผลผิวบุ๋มที่เหมาะสมต่อการรักษา โดยแผลนั้นต้องไม่มีพังผืดในบริเวณใต้แผลบุ๋ม มิฉะนั้นผลการรักษาจะไม่ดีเท่าที่ควร และใช้ฟิลเลอร์ฉีดเพื่อเสริมเนื้อเยื่อผิวหนังให้มีลักษณะนูนเต็มขึ้นกว่าเดิม (Augmentation) เช่น เสริมจมูก เสริมคาง ริมฝีปาก หรือฉีดเพื่อทำให้รูปทรงของหน้าดูอวบอิ่มกว่าเดิม</p><p>สำหรับผลข้างเคียงที่อาจเกิดจากการฉีดฟิลเลอร์แบ่งออกได้เป็นหลายประเภท ได้แก่ 1. เกิดผื่นแดงบริเวณที่ฉีดฟิลเลอร์ หรือรอยช้ำบริเวณฉีดซึ่งหายได้เอง 2. การเกิดรอยนูน หรือผิวไม่เรียบเนื่องจากเทคนิคการฉีดที่ตื้นเกินไป หรือเลือกใช้ฟิลเลอร์ที่มีขนาดโมเลกุลไม่เหมาะสม และอาการแพ้กรดไฮยาลูโรนิก ซึ่งขึ้นอยู่กับปฏิกิริยาของร่างกายผู้ได้รับการฉีดเอง
  3. เกิดปัญหาการเคลื่อนย้าย (Migration) เช่น ฉีดดั้งจมูกแล้วฟิลเลอร์เคลื่อนไหลไปที่ปลายจมูก ดังนั้น ถ้าต้องการฉีดฟิลเลอร์เพื่อเสริมคางหรือจมูก ต้องเลือกฟิลเลอร์ที่มีขนาดโมเลกุลใหญ่ เพื่อให้ฟิลเลอร์ชนิดนั้นมีความหนืดเพิ่มมากขึ้น ช่วยลดปัญหาการเคลื่อนย้ายจากบริเวณที่ฉีด และทำให้มีอายุใช้งานได้ยาวนานขึ้นอีกด้วย 4. อาการแพ้สารฟิลเลอร์ที่ให้ลักษณะเป็นก้อนนูนแดงอักเสบ อาการแพ้ชนิดนี้บางครั้งอาจพบได้ภายหลังการฉีดฟิลเลอร์ผ่านพ้นไปแล้วเป็นเวลาหลายเดือนหรือเป็นปี ขึ้นกับอายุการใช้งานของฟิลเลอร์ชนิดนั้น ๆ 5. การที่ฉีดฟิลเลอร์ผิดตำแหน่งโดยฉีดเข้าไปในหลอดเลือดอาจทำให้เกิดการอุดตันของหลอดเลือดได้ เกิดเนื้อตายบริเวณที่เส้นเลือดนั้นมาเลี้ยง หรือฉีดฟิลเลอร์แล้วเกิดตาบอด เนื่องมาจากฟิลเลอร์ที่ฉีดเกิดไปอุดตันหลอดเลือดที่ไปเลี้ยงจอประสาทตา มีผลทำให้สูญเสียการมองเห็นได้ ซึ่งขณะนี้พบในประเทศไทยและต่างประเทศแล้ว</p><p><img src="https://www.doctoryounger.com/img-uploads/222.jpg" alt=""></p><p>รศ.นพ.นภดล นพคุณ นายกสมาคมแพทย์ผิวหนังแห่งประเทศไทย กล่าวว่า การฉีดฟิลเลอร์ได้รับความนิยมมากในปัจจุบัน เพราะเห็นผลเร็วและไม่จำเป็นต้องไปผ่าตัดศัลยกรรม
  โดยเฉพาะการฉีดจมูก ซึ่งสารที่ฉีดในปัจจุบันคือ Hyaluronic Acid ที่มีอยู่ในผิวหนังของคนเราอยู่แล้ว แต่สิ่งที่นำมาฉีดเป็นการสังเคราะห์ขึ้นมา เมื่อฉีดเข้าไปก็หวังจะไปเติมเต็มร่องรอยต่าง ๆ แต่เดิมคิดว่าสารตัวนี้ปลอดภัย เพราะสามารถละลายหรือสลายไปได้ แต่ปัญหาคือเมื่อมาฉีดที่จมูก ใต้ตา อาจจะทำให้เกิดการอุดตันของหลอดเลือด เพราะบริเวณดังกล่าวมีหลอดเลือดอยู่มาก โดยเฉพาะหลอดเลือดที่ไปเลี้ยงตาอาจทำให้ตาบอดได้ ดังนั้น การฉีดบริเวณตรงกลางหน้าคือ สันจมูกและรอบดวงตาจะต้องเป็นแพทย์ผู้เชี่ยวชาญที่มีความชำนาญมากจึงจะฉีดได้ แต่ถึงแม้จะมีความชำนาญก็ยังมีความเสี่ยงอยู่ คือเมื่อฉีดเข้าไปแล้ว สารที่ฉีดเข้าไปอาจไปอุดตันหลอดเลือดแดงที่ไปเลี้ยงดวงตา ถ้าฉีดมากเกินไปอาจไปกดหรือเบียดทำให้ดวงตาขาดเลือดไปเลี้ยงได้</p><p>“การฉีดบริเวณจมูกไม่ควรทำอย่างยิ่ง เพราะอยู่ได้ไม่กี่เดือนก็ต้องฉีดใหม่ ถ้าอยากทำจมูกจริง ๆ การผ่าตัดศัลยกรรมน่าจะดีกว่า เพราะอยู่ได้ถาวรและความเสี่ยงน้อยกว่า ปัญหาที่เรากลัวตอนนี้คือ คนที่รับจ้างฉีดตามคลินิกต่าง ๆ ส่วนใหญ่ไม่ได้มีความชำนาญจริง ๆ เป็นผู้ที่ได้รับการฝึกอบรมระยะสั้น ๆ จากบริษัทยาที่ขายฟิลเลอร์ชนิดนี้
  บางคนเพิ่งจบแพทย์มาด้วยซ้ำ ยังไม่ได้รับการอบรมอะไรเลยก็ไปฉีดให้บริการผู้ป่วยแล้ว ซึ่งผู้ป่วยก็ไม่รู้ คิดว่าพอเป็นแพทย์ก็สามารถทำได้ทั้งนั้น นอกจากนี้ยังมีปัญหาที่มักจะพบเห็นอยู่เป็นประจำ กรณีมีหมอเถื่อนให้บริการฉีดฟิลเลอร์และผู้ป่วยก็ไปซื้อยาตามอินเตอร์เน็ตมาฉีด คือสารบางตัวมีความเข้มข้นสูง ถ้าไปฉีดบริเวณจมูกซึ่งใกล้กับดวงตาอาจไปอุดตันหรือกดหลอดเลือดที่ไปเลี้ยงดวงตาและอาจทำให้ตาบอดได้”</p><p>รศ.พญ.รังสิมา วณิชภักดีเดชา ผู้ช่วยประชาสัมพันธ์ สมาคมแพทย์ผิวหนังแห่งประเทศไทย กล่าวว่า ฟิลเลอร์แบ่งออกได้เป็นหลายรูปแบบ ได้แก่ 1. แบบชั่วคราว (Temporary Filler) มีอายุใช้งานประมาณ 4-6 เดือน แต่มีความปลอดภัยสูง สลายตัวได้เองตามธรรมชาติ 2. แบบกึ่งถาวร (Semi Permanent Filler) มีอายุใช้งานประมาณ 2 ปี มีความปลอดภัยปานกลาง และ 3. แบบถาวร (Permanent Filler) เช่น ซิลิโคน หรือพาราฟิน หลังฉีดแล้วจะอยู่ในผิวตลอดไป ไม่สลายตามธรรมชาติ มักพบผลข้างเคียงระยะยาว</p><p>สำหรับฟิลเลอร์ที่ใช้ฉีดเข้าใต้ผิวเพื่อเพิ่มปริมาตรของใบหน้า ทำให้ใบหน้าดูอ่อนเยาว์หรือเพื่อลดริ้วรอยบนใบหน้าที่เป็นร่องลึก ที่นิยมใช้ที่สุดในปัจจุบันคือ
  Hyaluronic Acid หรือ HA เนื่องจากมีคุณสมบัติเฉื่อย ไม่ทำให้เกิดการแพ้ มีความคงตัว และอยู่ในร่างกายได้เป็นเวลานาน อีกทั้งยังสามารถเสื่อมสลายไปเอง ไม่เกิดปัญหาสะสมในร่างกาย ในประเทศไทยมีเพียง Hyaluronic Acid เท่านั้นที่ผ่านการรับรองจากสำนักงานคณะกรรมการอาหารและยา (อย.) ให้ใช้ได้อย่างปลอดภัย</p><p>“ตำแหน่งที่นิยมฉีดฟิลเลอร์ คือบริเวณทั่วใบหน้า ตั้งแต่หว่างคิ้ว แก้ม ร่องแก้ม ร่องน้ำตา และริมฝีปาก ยิ่งในระยะหลังมานี้การปรับรูปหน้าสไตล์เกาหลีกำลังเป็นที่นิยม ทำให้มีคนที่ต้องการเสริมจมูกและคางด้วยการฉีดฟิลเลอร์มากขึ้นตามไปด้วย เพราะเห็นว่าเป็นวิธีที่ค่อนข้างง่าย ไม่เจ็บ บวม ช้ำ และไม่ต้องผ่าตัด โดยในปัจจุบันคนไข้จะเป็นฝ่ายเดินเข้ามาถามแพทย์เกี่ยวกับการฉีดฟิลเลอร์ ส่วนหนึ่งเป็นเพราะได้ศึกษาข้อมูล อ่านรีวิวมาในระดับหนึ่ง ซึ่งเมื่อมีการให้บริการฉีดฟิลเลอร์มากขึ้นก็กลับพบผลข้างเคียงที่มากขึ้นตามไปด้วย”</p><p><img src="https://www.doctoryounger.com/img-uploads/111.jpg" alt=""></p><p>รศ.พญ.รังสิมา กล่าวอีกว่า ขณะนี้มีเคสคนไข้ที่ได้รับผลข้างเคียงส่งต่อเข้ามา หรือคนไข้มาด้วยตัวเองเป็นจำนวนมาก โดยผลข้างเคียงที่พบบ่อยคือ
  ผื่นแดง รอยช้ำ ซึ่งจะหายได้เองภายใน 2 อาทิตย์ แต่ผลข้างเคียงหนึ่งที่พบไม่บ่อย อัตราการเกิดไม่ถึง 1% แต่เมื่อพบแล้วเป็นปัญหา ได้แก่ เกิดรอยนูนหรือผิวไม่เรียบ ซึ่งเกิดจากการฉีดฟิลเลอร์ผิดชนิด ฉีดในตำแหน่งที่ไม่เหมาะสม หรือเกิดการอักเสบติดเชื้อตามรอยบริเวณที่ฉีด รวมถึงอาจเกิดอาการแพ้ฟิลเลอร์ที่มีลักษณะเป็นก้อนนูนแดงอักเสบได้ โดยในบริเวณที่ฉีดจะบวมแดง เช่น ฉีดจมูกจะไปบวมรอบดวงตา คนไข้จึงมาด้วยอาการตาบวม จมูกบวม ซึ่งสามารถรักษาได้โดยการฉีดสลาย แต่ผลข้างเคียงร้ายแรงกว่านั้นคือการเกิดเนื้อตาย เป็นผิวหนังที่ขาดเลือดมาเลี้ยงและเป็นแผล เมื่อสะเก็ดหลุดลอกมักจะกลายเป็นแผลหลุมลึกตามมา เช่น ที่บริเวณปลายจมูก และหน้าผาก ซึ่งเป็นตำแหน่งที่พบบ่อยที่สุด</p><p>“การเกิดเนื้อตายมักจะเกิดจากการฉีดฟิลเลอร์เข้าเส้นเลือดโดยตรง เช่น เส้นเลือดบนใบหน้า เวลาที่จิ้มเข็มลงไปบนผิวหนัง เมื่อดึงเข็มออกและมีเลือดติดเข็มออกมาด้วย นั่นแสดงว่าเราฉีดฟิลเลอร์เข้าเส้นเลือดโดยตรง ซึ่งในจุดนี้แพทย์ที่ผ่านการฝึกอบรมอย่างดีจะรู้ว่าไม่ควรฉีดเข้าไปในตำแหน่งนั้น ควรฉีดเข้าไปในตำแหน่งอื่นที่ไม่เจอเส้นเลือด เพราะฉะนั้นถ้าหากคนไข้ฉีดฟิลเลอร์ไปแล้วเกิดเป็นแผลดำ
  วินิจฉัยได้ง่าย ๆ ว่าเกิดเนื้อตายอย่างแน่นอน แต่เนื้อตายที่เกิดขึ้นในตอนแรกอาจจะดูไม่รุนแรงนัก มีลักษณะเป็นตุ่มหนอง ทำให้คนไข้คิดว่าเป็นแค่สิว หรือบางทีแพทย์ที่ไม่ชำนาญก็อาจจะไม่ทราบว่านี่เป็นอาการเริ่มแรกของเนื้อตาย”</p><p>ปัจจุบันมีวารสารทางการแพทย์อย่างน้อย 41 เรื่อง รายงานผู้ป่วยรวมถึง 61 รายที่เกิดผลข้างเคียงอย่างรุนแรงหลังการฉีดสารเติมเต็ม โดยตำแหน่งที่ฉีดแล้วทำให้เกิดเนื้อตายได้บ่อยที่สุดคือ จมูก (33.3%) และร่องแก้ม (31.2%) และตำแหน่งที่ฉีดแล้วทำให้เกิดตาบอดได้บ่อยที่สุดคือ หว่างคิ้ว (58.3%) และร่องแก้ม (33.3%) จากวารสารทางการแพทย์พบมีรายงานผู้ป่วยตาบอดจากการฉีดฟิลเลอร์ในประเทศเกาหลี 44 ราย และในสหรัฐอเมริกา 3 ราย ในประเทศไทยไม่เคยมีรายงานในวารสารทางการแพทย์ แต่มีการยืนยันผู้ป่วยแล้ว 8 ราย</p><p>อย่างไรก็ตาม การฉีดเสริมดั้งจมูกหรือในส่วนอื่น ๆ ของร่างกาย ขอให้พิจารณาศึกษาหาข้อมูล ทั้งสถานที่ที่จะรับบริการ สารที่แพทย์จะฉีดให้ และตัวแพทย์ที่ฉีดด้วย ถึงแม้ว่าผลข้างเคียงที่ร้ายแรงพบได้ไม่บ่อย แต่เมื่อเกิดขึ้นแล้วมีอันตรายมาก และแม้ว่าสารที่ฉีดได้มาตรฐานผ่านการรับรองจาก อย. ใช้เครื่องมืออุปกรณ์การฉีดที่ได้มาตรฐาน
  แต่ผู้ที่ฉีดขาดความชำนาญ หรือแม้กระทั่งผู้ที่มีความชำนาญฉีดถูกต้องตามหลักวิชาทุกประการ แต่ผู้รับบริการที่ลักษณะทางกายวิภาคผิดไปจากที่ควร เช่น อาจได้รับอุบัติเหตุมีพังผืด หรือเคยเสริมจมูกมาแล้ว หรือเป็นความแปรผันของเส้นเลือดที่แต่ละคนไม่เหมือนกัน ก็เป็นสาเหตุของผลข้างเคียงที่เป็นอันตรายได้</p><p>ทั้งนี้ข้อควรระวังสำหรับการเลือกใช้สารเติมเต็มเพื่อความสวยงาม คือ 1. ควรปรึกษาแพทย์ผู้เชี่ยวชาญเฉพาะทางก่อนทุกครั้ง 2. เลือกใช้บริการกับคลินิกที่มีมาตรฐานและได้รับใบอนุญาตให้ประกอบกิจการสถานพยาบาล (ตามพระราชบัญญัติสถานพยาบาล พ.ศ. 2541 และกฎกระทรวงว่าด้วยการประกอบกิจการสถานพยาบาล พ.ศ. 2545) อย่างถูกต้อง 3. ไม่ควรใช้สารอื่น ๆ ที่ไม่แน่ใจในมาตรฐานและความปลอดภัยมาฉีดเป็นอันขาด</p><p>ในประเทศไทยได้จัดประเภทของสารเติมเต็มหรือฟิลเลอร์ไว้เป็นยา การนำเข้าต้องผ่านการขึ้นทะเบียนกับสำนักยา อย. ซึ่งได้รับเพียงไม่กี่ชนิด ฟิลเลอร์ทั้งหมดที่ผ่านการรับรองจาก อย. ในปัจจุบันจะเป็น Hyaluronic Acid ทั้งสิ้น โดยสามารถตรวจสอบข้อมูลของสารเติมเต็มได้ที่ อย. หรือที่เว็บไซต์ http://fdaolap.fda.moph.go.th/logistics/drgdrug/DSerch.asp?id=drug
  และการฉีดสารเติมเต็มต้องฉีดโดยแพทย์เท่านั้น ซึ่งสามารถตรวจสอบรายชื่อแพทย์ได้ที่ http://www.tmc.or.th/service_check.php และสามารถตรวจสอบรายชื่อแพทย์ผิวหนังได้ที่ <a href="http://www.dst.or.th/html/index.php?op=article-search_md">http://www.dst.or.th/html/index.php?op=article-search_md</a></p><p><img src="https://www.doctoryounger.com/img-uploads/Filler3.jpg" alt=""></p><p>ด้าน นพ.ไพศาล ร่วมวิบูลย์สุข ประธานราชวิทยาลัยจักษุแพทย์แห่งประเทศไทย กล่าวว่า ลักษณะกายวิภาคของเส้นเลือดแดงบนใบหน้าของคนเรานั้น ประกอบด้วยแขนงแยกย่อยมากมาย โดยเฉพาะอย่างยิ่งมีแขนงเชื่อมกับเส้นเลือดหลักที่เลี้ยงดวงตาทั้งลูกเมื่อสารฟิลเลอร์เข้าสู่กระแสเลือด หากไปอุดที่ตำแหน่งที่เป็นเส้นเลือดหลักที่เลี้ยงดวงตา โดยเฉพาะเส้นเลือดแดงหลักที่เลี้ยงจอประสาทตาทั้งหมด จอประสาทตาก็จะขาดเลือด ซึ่งจะต้องรับการรักษาจากจักษุแพทย์ภายใน 90 นาที เซลล์รับแสงของจอประสาทตาจึงจะไม่ตายอย่างถาวร การอุดตันของเส้นเลือดแดงหลักที่เลี้ยงจอประสาทตานี้เกิดขึ้นได้ไม่ว่าจากฟิลเลอร์ชนิดไหน แม้ฟิลเลอร์ที่ทำจากไขมันของตนเอง</p><p>อย่างไรก็ดี แม้ว่าคนไข้ที่มีการอุดตันของเส้นเลือดแดงหลักที่เลี้ยงจอประสาทตาจากสารฟิลเลอร์จะมาถึงมือจักษุแพทย์ภายใน
  90 นาที ก็ยังรักษาให้การมองเห็นกลับคืนมาได้ยากมาก และปัจจุบันยังไม่มีมาตรฐานในการรักษาภาวะนี้จากสารฟิลเลอร์ มีเพียงการรักษาแบบประคับประคอง เช่น การพยายามลดความดันตา การพยายามเปลี่ยนแปลงการไหลเวียนของเลือดในตา การขยายหลอดเลือดแดงด้วยวิธีต่าง ๆ ได้แก่ การให้ออกซิเจนผสมคาร์บอนไดออกไซด์ โดยหวังให้ฟิลเลอร์เคลื่อนหลุดไปจากตำแหน่งที่อุดตัน ซึ่งโอกาสสำเร็จมีน้อยมาก</p><p>นอกจากนี้ยังพบอีกว่า คนไข้ที่มีการอุดตันของเส้นเลือดแดงหลักที่เลี้ยงจอประสาทตาจากสารฟิลเลอร์มักจะมีผิวหนังตายบริเวณใบหน้าใกล้เคียงกับดวงตาร่วมด้วย ซึ่งน่าจะเกิดจากการอุดตันของเส้นเลือดสาขาเดียวกัน สำหรับประเทศไทยมีคนไข้ 1 รายที่มีการอุดตันของเส้นเลือดแดงหลักของจอประสาทตาในตาสองข้าง ทำให้ตาบอดทั้งสองข้างหลังจากการฉีดฟิลเลอร์ไม่กี่นาที และยังมีคนไข้อยู่อีก 1 รายที่นอกจากจะมีการอุดตันของเส้นเลือดแดงหลักที่เลี้ยงจอประสาทตาแล้ว ยังมีการอุดตันของเส้นเลือดที่ไปเลี้ยงส่วนหน้าของดวงตาอีกด้วย การอุดตันของเส้นเลือดแดงหลักที่เลี้ยงจอประสาทตานั้น ด้านหน้าของดวงตาจะแลดูปกติ แต่จะมองไม่เห็น แต่ถ้าเกิดการอุดเส้นเลือดที่เลี้ยงส่วนหน้าของดวงตาด้วย
  จะทำให้กระจกตาขุ่นมัว เยื่อบุตาบวม เกิดการอักเสบของดวงตา อาจจะทำให้ดวงตาฝ่อเล็กลง ไม่ทำงาน จนต้องควักลูกตาออก บางรายสารฟิลเลอร์อาจเข้าไปอุดตันที่เส้นเลือดในสมองได้</p><p>การฉีดฟิลเลอร์นับเป็นการทำหัตถการทางการแพทย์อย่างหนึ่ง ซึ่งการทำหัตถการทางการแพทย์แทบทุกประเภทมีโอกาสเกิดภาวะแทรกซ้อนขึ้นได้ แต่จะมีโอกาสเกิดและมีความรุนแรงมากน้อยต่างกัน กรณีที่เกิดตาบอดขึ้นนี้นับเป็นภาวะแทรกซ้อนที่รุนแรงมาก ก่อนรับการฉีด ผู้รับการฉีดจะต้องรับรู้ถึงภาวะแทรกซ้อนนี้และพึงตระหนักว่าประโยชน์ที่คิดว่าจะได้รับจากการฉีดฟิลเลอร์นั้นคุ้มค่ากับความเสี่ยงที่อาจเกิดขี้นหรือไม่</p><h3>ที่มา: Wongkarnpat</h3>'
