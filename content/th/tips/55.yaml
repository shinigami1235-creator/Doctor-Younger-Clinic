title: 6 ขั้นตอนดูแลผิวหน้าที่คล้ำเสียจากแสงแดด ให้กลับมาขาวใส
date: 29 Oct 2017
source: Gangbeauty
body: '<p>ด้วยสภาพสภาวะอากาศในประเทศไทยที่เป็นเมืองร้อน แสงแดดมีความร้อนแรงแทบทั้งวันทำให้การใช้ชีวิตประจำวันของเราต้องเสี่ยงต่อแสง UV ยิ่งถ้าคนไหนไม่ได้ทาครีมกันแดดที่มีค่า SPF สูงๆ ก็เชื่อได้เลยว่าผิวหน้าจะต้องเกิดความคล้ำเสียจากแสงแดดแน่นอน อีกทั้งในตัวเมืองใหญ่ๆ เราต้องเจอทั้งมลภาวะที่เป็นพิษ ทั้งฝุ่น ทั้งควันจากท่อไอเสียของรถ ทำให้สิ่งสกปรกสะสมอยู่บนผิว เวลาผ่านไปนานๆเข้าก็ยิ่งทำให้ผิวคล้ำเสียและดูโทรมลงได้ ดังนั้นจะมาแนะนำ 6 ขั้นตอนดูแลผิวหน้าที่คล้ำเสียจากแดด ให้กลับมาขาวใสเหมือนเดิม เพียงแค่ทำตามขั้นตอนนี้รับรองว่าผิวพรรณจะดูดีขึ้นได้ในเวลาไม่นานแน่นอนค่ะ</p><p><img src="https://www.doctoryounger.com/img-uploads/002.jpg" alt=""></p><h3>ขั้นตอนที่ 1 ทำความสะอาดผิวหน้าเป็นประจำ</h3><p>ผิวคล้ำเสียจากแดด ไม่ใช่แค่แสงแดดเท่านั้นนะคะที่เป็นการทำร้ายผิว แต่ก็เกิดได้จากมลภาวะที่เป็นพิษเช่นฝุ่น ควัน ความร้อน แสงจากมือถือ หน้าจอคอมพิวเตอร์ ที่เราใช้เผชิญกันอยู่ในทุกๆวันได้เช่นกัน จนเกิดเป็นสิ่งสกปรกและความคล้ำเสียสะสมอยู่บนผิวหน้า ดังนั้นขั้นตอนแรกของการฟื้นฟูผิวคล้ำเสียให้กลับมาขาวใสเหมือนเดิมได้นั้นก็ต้องเริ่มจาก
  การทำความสะอาดผิวหน้าค่ะ โดย</p><p>- เลือกผลิตภัณฑ์ที่เหมาะสมกับสภาพผิวหน้า เช่นผิวมัน ไม่ควรใช้ผลิตภัณฑ์ที่มีส่วนผสมของน้ำมัน</p><p>- ทำความสะอาดผิวหน้าตามแนวรูขุมขน</p><p>- และหลังล้างหน้าควรใช้โทนเนอร์เช็ดเป็นประจำ</p><h3>ขั้นตอนที่ 2 ใช้ครีมบำรุงผิวหน้า</h3><p>หลังจากทำความสะอาดผิวหน้าจนหมดจดแล้ว สาวๆ อย่าลืมทาครีมบำรุงผิวก่อนนอนด้วยนะคะ อย่างเช่นครีมที่มีส่วนผสมของไวท์เทนนิ่ง จะช่วยฟื้นฟูผิวที่คล้ำเสียให้ค่อยๆกลับมาดูขาวกระจ่างใสเหมือนเดิมได้ค่ะ นอกจากนั้นการใช้ครีมบำรุงผิวหน้าในตอนเช้าก่อนลงครีมกันแดด และแต่งหน้า ก็ช่วยให้ผิวพรรณดูดีได้มากยิ่งขึ้นค่ะ</p><h3>ขั้นตอนที่ 3 น้ำมันสมุนไพรช่วยได้</h3><p>น้ำมันสมุนไพรมีประโยชน์หลากหลายมากเลยทีเดียวค่ะ สามารถช่วยลดอาการแสบจากการโดนแสงแดงเผา ช่วยฟื้นฟูผิวที่คล้ำเสียให้กลับมาดีขึ้น นอกจากนั้นยังช่วยลดริ้วรอยเหี่ยวย่นต่างๆ ช่วยให้ผิวพรรณเต่งตึงกระชับ ดูสดใส ซึ่งน้ำมันสมุนไพรมีหลายอย่างเลยนะคะ แต่ที่แนะนำว่าดีมากเลยคือ น้ำมันมะพร้าว น้ำมันมะกอก และน้ำมันละหุ่งค่ะ</p><p><img src="https://www.doctoryounger.com/img-uploads/001.jpg" alt=""></p><h3>ขั้นตอนที่
  4 ห้ามลืมทาครีมกันแดด</h3><p>ข้อนี้จะขาดไปไม่ได้เลยนะคะ เพราะแสงแดดในไทยแรงมากขึ้นรื่อยๆ ถ้าเราไม่ทาครีมกันแดดก่อนออกแดด หรือทำกิจกรรมกลางแจ้ง ก็จะโดนแสง UV ทำร้ายผิวพรรณของเราได้อย่างง่ายๆเลยค่ะ ซึ่งการทาครีมกันแดดเราก็จะต้องเลือค่า SPF ให้เหมาะกับกิจกรรมที่เราทำนั้นๆด้วยนะคะ ยิ่งถ้าต้องออกแดดกลางแจ้งแรงเป็นระยะเวลานาน ยิ่งต้องทาครีมกันแดดที่มีค่า SPF 50+++ นอกจากนั้นแม้จะนั่งอยู่ในที่ร่มหรือในบ้านก็สามารถโดนแสงแดดทำร้ายได้เหมือนกัน ดังนั้นต้องทาครีมกันแดดด้วยเช่นกันประมาณ SPF 10-20 ก็สามารถช่วยปกป้องผิวได้แล้วค่ะ</p><h3>ขั้นตอนที่ 5 สครับผิวหน้า</h3><p>การสครับผิวหน้า หรือการขัดผิวจะเป็นอีกหนึ่งตัวช่วยที่ขจัดเซลล์ผิวที่ตายแล้ว หรือเซลล์ผิวที่คล้ำเสียให้หลุดออกได้อย่างง่ายขึ้นค่ะ และเมื่อเราบำรุงผิวโดยผลิตภัณฑ์ต่างๆก็สามารถทำให้ซึมซาบเข้าสู่ผิวได้ดีมากยิ่งขึ้น ผิวพรรณจึงค่อยๆ ฟื้นฟูและกลับมาขาวกระจ่างใส ดังนั้นเราควรสครับผิวอย่างน้อยสัปดาห์ละครั้งนะคะ</p><p><img src="https://www.doctoryounger.com/img-uploads/003.jpg" alt=""></p><h3>ขั้นตอนที่ 6 ใส่ใจสุภาพ</h3><p>ดูแลผิวพรรณภายนอกไปแล้ว
  ผิวพรรณภายในก็ต้องดูแลและใส่ใจด้วย เช่นการรับประทานอาหารที่มีประโยชน์ ให้ครบ 5 หมู่ ทานผัก ผลไม้ และดื่มน้ำอย่างน้อยวันละ 8-10 แก้ว นอกจากนั้นยังต้องออกกำลังกาย และนอนหลับพักผ่อนให้เพียงพอ ก็จะช่วยให้ร่างได้ซ่อมแซมผิวพรรณจากภายใน ส่งผิวต่อผิวพรรณภายนอกให้กลับมาสวยใสได้แล้วค่ะ</p><p>6 เคล็ดลับขั้นตอนง่ายๆเพียงเท่านี้ ก็สามารถฟื้นฟูและค่อยๆซ่อมแซมผิวพรรณที่คล้ำเสียให้กลับมาขาวกระจ่างใสได้แล้วค่ะ เพียงแต่ห้ามขี้เกียจ ต้องขยันและมั่นทำเป็นประจำเท่านั้นเองค่ะ</p><h3>ที่มา: Gangbeauty</h3>'
