title: 3 เคล็ดลับปรับความสวยหลังเจอหายนะ
date: 08 Apr 2017
source: Dichan
body: '<p>หายนะทางด้านความงาม อย่างการร้องไห้ อาการหวัดคัดจมูก หรือสิวเห่อขึ้นมานั้น อาจเป็นอุปสรรคต่อความสวยความงามของคุณไม่มากก็น้อย ฉะนั้นเพื่อให้คุณฝ่าฟันหายนะพวกนี้ไปได้ เราก็มีเคล็ดลับดีๆ มาบอกคุณแล้ว</p><h3>1. วิธีเยียวยาจมูกแห้งจากการสั่งน้ำมูก</h3><p>การสั่งน้ำมูกบ่อยๆ อาจทำให้ผิวบริเวณจมูกเกิดอาการระคายเคืองจนมีสภาพที่แห้งและลอกได้ ฉะนั้นคุณจึงควรเลือกใช้กระดาษทิชชูที่มีความนุ่มเป็นพิเศษ นอกจากนี้ก็ควรหลีกเลี่ยงสบู่และผลิตภัณฑ์ขัดผิว เพราะอาจจะทำให้เกิดอาการระคายเคืองมากขึ้น ทางที่ดีคุณควรทาโลชั่นที่มีความเข้มข้นสูงหลังจากสั่งน้ำมูกทุกครั้ง เพื่อเป็นการป้องกันเอาไว้ก่อนที่อาการระคายเคืองจะเกิดขึ้น ถ้าผิวบริเวณจมูกมีอาการแห้งมาก ก็ผสมน้ำมันเข้ากับมอยส์เจอไรเซอร์ชนิดไม่มีกลิ่นหอม แล้วทาลงตรงบริเวณที่มีปัญหา ถ้าคุณใช้น้ำมันจากแคปซูลวิตามินอีก็จะช่วยเสริมความแข็งแร็งให้กับผิวได้ แต่ถ้าคุณใช้น้ำมันยูคาลิปตัสก็จะช่วยให้คุณหายใจได้สะดวกขึ้น ถ้าคุณจำเป็นต้องออกไปพบปะใครในช่วงที่เป็นหวัดอยู่นี้ ก็ปกปิดรอยแดงๆด้วยคอนซีลเลอร์ชนิดสีเขียว ก่อนจะตามด้วยคอนซีลเซอร์และครีมรองพื้นตามปกติ</p><p><img
  src="https://www.doctoryounger.com/img-uploads/22.jpg" alt=""></p><h3>2. วิธีฟื้นฟูความสวยหลังร้องไห้</h3><p>นี่คือเคล็ดลับดีๆที่จะช่วยให้คุณไม่ต้องสวมแว่นตาดำหลังร้องไห้อยู่ตลอดเวลา</p><p>- ใช้ดินสอเขียนตาสีเนื้อแทนสีดำ เพราะสีเนื้อที่เข้มกว่าสีผิวของคุณเล็กน้อยจะช่วยปกปิดขอบตาแดงๆจากการร้องไห้ได้เป็นอย่างดี ถ้าคุณเลือกแบบที่เป็นสีแมตต์จะช่วยให้ดูเป็นธรรมชาติได้ แต่ถ้าคุณเลือกแบบที่มีชิมเมอร์ผสมอยู่ด้วย ก็จะช่วยให้ดวงตาดูสดใสขึ้นเยอะ</p><p>- บลัชออนชนิดครีมเป็นอีกหนึ่งอาวุธที่ช่วยคุณได้เป็นอย่างดี เพราะจะช่วยให้ผิวหน้าดูเปล่งปลั่งสดใสอย่างเป็นธรรมชาติ ถ้าคุณเป็นคนผิวขาวก็เลือกเฉดสีชมพูอ่อน แต่ถ้าคุณมีผิวคล้ำก็เลือกเฉดสีชมพูอมน้ำตาลหรือสีพีช</p><p>- ถ้าใต้ตาดูแดงช้ำ ก็ลองใช้คอนซีลเลอร์ที่ออกโทนเหลืองๆ ซึ่งจะช่วยกลบเกลื่อนให้ดูสดใสขึ้นได้ แต่ถ้าคุณอยากให้ดูเป็นธรรมชาติมากกว่าก็เลือกโทนสีพีช</p><p>- ถ้าผิวหน้าของคุณดูเหนื่อยอ่อน ก็ลองตบตาให้ผิวดูเปล่งปลั่งสดใสขึ้นมาด้วยสเปรย์น้ำแร่ ซึ่งถ้าคุณนำไปแช่ตู้เย็นก่อน ก็จะช่วยเยียวยาปัญหาหน้าตาบวมให้คุณได้ด้วย</p><p><img src="https://www.doctoryounger.com/img-uploads/11.jpg"
  alt=""></p><h3>3. เยียวยาสิวด้วยตัวเอง</h3><p>เรามีทรีทเม้นท์ง่ายๆที่จะช่วยให้คุณจัดการกับสิวได้อย่างมีประสิทธิภาพด้วยมือของคุณเองมาบอกแล้ว ขั้นแรกก็เติมน้ำอุ่นลงไปในอ่างล้างหน้าประมาณเศษหนึ่งส่วนสามส่วน แล้วเติมน้ำมันยูคาลิปตัส และน้ำมันที-ทรี ลงไปอย่างละหนึ่งช้อนโต๊ะ จุ่มผ้าขนหนูลงในน้ำที่ผสมไว้นั้น บิดน้ำออก แล้วโปะผ้าขนหนูลงบนใบหน้าเป็นเวลาห้านาที จุ่มผ้าขนหนูลงในน้ำอีกครั้ง แล้วทำซ้ำแบบเดียวกันอีก 8 ถึง 10 ครั้ง ทั้งน้ำมันยูคาลิบตัสและน้ำมันที-ทรีต่างก็มีคุณสมบัติในการต่อต้านการอักเสบ ซึ่งช่วยฆ่าเชื้อแบคทีเรียอันเป็นต้นเหตุของสิว จากนั้นก็แต้มยารักษาสิวที่มีส่วนผสมของกรดซาลิไซลิค โดยแตะแต้มเฉพาะในบริเวณที่มีปัญหา จากนั้นใช้นิ้วตบเบาๆ ให้ตัวยาแทรกซึมเข้าไปในผิว ตบท้ายด้วยการแช่หินกรวดแบนๆที่มีผิวเกลี้ยงๆให้เย็น แล้วนำมากดลงบนจุดที่เป็นรอยแดงๆ ซึ่งจะช่วยลดการอักเสบได้อีกทาง</p><h3>ที่มา: Dichan</h3>'
