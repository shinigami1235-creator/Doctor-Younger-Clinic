title: เคล็ดลับป้องกันสิวอย่างได้ผล แม้ต้องแต่งหน้าทุกวันก็ตาม
date: 17 Feb 2018
source: Sanook
body: '<p>ผู้หญิงกับเรื่องความสวยความงามเป็นของคู่กันและเห็นจะขาดกันไม่ได้ โดยเฉพาะอย่างยิ่ง การแต่งหน้าที่จะต้องมีในชีวิตประจำวัน แม้ว่าการแต่งหน้าจะช่วยทำให้ผิวมีความเรียบเนียนและดูสวยมากยิ่งขึ้น ทำให้ใบหน้าสวยแบบมีมิติราวกับคนละคนก็ตาม แต่หลายคนกลับต้องเจอกับปัญหาสิวที่มาเยือนอย่างไม่ทันตั้งตัว ถ้าคุณกำลังเจอปัญหานี้ก็อย่าได้กลุ้มใจไป เพราะเรามีเคล็ดลับป้องกันสิว แม้ต้องแต่งหน้าทุกวันมาฝากดังนี้แล้วค่ะ</p><p><img src="https://www.doctoryounger.com/img-uploads/1.jpg" alt=""></p><h3>ใช้ครีมละลายสิวเป็นตัวช่วย</h3><p>ในวันที่สิวขึ้นมาอย่างกะทันหัน แต่ต้องแต่งหน้าออกไปข้างนอก คุณสามารถใช้ตัวช่วยฉุกเฉินอย่างครีมละลายสิว โดยนำมาแต้มลงไปก่อนการแต่งหน้า เพียงเท่านี้ตัวยาจากครีมก็จะช่วยยับยั้งและป้องกันไม่ให้อาการของสิวลุกลามหนักในระหว่างวันได้มากขึ้นแล้ว</p><h3>ใช้เครื่องสำอางที่เหมาะกับผิว</h3><p>การใช้เครื่องสำอางที่เหมาะกับผิวหน้า เรียกได้ว่าเป็นสิ่งสำคัญอย่างมากที่ควรตระหนักไว้ เพราะเครื่องสำอางที่เหมาะสมกับผิวจะช่วยเซฟใบหน้าไม่ให้มีปัญหาได้ง่าย เช่น คนผิวมัน ควรเลือกเครื่องสำอางแบบ Oil free,
  ผิวแห้ง ควรเลือกชนิดที่มีความชุ่มชื้น ในขณะที่สาวผิวแพ้ง่าย ควรจะเลือกเครื่องสำอางที่ปราศจากแอลกอฮอลล์และน้ำหอม เป็นต้น เพียงแค่นี้สิวก็จะไม่มากวนใจบนใบหน้าคุณได้ง่ายๆ แล้วค่ะ</p><p><img src="https://www.doctoryounger.com/img-uploads/3.jpg" alt=""></p><h3>แต่งหน้าได้ แต่อย่ามากเกินไป</h3><p>แม้ว่าจะเป็นสิว สาวๆ ก็สามารถที่จะแต่งหน้าได้นะ แต่มีข้อแนะนำว่าควรแต่งหน้าแบบบางเบาเท่านั้น อย่าทาแป้งหรือลงรองพื้นจนหนาเตอะมากเกินไป ไม่อย่างนั้นแล้ว สิวจะต้องถามหาแน่ๆ</p><h3>ล้างหน้าให้สะอาดหมดจดทุกวัน</h3><p>การแต่งหน้า อาจทำให้สิ่งสกปรกหรือสารเคมีจากเครื่องสำอางตกค้างในผิวของเราได้ ดังนั้น จึงควรล้างหน้าให้สะอาดเป็นประจำทุกวัน เพราะสารเคมีจากเครื่องสำอางบวกกับฝุ่นละอองหรือมลภาวะที่สาวๆ เจออยู่ทุกวัน อาจรวมตัวพากันอุดตันในรูขุมขน และกลายเป็นต้นเหตุของการเกิดสิวได้ง่ายดายนั่นเอง ดังนั้น จึงไม่ควรขี้เกียจล้างหน้าให้สะอาดหลังจากกลับมาถึงบ้านแล้วเด็ดขาด แม้ว่าจะดึกดื่นแค่ไหนก็ตาม ห้ามทิ้งตัวลงนอนทันที ไม่อย่างนั้นสิวบุกขึ้นหน้าชัวร์</p><p><img src="https://www.doctoryounger.com/img-uploads/0.jpg" alt=""></p><h3>ใช้ผลิตภัณฑ์
  Cleaning Water</h3><p>คลีนซิ่ง ถือว่าเป็นไอเท็มที่ช่วยได้มากทีเดียวในการทำความสะอาดผิวหน้าได้อย่างหมดจด ซึ่งการล้างหน้าที่เต็มไปด้วยเครื่องสำอางนั้น การใช้แค่โฟมหรือสบู่เพียงอย่างเดียวคงไม่พอ เราควรจะใช้คลีนซิ่งหรือเมคอัพรีมูฟเวอร์ เข้าไปช่วยเช็ดคราบเครื่องสำอางออกให้หมด จากนั้นจึงล้างด้วยโฟมล้างหน้าตามขั้นตอนปกติ ทั้งนี้เพื่อเป็นการกำจัดสิ่งสกปรกให้หลุดไปจากผิวได้อย่างแท้จริง เพียงแค่นี้สิวก็ไม่กล้าบุกมากวนใจผิวสวยแล้ว</p><p>เป็นอย่างไรกันบ้าง สำหรับเคล็ดลับป้องกันสิว แม้ว่าจะต้องแต่งหน้าเป็นประจำทุกวัน สาวๆ เพียงทำตามนี้ ผิวหน้าสวยใสไร้สิวก็จะเป็นของคุณแน่นอนค่ะ</p><h3>ที่มา: Sanook</h3>'
