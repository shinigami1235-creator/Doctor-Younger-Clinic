title: แก้ปัญหาถุงใต้ตาบวมง่ายๆ ไม่ต้องใช้ครีม
date: 05 Aug 2017
source: Sanook
body: '<p>ถุงใต้ตาบวม เป็นอีกปัญหาหนึ่งที่มักจะทำให้สาวๆ เกิดความกังวลเป็นอย่างมาก เพราะนั่นเป็นจุดเริ่มต้นของความหมองคล้ำ ไม่สดใสและการเกิดริ้วรอยรอบดวงตาเลยทีเดียว แต่ก็ไม่ต้องกังวลไป เพราะการแก้ปัญหาถุงใต้ตาบวมทำได้ไม่ยาก แถมไม่ต้องใช้ครีมราคาแพงอีกด้วย ซึ่งจะมีวิธีการอย่างไร มาดูกัน</p><h3>ประคบด้วยแตงกวา</h3><p>แตงกวามีมอยเจอร์ไรเซอร์จากธรรมชาติ ที่จะช่วยบำรุงและแก้ปัญหาถุงใต้ตาบวมได้เป็นอย่างดี และสามารถลดความหมองคล้ำรอบดวงตาได้อีกด้วย โดยให้นำแตงกวาแช่เย็นมาฝานเป็นแว่นๆ ประมาณ 3-4 แว่น จากนั้นนำมาประคบบนดวงตาทั้งสองข้างและถุงใต้ตา ทิ้งไว้ประมาณ 30 นาทีแล้วเอาออก สามารถทำก่อนนอนหรือหลังตื่นนอนตอนเช้าก็ได้</p><p><img src="https://www.doctoryounger.com/img-uploads/221144.jpg" alt=""></p><h3>ประคบด้วยมะเขือเทศ</h3><p>มะเขือเทศมีวิตามินซีที่จะช่วยลดความหมองคล้ำ อาการบวมและสามารถบำรุงดวงตาให้สดใสได้เป็นอย่างดี โดยให้นำมะเขือเทศมาหั่นเป็นแว่นบางๆ จากนั้นวางลงบนดวงตาทั้งสองข้าง ทิ้งไว้ประมาณ 30 นาทีแล้วเอาออก จะรู้สึกได้ถึงความสดชื่นและช่วยให้ดวงตาเกิดความผ่อนคลายได้อีกด้วย</p><h3>ประคบด้วยกากชาใช้แล้ว</h3><p>สำหรับใครที่คนในครอบครัวดื่มชาเป็นประจำ
  กากชาที่ใช้แล้วอย่าเพิ่งทิ้ง แนะนำให้เอากากชามาห่อด้วยผ้าขาวบางทำเป็นลูกประคบขนาดพอเหมาะ เอาน้ำอุ่นมาราดและบีบให้น้ำออกมาเล็กน้อย จากนั้นนำมาประคบบนเปลือกตาทั้งสองข้าง ปล่อยทิ้งไว้ประมาณ 30 นาทีแล้วล้างออก ทำบ่อยๆ ถุงใต้ตาจะค่อยๆ ลดอาการบวมลงในที่สุด</p><h3>ประคบด้วยมันฝรั่ง</h3><p>มันฝรั่งเป็นอีกตัวช่วยหนึ่งที่จะช่วยแก้ปัญหาถุงใต้ตาบวมและฟื้นฟูดวงตาให้สดใสได้ดี โดยให้นำมันฝรั่งมาปอกเปลือก จากนั้นฝานเป็นชิ้นบางๆ นำมันฝรั่งที่ฝานแล้วมาประคบบนดวงตาทั้งสองข้างประมาณ 30 นาที แล้วเอาออก ทำบ่อยๆ เป็นประจำก็จะช่วยลดอาการบวมได้ดีอย่างแน่นอน</p><p><img src="https://www.doctoryounger.com/img-uploads/33366552.jpg" alt=""></p><h3>นวดด้วยน้ำมันอัลมอนด์</h3><p>น้ำมันอัลมอนด์อุดมไปด้วยวิตามินมากมายที่มีส่วนช่วยในการบำรุงผิวรอบดวงตาและสามารถลดอาการบวมได้ดี โดยให้นำน้ำมันอัลมอนด์มานวดเบาๆ ที่บริเวณถุงใต้ตาก่อนนอน ทิ้งไว้จนเช้าแล้วจึงล้างหน้าตามปกติ เท่านี้ปัญหาถุงใต้ตาก็จะไม่มากวนใจคุณอีกต่อไป</p><p>เห็นไหมว่าปัญหาถุงใต้ตาสามารถจัดการได้ไม่ยาก เพียงแค่ใช้ตัวช่วยจากธรรมชาติเท่านั้น ซึ่งนอกจากจะให้ผลลัพธ์ในการลดอาการบวมของถุงใต้ตาได้ดีแล้ว
  ก็ยังช่วยบำรุงดวงตาให้สดใสและลดอาการเหนื่อยล้าของดวงตาได้ดีอีกด้วย เพราะฉะนั้นมาลองมาแก้ปัญหาถุงใต้ตาบวมด้วยวิธีเหล่านี้กันดูสิ</p><h3>ที่มา: Sanook</h3>'
