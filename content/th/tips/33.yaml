title: ชะลอความแก่ด้วยศัลยกรรม อยู่ได้นานแค่ไหนกัน??
date: 22 Jul 2017
source: med.mahidol.ac.th
body: '<p>สิ่งที่สาวๆ เป็นกังวลและหวานกลัวเอามากๆ เมื่อเวลาอายุมากขึ้น นั่นก็คือ ปัญหาของริ้วรอย หรือความหย่อนคล้อยของผิวบนใบหน้า ซึ่งสิ่งที่จะช่วยทำให้ปัญหาเหล่านั้นหมดไปก็คือ การรู้จักบำรุงและดูแลผิวหน้าด้วยการทาครีม หรือการศัลยกรรม และแน่นอนว่าวิธีที่ได้รับความนิยมมากที่สุดในหมู่ของสาวๆ ก็คือ การศัลยกรรม เพราะมันเป็นวิธีที่เห็นผลได้รวดเร็วที่สุด แต่มันจะอยู่ได้นานแค่ไหน และมีประโยชน์มากน้อยเพียงใด วันนี้จะมาไขข้อข้องใจให้ฟังกันค่ะ</p><p><img src="https://www.doctoryounger.com/img-uploads/999.jpg" alt=""></p><p>เริ่มด้วยครีมบำรุงผิว ตัวช่วยแรกที่หลายคนนิยมใช้ เพื่อย้อนวัยให้กับผิวและใบหน้า ก่อนอื่นเลยสิ่งที่สาวๆ ควรจะให้ความสำคัญก็คือ สาวๆ จะต้องรู้ว่าคุณสมบัติของครีมแต่ละตัวนั้นช่วยในเรื่องอะไรบ้าง เช่น ครีมที่ให้ความชุ่มชื่น ก็ต้องดูว่าเหมาะกับสภาพผิวของเรามากน้อยเพียงใด ดูในเรื่องของส่วนผสม เช่น สารกันแดด สารที่มีการกระตุ้นคอลลาเจน (อนุพันธุ์ของวิตามิน A , C , Peptide) เป็นต้น</p><p>ส่วนผลิตภัณฑ์ที่ลดริ้วรอย ก็คงต้องพิจารณาว่าสามารถเห็นผลได้ภายในกี่วัน ทั้งนี้ยังขึ้นอยู่กับปัญหาหน้าด้วยว่าเกิดขึ้นมานานแค่ไหน
  หากเกิดขึ้นนานแล้วการใช้ครีมลดริ้วรอยที่สามารถเห็นผลภายในไม่กี่วัน ก็คงจะไม่เห็นผลตามที่ผลิตภัณฑ์ระบุไว้ หรือการใช้ครีมยกกระชับผิวหน้า ที่ช่วยให้หน้าเต่งตึง แต่ก็ไม่สามารถเห็นผลได้ทันทีทันใด</p><p>ส่วนเรื่องของการศัลยกรรม เพื่อลดเลือนริ้วรอยบนผิวนั้น ก็ต้องรู้ไว้ก่อนเลยว่า ความจริงแล้วริ้วรอยบนใบหน้ารักษาได้ยากทุกริ้วรอย วิธีการเลือกใช้เลเซอร์จะสามารถลดเลือนริ้วรอยได้ยากหรือง่ายนั้นก็ขึ้นอยู่กับว่าทำเลเซอร์แบบไหน เช่น การเลเซอร์เพื่อกลอหน้าลอกผิวออก หรือการ Botox , Filler และร้อยไหม ก็จะมีความแตกต่างกันออกไป</p><p><img src="https://www.doctoryounger.com/img-uploads/888.jpg" alt=""></p><p>Botox เป็นการลดการทำงานของกล้ามเนื้อ ริ้วรอยบนใบหน้าที่เหมาะกับการ Botox คือ ตีนกา ริ้วรอยบนหน้าผาก และร่องคิ้ว โดยการ Botox จะช่วยลดการทำงานของกล้ามเนื้อเพียงชั่วคราว เมื่อยาหมดฤทธิ์ก็จะกลับสู่สภาวะปกติ ซึ่งการ Botox จะมีระยะเวลาประมาณ 3-6 เดือน</p><p>Filler คือการเติมเต็มร่องลึก เช่น แก้มตอบ ร่องแก้ม หรือริ้วรอยบริเวณรอบริมฝีปาก โดยการ Filler จะมีระยะเวลาอยู่ประมาณ 1 ปี ปัจจุบันนี้วิวัฒนาการเริ่มเปลี่ยนนอกจาก
  Filler ก็จะมีการตบหน้าช่วยให้หน้าเข้ารูป ตึง กระชับ เข้ามา แต่วิธีนี้จะเห็นผลในระยะเวลาชั่วคราวเท่านั้น</p><p>แม้ความสวยจะเป็นสิ่งที่สาวๆ หลายคนยังต้องการ เมื่ออายุมากขึ้นแล้วก็ตาม แต่ก่อนที่จะตัดสินใจทำอะไร อยากให้สาวๆ ลองศึกษาหาข้อมูลให้ละเอียด รวมถึงผลกระทบที่อาจเกิดขึ้นในภายภาคหน้าด้วย อย่างไรก็ตามการรู้จักบำรุงตัวเองให้สวยออกมาจากภายใน ตั้งแต่การมีสุขภาพกาย สุขภาพใจ และสุขภาพผิวที่ดี ก็ย่อมยืนยาวกว่าอย่างแน่นอนค่ะ</p><h3>ที่มา: med.mahidol.ac.th</h3>'
