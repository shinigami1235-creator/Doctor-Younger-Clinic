title: วิธีล้างเครื่องสำอางกันน้ำ สเต็ป บาย สเต็ป ให้หน้าใสกิ๊ก ไม่เหลือสิ่งตกค้าง!
date: 24 Jan 2018
source: Kapook
body: '<p>วิธีล้างเครื่องสำอางกันน้ำ ที่ติดทนนานมีเทคนิคง่ายๆ เพียงแค่ทำตามขั้นตอนแบบสเต็ป บาย สเต็ปตามที่นำเสนอ รับรองว่าทั้งคราบเครื่องสำอางและสิ่งตกค้างบนใบหน้าจะหายวับสะอาดหมดจดอย่างแน่นอน!</p><p>คุณสาวๆ คงเคยเผชิญปัญหาเกี่ยวกับวิธีล้างเครื่องสำอางกันน้ำที่ติดทนนานตลอดทั้งวันไม่ออก ไม่ว่าจะเช็ดซ้ำๆ หลายรอบยังไง คราบเครื่องสำอางก็ยังคงติดหนึบไม่หลุดออกไปสักที หนำซ้ำผิวถูกทำร้ายและมีสิ่งตกค้างบนใบหน้า ทำให้ใบหน้าอุดตันอีก จนรู้สึกเฟลใช่มั้ยล่ะคะ? แต่ช้าก่อนค่ะ! ปัญหานี้จะไม่ใช่เรื่องยุ่งยากสำหรับสาวๆ หลายคนอีกต่อไป วันนี้ขอนำเสนอ วิธีล้างเครื่องสำอางกันน้ำแบบถูกวิธีสเต็ป บาย สเต็ป ที่ช่วยปกป้องผิวหน้าและขนตาไม่ให้ถูกทำร้ายในขณะที่กำลังล้างเครื่องสำอางกันน้ำออก และที่สำคัญช่วยปกป้องและบำรุงผิวหน้าให้กลับมามีสุขภาพผิวดีได้อีกด้วย</p><h3>Step 1 : เช็ดเมคอัพรอบดวงตาและลิปสติกให้ถูกวิธี </h3><p>การเช็ดเครื่องสำอางที่ถูกต้อง คือการเช็ดเมคอัพรอบดวงตาออกก่อน แล้วค่อยไล่ไปเช็ดส่วนอื่นๆ เนื่องจากสารเคมีและสิ่งสกปรกที่ติดอยู่กับเครื่องสำอาง อาจหลุดเข้าไปทำร้ายดวงตาของเราในขณะที่กำลังล้างหน้าได้ อีกทั้งผิวบริเวณรอบดวงตานั้นบอบบางดุจทารก
  ดังนั้นการเช็ดทำความสะอาดเครื่องสำอางที่อยู่รอบๆ ดวงตาจึงเป็นสิ่งสำคัญอันดับแรกในการทำความสะอาดใบหน้า โดยสาวๆ ควรล้างมาสคาร่าและอายแชโดว์ออกเสียก่อน แล้วจึงเช็ดลิปสติกออก ด้วยวิธีดังต่อไปนี้ค่ะ</p><p><img src="https://www.doctoryounger.com/img-uploads/22222.jpg" alt=""></p><p>1. วิธีล้างมาสคาร่ากันน้ำ ที่ติดทนนานให้ออกได้อย่างง่ายดาย โดยไม่ต้องสูญเสียขนตาหรือตาแดงบวมช้ำจากการขยี้ แนะนำให้ใช้อาย รีมูฟเวอร์หรือน้ำมันมะพร้าวเทลงบนแผ่นสำลี แล้วโปะลงไปที่ขนตาทั้งสองข้างนาน 30 วินาที แล้วค่อยๆ เช็ดเอาเนื้อมาสคาร่าที่ติดขนตาอยู่ออก หรือใช้น้ำมันมะกอกที่สามารถทำลายคุณสมบัติกันน้ำของมาสคาร่าได้ หยดลงบนนิ้วมือเล็กน้อยแล้วลูบเบาๆ ที่ขนตาระหว่างหัวแม่มือนิ้วโป้งและนิ้วชี้ จากนั้นใช้คอตตอนบัดจุ่มคลีนซิ่งเช็ดเกลี่ยไปตามโคนขนตาที่ยังมีเศษมาสคาร่าติดอยู่ออกให้หมด เพียงเท่านี้มาสคาร่าก็จะหลุดออกอย่างง่ายดาย </p><p>2. เช็ดอายแชโดว์และลิปสติก โดยใช้ อาย เมคอัพ รีมูฟเวอร์ โดยสาวๆ ควรเลือกใช้สูตรที่สามารถล้างเครื่องสำอางกันน้ำได้อย่างอ่อนโยนและไม่ระคายเคืองต่อผิวบอบบางรอบดวงตา หรือสาวๆ จะเลือกใช้คลีนซิ่ง วอเตอร์
  สูตรน้ำแร่ที่ช่วยถนอมผิวให้ชุ่มชื่นก็ได้เช่นกันค่ะ โดยขั้นตอนการเช็ดให้ใช้สำสีชนิดแผ่นที่ชุ่มไปด้วยคลีนซิ่งโปะลงไปที่บริเวณเปลือกตา ทิ้งไว้สักครู่เพื่อให้คลีนซิ่งละลายและดูดซับเครื่องสำอางออก แล้วค่อยๆ รูดแผ่นสำลีจากเปลือกตาลงมาตามแนวเส้นขนตาเบาๆ และห้ามขยี้เด็ดขาดนะคะเพราะจะทำให้เกิดริ้วรอยและขนตาหลุดร่วงได้ จากนั้นกลับด้านแผ่นสำลีแผ่นเดิมโปะลงที่เปลือกตา แล้วเช็ดเครื่องสำอางออกซ้ำอีกรอบให้สะอาด เท่านี้ก็เรียบร้อยแล้วล่ะค่ะ</p><p>3. ถึงแม้ว่าลิปสติกที่คุณสาวๆ ใช้จะติดทนนานยากต่อการเช็ดออก ไม่ต้องกังวลไปค่ะ ตัวช่วยที่ดีที่สุดในนาทีนี้คือวาสลีน ง่ายๆ เพียงแค่ทาวาสลีนลงไปบนริมฝีปากทิ้งไว้ 3 นาที ในระหว่างนี้ให้เม้มริมฝีปากเป็นระยะๆ เพื่อช่วยให้เนื้อลิปสติกละลายหลุดออกมา จากนั้นก็ใช้แผ่นสำลีเช็ดทำความสะอาดลิปสติกออกให้หมด เท่านี้ก็เรียบร้อย แต่คุณสาวๆ ต้องไม่ลืมที่จะทาลิปบาล์มบำรุงหลังจากล้างทำความสะอาดหน้าเสร็จเรียบร้อยแล้วด้วยนะคะ เพื่อช่วยบำรุงให้ริมฝีปากชุ่มชื่นไม่แห้งแตกเป็นขุยค่ะ</p><p><img src="https://www.doctoryounger.com/img-uploads/3333.jpg" alt=""></p><h3>Step 2 : เช็ดเครื่องสำอางออกจากผิวหน้าให้หมดก่อนล้างหน้า</h3><p>เมื่อล้างเครื่องสำอางบริเวณรอบดวงตาและปากเสร็จแล้ว
  ขั้นตอนต่อไปให้สาวๆ เช็ดเครื่องสำอางส่วนที่เหลืออยู่ตามส่วนต่างๆ บนใบหน้า โดยแนะนำให้ใช้คลีนซิ่ง เมคอัพ รีมูฟเวอร์ เช็ดทำความสะอาดแป้ง รองพื้น ชิมเมอร์ และครีมกันแดด ตั้งแต่หน้าผาก คิ้ว แก้ม จมูก คางและบริเวณลำคออย่างเบามือ ทั้งนี้คุณสาวๆ ควรเลือกใช้คลีนซิ่งที่เหมาะกับสภาพผิวหน้าของตัวเองด้วยนะคะ อย่างเช่น คลีนซิ่งออยจะช่วยละลายเครื่องสำอางและดูดซับสิ่งสกปรกให้หลุดออกมา และช่วยให้ผิวไม่แห้งตึง คลีนซิ่งมิลล์ช่วยเพิ่มความชุ่มชื่นให้กับผิว สำหรับผิวแพ้ง่ายควรใช้โลชั่นคลีนซิ่งที่อ่อนโยนต่อผิว เพียงแค่เช็ดเบาๆ เครื่องสำอางก็จะหลุดออกมาได้อย่างง่ายดายแล้วค่ะ</p><h3>Step 3 : ล้างหน้าให้ใสวิ้งด้วยผลิตภัณฑ์ทำความสะอาดผิวหน้า</h3><p>หลังจากเช็ดเครื่องสำอางออกแล้ว ก็อาจยังมีสิ่งตกค้างอยู่บนใบหน้าได้ ดังนั้นคุณสาวๆ จำเป็นต้องทำความสะอาดผิวหน้าให้หมดจดอีกครั้งด้วยโฟมล้างหน้าหรือสบู่ที่มีสารสกัดจากธรรมชาติ อ่อนโยนต่อผิว ไม่ว่าจะเป็นสูตรควบคุมความมัน ลดสิว สูตรสครับสิ่งสกปรกให้หลุดออกไป หรือจะเป็นสบู่น้ำนมข้าวหรือสบู่สกัดจากสมุนไพรก็เป็นอีกตัวเลือกหนึ่งที่ทำความสะอาดและบำรุงผิวหน้าได้อย่างมีประสิทธิภาพดีเยี่ยมเลยทีเดียว</p><p><img
  src="https://www.doctoryounger.com/img-uploads/4444.jpg" alt=""></p><h3>Step 4 : ปิดท้ายการล้างเครื่องสำอางกันน้ำด้วยการบำรุงผิว</h3><p>มาถึงสเต็ปนี้ เนื่องจากผิวหน้าของเราผ่านการใช้งานมาอย่างหนักหน่วง ทั้งจากการแต่งหน้าด้วยเครื่องสำอางกันน้ำ และการถูเช็ดทำความสะอาดหลายขั้นตอน จึงควรให้อาหารผิวด้วยการทาครีมบำรุงให้ผิวกลับมาชุ่มชื่นอีกครั้ง หรือจะนอนมาสก์หน้าเพลินๆ สัก 15-20 นาที เพียงเท่านี้ผิวหน้าของคุณสาวๆ ก็จะกลับมาเนียนนุ่มแลดูผิวสุขภาพดีแล้วล่ะ</p><p>วิธีการล้างเครื่องสำอางกันน้ำอย่างถูกวิธี สามารถทำได้โดยมีขั้นตอนไม่ยุ่งยาก นอกจากจะช่วยให้เครื่องสำอางหลุดออกอย่างง่ายดายแล้ว ยังช่วยปกป้องและบำรุงให้ผิวหน้าของคุณสาวๆ ดูเปล่งปลั่ง มีสุขภาพดี เพื่อรอการแต่งแต้มสีสันจากเครื่องสำอางใหม่อีกครั้งในวันต่อไปได้แล้วค่ะ</p><h3>ที่มา: Kapook</h3>'
