title: นอนผิดท่า...หน้าเหี่ยวไว (พร้อมเคล็ด 7 ข้อดูแลผิว)
date: 30 Aug 2017
source: Manager
body: '<p>การดูแลรักษาผิวหน้าให้คงความอ่อนเยาว์ เป็นเรื่องที่สาวๆ อยากจะทำได้และนอกจากนี้หน้าตาก็เป็นสิ่งแรกที่คนอื่นจะเห็น การดูแลผิวพรรณให้ดูดีตั้งแต่ตอนนี้ ไม่ต้องรอให้อายุมากขึ้นจนริ้วรอยถามหาแล้วค่อยมารักษามาบำรุงผิวหน้า สาวๆ จึงควรเริ่มสนใจดูแลบำรุงผิวหน้าตั้งแต่ตอนนี้เพื่อที่จะคงความอ่อนเยาว์ของใบหน้าไว้ให้อยู่กับตัวเองไปนานๆ</p><h3>1. อย่าเปิดแอร์เย็นจัด</h3><p>เวลานอนเรามักจะเปิดแอร์เย็นๆ เพื่อให้หลับสบายแต่การอยู่ในห้องแอร์ที่เย็นมากๆ เป็นเวลานานจะทำให้ผิวหนังเสียความชุ่มชื้นและผิวจะแห้งกร้านเกิดเป็นริ้วรอยได้ง่าย ดังนั้นถ้าจะอยู่ห้องแอร์นานๆ ควรทาครีมเพื่อให้ผิวมีชุ่มชื้นหรือไม่ควรเปิดแอร์ให้เย็นจนเกินไป</p><p><img src="https://www.doctoryounger.com/img-uploads/33.jpg" alt=""></p><h3>2. นอนให้ถูกท่า</h3><p>การนอนให้ถูกท่าสามารถช่วยให้สาวๆ หน้าไม่เหี่ยวได้ การนอนท่าที่สามารถช่วยลดลิ้วรอยได้คือการนอนหงายเพราะการนอนหงายจะไม่ทำให้ใบหน้ากดทับกับหมอนจึงไม่ทำให้เกิดริ้วรอยเหี่ยวย่น</p><h3>3. ไม่ควรใช้หลอดดูดน้ำ</h3><p>การใช้หลอดดูดน้ำหนึ่งครั้งต้องใช้กล้ามเนื้อใบหน้าเกร็งเพื่อดูดน้ำขึ้นมาเพราะแบบนี้จึงเป็นเหตุผลที่ทำให้เกิดการเพิ่มริ้วรอยบนใบหน้า
  นอกจากนี้ยังทำให้ผิวหนังบริเวณริมฝีปากจะเหี่ยวย่นอีกด้วย </p><h3>4. บำรุงด้วยสารพัดครีม</h3><p>สาวๆ ควรทาครีมกันแดดก่อนออกจากบ้านทุกวันให้เป็นนิสัยเพราะไม่ได้มีแค่แสงอาทิตย์ที่ทำร้ายผิวเราได้อย่างเดียว แสงไฟนีออน แสงจากหน้าคอมพิวเตอร์ล้วนทำร้ายเราได้ทั้งนั้น, ทาอายครีม เพื่อลดรอยตีนกาและถุงใต้ตาก่อนนอน เพื่อช่วยชะลอริ้วรอยรอบดวงตา</p><p><img src="https://www.doctoryounger.com/img-uploads/00.jpg" alt=""></p><h3>5. ทานผักผลไม้</h3><p>ควรเลือกรับประทานให้หลากหลายเพราะผลไม้แต่ละชนิดก็มีประโยชน์แตกต่างกันไป แต่ผลไม้ส่วนใหญ่ก็มีสารต้านอนุมูลอิสระซึ่งจะช่วยชะลอความแก่ของผิวและช่วยลดริ้วรอย</p><h3>6. งดบุหรี่และหลีกเลี่ยงแอลกอฮอลล์</h3><p>การสูบบุหรี่จะทำให้หน้าเหี่ยวและแก่ไว ส่วนแอลกอฮอลล์ถ้ากินนิดๆ หน่อยๆ พอให้เลือดสูบฉีดก็ไม่เป็นไร แต่ถ้ากินบ่อยๆ จะทำร้ายผิวให้ผิวไม่สวย ถ้าไม่จำเป็นก็ควรจะหลีกเลี่ยงทั้ง 2 อย่างเพราะไม่ดีต่อสุขภาพทั้งคู่</p><h3>7. ควบคุมสีหน้าให้พอดี</h3><p>การหัวเราะหรือทำหน้าย่นบ่อยๆ จะทำให้หน้าแก่และมีรอยตีนกา ทำให้เกิดริ้วรอยก่อนวัยอันควรได้ง่ายขึ้น เพราะฉะนั้น เวลาหัวเราะ
  ควรหัวเราะแต่พอดี ไม่มากจนเกินไป</p><h3>8. ออกกำลังกายอย่างสม่ำเสมอ</h3><p>การออกกำลังกายอย่างสม่ำเสมอจะทำให้ผิวพรรณเปล่งปลั่ง ดูสวยขึ้น ทำให้มีน้ำมีนวลมากขึ้น ควรออกกำลังกายอาทิตย์ละ 3-4 ครั้ง ครั้งละ 1-2 ชั่วโมงเพื่อดึงความสดชื่นกลับมาให้ผิว และช่วยระบบเผาผลาญในร่างกายให้ดีขึ้น </p><h3>ที่มา: Manager</h3>'
