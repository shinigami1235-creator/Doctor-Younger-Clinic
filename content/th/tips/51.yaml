title: 9 ผลไม้เพิ่มน้ำหนัก ที่ต้องหยุดกิน ถ้ายังไม่อยากอ้วน!!
date: 12 Oct 2017
source: Medicthai
body: '<p>ผลไม้ เป็นตัวเลือกอันดับแรกๆ ที่หลายคนให้ความสนใจ และเลือกทานกันเป็นจำนวนมากในยุคที่คนรักสุขภาพแบบนี้ ซึ่งผลไม้แทบจะทุกชนิดนั้นล้วนอุดมไปด้วยคุณค่าทางสารอาหารมากมาย แต่ผลไม้บางอย่างก็ไม่เหมาะกับคนที่ต้องการควบคุมน้ำหนัก หรือลดความอ้วนสักเท่าไหร่ เพราะฉะนั้นถ้าคุณยังทานผลไม้พวกนี้อยู่ล่ะก็ น้ำหนักคุณก็ไม่มีวันลดได้แน่ๆ</p><p><img src="https://www.doctoryounger.com/img-uploads/Untitled-1.jpg" alt=""></p><p>การอดอาหารแล้วหันมาบริโภคแต่ผลไม้นับเป็นทางเลือกที่ดี แต่ใครจะรู้ล่ะว่า “ผลไม้” ที่ทั้งอร่อยและได้ประโยชน์ก็สามารถสร้างความปวดใจให้กับน้ำหนักตัวของเราได้ และใช่ว่าจะได้ผล 100% เพราะผลไม้บางชนิดนอกจากจะไม่ช่วยให้อิ่มท้องแล้ว ยังสามารถทำให้น้ำหนักตัวของเรามากขึ้น เนื่องจากน้ำตาลในผลไม้นั้นค่อนข้างมาก โดยความหวานที่ว่านี้ จะให้พลังงานแก่ร่างกาย ยิ่งไม่รับประทานข้าว ซึ่งเป็นโปรตีนและผักที่เป็นไฟเบอร์เลย ร่างกายก็จะเปลี่ยนแป้งและน้ำตาลในผลไม้เหล่านี้ให้เป็นไขมันสะสม และนั่นจะก่อให้เกิดโรคอ้วนลงพุง ดังนั้นก่อนจะลดน้ำหนักด้วยผลไม้จึงควรศึกษาให้ละเอียด สำหรับผลไม้ที่ขึ้นชื่อว่ามีน้ำตาลมากก็สังเกตได้ไม่ยาก
  พวกสีเหลืองๆ รสหวานจัดๆ ได้แก่</p><p>1. ทุเรียน</p><p>2. กล้วยไข่ กล้วยน้ำว้า กล้วยหอม</p><p>3. ขนุน</p><p>4. มะม่วงสุก</p><p>5. เงาะ</p><p>6. ลำไย</p><p>7. ลองกอง</p><p>8. ลางสาด</p><p>9. ละมุด</p><p><img src="https://www.doctoryounger.com/img-uploads/Untitled-2%20copy.jpg" alt=""></p><p><strong>เกร็ดความรู้</strong> น้ำผลไม้คั้น แม้จะไม่ใส่น้ำตาล แต่แท้จริงแล้วก็มีน้ำตาลธรรมชาติจำนวนมาก ซึ่งถ้าดื่มแล้วไม่ออกกำลังเผาผลาญทิ้งไป ก็อาจทำให้อ้วนมากกว่าการดื่มนมจืดขาดมันเนยเสียอีก การที่เราเลือกรับประทานผลไม้จืดหรือเปรี้ยวแทนอาหาร 1 มื้อ เช่น กล้วย ฝรั่ง แอปเปิ้ล แก้วมังกร หรือสับปะรด นับเป็นวิธีการที่ผิดอย่างร้ายแรง การรับประทานมะม่วงสุก 3 ลูก จะเทียบเท่ากับการให้พลังงานประมาณข้าวขาหมู 1 จาน หรือถ้าเปลี่ยนจากข้าวมาเป็นผลไม้อย่าง ฝรั่ง หรือมะม่วง ก็เท่ากับรับประทานแป้งเหมือนเดิม แต่มีน้ำตาลมากกว่า ปริมาณน้ำตาลที่นักโภชนาการแนะนำให้รับประทานต่อวัน คือ ไม่ควรเกิน 4 ช้อนชาสำหรับเด็ก และ 6 ช้อนชาสำหรับผู้ใหญ่ หากเราดื่มน้ำผัก-ผลไม้รวมพร้อมดื่ม 1 แก้ว หรือประมาณ 200 มิลลิลิตร เราจะได้น้ำตาลประมาณ
  4 ช้อนชา ซึ่งถือว่าค่อนข้างสูงเมื่อรวมกับอาหารทั้งวันที่รับประทาน</p><h3>ที่มา: Medicthai</h3>'
