title: เทรนด์แต่งหน้า 2018 จาก ป้อม วินิจ ช่างแต่งหน้าขั้นเทพของซุปตาร์
date: 30 Dec 2017
source: Sanook
body: '<p>จะปีไหนๆ "ผู้หญิงก็อย่าหยุดสวย" นับถอยหลังเข้าสู่ปี 2018 แล้ว ปี 2017 ที่ผ่านพ้นไปเทรนด์แต่งหน้าไหนมาแรง ขอให้ลืมและพับเก็บเข้ากรุไว้ก่อน ถ้าอยากสวยอิน ตามโลกแห่งความสวยให้ทัน มาอัพเดทเทรนด์แต่งหน้าที่มาแน่ในปี 2018 จาก "พี่ป้อม วินิจ บุญชัยศรี" ช่างแต่งหน้าคิวทองของไทย หรือขุ่นแม่ผู้เปลี่ยนลุคให้เหล่าซุปตาร์ในวงการกัน</p><h3>"เทรนด์แต่งหน้าปี 2018"</h3><p>มีการแต่งตา เฉดดิ้ง คอนทัวร์ ไฮไลท์ มากขึ้น ส่วนรองพื้น จะเป็นรองพื้นที่มีความหนาแน่นเพิ่มขึ้น สาวๆ ที่ต้องการปกปิด ปีหน้าก็จะรอดตัว สีตาแปลกๆ เมทัลลิค หรือกลิตเตอร์ ลิปเมทัลลิคมีความแวววา กำลังจะมา สีเอิร์ธโทนจะลดน้อยลง สีปากจะสดใสขึ้น ทั้งนี้ทั้งนั้น การแต่งหน้าต้องเพิ่มความจับต้องได้ พี่ป้อมแนะนำว่าเวลาใช้ในชีวิตประจำวันควรเบรคลงมาหน่อย เพื่อเผยผิวจริงได้มากขึ้น </p><p><img src="https://www.doctoryounger.com/img-uploads/01.jpg" alt=""></p><h3>"ทรงคิ้ว"</h3><p>เน้นการมีขนคิ้วค่อนข้างเยอะ สาวๆ เตรียมเลี้ยงคิ้วไว้ได้เลย ปีที่ผ่านมา เน้นการเขียนคิ้วให้ชัด ปังๆ แต่ตอนนี้จะเน้นปัดให้ฟูๆ ให้ดูมีขนคิ้ว ถ้าใครไม่มีขนคิ้ว ก็จะเขียนแบบ
  3D เลียนแบบขนคิ้วจริง ใช้วิธีวาดเป็นเส้นๆ</p><p>พี่ป้อมแนะนำเทคนิคเขียนคิ้วง่ายๆ คือ เลือกอายแชโดว์สีฝุ่น โดยเขียนคิ้วสีอ่อนๆ ก่อน ใช้ดินสอวาดเป็นเส้นๆ หรืออายไลเนอร์สำหรับเขียนคิ้ว ส่วนของสีคิ้วเมื่อก่อนนิยมเป็นดินสอเขียนคิ้ว หรืออายแชโดว์เขียนคิ้ว ตอนนี้เป็นคุชชั่นเขียนคิ้ว หรือเป็นน้ำหมึกเขียนคิ้ว คิ้วจะได้ดูแน่นขึ้น</p><h3>"เฉดดิ้ง"</h3><p>มีการเอามาใช้มากขึ้น ใช้ตัวเมทัลลิคต่างๆ พวกสีสันแปลกๆ มาแน่ เช่นไฮไลท์โหนกแก้ม เพิ่มความมีมิติบนใบหน้า เวลาแต่งหน้าเทคนิคลงบนหน้าจะเยอะมากขึ้น สาวๆ อาจจะต้องเสียเวลาแต่งหน้าเพิ่ม</p><p><img src="https://www.doctoryounger.com/img-uploads/02.jpg" alt=""></p><h3>"ลิปสติก"</h3><p>สีปากเป็นเมทัลลิคแวววาวมีทั้งแมตต์ ทั้งเนื้อกลอสอยู่บนปาก เทรนด์การแต่งหน้าจะเปลี่ยนแค่ไหน "สีแดง" จะสวยล้ำเทรนด์ตลอด หรือลิปโทนนู้ดก็แต่งได้ตลอด การแต่งหน้าเมคอัพโนเมคอัพ หรือเทรนด์นู้ดยังไงก็ทำให้ผู้หญิงสวยที่สุด ปีหน้าเทรนด์จะมายังไง เราต้องดึงตัวเองกลับมาในลุคเบสิคที่แต่งได้ตลอดกาล</p><p>สรุปปีหน้าอารมณ์จะเหมือนเป็นโรคไบโพลาร์ จะกลับไปกลับมา ไม่น่าเบื่อ สามารถเล่นสนุกได้
  เพราะมีลูกเล่นเยอะ มันยากที่เราจะกำหนด แนว "K-beauty" ก็ยังอยู่ "แนวสายฝอ" ก็ต้องมา อาจจะแต่งผสมผสานกัน แต่งสลับไปมา เราก็เลือกใช้ได้ ทิศทางมันค่อยข้างเยอะ แนะนำให้เอามาปรับใช้เดินบนท้องถนนได้จะดีที่สุด</p><p><strong>สิ่งสำคัญ</strong> คือการแต่งหน้าจะต้องแต่งตามเสื้อผ้าที่เราใส่ เราควรกำหนดสไตล์การแต่งตัวก่อน หลังจากนั้นสไตล์การแต่งหน้าจึงตามมา "ความสวยไม่มีกฎตายตัว"</p><h3>ที่มา: Sanook</h3>'
