title: แชร์วนไปค่ะ!!! 5 ทริค ทาปากอย่างไรให้ดูเป๊ะมากที่สุด
date: 10 Nov 2017
source: Mthai
body: '<p>สาวๆ เคยได้ยินประโยคที่ว่า “แค่สีปากมา ชีวิตก็เปลี่ยน” ไหม? ก็เพราะว่าลิปสติกเนี่ยมันเป็นไอเทมกันตายสำหรับสาวๆ ต่อให้ไม่แต่งหน้ามายังไง แค่ทาลิปสติกลงไปเพียงแค่แท่งเดียว ก็สามารถเปลี่ยนหน้าตาโทรมๆ ให้ดูดีขึ้นได้ภายในพริบตาเดียว ขอบอกเลยว่าของแบบนี้มันมีเทคนิคค่ะคู้ณณณณ ขยับเข้ามาใกล้ๆ สิ เดี๋ยวเราจะกระซิบให้ฟังกันว่าทาปากอย่างไร ให้ดูเป๊ะมากที่สุด</p><h3>1. รองพื้นด้วยลิปมัน</h3><p>ขนาดแต่งหน้ายังต้องลงรองพื้นก่อนเลย แล้วนับประสาอะไรกับการทาปาก มันก็ต้องลงลิปมัน หรือ ลิปบาล์ม เพื่อถนอมผิวปาก ให้ชุ่มชื่นเหมือนกันน่ะแหละค่ะ จะบอกอะไรไว้อย่างนึงนะว่า การลงลิปมันก่อนทาลิปสติกเนี่ย มันจะทำให้ปากคุณดูเต็มขึ้น ทาลิปสติกไปก็ไม่ตกร่องยังไงล่ะ</p><p><img src="https://www.doctoryounger.com/img-uploads/01.jpg" alt=""></p><h3>2. แกต้องวาดขอบปากก่อนสิ!</h3><p>ถ้าคุณอยากลุคคอมพลีทลุคให้เป๊ะมากกว่าเดิม แนะนำเลยค่ะว่าให้วาดขอบปากด้วยดินสอเขียนขอบปากซะก่อน ไม่ว่าจะทาสีอ่อน สีเข้ม หรือสีแซ่บแค่ไหนก็ตาม วิธีเนี่ย มันจะทำให้คุณสามารถกำหนดได้ว่า คุณอยากได้รูปปากแบบไหน แถมยังทำให้ลุคของคุณดูแพงขึ้นอีกด้วยนะ
  แต่สิ่งหนึ่งที่สาวๆ ต้องระวังเลยก็คือ ต้องเลือกดินสอเขียนขอบปากให้สีใกล้เคียงกับลิปสติกที่จะทามากที่สุด ไม่อย่างนั้นจะโป๊ะแบบไม่รู้ตัวเอาได้นะ</p><h3>3. ถ้าอยากปากเป๊ะก็ต้องใจเย็นๆ</h3><p>เพราะปากเป็นอีกหนึ่งจุดเด่นของใบหน้า ไม่ว่าจะทาลิปสีไหนก็ตาม ขอให้สาวๆ Keep Calm ใจเย็นๆ ไว้ก่อนดีกว่านะ เพราะถ้าขืนรีบๆ ปาดไปแบบไม่ระวัง รับรองได้เลยค่ะว่างานนี้มีเละชัวร์!</p><p><img src="https://www.doctoryounger.com/img-uploads/02.jpg" alt=""></p><h3>4. แค่มีตัวช่วยดีๆ ลิปสติกก็ติดทนนานได้แล้ว</h3><p>เทคนิคนี้ไม่แชร์ไม่ได้แล้วจ้าาาาา เพราะถ้าคุณเป็นคนที่ชอบทาลิปสติกแล้วอยากให้สีมันดูแมทท์ ติดทนนานกว่าเดิม แนะนำว่าให้ใช้แป้งฝุ่นมาเป็นตัวช่วย โดยให้คุณสาวๆ ทั้งหลายทาลิปสติกลงไปรอบนึงก่อน จากนั้นก็ซับความมันออกด้วยกระดาษทิชชู แล้วก็ทาแป้งฝุ่นลงไปเบาๆ บนริมฝีปาก สุดท้ายก็ค่อยปิดจ๊อบด้วยการทาลิปลงไปอีกครั้ง รับรองได้เลยค่ะว่างานนี้ไม่มีคำว่าลิปหลุด ลิปลอกอย่างแน่นอน!</p><h3>5. เก็บรายละเอียดด้วยคอนซีลเลอร์</h3><p>อีกสิ่งหนึ่งที่จะช่วยให้ริมฝีปากของคุณดูเป๊ะมากที่สุด คือการเก็บรายละเอียดด้วยการลงคอนซีลเลอร์หลังทาปากเสร็จ
  ขอบอกเลยนะคะว่าเทคนิคนี้ จะช่วยให้รูปปากของคุณดูเป๊ะ ได้รูปมากกว่าเดิม โดยเฉพาะถ้าคุณทาลิปสติกสีแซ่บๆ อย่างสีแดง เบอร์กันดี หรือสีน้ำตาล เป็นต้น</p><h3>ที่มา: Mthai</h3>'
