title: เทโลเมียร์กับสุขภาพและความงาม
date: 18 May 2017
source: edin.co.th
body: '<p>เด็กจะมีเทโลเมียร์ที่ยาวกว่าผู้ใหญ่ และคนหนุ่มสาวจะมีเทโลเมียร์ที่ยาวกว่าคนแก่ชรา เราจำเป็นต้องมีเทโลเมียร์ภายในเซลล์ที่ยาวเพียงพอเพื่อการมีสุขภาพที่แข็งแรงและผิวพรรณที่สดใส เพราะหมายถึงเซลล์ของอวัยวะต่างๆรวมถึงเซลล์ผิวหนังยังคงเป็นเซลล์ที่ไม่ชราภาพและทำหน้าที่ได้อย่างปกติ มีหลักฐานพบว่า ผู้ที่มีเทโลเมียร์สั้นจำนวนมากภายในเซลล์ของร่างกาย เกี่ยวข้องกับอุบัติการณ์เกิดของโรคแห่งความชราภาพต่างๆ เช่น โรคมะเร็ง โรคเบาหวาน โรคไขข้ออักเสบ โรคหัวใจ โรคความดันโลหิตสูง ผิวหนังเหี่ยวย่น กระดูกพรุน โรคความจำเสื่อม โรคประสาทตาเสื่อม โรคตับแข็ง และภาวะภูมิคุ้มกันอ่อนแอ เป็นต้น เซลล์ผิวหนังที่มีเทโลเมียร์สั้นเกินไปก็จะไม่สามารถผลิตคอลลาเจนและอีลาสตินให้กับผิวได้อีกต่อไป และอาจสร้างเอนไซม์มาย่อยคลอลาเจนของตนเองอีกต่างหาก ทำให้เกิดรอยเหี่ยวย่นของผิวหนัง</p><p><img src="https://www.doctoryounger.com/img-uploads/ta1.jpg" alt=""><img src="https://www.doctoryounger.com/img-uploads/ta2.jpg" alt=""></p><p><img src="https://www.doctoryounger.com/img-uploads/ta3.jpg" alt=""><img src="https://www.doctoryounger.com/img-uploads/ta4.jpg"
  alt=""></p><p><img src="https://www.doctoryounger.com/img-uploads/ta5.jpg" alt=""><img src="https://www.doctoryounger.com/img-uploads/ta6.jpg" alt=""></p><h3>ที่มา: edin.co.th</h3>'
