title: มาทำความรู้จักกับ "เทโลเมียร์" กันเถอะ
date: 09 Jun 2017
source: edin.co.th
body: '<p>ความสำคัญของ "เทโลเมียร์" มีผลงานวิจัยมากมาย แสดงถึงว่าการหดสั้นของเทโลเมียร์ ภายมนนิวเคลียสของเซลล์ เกี่ยวข้องกับโรคที่เกิดจากการชราภาพ หรืออาจเป็นสาเหตุแห่งการชราภาพของร่างกาย มีงานวิจัยระบุว่า ผู้ที่มีเทโลเมียร์สั้น จะมีอายุขัยที่สั้นกว่าผู้ที่มีเทโลเมียร์ยาว ทราบอย่างนี้แล้ว เราควรหาวิธีชะลอการหดสั้นของเทโลเมีบร์ของเราเอง หรือเพิ่มความยาวของเทโลเมียร์กันเถอะ ด้วยผลิตภัณฑ์เสริมอาหาร TA-65® MD </p><p><img src="https://www.doctoryounger.com/img-uploads/AW%20Line@_1.jpg" alt=""><img src="https://www.doctoryounger.com/img-uploads/AW%20Line@_2.jpg" alt=""></p><p><img src="https://www.doctoryounger.com/img-uploads/AW%20Line@_3.jpg" alt=""><img src="https://www.doctoryounger.com/img-uploads/AW%20Line@_4.jpg" alt=""></p><p><img src="https://www.doctoryounger.com/img-uploads/AW%20Line@_5.jpg" alt=""><img src="https://www.doctoryounger.com/img-uploads/AW%20Line@_6.jpg" alt=""></p><h3>ที่มา: edin.co.th</h3>'
