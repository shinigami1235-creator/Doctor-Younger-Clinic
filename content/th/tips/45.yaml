title: 8 วิธีทำบ้านให้หอมสดชื่นอย่างเป็นธรรมชาติ
date: 19 Sep 2017
source: Bhg
body: '<p>เรื่อง "<strong>กลิ่น" </strong>เป็นสิ่งที่สำคัญและมีผลกระทบต่อความรู้สึกของคนเรา เช่นเดียวกับกลิ่นในบ้านสถานที่ซึ่งเราต้องใช้เวลาส่วนใหญ่พักผ่อน ทำกิจกรรมต่างๆ ถ้าบ้านมีกลิ่นไม่พึงประสงค์ เราก็คงไม่อยากอยู่ มาทำบ้านให้หอมอย่างที่ต้องการกันดีกว่า วันนี้เลยนำเทคนิคสร้างกลิ่นในบ้านโดยใช้ของที่มีอยู่ในธรรมชาติ มาปรับกลิ่นในบ้านให้หอมสดชื่นได้อย่างน่าทึ่ง โดยเฉพาะ 8 สิ่งต่อไปนี้</p><p><strong>1. เลม่อนและโรสแมรี่</strong> : ถ้าอยากให้บ้านมีกลิ่นสะอาดสดชื่น เราสามารถนำเลม่อน และโรสแมรี่ มาผสมลงในน้ำจากนั้นอาจจะใส่กลิ่นวนิลาเพิ่มลงไปเล็กน้อย หาภาชนะที่มีในบ้านมาใส่ เพียงแค่นี้ จะทำให้บ้านมีกลิ่นสดชื่นขึ้นได้</p><p><strong>2. ไลแลค </strong>: เป็นดอกไม้กลิ่นหอมที่ใคร ๆ ก็ชอบ หากนำมาไว้ในบ้าน จะทำให้บรรยากาศมีความสดชื่นเหมือนฤดูใบไม้ผลิ เราสามารถทำสเปรย์กลิ่นไลแลคใช้เองได้ด้วยการนำน้ำ ผสมวอดก้า และน้ำมันไลแลค</p><p><img src="https://www.doctoryounger.com/img-uploads/001.jpg" alt=""></p><p><strong>3. ผงโรยพรมกลิ่นโรสแมรี่ และลาเวนเดอร์</strong> : ช่วยให้พรมมีกลิ่นสดชื่นเป็นธรรมชาติ แค่ผสมเบกกิ้งโซดา
  กับดอกโรสแมรี่แห้ง และน้ำมันลาเวนเดอร์ แล้วนำไปโรยบนพรม ทิ้งไว้สัก 15-20 นาที จากนั้นก็ใช้เครื่องดูดฝุ่นดูดออก กลิ่นในห้องก็จะหอมสดชื่น</p><p><strong>4. ต้มส่วนผสมที่มีกลิ่นสดชื่น</strong> : การนำเอาผลไม้ที่มีกลิ่นสดชื่น มาต้มรวมกัน ก็ทำให้มีกลิ่นสดชื่นในบ้าน เราสามารถต้มแล้วเก็บไว้ในขวด เป็นการเพิ่มความหอมให้กับบ้านอย่างง่าย ๆ ด้วยตัวเอง</p><p><strong>5. น้ำหอมในบ้านแบบเสียบปลั๊กเมื่อกลิ่นหมดแล้วอย่าทิ้ง</strong> : บางคนนิยมใช้น้ำหอมแบบเสียบปลั๊กให้ความหอมระเหยออกมา แต่เมื่อน้ำหอมหมดกลิ่นแล้ว อย่าเพิ่งทิ้ง แค่ใส่น้ำมันหอมระเหยผสมน้ำลงไป ก็ใช้ต่อได้</p><p><img src="https://www.doctoryounger.com/img-uploads/002.jpg" alt=""></p><p><strong>6. ซินนามอน และส้ม</strong> : ให้นำโพลิมเมอร์ดูดน้ำมาใช้ ใส่น้ำมันหอมระเหยซินนามอน และน้ำมันหอมระเหยกลิ่นส้ม ผสมน้ำ จะทำให้บ้านมีกลิ่นเหมือนกับฤดูใบไม้ร่วง</p><p><strong>7. อบแคนเบอรรี่ และส้ม</strong> : เราสามารถทำถุงเครื่องหอม ด้วยการใช้แคนเบอรี่ และส้ม มาอบแห้งอาจจะเพิ่มซินนามอน วนิลา จันทน์เทศ และโรสแมรี่ เพื่อเพิ่มบรรยากาศอบอุ่นเหมือนช่วงคริสต์มาส</p><p><strong>8.
  ทำก้านไม้หอมปรับอากาศ</strong> : เราสามารถทำก้านไม้หอมปรับอากาศใช้เองได้ แค่นำเอาภาชนะแก้วมาเปิด ผสมแอลกอฮอล์ น้ำมันอัลมอนต์ น้ำมันหอมระเหย และก้านหอมลงไป อาจจะเลือกใส่กลิ่นลาเวนเดอร์ เพื่อความสดชื่น ในห้องนอน และใส่กลิ่นสดชื่นอย่างมะนาวในห้องครัว</p><h3>ที่มา: Bhg</h3>'
