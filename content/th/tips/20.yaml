title: ร้อยไหมเสี่ยงเนื้องอก พังผืดยึดทำหน้าผิดรูป
date: 25 May 2017
source: Horonumber
body: '<p>แพทย์ผิวหนังเตือนหนุ่มสาวนิยม "ร้อยไหมทอง" เชื่อว่าสามารถลดความหย่อนคล้อย และกระชับใบหน้าให้เต่งตึง ขาวใส แต่เสี่ยงเนื้องอก หน้าผิดรูป ชี้หากป่วยหนักมีโอกาสพลาดเข้าเครื่อง "เอ็มอาร์ไอ" เพราะโลหะปนเปื้อนร่างกาย พญ.วิไล ธนสารอักษร อาจารย์พิเศษหน่วยโรคผิวหนัง คณะแพทยศาสตร์ โรงพยาบาลรามาธิบดี เปิดเผยว่าปัจจุบันมีกลุ่มที่รักสวยรักงามหันมานิยมใช้วิธีร้อยไหมบนใบหน้า เพื่อลดความหย่อนคล้อยและกระชับใบหน้าให้เต่งตึง โดยเฉพาะการร้อยไหมทอง</p><p>"ที่ผ่านมาเคยมีเคสคนไข้รายหนึ่ง ยกกระชับใบหน้าด้วยวิธีร้อยไหมทอง จากคลินิกแห่งหนึ่ง แต่ผลที่ได้ไม่เป็นที่พอใจจึงเปลี่ยนคลินิกใหม่ โดยคลินิกที่สองไม่ทราบมาก่อนว่าเคยผ่านการร้อยไหมทอง จึงสั่งให้ทำเลเซอร์ ส่งผลให้เนื้อทองละลายออกที่ใบหน้าจนเสียแนวดึงรั้ง สุดท้ายใบหน้าหย่อนคล้อยกว่าเดิม และผิดรูปจนต้องซ่อมรูปหน้าใหม่ จึงขอเตือนคนที่คิดจะยกกระชับใบหน้าด้วยวิธีร้อยไหมทองให้พิจารณาความจำเป็น" พญ.วิไลกล่าว และว่านอกจากนี้ ผู้ที่ร้อยไหมทอง หากเกิดเจ็บป่วยและจำเป็นต้องเข้าตรวจร่างกายด้วยเครื่องเอ็มอาร์ไอ (MRI : Magnetic Resonance Imaging) ซึ่งเป็นเครื่องสร้างภาพด้วยสนามแม่เหล็กไฟฟ้า
  ใช้ในการตรวจวินิจฉัยรอยโรค ก็จะไม่สามารถเข้าเครื่องตรวจชนิดนี้ได้ เพราะผู้เข้าตรวจจะต้องถอดโลหะออกจากร่างกายทั้งหมด และทองก็ถือเป็นโลหะชนิดหนึ่ง พญ.วิไลกล่าวอีกว่า ขณะนี้มีการพูดคุยกับแพทย์เอกซเรย์ในกลุ่มโรงเรียนแพทย์ว่า ควรมีการเพิ่มเช็กลิสต์โลหะก่อนเข้าเครื่องเอ็มอาร์ไอด้วยการระบุเจาะจงว่า ผู้เข้ารับการตรวจเคยผ่านการทำร้อยไหมทองมาหรือไม่ เพื่อช่วยกระตุ้นความจำของผู้ป่วยบางรายที่เคยทำมาก่อน แต่อาจหลงลืม และว่าในอนาคตการเพิ่มเช็กลิสต์นี้จะให้ใช้เป็นมาตรฐานกับสถานพยาบาลทั้งของรัฐและเอกชนทุกแห่ง</p><p><img src="https://www.doctoryounger.com/img-uploads/Untitle111111111.jpg" alt=""></p><p>"การร้อยไหมทอง ไม่สามารถแก้ไขหรือเอาออกได้ เนื่องจากทองถูกพังผืดยึดเอาไว้ หากดึงออกจะทำให้ผิวบุ๋มจนหน้าเสียโฉม ทั้งนี้การร้อยไหมถาวรก็ถือเป็นอันตราย เพราะจะก่อให้เกิดเนื้องอกของสิ่งแปลกปลอม เพราะรูปหน้าคนมีการเปลี่ยนแปลงทุกวินาที การร้อยไหมถาวร หากวันหน้ามีการหย่อนคล้อยก็ต้องแก้ไปเรื่อยๆ สิ่งแปลกปลอมจะสะสมมากขึ้นจนกลายเป็นเนื้องอก" พญ.วิไลกล่าว</p><p>ด้าน นพ.สว่าง อัมพรพันธ์ กรรมการผู้จัดการด็อกเตอร์ ยังเกอร์
  คลินิก กล่าวว่า วัยรุ่นเชื่อว่ายิ่งร้อยไหมจะยิ่งทำให้ผิวขาวใสและกระชับ ถือเป็นความเข้าที่ไม่ถูกต้อง เพราะการนำสิ่งแปลกปลอมเข้าสู่ใบหน้าก่อให้เกิดการทำร้ายเนื้อเยื่อในชั้นผิวหนัง ทำให้เกิดแผลเป็นและพังผืด หากมีจำนวนมากอาจดึงรั้งผิวจนหน้าบุบหรือผิดรูป ที่สำคัญไหมทองยังไม่ผ่านการรับรองจากสำนักงานคณะกรรมการอาหารและยา (อย.) คำโฆษณาเกี่ยวกับการร้อยไหมเพื่อความสวยงามมีอยู่มากมายเสียจนกระทั่งหลายๆคนอาจหลงเชื่อ ว่าเป็นความมหัศจรรย์ทางการแพทย์ จริงๆแล้วไม่ใช่ ตามที่เห็นในภาพ ผู้ป่วยรายนี้ได้รับการร้อยไหมละลายที่คลินิกแห่งหนึ่ง ซึ่งมีหลายสาขา แต่ดำเนินการโดยแพทย์ที่ไม่ใช่ผู้เชี่ยวชาญเฉพาะ ไม่ใช่ทั้งหมอผิวหนังหรือศัลยแพทย์ตกแต่ง แก้มแต่ละข้างใส่ไหมเข้าไปข้างละเป็นร้อยเส้น! ผลก็คือมีการติดเชื้อ กลายเป็นแผลเป็นเสียโฉมไปตลอดชีวิต</p><h3>ที่มา: Horonumber</h3>'
