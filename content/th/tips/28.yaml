title: 9 เคล็ดลับสู่อาหารต้านมะเร็ง
date: 05 Jul 2017
source: Bangkokbiznews
body: '<p>โรคมะเร็งเป็นสาเหตุการเสียชีวิตดับหนึ่งของคนไทยต่อเนื่อง จากการศึกษาพบว่าอาหารมีส่วนสัมพันธ์กับการเกิดโรคมะเร็งประมาณ 30-50% กรมการแพทย์แนะลดเสี่ยงด้วย 9 เคล็ดลับสู่อาหารต้านมะเร็ง หลีกเลี่ยงอาหารที่มีสารก่อมะเร็ง ไม่ดื่มสุรา ไม่สูบบุหรี่ นายแพทย์ธีรพล โตพันธานนท์ อธิบดีกรมการแพทย์ กล่าวว่า โรคมะเร็งเป็นปัญหาสาธารณสุขที่สำคัญของไทย มีปัจจัยเสี่ยงที่สำคัญจากสิ่งแวดล้อมภายนอกร่างกาย เช่น สารก่อมะเร็งที่ปนเปื้อนในอาหาร อากาศ เครื่องดื่ม รวมถึงการได้รับรังสี เชื้อไวรัส เชื้อแบคทีเรีย และพยาธิบางชนิด และปัจจัยจากภายในร่างกาย เช่น ความผิดปกติทางพันธุกรรม ความบกพร่องของระบบภูมิคุ้มกันและภาวะทุพโภชนา เป็นต้น </p><p>โรคมะเร็ง คือ กลุ่มโรคที่เกิดจากเซลล์ของร่างกาย มีความผิดปกติที่ DNA หรือสารพันธุกรรม ส่งผลให้เซลล์มีการเจริญเติบโตแบ่งตัวเพิ่มจำนวนเซลล์อย่างรวดเร็วและมากกว่าปกติ จึงอาจทำให้เกิดก้อนเนื้อผิดปกติและทำให้เกิดการตายของเซลล์ในก้อนเนื้อ เนื่องจากขาดเลือดไปเลี้ยง ถ้าเซลล์พวกนี้เกิดอยู่ในอวัยวะใดจะเรียกชื่อ มะเร็ง ตามอวัยวะนั้น เช่น มะเร็งปอด มะเร็งสมอง มะเร็งเต้านม มะเร็งปากมดลูก
  มะเร็งเม็ดเลือดขาว มะเร็งต่อมน้ำเหลือง และมะเร็งผิวหนัง เป็นต้น การรักษามะเร็งแต่ละชนิดจะมีวิธีการรักษาที่แตกต่างกัน ทั้งนี้ขึ้นอยู่กับอวัยวะที่เป็นมะเร็ง ระยะของมะเร็ง สภาพร่างกายของผู้ป่วยมะเร็ง การรักษาจะยากหรือง่ายก็ขึ้นอยู่กับชนิดของเซลล์มะเร็งและการดำเนินโรค </p><p><img src="https://www.doctoryounger.com/img-uploads/Untitled-1.jpg" alt=""></p><p>นายแพทย์วีรวุฒิ อิ่มสำราญ ผู้อำนวยการสถาบันมะเร็งแห่งชาติ กล่าวเพิ่มเติมว่า พบว่าอาหารมีส่วนสัมพันธ์กับการเกิดโรคมะเร็งประมาณ 30-50% โดยเฉพาะอาหารที่มีราสีเขียว-สีเหลืองขึ้น อาหารที่มีไขมันสูง อาหารเค็มจัดส่วนไหม้เกรียมของอาหารปิ้ง ย่าง รมควัน และอาหารที่ถนอมด้วยเกลือ ดินประสิว อาหารจำพวกนี้จะมีความเสี่ยงสูงต่อการเกิดมะเร็ง การเลือกทานอาหารที่ดีมีประโยชน์จะช่วยให้สุขภาพแข็งแรง ลดความเสี่ยงต่อการเกิดโรคต่างๆ รวมถึงโรคมะเร็ง </p><p>ดังนั้นขอแนะนำ 9 เคล็ดลับอาหารต้านมะเร็งได้แก่ </p><p>1. กินผักหลากสี เช่น มะเขือเทศ ฟักทอง แครอท คะน้า บล็อคโคลี่ ผักบุ้ง กวางตุ้ง ตำลึง กะหล่ำสีม่วง มะเขือม่วง ผักกาดขาว ดอกแค เป็นต้น </p><p>2. ควรทานผลไม้ที่มีวิตามิน
  และแร่ธาตุหลากหลายชนิดที่มีประโยชน์ต่อร่างกาย </p><p>3. อาหารธัญพืชและเส้นใย ธัญพืชเต็มเมล็ด คือ ธัญพืชที่ไม่ผ่านการขัดสีหรือขัดสีน้อยที่สุดทำให้มีคุณค่าทางโภชนาการสูง ได้แก่ ข้าวกล้อง ข้าวสาลี ข้าวโพด ข้าวโอ๊ต ข้าวบาร์เลย์ ลูกเดือย เป็นต้น </p><p>4. เครื่องเทศมีสรรพคุณลดความเสี่ยงในการเกิดโรคมะเร็งและกระตุ้นระบบภูมิคุมกันได้ </p><p>5. เพิ่มสารต้านอนุมูลอิสระ เช่น ชาเขียว น้ำแครอท น้ำส้ม น้ำขิง เป็นต้น </p><p>6. ปรุงอาหารอย่างถูกวิธี หลีกเลี่ยงการปิ้งย่างจนไหม้เกรียมและอาหารแบบดิบๆ สุกๆ โดยเฉพาะปลาน้ำจืดที่มีเกล็ด ไม่ใช้น้ำมันทอดซ้ำหลายๆ ครั้ง </p><p>7. หลีกเลี่ยงอาหารไขมัน ได้แก่ ไขมันอิ่มตัว เช่น กะทิ เนย ไขมันสัตว์ </p><p>8. ลดบริโภคเนื้อแดง ควรจำกัดการรับประทานเนื้อแดงให้เหลือเพียงสัปดาห์ละ 500 กรัม </p><p>9. เกลือแกงอาหารหมักดองต้องน้อยลง ในวันหนึ่งๆควรบริโภคเกลือไม่เกินวันละ 6 กรัม </p><p>ทั้งนี้ควรเลือกทานอาหารหลากหลายครบ 5 หมู่ หลีกเลี่ยงอาหารที่มีสารก่อมะเร็ง ไม่ดื่มสุรา ไม่สูบบุหรี่ ออกกำลังกายสม่ำเสมอ พักผ่อนให้เพียงพอ และไม่เครียด </p><h3>ที่มา: Bangkokbiznews</h3>'
