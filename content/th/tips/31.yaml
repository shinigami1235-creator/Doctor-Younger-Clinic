title: สาเหตุของการเกิดกระและวิธีป้องกันรักษา
date: 14 Jul 2017
source: Oregonwetlands
body: '<p><strong>"กระ"</strong> จะมีลักษณะที่สังเกตได้ไม่ยากเมื่อเกิดขึ้นบนใบหน้าแล้วมักจะเป็นเม็ดสีผิวที่มีขนาดเล็กกลมๆ ที่ออกสีน้ำตาลกระจายรวมกันบนผิว เมื่อสัมผัสกับแสงแดดบ่อยก็จะยิ่งมีสีเข้มมากขึ้น คนที่มีโอกาสเกิดกระได้มากก็มักจะเป็นคนที่มีผิวสีขาว และกระก็ยังสามารถเกิดขึ้นได้หลายแห่งด้วยกัน ได้แก่ ใบหน้า แก้มสองข้างและจมูก หรือแม้กระทั่งตามส่วนต่างๆ ของร่างกายไม่ว่าจะเป็นบริเวณหัวไหล่หรือแขนก็สามารถเกิดกระได้เช่นเดียวกัน ทั้งนี้มันยังสามารถเกิดขึ้นได้ไม่กัดเพศ วัย และอายุ เกิดได้แม้กระทั่งเด็กและผู้ใหญ่ พูดง่ายๆ คือคนเราทุกคนล้วนมีโอกาสเป็นกระได้ด้วยกันทั้งสิ้น</p><p><img src="https://www.doctoryounger.com/img-uploads/77.jpg" alt=""></p><h3>สาเหตุที่ทำให้เกิดกระบนใบหน้า</h3><ul><li>เกิดจากกรรมพันธุ์</li><li>เกิดจากสภาพแวดล้อม โดยเฉพาะแสงแดด UVA และ UVB</li><li>ฮอร์โมนที่มักเปลี่ยนแปลงสำหรับเพศหญิง</li></ul><h3>วิธีการป้องกันและรักษากระ</h3><p><strong>1. ทาครีมกันแดด</strong> ครีมกันแดดเป็นสิ่งสำคัญอย่างมากสำหรับการปกป้องผิวไม่ให้เผชิญกับแสงแดดทำร้ายโดยตรง เพราะทำหน้าที่กรองแสงแดดไม่ให้ใบหน้ามีกระเพิ่มขึ้นได้
  นอกจากนี้ ทำให้ใบหน้าของเราไม่หมองคล้ำอีกด้วย ขณะเดียวกันก็อย่าลืมพกร่ม สวนแว่นตากันแดด หมวกและเสื้อคลุมกันแดดไปพร้อมกันนะคะ เพื่อที่จะได้ปกป้องผิวสวยให้ขาวกระจ่างใสไร้กระอย่างถาวรนั่นเอง</p><p><img src="https://www.doctoryounger.com/img-uploads/66.jpg" alt=""></p><p><strong>2. ล้างหน้าให้สะอาด</strong> ควรล้างหน้าทำความสะอาดอย่างหมดจดวันละ 2 ครั้ง เช้า-เย็นและตามด้วยการทาครีมบำรุงผิวที่มีส่วนผสมของไวท์เทนนิ่งตามด้วยทุกครั้ง</p><p><strong>3. สครับและมาส์กหน้า</strong> ควรทำการสครับและมาส์กหน้าเป็นประจำอย่างน้อยสัปดาห์ละครั้ง แต่หลังจากการสครับผิวหน้าแล้วไม่ควรออกแดดทันที ควรเลือกวันสครับผิวในวันที่ไม่มีโปรแกรมออกจากบ้านในวันรุ่งขึ้นดีกว่า</p><p><img src="https://www.doctoryounger.com/img-uploads/55.jpg" alt=""></p><p><strong>4. ยิงเลเซอร์ </strong>เป็นวิธีเดียวที่ค่อนข้างกำจัดกระแบบได้ผลดี ทว่ามาพร้อมค่าใช้จ่ายที่สูง แต่รักษากระได้หายชัวร์แน่นอน ทั้งนี้ก่อนจะทำการยิงเลเซอร์ สาวๆ สามารถขอคำแนะนำจากแพทย์ผู้เชี่ยวชาญก่อนเป็นดีที่สุด</p><p><strong>5. เมคอัพปกปิดรอยกระ</strong> การแต่งหน้าเป็นหนทางแก้ปัญหาเฉพาะหน้าที่ได้ผลดีเยี่ยมไม่แพ้กัน
  สาวคนไหนที่ไม่มั่นใจกับการแต่งตัวสวยๆ ออกจากบ้านเพราะอายใบหน้าที่มีกระ ก็เพียงหยิบรองพื้นและคอนซีลเลอร์มาช่วยตบแต่งบนใบหน้าเพื่อปกปิดรอยกระเท่านี้ก็เดินเฉิดฉายออกจากบ้านได้อย่างมั่นใจแล้วค่ะ</p><h3>ที่มา: Oregonwetlands</h3>'
