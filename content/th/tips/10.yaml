title: ผิวดีน่ากัด 5 เทรนด์ใหม่การดูแลตัวเองสไตล์สาวรักธรรมชาติ
date: 12 Apr 2017
source: Girlsallaround
body: '<p>มาอัพเดทเทรนด์สไตล์รักธรรมชาติกันตั้งแต่ภายในถึงภายนอกให้สาวๆ ได้เป็นสาวรักธรรมชาติตัวจริงกันเลยทีเดียว สาวๆ ที่ใส่ใจสุขภาพและใส่ใจกับสิ่งแวดล้อมรอบข้างนี่ดูเป็นคนคูลสุดๆ ดูน่าเข้าหาและมีเสน่ห์ เพราะมันสื่อว่าคนๆนั้นได้ดูแลตัวเองอย่างดีแถมยังเผื่อแผ่ความใส่ใจไปถึงคนรอบข้างด้วย จะอดใจไม่ให้หลงใหลยังไงไหว ถ้าอยากเป็นสาวที่น่าสนใจแบบนี้ ลองมาดูกันดีกว่าค่ะ ว่าทำได้ยังไงบ้าง</p><h3>1. เปลี่ยนจากทานขนมขบเคี้ยวเป็นทานผักผลไม้แทน</h3><p>ขนมขบเคี้ยวนอกจากจะมีไขมันที่ทำให้อ้วนแล้วยังมีโซเดียมเยอะไม่ดีต่อไตด้วย งั้นเปลี่ยนจากขนมเป็นผักผลไม้สดๆจะดีกว่า ผิวจะได้สวยเปล่งปลั่งจากภายใน ควรทานผักผลไม้ให้ครบ 5 สี และเลือกของที่มีประโยชน์ต่อร่างกาย ประโยคที่ว่า You are what you eat นี่ยังไงก็จริงวันยังค่ำ ถ้าเลือกทานแต่ของที่มีประโยชน์แล้วหุ่นดีๆ ผิวดีๆ จะหนีไปไหนได้</p><p><img src="https://www.doctoryounger.com/img-uploads/33.jpg" alt=""></p><h3>2. ลองปลูกต้นไม้แบบอินดอร์ ฟอกอากาศในบ้าน</h3><p>สีเขียวๆ ในบ้านคงจะเป็นอะไรที่ดูแล้วรู้สึกรีเฟรชสุดๆ ลองหาต้นไม้ที่สามารถอยู่ในร่มได้ เช่น เฟิร์นหรือต้นปาล์มที่ปลูกได้ในกระถางไม่ใหญ่มากมาวางไว้ในบ้าน
  สามารถช่วยฟอกอากาศให้เย็นสบายและสะอาดขึ้นได้ หรือจะเป็นต้นไม้ต้นเล็กๆ อย่างกระบองเพชรนำไปวางไว้ข้างคอมพิวเตอร์หรือโน๊ตบุ๊คนอกจากจะมองเพลินสบายตาเวลาทำงานหรืออ่านหนังสือแล้ว ต้นไม้น้อยๆนี้ยังช่วยดูดซับพลังงานจากสนามแม่เหล็กของ จอคอมพิวเตอร์ได้ด้วยนะผิวจะได้สัมผัสอากาศบริสุทธิ์ในบ้านบ้าง ไปผจญกับอากาศปนเปื้อนจนหม่นหมองจากในเมืองมาพอแล้ว</p><p><img src="https://www.doctoryounger.com/img-uploads/11.jpg" alt=""></p><h3>3. เปลี่ยนจากวิ่งในฟิตเนสไปวิ่งสัมผัสธรรมชาติในสวน</h3><p>จะดูแลผิวให้สวยต้องอย่าลืมออกกำลังกายด้วยนะ ลองมองหาสวนใกล้ๆบ้านแล้วออกไปวิ่งกันสัก 30 นาที ก็ช่วยให้สาวๆแข็งแรงขึ้นอีกเยอะดีต่อผิว ดีต่อร่างกาย ช่วยในเรื่องระบบหมุนเวียนเลือด ทำอะไรจะได้ไม่เหนื่อยง่าย แถมผิวยังดูเปล่งปลั่งสดใสขึ้นมาได้เลยล่ะ ถ้าไม่เชื่อลองออกกำลังกายเป็นประจำติดต่อกันสัก 1 เดือนดูสิ จะมีความแตกต่างเห็นได้อย่างชัดเจนเลยค่ะ</p><h3>4. ผ่อนคลายผิวด้วยการอาบน้ำ</h3><p>การอาบน้ำนี่แหละค่ะที่ทำให้ผิวเราผ่อนคลายแบบสุดๆ แต่หากต้องการดูแลผิวไปพร้อมๆกับการอาบน้ำและรู้สึกว่าการอาบน้ำปกติไม่เพียงพอแล้วละก็ ลองหาตัวช่วยบำรุงอย่างมะขาม
  เกลือสปา หรือครีมอาบน้ำที่ผสมเม็ดบีดส์ ยิ่งถ้ามีกลิ่นหอมๆ เช่น วานิลลา หรือ ข้าวโอ๊ตด้วยแล้ว รับรองว่าทำให้สาวๆรู้สึกดีไม่น้อย แถมช่วยผลัดเซลล์ผิวชั้นนอกที่ตายแล้วออกไปพร้อมทั้งเพิ่มความนุ่มชุ่มชื้นให้กับผิวด้วย</p><p><img src="https://www.doctoryounger.com/img-uploads/00.jpg" alt=""></p><h3>5. ใช้ผลิตภัณฑ์ที่มาจากธรรมชาติดูแลผิวให้สวยสุขภาพดีน่ากัด</h3><p>เชื่อว่าใครๆ ก็อยากมีผิวสวยเพอร์เฟ็กต์ที่ไร้รอยด่างดำ ดูโกลว เปล่งปลั่ง ไม่ว่าจะเป็นผิวขาวหรือผิวแทนถ้าเลือกผลิตภัณฑ์ที่ปรุงแต่งมากๆก็อาจจะทำให้ผิวดูอ่อนล้ามากกว่าเดิม ขอแนะนำให้ใช้ผลิตภัณฑ์ที่สกัดมาจากธรรมชาติแท้ๆจะดีกว่า</p><h3>ที่มา: Girlsallaround</h3>'
