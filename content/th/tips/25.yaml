title: 4 ข้อดีมีประโยชน์จากน้ำมันมะกอก ที่คุณรู้แล้วจะต้องอึ้ง!!!
date: 21 Jun 2017
source: เบอร์ทอลลี่
body: '<p><strong>“You are what you eat.”</strong> เป็นประโยคคลาสสิคที่มักใช้เตือนใจให้ผู้คนใส่ใจดูแลสุขภาพ ถ้าแปลเป็นภาษาไทยตรงๆ ก็คือ “กินอะไรไป คุณก็ได้อย่างนั้น” ซึ่งหมายความว่า หากเรารู้จักรับประทานอาหารที่ดี มีประโยชน์ต่อร่างกาย เราก็จะสุขภาพดีตามไปด้วย ทั้งร่างกายสมดุล ไม่อ้วนหรือผอมจนเกินไป ไม่มีโรคภัยไข้เจ็บมากวนใจอย่างแน่นอน หลายครั้งที่เราอาจจะอยากเริ่มหันมารับประทานอาหารเพื่อสุขภาพ แต่อีกใจเราก็รู้สึกว่าเป็นเรื่องยุ่งยาก ไม่อยากเปลี่ยนแปลงการกินอาหารอร่อยๆ หลากหลายรสชาติ มากินอาหารรสคลีนๆ จืดๆ แต่ความจริงแล้ว สุขภาพที่ดีสามารถเริ่มได้ทีละเล็กละน้อย จนไปสู่ผลลัพธ์ที่ยิ่งใหญ่ได้ โดยเริ่มต้นง่ายๆ จากการปรุงอาหาร ลองนึกตามดูว่า ถ้าน้ำมันที่เป็นส่วนประกอบในอาหารแทบทุกมื้อของเรามีคุณค่าทางอาหารที่มากกว่าเดิม จะสามารถสร้างความเปลี่ยนแปลงแก่สุขภาพเราได้เป็นอย่างมากเลยทีเดียว โดยน้ำมันมะกอกถือเป็นน้ำมันสกัดธรรมชาติจากผลมะกอก อันเป็นหนึ่งในตัวเลือกที่ดีที่สุดสำหรับการปรุงอาหารเพื่อสุขภาพ และยังช่วยให้เรายังสามารถตามใจปาก รับประทานอาหารจานโปรดแบบผัดๆ ทอดๆ ตามเดิมได้โดยไม่รู้สึกผิด แถมยังเป็นการเสริมสุขภาพให้ดีได้อีกด้วย</p><p><img
  src="https://www.doctoryounger.com/img-uploads/110.jpg" alt=""></p><h3>1. น้ำมันมะกอกช่วยลดระดับคอเลสเตอรอล</h3><p>น้ำมันมะกอกไม่มีส่วนประกอบของเกลือ แถมยังปราศจากคอเลสเตอรอล และอุดมไปด้วยไขมันชนิดไม่อิ่มตัวถึง 77% โดยเฉพาะกรดโอเลอิกหรือกรดไขมันไม่อิ่มตัวเชิงเดี่ยว นายพศิษฐ์ คณาศิริชัยนนท์ นักกำหนดอาหารวิชาชีพและวิทยากรด้านอาหารและสุขภาพ จากเพจเฟสบุ๊คชื่อดังด้านอาหารและโภชนาการ "เมื่อวานป้าทานอะไร?" กล่าวว่า "สิ่งที่น่าสนใจคือ น้ำมันมะกอกนั้นมีส่วนประกอบของกรดโอเลอิกถึง 80% ซึ่งการบริโภคไขมันไม่อิ่มตัวเชิงเดี่ยวหรือกรดโอเลอิกที่ว่านี้ในปริมาณที่สมดุลและพอเหมาะ สามารถช่วยรักษาระดับคอเลสเตอรอลให้คงที่ และยังช่วยลดความเสี่ยงจากโรคต่างๆ ที่ตามมาจากการมีระดับคอเลสเตอรอลสูงได้อีกด้วย"</p><h3>2. น้ำมันมะกอกอุดมไปด้วยสารต้านอนุมูลอิสระ</h3><p>ที่ไม่พบในน้ำมันชนิดอื่นๆ และยังอุดมไปด้วยวิตามินอี น้ำมันมะกอกเพียงหนึ่งช้อนโต๊ะมีวิตามินอีมากถึง 8% ของปริมาณวิตามินอีที่ร่างกายต้องการในแต่ละวัน ในน้ำมันมะกอกยังประกอบด้วย สารต้านอนุมูลอิสระตามธรรมชาติ และสารโพลิฟีนอล ที่ไม่พบในน้ำมันชนิดอื่นๆ นอกจากนี้
  ยังไม่ก่อให้เกิดโรคหัวใจ หลอดเลือด และโรคเบาหวาน</p><h3>3. น้ำมันมะกอกป้องกันการเกิดโรคหัวใจและหลอดเลือด</h3><p>น้ำมันมะกอกมีปริมาณของกรดไขมันไม่อิ่มตัวเชิงเดี่ยวสูงกว่าน้ำมันพืชชนิดอื่นๆ เช่น น้ำมันถั่วเหลือง น้ำมันเมล็ดทานตะวัน คนที่ได้รับกรดไขมันไม่อิ่มตัวเชิงเดี่ยวจากน้ำมันมะกอกเป็นประจำนั้น จะมีระดับของคอเลสเตอรอลในเลือดชนิด LDLต่ำ ซึ่ง LDL นี้เองที่เป็นหนึ่งในปัจจัยสำคัญอันก่อให้เกิดโรคหัวใจและหลอดเลือดนั่นเอง นอกจากนี้ น้ำมันมะกอกยังช่วยลดความเสี่ยงในการเกิดโรคเกี่ยวกับเส้นเลือด ลดภาวะเกล็ดเลือดจับตัวเป็นลิ่ม ช่วยให้เส้นเลือดแข็งแรงขึ้น และยังช่วยป้องกันโรคอัลไซเมอร์อีกด้วย</p><p><img src="https://www.doctoryounger.com/img-uploads/1112.jpg" alt=""></p><h3>4. น้ำมะกอกช่วยลดเบาหวานได้หลายวิธี</h3><p>ตามที่กล่าวไปข้างต้นว่า น้ำมันมะกอกนั้นมีสารต้านอนุมูลอิสระสูง ซึ่งสารต้านอนุมูลอิสระนี้ สามารถช่วยลดความเสียหายจากสภาวะเครียดออกซิเดชัน (Oxidative Stress) อันเป็นผลมาจากระดับน้ำตาลในเลือดที่สูงได้ จึงช่วยลดความเสี่ยงในการเกิดสภาวะแทรกซ้อนจากโรคเบาหวานได้เป็นอย่างดี รวมทั้งอาการที่เกิดขึ้นจากเส้นประสาทชนิดต่างๆ
  ถูกทำลายโดยโรคเบาหวาน (Diabetic Neuropathy) ภาวะความเสียหายของประสาทในเรตินา (Retinal Neuropathy) ภาวะความดันเลือดสูง และโรคหัวใจ</p><p>น้ำมันมะกอกยังสามารถช่วยต้านการอักเสบซึ่งเป็นสาเหตุของโรคต่างๆ ได้อีกด้วย โดยน้ำมันมะกอกจะช่วยลดการอักเสบและผลข้างเคียงจากการอักเสบในระยะยาวได้ เช่น ในโรคเบาหวาน และสภาวะแทรกซ้อนจากการเป็นโรคเบาหวาน ด้วยคุณสมบัติต่างๆ ที่มีในน้ำมันมะกอก รวมถึงสามารถทนความร้อนได้สูง จึงเหมาะกับการปรุงเมนูอาหารไทยได้อย่างหลากหลาย ตั้งแต่เมนูอบ ย่าง ไปจนถึง ผัด ทอด ช่วยให้เราสามารถรักษาสุขภาพไปพร้อมๆ กับความเอร็ดอร่อยในการรับประทานอาหารจานโปรดจานเดิมได้โดยไม่ต้องปรับเปลี่ยนไลฟ์สไตล์ ไม่มีใครมาเสกสุขภาพที่ดีให้กับเราได้ เราต้องสร้างมันขึ้นมาด้วยตัวเอง อย่าลืมนะว่า “คุณกินอะไรไป คุณก็ได้อย่างนั้น” ลองเริ่มเปลี่ยนหันมาใช้น้ำมันมะกอกดู รับรองว่ารสชาติอาหารยังอร่อยเหมือนเดิม แถมสุขภาพดีขึ้นอีกด้วย</p><h3>ที่มา: เบอร์ทอลลี่</h3>'
