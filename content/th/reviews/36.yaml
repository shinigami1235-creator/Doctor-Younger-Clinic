title: ลดน่องให้เรียวสวยด้วย Botox
by: รีวิวโดย จ๊ะจ๋า
body: <p>อยากจะมีขาเรียวเล็กสมส่วนเหมือนคนอื่น ออกกำลังกายก็แล้ว แต่ขาก็ยังไม่เล็กลง จะนุ่งสั้นก็ไม่มั่นใจอีก พอดีมีคนแนะนำให้มาปรึกษาที่ Doctor Younger Clinic เพราะว่าดี คุณหมอเก่ง ก็เลยลองมาค่ะ เริ่มจากขอคำปรึกษา ซึ่งคุณหมอก็น่ารัก ดูเป็นกันเองมากๆ จะประเมินสภาพปัญหาของคนไข้ ปริมาณยาที่ต้องใช้นั้น คุณหมอบอกว่าขึ้นอยู่กับปัญหาของแต่ละบุคคล จะไม่แบบว่า Fix เพราะแต่ละคนมีปัญหาและความต้องการที่แตกต่างกัน รวมถึงยังให้คำแนะนำต่างๆ เพื่อให้คนไข้เป็นผู้ตัดสินใจเอง ไม่ได้บังคับ ไม่ได้บอกว่าแบบต้องเหมาทั้งขวดนะถึงจะได้ผล แต่คุณหมอจะแนะนำบนพื้นฐานของความจริง ตามปัญหาของแต่ละคนจริงๆ ซึ่งแบบรู้สึกประทับใจมากๆ และก็เลยตัดสินใจทำเลยค่ะ</p><p><img src="https://www.doctoryounger.com/img-uploads/DY176%20copy.jpg" alt=""></p><p>คุณหมอบอกว่า "โบท็อกซ์ลดน่อง" เป็นการคลายกล้ามเนื้อน่องให้ทำงานน้อยลง จึงทำให้ขนาดดูเล็กลง มั่นใจขึ้น หากใครที่น่องใหญ่เพราะไขมัน ต้องทำอย่างอื่นควบคู่ไปด้วย เช่น การดูดไขมัน การทำเลเซอร์ แล้วแต่คุณหมอแนะนำตามสภาพปัญหาของแต่ละคน ผลการรักษาจะอยู่ได้นานประมาณ 4-6 เดือน แล้วแต่บุคคล
  รวมถึงการใช้ชีวิตในแต่ละวันด้วย สุดท้ายนี้ขอขอบคุณ Doctor Younger Clinic ที่ช่วยให้มีเรียวขาที่สวย มั่นใจ การบริการดีมาก เป็นกันเองทุกคนเลยค่ะ</p>
