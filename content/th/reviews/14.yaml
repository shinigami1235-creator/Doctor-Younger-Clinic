title: รักษาสิวบนใบหน้า
by: รีวิวโดย รีน
body: <p>ปัญหาสิวหนักมาก เม็ดทั้งใหญ่และแดง จนเริ่มขาดความมั่นใจ เป็นมาหลายเดือนแล้ว หาหมอมาหลายที่ก็ยังไม่ดีขึ้นเลย เพื่อนเลยแนะนำให้มาหาที่ Doctor Younger ก็เลยลองมาปรึกษาที่นี่ดู วันนั้นก็เลยมาที่สาขาสุมขุมวิท 23 ได้พบกับคุณหมอเจน ก็เลยขอฝากตัวเป็นคนไข้ซะเลย</p><p><img src="https://www.doctoryounger.com/img-uploads/Ryn%20%E0%B8%AA%E0%B8%B4%E0%B8%A74%20copy.jpg" alt=""></p><p>คุณหมอบอกว่า...สำหรับปัญหาสำคัญของหญิงสาวอีกประการคือ ปัญหาสิว และบางท่านก็พบอาการที่หนักหนาจนทำให้หมดความมั่นใจไปเลยทีเดียว ซึ่งปัญหาสิวของคุณผู้หญิงอาจจะไม่ได้เกิดจากสุขลักษณะในการรักษาความสะอาดเพียงอย่างเดียว ยังเกิดได้จากสภาวะฮอร์โมน ที่มีฮอร์โมนเพศชายในร่างกายมากผิดปกติ ซึ่งคุณหมอได้ให้คำแนะนำขั้นตอนในการรักษาดังนี้</p><p>1.) เจาะเลือด เพื่อตรวจดูค่าฮอร์โมน</p><p>2.) ทานยาช่วยปรับระดับฮอร์โมน และยาลดการอักเสบ</p><p>3.) แนะนำให้ทำโปรแกรม Clear Light ซึ่งเป็นการฉายแสงความเข้มข้นสูงด้วยแสงสีแดง เพื่อลดการอักเสบของสิว</p><p><img src="https://www.doctoryounger.com/img-uploads/Ryn%20%E0%B8%AA%E0%B8%B4%E0%B8%A72%20copy.jpg"
  alt=""></p><p>หลังจากได้ทำความสะอาดหน้าแล้ว ก็ถึงเวลาฉายแสงสีแดงแล้ว เพื่อทำการรักษาสิว ตัวการที่ทำให้เราขาดความมั่นใจ ซึ่งใช้เวลาในการทำประมาณ 15-20 นาที</p><p><img src="https://www.doctoryounger.com/img-uploads/Ryn%20%E0%B8%AA%E0%B8%B4%E0%B8%A73%20copy.jpg" alt=""></p><p>ส่วนเจ้าแสงสีแดง หรือ Red Light มีคุณสมบัติช่วยในการรักษาสิวอักเสบ นอนเพลินได้แป๊บนึง ก็เป็นอันเสร็จเรียบร้อยแล้วค่ะ หลังจากนั้นก็ออกมาพบคุณหมออีกครั้ง เพื่อนัดเจาะเลือด โดยให้เราไปที่โรงพยาบาลเอง และนำผลตรวจกับมาให้คุณหมอดู คำแนะนำที่สำคัญที่สุดคือ ห้ามกด ห้ามบีบโดยเด็ดขาด และห้ามทำทรีทเม้นท์ใดๆด้วย เพราะจะทำให้เกิดการอักเสบ เป็นแผลเป็น และอาจเกิดปัญหารอยบุ๋มของหลุมสิวตามมาอีกด้วย ทั้งนี้ควรปฏิบัติตนตามคำสั่งแพทย์อย่างเคร่งครัดตลอดการรักษา</p><p><img src="https://www.doctoryounger.com/img-uploads/Ryn%20%E0%B8%AA%E0%B8%B4%E0%B8%A71%20copy.jpg" alt=""></p><p>ระยะเวลาการในรักษาเคสของเรานี้ คุณหมอบอกว่าค่อนข้างหนัก และต้องใช้เวลาในการรักษาค่อนข้างนาน ผ่านมาได้ 2 สัปดาห์ สิวเริ่มยุบและแดงอักเสบน้อยลง เราได้มาทำฉาย Red Light
  ประมาณ 5-6 ครั้ง และทายาตามที่คุณหมอให้ไป รวมถึงพยายามดูแลรักษา ไม่มือบอน ไปกด ไปบีบ ไปจับมัน แค่นั้นเอง รวมๆแล้วผ่านไปเดือนครึ่ง สิวทั้งหลายนี้ก็เริ่มหายไปจากหน้าเรา ขอขอบคุณ "คุณหมอเจน" และขอบคุณ Doctor Younger ที่ดูแลเราเป็นอย่างดีค่ะ</p>
