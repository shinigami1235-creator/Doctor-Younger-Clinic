title: ลบไฝบริเวณมุมปากด้วย CO2 Laser
by: รีวิวโดย นิภา
body: <p>วันนี้ลูกค้า "คุณนิภา" ได้เข้ามารับบริการ CO2 Laser เพื่อลบไฝบริเวณมุมปากออก ดูแลการรักษาโดย พ.ญ.พัชราภรณ์ วชิรนันทศิลป์ (คุณหมอบี) ที่สาขา Terminal 21 ขอขอบคุณลูกค้าที่ไว้วางใจให้เราได้ดูแลคุณนะคะ</p><p><img src="https://www.doctoryounger.com/img-uploads/DY178%20copy.jpg" alt=""></p>
