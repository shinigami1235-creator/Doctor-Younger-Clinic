title: Fractional Co2 Laser โดยคุณณรงวิทย์ เตชะธนวัฒน์ นักแต่งเพลงชื่อดัง
by: รีวิวโดย ณรงวิทย์ เตชะธนวัฒน์
body: <p>ยิ่งอายุเพิ่มมากขึ้น ก็ยิ่งต้องดูแลตัวเอง "คุณหนึ่ง ณรงวิทย์ เตชะธนวัฒน์" นักแต่งเพลง นักร้อง โปรดิวเซอร์ ได้เข้ามารับบริการ Fractional Co2 Laser ที่สาขาธัญญา พาร์ค ศรีนครินทร์ โดย น.พ.สว่าง อัมพรพันธ์ เพื่อดูแลและปรับสภาพผิวหน้า กระชับรูขุมขน ให้ผิวดูเรียบเนียน และมีสุขภาพดียิ่งขึ้น ย้อนวัยให้อายุเป็นเพียงตัวเลข</p><p><img src="https://www.doctoryounger.com/img-uploads/DY319%20copy.jpg" alt=""></p><p>ก่อนทำก็จะต้องแปะยาชาทิ้งไว้ประมาณ 40 นาที แล้วก็ใช้เวลาทำไม่นานครับ ประมาณ 15 นาทีเอง ขณะทำก็ไม่่เจ็บ จะรู้สึกอุ่นๆ หน่อย เพราะคุณหมอบอกว่า อยู่การตั้งค่าตามสภาพผิวและปัญหาของแต่ละบุคคล หลังทำคุณหมอแจ้งว่า จะมีแผลตกสะเก็ดเล็กน้อย แต่ของผมจะมีไม่มาก เพราะใช้การตั้งค่าอย่างเบา เพื่อทำการคลีนหน้าหรือผลัดเซลล์ชั้นบนออก เพื่อให้ผิวหน้าดูเรียบเนียนขึ้น แล้วก็ห้ามออกไปโดนแดดแรงๆด้วย อีกอย่างคุณหมอก็มือเบาและฝีมือดีมากๆด้วยครับ เลยไว้ใจที่จะมารับบริการที่นี่</p><p><img src="https://www.doctoryounger.com/img-uploads/DY321%20copy.jpg" alt=""></p>
