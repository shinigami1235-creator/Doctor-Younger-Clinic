title: Review ครีมกันแดด 360 ของ Doctor Younger
by: รีวิวโดย KoOoR
body: <p>ก่อนอื่นเลย...ส่วนตัวเราเป็นคนไม่ค่อยชอบทาครีมอะไรซักเท่าไหร่อยู่แล้ว เพราะทาแล้วหน้ามัน เหนียว โดยเฉพาะพวกครีมกันแดดทั้งหลาย ที่ได้ลองมาแล้วหลายยี่ห้อ ทาแล้วหน้าจะมันเยิ้มมากๆ ตอนนี้ก็วางทิ้งไว้เต็มไปโต๊ะ เต็มกระเป๋าไปหมด ถามว่ารู้จักครีมยี่ห้อนี้ได้อย่างไร?? เริ่มจากไปทำทรีทเม้นท์หน้าที่นี่ แล้วพี่ๆพนักงานเค้าก็แนะนำให้เราลองใช้ บอกมาหลายครั้งแล้ว ก็เลยลองตัดสินใจใช้ดู</p><p><img src="https://www.doctoryounger.com/img-uploads/%E0%B8%81%E0%B8%B1%E0%B8%99%E0%B9%81%E0%B8%94%E0%B8%94%20copy.jpg" alt=""></p><p>ได้ลองใช้มา 2 อาทิตย์แล้ว บอกเลยว่าใช้ดีมากๆ ทาแล้วหน้าไม่มันเหมือนยี่ห้ออื่นๆ (ตกบ่ายหน้าก็ไม่เยิ้ม) ไม่อวย ไม่เว่อร์ ไม่ได้ค่าโฆษณาอะไรด้วย เรารีวิวให้จากใจ เพราะใช้แล้วดีจริงๆ เริ่มจาก "เนื้อครีม" เป็นเนื้อละเอียด ไม่ข้นมาก บางเบา ไม่เหนียวเหนอะหนะ สามารถใช้แทนรองพื้นได้เลย ตอนนี้ใช้แล้วอุ่นใจ แดดแรงแค่ไหนก็ไม่กลัว เพราะ<strong>ปกป้องผิวหน้าได้อย่างมีประสิทธิภาพ</strong></p><p><img src="https://www.doctoryounger.com/img-uploads/Sunscreen2%20copy.jpg" alt=""></p><p>ส่วนราคา
  1,200 บาท ตอนแรกรู้สึกแพงนะ เพราะเราก็มีกำลังระดับกลางๆ ใช้ครีมอย่างแพงๆก็ไม่เคยเกินพัน แต่พอลองแล้วแบบว่าไม่แพงเลย คุ้มค่า คุ้มราคามากๆ คุณภาพเกินราคาจริงๆ ดีกว่าแบบซื้อถูกแล้วไปวางทิ้งเอาไว้ สำหรับใครที่รักสวยรักงาม ต้องรีบหามาลองเลยนะจ๊ะ ซื้อ 1 แต่ได้ถึง 2 เพราะนอกจากจะเป็นครีมกันแดดแล้ว ยังเป็นครีมรองพื้นในตัวอีกด้วย กับครีมกันแดด ยี่ห้อ <strong>Doctor Younger Sunscreen 360 SPF 50 PA+++</strong> ลองใช้มาประมาณ 2 สัปดาห์แล้ว ชอบที่สุดคือ ใช้แล้วหน้าไม่เหนียว ไม่หนา ไม่หลอก ดูว่าไม่โบ๊ะ เพราะเนื้อครีมบางเบามาก ซึมเร็ว แค่หลอดเล็กๆ แต่คุณภาพเยี่ยมมาก ตอนนี้ไม่กลัวแดดแล้ว แค่มี <strong>Doctor Younger Sunscreen 360 SPF 50 PA+++</strong> พกไว้อุ่นใจทุกที่ ทุกเวลาค่ะ</p><p><img src="https://www.doctoryounger.com/img-uploads/Sunscreen%20copy.jpg" alt=""></p><p>ไม่ว่าคุณจะอายุเท่าไร เริ่มตอนนี้ก็ยังไม่สาย มาปกป้องผิวของคุณด้วย <strong>Doctor Younger Sunscreen 360 SPF 50 PA+++</strong> นวัตกรรมแห่งการปกป้องผิวชั้นสูงจากแสงทุกชนิด แบบทุกองศา และครบวงจร เพื่อคืนความอ่อนเยาว์ให้แก่ผิว ด้วยเนื้อฟลูอิด
  (Fluid/Fluide) สีเบจ กันน้ำได้ดี ผสมผสานเป็นเนื้อเดียวกับผิว รู้สึกถึงความเนียนนุ่ม พร้อมยังช่วยปรับสภาพผิวให้ดูกระจ่างใสอย่างเป็นธรรมชาติ ไร้ที่ติทุกมุมมอง</p>
