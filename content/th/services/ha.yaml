name: HA
tagline: สารเติมเต็ม
body: <h3>ผลลัพธ์ที่ได้จาก HA (สารเติมเต็ม) </h3><ul><li>แก้ปัญหาริ้วรอยบนใบหน้า</li><li>ช่วยให้ใบหน้าเต่งตึง กระชับ</li><li>เติมเต็มผิวบริเวณที่มีริ้วรอยร่องลึก</li><li>ใบหน้าแลดูอ่อนเยาว์มากขึ้น</li></ul><h3>หลักการทำงานของ HA (สารเติมเต็ม) </h3><p><strong>ฟิลเลอร์หรือสารเติมเต็ม</strong> คือการฉีดสารเข้าใต้ผิวหนังบริเวณจุดต่างๆของใบหน้าเพื่อ เติมเต็มในบริเวณนั้นๆ เช่น ริ้วรอยใต้ตา ร่องแก้ม แก้มตอบ ขมับตอบ โหนกแก้ม ริ้วรอยบนหน้าผาก เป็นต้น </p><p>โดยปกติแล้วในร่างกายของเรามีสารไฮยาลูโรนิค แอซิด (HYALURONIC ACID) ที่ช่วยเก็บกักและดูดซับนํ้า ทำให้ผิวเต่งตึง คงความชุ่มชื้นในผิวของเรา แต่เมื่อเราอายุมากขึ้น สาร HA ในผิวลดลง จึงทำให้เกิดริ้วรอย การฉีดสารเติมเต็มจะสามารถลดริ้วรอยที่เกิดขึ้นได้</p><h3>ข้อปฏิบัติตนหลังการฉีด HA</h3><ul><li>หลังจากการรักษา 24-48 ชั่วโมง อาจเกิดอาการบวม รอยแดงในบริเวณที่ทำการรักษา และจะหายไปในระยะเวลาประมาณ 30-60 นาที</li><li>เพื่อผลการรักษาที่ดี ควรงดแต่งหน้าทันทีหลังบริเวณที่ทำการรักษา และหลีกเลี่ยงสารที่มีส่วนผสมของ AHA , BHA , ครีมหรือเจลที่มีส่วนผสมของ RETINOID
  เป็นระยะเวลา 2 วัน</li><li>สามารถใช้เครื่องสำอางที่มีส่วนผสมของ LIGHT WATER BASE หรือเครื่องสำอางที่มีส่วนผสมของ OIL FREE ในบริเวณอื่นๆได้</li><li>สามารถใช้ผ้าชุบน้ำเย็นหรือเจลประคบเย็น ประคบบริเวณที่ฉีดเพื่อลดอาการบวมแดงได้</li><li>หลีกเลี่ยงการดื่มแอลกอฮอล์ เนื่องจากเป็นสาเหตุให้เส้นเลือดขยายตัว อาจทำให้เกิดการบวมแดงมากยิ่งขึ้นได้</li><li>หลีกเลี่ยงการออกกำลังกายหนักๆ หรือสัมผัสความร้อนจัดและหนาวจัด เช่น การทำสปา ซาวน่า แอโรบิค เป็นระยะเวลา 2 วัน</li><li>หลังจากการรักษาควรดื่มน้ำอุณหภูมิปกติมากๆ เพื่อให้ฟิลเลอร์อยู่ได้นานยิ่งขึ้น โดยดื่มน้ำมากๆ หลังการฉีดเป็นเวลา 4 วัน</li><li>หลีกเลี่ยงการนวดหน้าเป็นเวลา 1 เดือน</li><li>หลีกเลี่ยงการนวด จับ คลึง บริเวณที่ฉีด เนื่องจากอาจทำให้ฟิลเลอร์ผิดรูปได้</li></ul>
closing: 'สนใจติดต่อรับบริการได้ที่ด็อกเตอร์ ยังเกอร์ คลินิก ทุกสาขา สอบถามโทร. 02-261-3697-8 หรือทาง Facebook และ Line ID : @Doctoryounger'
