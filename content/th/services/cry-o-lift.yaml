name: CRY-O LIFT
tagline: ผิวยกกระชับ เต่งตึง เผยใบหน้าที่ขาวใส
body: <h3>ผลลัพธ์ที่ได้จาก CRY-O LIFT TREATMENT</h3><ul><li>ช่วยในการยกกระชับให้ผิวดูเฟิร์มและเต่งตึง</li><li>ปรับรูปหน้าให้เรียวและเข้ารูปมากขึ้น</li><li>กระชับรูขุมขน ทำให้รูขุมขนเล็กลง</li><li>ลดเลือนริ้วรอยและความหย่อนคล้อย</li><li>ลดความหมองคล้ำ และอาการบวมช้ำ</li><li>ฟื้นฟูผิวที่อ่อนล้าให้เปล่งปลั่ง ดูสดชื่น สดใส</li></ul><h3>หลักการทำงานของ CRY-O LIFT TREATMENT</h3><p>ทรีทเม้นท์ที่ใช้คลื่นความเย็นในการผลักวิตามินและสารอาหารลงสู่ผิว เพื่อลดเลือนริ้วรอย ให้ผิวยกกระชับ และช่วยกระตุ้นการสร้างคอลลาเจน ช่วยเพิ่มความชุ่มชื้น และกระชับรูขุมขน นอกจากนี้วิตามินและสารอาหารที่ผลักลงไปยังช่วยทำให้ใบหน้าขาวใส ผิวกระชับ และดูเรียบเนียนยิ่งขึ้น</p><h3>อัตราค่าบริการ</h3><ul><li>ราคาครั้งละ <strong>1,200</strong> บาท</li><li>คอร์ส 10 ครั้ง ราคา <strong>10,800</strong> บาท</li></ul>
closing: 'สนใจติดต่อรับบริการได้ที่ด็อกเตอร์ ยังเกอร์ คลินิก ทุกสาขา สอบถามโทร. 02-261-3697-8 หรือทาง Facebook และ Line ID : @Doctoryounger'
