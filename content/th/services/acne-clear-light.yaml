name: ACNE CLEAR LIGHT
tagline: เคลียร์เรื่องสิวๆ ให้ผิวหน้าสวยใส
body: <p><strong>ACNE CLEAR LIGHT</strong> เป็นโปรแกรมรักษาสิวด้วยแสง LIGHT– EMITTING DIODE (LED) ซึ่งมีประสิทธิภาพในการทำลายเชื้อแบคทีเรียต้นกำเนิดของสิวอุดตัน สิวอักเสบทั้งหลายได้อย่างรวดเร็ว เป็นการดีท็อกหน้าและมีความปลอดภัยสูง ประกอบด้วยแสง 3 สีด้วยกันซึ่งทำหน้าที่ในการรักษาสิวแตกต่างกัน ได้แก่</p><ul><li><strong>แสงสีเหลือง (INFRARED)</strong> ช่วยในการรักษาสิว (ACNE) และช่วยเพิ่มความขาวทำให้หน้าใสขึ้น</li><li><strong>แสงสีฟ้า (BLUE LIGHT)</strong> ช่วยลดการอักเสบ ประเด็นสำคัญที่สุดในการรักษาสิว (ACNE) คือ ตัวแสงนั้นจะมีพลังงานในการฆ่าเชื้อแบคทีเรียในผิวหนัง และแบคทีเรียตัวนี้เองที่เป็นสาเหตุทำให้เกิดสิว</li><li><strong>แสงสีแดง (RED LIGHT)</strong> ช่วยรักษาสิวอักเสบ</li></ul><h3>ระยะเวลาในการรักษา</h3><p>ควรรับการรักษาประมาณ 8-12 ครั้ง (ทั้งนี้ขึ้นอยู่กับสภาพปัญหาของแต่ละบุคคล) เพื่อเคลียร์ปัญหาสิวให้หมด </p><h3>สาเหตุของการเกิดสิว (ACNE)</h3><ul><li>การผลิตน้ำมันในผิวมากเกินไป โดยปกติแล้วต่อมไขมันจะผลิตน้ำมันเพื่อการหล่อลื่นผิวหนัง แต่มีหลายปัจจัยที่สามารถกระตุ้นการผลิตน้ำมันของต่อมไขมันได้
  เช่น ฮอร์โมน สภาพอากาศ ยาบางชนิด พันธุกรรม เป็นต้น </li><li>การที่ผิวหนังชั้นนอกสุด (STRATUM CORNEUM) เกิดการหนาตัวขึ้นผิดปกติ เนื่องจากเกิดการผลัดเซลล์ผิวที่ตายแล้วผิดปกติ ทำให้เกิดการอุดตันท่อต่อมไขมัน และส่งผลรบกวนการไหลของน้ำมันออกมานอกผิวหนัง จึงทำให้เกิดการอุดตันขึ้นในรูขุมขน ซึ่งกลายเป็นสิวอุดตันหัวปิด (สิวหัวขาว) หรือ ถ้าการอุดตันเกิดขึ้นใกล้กับปากรูขุมขน ก็จะเกิดเป็นสิวหัวเปิด (สิวหัวดำ) ขึ้นมา</li><li>แบคทีเรียที่เจริญเติบโตอยู่บริเวณรูขุมขน (PROPIONIBACTERIA) เป็นสาเหตุให้สิวอุดตัน เกิดเป็นสิวอักเสบ บวมแดง หรือเป็นหัวหนองขึ้นมา</li><li>กระบวนการอักเสบของร่างกาย ทำให้เกิดสิวบวมแดงและสิวอักเสบขึ้น ในกรณีที่เป็น SEVERE ACNE การอักเสบจะขยายและลึกลงไปในบริเวณเนื้อเยื่อที่อยู่ใกล้เคียงมากขึ้น</li></ul><h3>ข้อปฏิบัติและวิธีรักษาสิวเบื้องต้น</h3><ul><li>ควรเลือกใช้ผลิตภัณฑ์ล้างหน้าที่เหมาะกับสภาพผิว</li><li>ไม่ควรบีบสิวหรือแกะสิวเอง ควรปล่อยให้สิวยุบหรือหายเองตามธรรมชาติ</li><li>เลือกใช้ผลิตภัณฑ์บำรุงผิวและเครื่องสำอางที่ไม่ก่อให้เกิดการอุดตันรูขุมขน</li><li>ทำความสะอาดใบหน้าที่แต่งด้วยเครื่องสำอางให้สะอาดในทุกๆวัน</li></ul><h3>อัตราค่าบริการ</h3><ul><li>ราคาครั้งละ
  <strong>800</strong> บาท</li><li>คอร์ส 10 ครั้ง ราคา <strong>7,200</strong> บาท</li></ul>
closing: 'สนใจติดต่อรับบริการได้ที่ด็อกเตอร์ ยังเกอร์ คลินิก ทุกสาขา สอบถามโทร. 02-261-3697-8 หรือทาง Facebook และ Line ID : @Doctoryounger'
