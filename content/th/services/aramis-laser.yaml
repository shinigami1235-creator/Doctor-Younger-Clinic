name: ARAMIS LASER
tagline: รักษารอยแผลเป็น กระชับรูขุมขน ให้ผิวเรียบเนียน ดูอ่อนเยาว์
body: <p>ผิวไม่เรียบ ผิวขรุขระ เริ่มมีริ้วรอย ผิวไม่กระชับ จัดการได้ด้วย <strong>ARAMIS LASER</strong> เลเซอร์ที่ช่วยในการฟื้นบำรุงและกระตุ้นการสร้างคอลลาเจน ทำให้ใบหน้ากระชับ ชะลอการเกิดริ้วรอย และยังช่วยแก้ปัญหาสิวอักเสบได้ด้วย </p><h3>ผลลัพธ์ที่ได้จาก ARAMIS LASER</h3><ul><li>ช่วยกระตุ้นการสร้างคอลลาเจนใหม่ขึ้นมา</li><li>ช่วยยกกระชับผิว และกระชับรูขุมขน</li><li>ทำให้ผิวไม่เสียน้ำ</li><li>ลดเลือนริ้วรอย และลดปัญหาสิวอักเสบ</li></ul><p><strong>หลักการทำงานของ ARAMIS LASER </strong><strong></strong></p><p><strong>ARAMIS LASER</strong> นวัตกรรมการยกกระชับผิวและช่วยให้ผิวขาวใสด้วยการใช้เทคโนโลยีเลเซอร์เย็น “COOLBURST” ความยาวคลื่น 1,540 ที่อุณหภูมิ 5 CO พร้อมรังสีความยาวคลื่น 1,540 mm. ที่สามารถกระตุ้นการผลิตคอลลาเจน เพื่อให้ผิวหนังมีความกระชับยิ่งขึ้น ยิงเข้าสู่ชั้นผิวหนังแท้ ที่ความลึก 200-500 ไมโครเมตร ซึ่งแสงเลเซอร์จะไปกระตุ้นให้เซลล์ FIBROBLAST สร้างคอลลาเจนใหม่ขึ้นมา ผิวที่รูขุมขนกว้างจะเกิดการกระชับ ช่วยลดปัญหาสิวอักเสบ ฟื้นบำรุงให้ผิวแข็งแรง ใบหน้าขาวใสขึ้น เป็นการรีแพร์ผิวให้มีสุขภาพดียิ่งขึ้น
  </p><h3>ความปลอดภัยเมื่อรักษาด้วย ARAMIS LASER</h3><p><strong>ARAMIS LASER</strong> หลังการรักษาสามารถแต่งหน้าไปทำงานตามปกติได้ทันที โดยการรักษาหนึ่งครั้งใช้เวลาเพียง 30 นาที ทำเพียง 6 ครั้ง ก็จะเริ่มเห็นผลที่ดีขึ้นได้ ทั้งนี้ขึ้นอยู่กับสภาพผิวและปัญหาของแต่ละบุคคล การรักษาขึ้นอยู่กับการวินิจฉัยของแพทย์ผิวหนังที่ด็อกเตอร์ ยังเกอร์ คลินิก </p><h3>ARAMIS LASER เหมาะสำหรับใช้แก้ปัญหา</h3><ul><li>รอยแผลเป็น</li><li>ผิวหย่อนคล้อย </li><li>กระตุ้นการสร้างคอลลาเจน</li><li>รูขุมขนกว้าง</li><li>สิวอักเสบ</li></ul>
closing: 'สนใจติดต่อรับบริการได้ที่ด็อกเตอร์ ยังเกอร์ คลินิก ทุกสาขา สอบถามโทร. 02-261-3697-8 หรือทาง Facebook และ Line ID : @Doctoryounger'
