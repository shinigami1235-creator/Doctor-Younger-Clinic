name: BLUE MATE
tagline: บำรุงผิวหน้าให้แข็งแรง ขาวกระจ่างใส มีสุขภาพดี
body: <h3>ผลลัพธ์ที่ได้จาก BLUE MATE TREATMENT</h3><ul><li>ช่วยให้ใบหน้าขาวใส</li><li>กระตุ้นการสร้างคอลลาเจน</li><li>ช่วยบำรุงผิวให้แข็งแรง แลดูอ่อนเยาว์</li></ul><h3>หลักการทำงานของ BLUE MATE TREATMENT</h3><p>ทรีทเม้นท์ที่ใช้เพื่อเพิ่มประสิทธิภาพการส่งวิตามินและเซรั่มบำรุงผิวเข้าสู่ผิวหนัง โดยการทำงานร่วมกันระหว่างหัวเครื่องของ <strong>BLUE MATE</strong> และเซรั่มบำรุงผิวจากประเทศอิตาลี ทำให้การบำรุงผิวและรักษาผิวได้ผลอย่างรวดเร็วและยืนยาวขึ้น เป็นการเพิ่มวิตามินและสารอาหารที่จำเป็นต่อผิว เพื่อช่วยให้ผิวเนียนนุ่ม ขาวใสอย่างเป็นธรรมชาติ โดยผ่านระบบ PHOTO-STIMULATING OR PHOTO-DRAINING MASSAGE ที่ทำงานอย่างอ่อนโยน</p><h3>อัตราค่าบริการ</h3><ul><li>ราคาครั้งละ <strong>1,700</strong> บาท</li><li>คอร์ส 10 ครั้ง ราคา <strong>15,300</strong> บาท</li></ul>
closing: 'สนใจติดต่อรับบริการได้ที่ด็อกเตอร์ ยังเกอร์ คลินิก ทุกสาขา สอบถามโทร. 02-261-3697-8 หรือทาง Facebook และ Line ID : @Doctoryounger'
