name: ACTIVE BRIGHT
tagline: ฟื้นบำรุงความอ่อนเยาว์ และความขาวกระจ่างใส
body: <h3>ผลลัพธ์ที่ได้จาก ACTIVE BRIGHT </h3><ul><li>ฟื้นบำรุงให้ผิวหน้าเนียนใส</li><li>ลดเลือนริ้วรอยเล็กๆบนใบหน้า ให้ผิวเรียบเนียน และช่วยกระชับรูขุมขน</li><li>ลดเลือนจุดด่างดำและการผลิตเม็ดสีที่ไม่สม่ำเสมอ ทำให้ผิวขาวใสขึ้น</li><li>ลดการอักเสบและรอยแดงจากสิวบริเวณใบหน้า </li><li>ช่วยลดอาการของโรค Rosacea</li></ul><h3>หลักการทำงานของ ACTIVE BRIGHT</h3><p><strong>ACTIVE BRIGHT</strong> เป็น BRIGHT LASER ที่ช่วยให้ผิวขาวใสด้วยพลังงานแสงความเข้มสูงคล้ายแสงแฟลช ที่เปล่งออกมาในช่วงสั้นๆ และมีการกรองเพื่อให้ได้ช่วงความถี่ของแสงที่เหมาะสม ให้ช่วงความถี่ของแสงผันแปรตามการใช้งานได้ ซึ่ง LASER ที่ยิงเข้าสู่ผิวนั้นจะช่วยโฟกัสปัญหาในแต่ละชั้นผิว ตั้งแต่การรักษาเม็ดสีที่ผิดปกติ อันเป็นสาเหตุแห่งจุดด่างดำและริ้วรอยต่างๆ โดยจะไม่ไปทำลายชั้นผิวหนัง อีกทั้งยังช่วยลดการอักเสบของเส้นเลือด เส้นเลือดฝอยใต้ผิวหนัง ลดอาการอักเสบของรอยแดงจากสิว และผิวหมองคล้ำจากแสงแดดได้อย่างมีประสิทธิภาพ เพื่อผิวเนียนและขาวใสยิ่งขึ้น <strong>ACTIVE BRIGHT</strong> เป็นเลเซอร์อีกชนิดหนึ่งที่มีคุณสมบัติในการช่วยเพิ่มความขาวใสให้ผิวหน้า
  ช่วยลดเลือนจุดด่างดำ และทำให้รูขุมขนกระชับขึ้นอย่างเห็นได้ชัด เพิ่มความยืดหยุ่นให้กับผิว และลดเลือนริ้วรอยได้ ผิวดูมีสุขภาพดี นอกจากนี้ยังช่วยกระตุ้นการเกิดคอลลาเจนและอีลาสตินใต้ผิวหนัง ให้ผิวเนียนนุ่ม ชุ่มชื้นได้</p><p><strong>ACTIVE BRIGHT </strong>จึงนับเป็นนวัตกรรมการฟื้นบำรุงสภาพผิวที่มีประสิทธิภาพ และมีความปลอดภัยต่อทุกสภาพผิวให้กลับมางามได้ดังเดิม โดยหลังทำ <strong>ACTIVE BRIGHT</strong> อาจมีแผลที่ตกสะเก็ดบ้างเล็กน้อย ตามจุดที่มีความเข้มของสีอย่างเช่น กระ รอยสิว หรือจุดด่างดำ หลังจากนั้นสะเก็ดจะหลุดไปเองและรอยจุดด่างดำจะจางลง ควรหลีกเลี่ยงแสงแดดจัดประมาณ 1-2 สัปดาห์ และต้องทาครีมกันแดดเป็นประจำ ทั้งนี้การรักษาขึ้นอยู่กับการวินิจฉัยของแพทย์ผิวหนังที่ ด็อกเตอร์ ยังเกอร์ คลินิก</p><h3>ระยะเวลาที่เริ่มเห็นผล</h3><p>โดยปกติจะสามารถเห็นผลการเปลี่ยนแปลงของผิวพรรณตั้งแต่การรักษาครั้งแรก แต่จะเห็นผลอย่างชัดเจนเมื่อรับบริการอย่างต่อเนื่อง 3-5 ครั้ง (ทั้งนี้ขึ้นอยู่กับสภาพปัญหาผิวของแต่ละบุคคล) การรักษาแต่ละครั้งจะใช้เวลาเพียงครั้งละ 15-30 นาที</p>
closing: 'สนใจติดต่อรับบริการได้ที่ด็อกเตอร์ ยังเกอร์ คลินิก ทุกสาขา สอบถามโทร. 02-261-3697-8 หรือทาง Facebook และ Line ID : @Doctoryounger'
