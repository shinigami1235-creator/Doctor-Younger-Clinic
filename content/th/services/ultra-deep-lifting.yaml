name: ULTRA DEEP LIFTING
tagline: ช่วยลดปัญหาริ้วรอย ผิวหย่อนคล้อย
intro: หมดกังวลกับปัญหาหน้ากลม หน้าบาน หน้าใหญ่ หรือแม้แต่ผิวหย่อนคล้อย สามารถแก้ปัญหาได้ด้วย ULTRA DEEP LIFTING

# Depth shown on the skin layer diagram, from "รอยต่อของชั้นผิวกล้ามเนื้อส่วนบน (SMAS)" in the text below.
depth: smas

sections:
  - heading: ผลลัพธ์ที่ได้จาก ULTRA DEEP LIFTING
    list:
      - ช่วยให้ผิวยกกระชับ
      - ช่วยลดเลือนริ้วรอยต่างๆ บนใบหน้า
      - ช่วยปรับรูปหน้าให้ดูเรียวเล็ก
      - ช่วยลดไขมันบนใบหน้า
  - heading: หลักการทำงานของ ULTRA DEEP LIFTING
    text: ULTRA DEEP LIFTING เทคโนโลยีคลื่นเสียงที่มีความถี่สูง (FOCUSED ULTRASOUND) ในการส่งผ่านพลังงานขนาดเล็กๆ ลงสู่ผิวหนังชั้นลึก ชั้นใต้ผิวหนัง และรอยต่อของชั้นผิวกล้ามเนื้อส่วนบน (SMAS) เพื่อยกกระชับผิว (TISSUE LIFTING) และลดเลือนริ้วรอย โดยระหว่างที่ทำการรักษาแพทย์จะสามารถมองเห็นภาพของผิวหนังผ่านหน้าจอเครื่อง ทำให้สามารถรักษาได้อย่างตรงจุด เพื่อลดเลือนริ้วรอยไปพร้อมกับการปรับคลื่นเสียงให้เหมาะกับสภาพผิวหนังของคนไข้ได้อย่างเหมาะสม ทั้งยังสามารถช่วยลดไขมันบนใบหน้าได้อีกด้วย ทำให้ผิวเกิดการยกกระชับ จึงช่วยปรับรูปหน้าให้มีใบหน้าเรียวเล็กลง แลดูอ่อนเยาว์ยิ่งขึ้น โดยไม่ต้องใช้การศัลยกรรม
    diagram: true
  - heading: ระยะเวลาที่เริ่มเห็นผล
    text: กระบวนการรักษาของ ULTRA DEEP LIFTING จะไปกระตุ้นการเสริมสร้างคอลลาเจนให้เกิดขึ้นใหม่ได้อย่างต่อเนื่อง ทำให้ผิวหย่อนคล้อย ยกกระชับ เต่งตึง เรียบเนียนขึ้นอย่างเห็นได้ชัด ตั้งแต่การทำครั้งแรก และยังเห็นผลชัดเจนต่อเนื่องไปอีก 3 เดือน โดยการใช้คลื่นความถี่ที่เฉพาะเจาะจงและไม่เป็นอันตรายต่อผิวชั้นลึก ไม่ก่อให้ผลกระทบกับผิวบริเวณข้างเคียง ทั้งนี้การรักษาขึ้นอยู่กับการวินิจฉัยของแพทย์ผิวหนังที่ด็อกเตอร์ ยังเกอร์ คลินิก
  - heading: ULTRA DEEP LIFTING เหมาะสำหรับใช้แก้ปัญหา
    list:
      - แก้ปัญหาผิวหย่อนคล้อยบริเวณใต้คางมีเนื้อเป็นชั้นๆ
      - ยกกระชับใบหน้า
      - ช่วยแก้ปัญหาหนังตาตก รวมทั้งขอบตาล่างหย่อนยาน
      - แก้ปัญหาริ้วรอย
      - ปรับให้ใบหน้าเรียวเล็กได้รูป

