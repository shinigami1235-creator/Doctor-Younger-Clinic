name: PIGMENT LASER
tagline: ลดเลือนรอยกระตื้น กระลึก กระแดด ปานดำ และลบรอยสัก
body: <p>บอกลาปัญหากระ ปานดำ สีผิวไม่สม่ำเสมอ และรอยสักที่ไม่ต้องการแล้ว ด้วย PIGMENT LASER ที่เห็นผลลัพธ์ได้ดี เผยผิวใหม่ให้แลดูขาวใสขึ้น เสริมบุคลิกภาพ เพิ่มความมั่นใจให้กับตัวเอง </p><h3>ผลลัพธ์ที่ได้จาก PIGMENT LASER</h3><ul><li>ช่วยลดเลือนกระตื้น กระลึก กระแดด</li><li>ปานดำที่อยู่บนผิวจะจางลง</li><li>ช่วยลบรอยสัก</li><li>ช่วยให้ผิวขาวใส</li></ul><h3>หลักการทำงานของ PIGMENT LASER</h3><p><strong>PIGMENT LASER</strong> เป็นเลเซอร์ที่เหมาะมากกับปัญหากระ เพื่อเผยผิวใหม่ที่ขาวใส เพราะมีความยาวคลื่น 532 และ 1,064 นาโนเมตร ปล่อยความยาวคลื่นความถี่ไปทำลายเม็ดสี (เมลานิน) ที่ชั้นหนังกำพร้าและหนังแท้ เพื่อรักษาความผิดปกติของเม็ดสี ทำให้เซลล์เม็ดสีแตกกระจายออก แล้วค่อยๆ ถูกกำจัดออกจากผิวหนังโดยกลไกธรรมชาติ จากนั้นเม็ดเลือดขาวจะค่อยๆเข้ามาเก็บกินเม็ดสีที่ถูกทำลาย ทำให้รอยกระต่างๆ รอยสัก และรอยปานดำค่อยๆจางลงและหายไปในที่สุด เผยผิวที่ขาวใส ผลข้างเคียงจากการลดเลือนกระ โดยใช้เครื่องเลเซอร์ชนิดนี้พบได้น้อยมาก ทั้งนี้การรักษาขึ้นอยู่กับการวินิจฉัยของแพทย์ผิวหนังที่ด็อกเตอร์ ยังเกอร์ คลินิก </p><h3>PIGMENT
  LASER เหมาะสำหรับใช้แก้ปัญหา</h3><ul><li>ช่วยในการลดเลือนรอยกระตื้น กระลึก กระแดด (SOLAR LENTIGINE) ปานดำ (หลังทำจะมีแผลตกสะเก็ดเล็กน้อย)</li><li>ช่วยเพิ่มความขาวใสให้ผิวหน้า ใต้ตา ใต้วงแขน ทำให้สีของเส้นขนอ่อนบางลง และยังช่วยกระชับรูขุมขน (ไม่มีสะเก็ด)</li><li>ช่วยลบรอยสัก (หลังทำจะมีแผลตกสะเก็ด)</li></ul>
closing: 'สนใจติดต่อรับบริการได้ที่ด็อกเตอร์ ยังเกอร์ คลินิก ทุกสาขา สอบถามโทร. 02-261-3697-8 หรือทาง Facebook และ Line ID : @Doctoryounger'
