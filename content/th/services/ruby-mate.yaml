name: RUBY MATE
tagline: ยกกระชับผิว ลดเลือนริ้วรอย และถุงใต้ตา
body: <h3>หลักการทำงานของ RUBY MATE TREATMENT</h3><p>ทรีทเม้นท์ที่ช่วยทำให้ผิวกระชับ โดยการใช้กระแสไฟฟ้าความถี่ต่ำ ในการกดและนวดบริเวณใบหน้า ใต้คาง เพื่อช่วยกระตุ้นการทำงานของกล้ามเนื้อบริเวณใบหน้า ช่วยให้ผิวยกกระชับ เต่งตึง เนื่องจากการกดและนวดแบบเฉพาะของทรีทเม้นท์นี้ จึงช่วยให้ระบบไหลเวียนน้ำเหลืองดียิ่งขึ้น จึงส่งผลทำให้ผิวยกกระชับ เต่งตึง และปราศจากไขมันส่วนเกิน อีกทั้งช่วยลดเลือนริ้วรอย ช่วยให้ถุงใต้ตากระชับขึ้นได้อีกด้วย เพิ่มความอ่อนเยาว์ให้ใบหน้า</p><h3>อัตราค่าบริการ</h3><ul><li>ราคาครั้งละ <strong>2,000</strong> บาท</li><li>คอร์ส 10 ครั้ง ราคา <strong>18,000</strong> บาท</li></ul>
closing: 'สนใจติดต่อรับบริการได้ที่ด็อกเตอร์ ยังเกอร์ คลินิก ทุกสาขา สอบถามโทร. 02-261-3697-8 หรือทาง Facebook และ Line ID : @Doctoryounger'
