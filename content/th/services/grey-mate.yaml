name: GREY MATE
tagline: ช่วยผลัดเซลล์ผิว และลดเลือนริ้วรอย จุดด่างดำ แผลเป็นจากสิว
body: '<h3>ผลลัพธ์ที่ได้จาก GREY MATE TREATMENT</h3><ul><li>ช่วยผลัดเซลล์ผิวเก่าออก </li><li>ช่วยลดเลือนริ้วรอย</li><li>รักษารอยแตกลาย</li><li>ลดเลือนจุดด่างดำ</li><li>ช่วยรักษารอยแผลเป็นจากสิว</li><li>ช่วยให้ผิวเนียนใส</li><li>ช่วยกระชับรูขุมขน</li></ul><h3>หลักการทำงานของ GREY MATE TREATMENT</h3><p>ทรีทเม้นท์ในการฟื้นฟูความงามให้กลับคืนสู่ผิวด้วยเครื่องกรอผิวผสานกับการนวดด้วยแสง LED และการสั่น โดยใช้ผงคริสตัลเป็นตัวกลาง จึงช่วยผลัดเซลล์ผิวชั้นบน ลดเลือนริ้วรอย รอยแตกลาย จุดด่างดำ รวมถึงแผลเป็นจากสิว และยังช่วยกระตุ้นการสร้างคอลลาเจนใหม่ ช่วยกระชับรูขุมขน ทำให้ผิวเนียนใส อย่างอ่อนโยน โดยกระบวนการทำงาน ดังนี้</p><p><strong>VACUUM : (ดูด) </strong>ช่วยเพิ่มการไหลเวียนของเลือด</p><p><strong>EXFOLIATION : (ขัด) </strong>ช่วยขัดเพื่อทำการผลัดเซลล์ผิวอย่างอ่อนโยนและกระตุ้นเซลล์ใหม่ ลดปัญหาริ้วรอย (EXCELLENT FOR REDUCING WRINKLES) จุดด่างดำ (HYPER-PIGMENTATIONS) และรอยแตกลาย (STRETCH-MASKS) </p><p><strong>PHOTO-VIBRATING MASSAGE : (นวดด้วยแสงและสั่น) </strong>โดยเครื่องจะมีคุณสมบัติในการนวด ทำให้ผิวหนังสงบ
  ทำการ DRAIN และ DETOX ของเสีย กระตุ้นเนื้อเยื่อ และลดแรงในการหดตัวของกล้ามเนื้อ ช่วยรักษาแผลเป็นจากสิว</p><h3>อัตราค่าบริการ</h3><ul><li>ราคาครั้งละ <strong>1,600</strong> บาท</li><li>คอร์ส 10 ครั้ง ราคา <strong>14,400</strong> บาท</li></ul>'
closing: 'สนใจติดต่อรับบริการได้ที่ด็อกเตอร์ ยังเกอร์ คลินิก ทุกสาขา สอบถามโทร. 02-261-3697-8 หรือทาง Facebook และ Line ID : @Doctoryounger'
