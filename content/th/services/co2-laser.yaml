name: CO2 LASER
tagline: รักษาไฝ ขี้แมลงวัน หูด ต่อมไขมันโต สิวหิน กระเนื้อ ติ่งเนื้อต่างๆ
body: <p>จัดการกับปัญหากวนใจผิวอย่างขี้แมลงวัน ไฝ หูด ต่อมไขมันโต กระเนื้อ ติ่งเนื้อต่างๆ รวมถึงสิวหิน สิวข้าวสาร ได้ด้วย <strong>CO2 LASER</strong></p><p><img src="https://www.doctoryounger.com/img-uploads/011%20copy.jpg" alt=""></p><h3>ผลลัพธ์ที่ได้จาก CO2 LASER</h3><ul><li>เม็ดของขี้แมลงวัน (LENTIGINES) และไฝจะหายไป</li><li>ผิวบริเวณที่เป็นกระเนื้อ (SEBORRHEIC KERATOSIS) จะเรียบเนียน</li><li>รักษาติ่งเนื้อผิวหนังทุกชนิด (SKIN TAG )</li><li>รักษาต่อมไขมันโต (SSGH)</li><li>รักษาสิวหิน (SYRINGOMA)</li><li>รักษาสิวข้าวสาร (MILIA)</li><li>รักษาหูด (WART) </li></ul><h3>หลักการทำงานของ CO2 LASER</h3><p><strong>CO2 LASER</strong> เป็นเทคโนโลยีเลเซอร์ที่มีความยาวคลื่น 10,600 nm.เกิดจากการขยายพลังงานที่มีแหล่งกำเนิดจากก๊าซ CO2 ให้คายพลังงานออกมาในรูปแสง ปัจจุบัน <strong>CO2 LASER</strong> ถูกทำให้มีพลังงานสูงขึ้น ลดระยะเวลาฉายแสงเลเซอร์ลงให้สั้นถึงระดับ MICROSECONDS (ULTRA PULSE) ทำให้เกิดประสิทธิภาพของการรักษาที่ดี จึงสามารถรักษาขี้แมลงวัน ไฝ หูด ต่อมไขมันโต สิวหิน สิวข้าวสาร กระเนื้อ และติ่งเนื้อต่างๆได้</p><h3>ความปลอดภัยเมื่อรักษาด้วย
  CO2 LASER </h3><p><strong>CO2 LASER</strong> จะมีการตกสะเก็ดที่ผิวหนังเป็นเวลา 7-14 วัน และหลุดออกได้เอง</p>
closing: 'สนใจติดต่อรับบริการได้ที่ด็อกเตอร์ ยังเกอร์ คลินิก ทุกสาขา สอบถามโทร. 02-261-3697-8 หรือทาง Facebook และ Line ID : @Doctoryounger'
