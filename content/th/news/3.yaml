title: ย้อนเวลาสู่ความอ่อนเยาว์
date: 29 Oct 2013
body: <h3><em></em> ย้อนเวลาสู่ความอ่อนเยาว์</h3><p><img src="https://www.doctoryounger.com/img-uploads/SPG1999.jpg" alt=""><img src="https://www.doctoryounger.com/img-uploads/242-mix1.jpg" alt=""><img src="https://www.doctoryounger.com/img-uploads/Adver-12601.jpg" alt=""></p><p>จากกระแสนิยมเรื่องหน้าใส หน้าเด้งสไตล์เกาหลีและญี่ปุ่น ทำให้ปัจจุบันธุรกิจเสริมความงาม ไม่ว่าจะเป็นร้านเสริมสวย คลินิกหรือสถาบันเสริมความงาม และคลินิกศัลยกรรมตกแต่งมีอัตราการเติบโตอย่างต่อเนื่องไม่ต่ำกว่า 10% ต่อปี โดยเฉพาะคลินิกเสริมความงาม คลินิกศัลยกรรมเรียกว่าฮอตสุดขีดเนื่องจากมีกิจการเกิดขึ้นมากกว่า 100 แห่งทั่วประเทศ มีมูลค่าธุรกิจทั้งหมดรวมกว่า 12,000-15,000 ล้านบาท คิดเป็นอัตราการเติบโตเฉลี่ยปีละ 10-50% และมีแนวโน้มที่จะสูงขึ้นเรื่อยๆ</p><p>Doctor Younger เป็นคลินิกเพื่อความงามที่บริหารงานอย่างใกล้ชิดจากแพทย์ผู้เชี่ยวชาญทางด้านผิวพรรณเพื่อความงามระดับสากล คือแพทย์หญิงวิไล ธนสารอักษร ประธานบริหาร Doctor Younger และนายแพทย์สว่าง อัมพรพันธ์ กรรมการผู้จัดการ Doctor Younger ที่พร้อมด้วยบริการอันหลากหลายประกอบกับเทคโนโลยีที่ทันสมัย
  ผ่านการรับรองความปลอดภัยจากองค์การ FDA ของสหรัฐอเมริกา และจากองค์การ CE ของยุโรป</p><p>จุดเริ่มต้นของการทำธุรกิจคลินิกเพื่อความงามมาจากการที่คุณหมอวิไลซึ่งเป็นแพทย์ที่จบมาจากโรงพยาบาลรามาธิบดี แพทย์ผู้เชี่ยวชาญทางด้านอายุรศาสตร์ แล้วก็ต่อแพทย์ผู้เชี่ยวชาญทางด้านผิวหนังจากประเทศอังกฤษและก็ไปศึกษาต่อที่ประเทศอเมริกาทางด้านเลเซอร์ผิวหนัง จนกลับมาที่เมืองไทย พ.ศ. 2538 มาบรรจุเป็นอาจารย์พิเศษหน่วยแพทย์ผิวหนังโรงพยาบาลรามาธิบดีจนถึงปัจจุบัน และก็เป็นอาจารย์พิเศษที่โรงพยาบาลสมิติเวชด้วย นอกจากนี้ยังเป็น Lecturer ทางด้าน Dermatology ผิวหนังเพื่อความงามมาโดยตลอดทั้งในประเทศและต่างประเทศ ส่วนคุณหมอสว่างจบแพทยศาสตร์จากจุฬาลงกรณ์มหาวิทยาลัย แล้วไปศึกษาเพิ่มเติมด้าน Anti–Aging Medicine ที่ประเทศอังกฤษ พอกลับมาถึงประเทศไทยก็ได้เปิดคลินิกในตอนนั้นใช้ชื่อว่า Derm Clinic หลังจากนั้นก็ไปศึกษาเพิ่มเติมในหลักสูตร World Anti-Aging ที่ฝรั่งเศสอีก 2 ปี ซึ่งหลังจากเรียนกลับมาก็ได้นำความรู้ที่ได้มาดูแลตัวเองและได้แนะนำคนใกล้ตัวรวมถึงลูกค้าไม่ว่าจะเป็นเรื่องอาหารและออกกำลังกาย นั่นคือจุดเริ่มต้นของการศึกษาเรื่องความงาม
  ก็เลยไปศึกษาต่อในหลักสูตรผิวพรรณเพื่อความงามที่ประเทศสหรัฐอเมริกา พอกลับมาก็คิดว่าน่าจะเปลี่ยนชื่อเป็น Doctor Younger</p><p>จุดแข็งของ Doctor Younger คือมุ่งเน้นตอบโจทย์ที่จำเป็นต่อปัญหาของลูกค้า แก้ปัญหาตามที่ลูกค้าต้องการเป็นหลัก รักษาด้วยนวัตกรรมที่ได้มาตรฐาน เพื่อความปลอดภัยในราคาที่ยุติธรรม และมีแพทย์ผู้เชี่ยวชาญของเมืองไทยที่ได้รับการยอมรับในระดับโลก คือคุณหมอวิไล ธนสารอักษร และประสบการณ์ของคุณหมอสว่าง อัมพรพันธ์ ที่ได้ผ่านการฝึกอบรมหลักสูตรเพื่อความงามต่างๆ รวมถึงมีเครือข่ายที่กว้างขวางกับแพทย์และผู้นำนวัตกรรมใหม่ในวงการแพทย์จากทั่วทุกมุมโลกด้วย</p><p>สำหรับอีกหนึ่งจุดเด่นคือการดูแลผิวพรรณของผู้เข้ารับการรักษาให้ได้ Look Younger นั้น Doctor Younger บอกว่ามีทั้งแบบค่อยเป็นค่อยไปและเร่งด่วนขึ้นอยู่กับแต่ละบุคคล เริ่มแก้ปัญหาจากเรื่องของริ้วรอยความหย่อนยาน คือ โบท็อกซ์ ฟิลเลอร์ เลเซอร์ IPL คลื่นอัลตร้าซาวน์ คลื่นวิทยุ ซึ่งจะทำให้เนื้อแท้หนังแท้มีการหดตัวขึ้นมา นวัตกรรมเหล่านี้จะช่วยให้ผู้ที่มารักษาดูอ่อนเยาว์ขึ้นได้ แต่เนื่องจากผิวของแต่ละคนแตกต่างกัน แพทย์จึงต้องวิเคราะห์ก่อนว่าอุปกรณ์แต่ละตัวเหมาะกับผิวของผู้รับบริการหรือเปล่า
  ความเข้มของสีผิว โครงสร้างความหนาบางของผิวหนัง โดยจะต้องทำการตั้งค่าของอุปกรณ์ซึ่งเป็นเรื่องที่ควรระวังและสำคัญมาก</p><p>มุมมองด้านเสริมความงามในปัจจุบันไม่ใช่เรื่องเสียหายขึ้นอยู่กับแต่ละบุคคล คนแรกที่จะตัดสินใจได้คือตัวคุณเองว่าจำเป็นต้องทำหรือไม่ แล้วก็ศึกษาข้อมูลพร้อมทั้งปรึกษาแพทย์ผู้เชี่ยวชาญเพิ่มเติมว่าเราจะทำโดยวิธีการไหน มีข้อดีข้อเสียต่างกันอย่างไร แต่ถ้าเป็นการเสริมความงามหรือศัลยกรรมตามแฟชั่น ทำโดยความไม่มีสติ อันนี้ก็ไม่สนับสนุนเลย</p><p>นอกจากนี้ภายใน Doctor Younger มีการตกแต่งไม่เหมือนกับที่อื่นทำให้เป็นเหมือนสปา บรรยากาศให้ความรู้สึกสบาย กว้างขวาง มีที่นั่งพักผ่อนจึงไม่ได้ให้ความรู้สึกว่ามาหาหมอเพราะคุณไม่ได้เจ็บป่วยอะไร เหมาะกับการมาผ่อนคลายความตึงเครียดด้วยการเสริมสร้างความงาม หรือรักษาปัญหาผิวพรรณภายใต้บรรยากาศอันอบอุ่นและเป็นกันเองเหมือนบ้าน รวมถึงเรื่องของนวัตกรรมและเทคโนโลยีใหม่ๆ ที่มีแพทย์และผู้ชำนาญการในการใช้เครื่องที่ผ่านการฝึกอบรมโดยคุณหมอวิไลเอง</p><p>Doctor Younger บอกเพิ่มเติมว่าการเลือกใช้สถาบันความงาม ผู้บริโภคจะต้องศึกษาหาข้อมูลจะต้องดูก่อนว่าเรื่องที่เราจะทำส่งผลต่อผิวพรรณมากน้อยแค่ไหนถ้ามากอาจจะมีความเสี่ยงสูง
  อย่างปัจจุบันมีข่าวว่าเด็กๆ ซื้อโบท็อกซ์ไปฉีดเองที่มหาวิทยาลัย ถือว่าอันตรายมาก การเลือกสถาบันที่มีแพทย์ที่เชี่ยวชาญทั้งการรักษาและการใช้เทคโนโลยีมีความจำเป็นเพื่อความปลอดภัยของผู้บริโภคเอง</p><p>Doctor Younger ปัจจุบันมี 6 สาขาด้วยกัน ซึ่งตั้งอยู่ในกรุงเทพฯ คือ สาขา Terminal 21 สุขุมวิท ซอย 19, สาขาอาคารจัสมิน สุขุมวิท ซอย 23, สาขาเควิลเลจ สุขุมวิท ซอย 26, สาขาเมกกะ บางนา, สาขาธัญญะ ช็อปปิ้งพาร์ค ศรีนครินทร์ และสาขารามคำแหง ซอย 12</p><p><em>สอบถามข้อมูลเพิ่มเติม<br></em><em>Doctor Younger Call Center 0-2261-3697-8</em></p>
