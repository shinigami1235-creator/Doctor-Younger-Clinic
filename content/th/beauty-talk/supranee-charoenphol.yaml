qa:
- q: มีทรีทเมนท์ใดบ้างที่ทำเป็นประจำ และอยากแนะนำคนอื่นบ้างคะ?
  a: ทรีทเมนท์ที่ทำประจำจะเป็นคอร์สกระชับสัดส่วน Endermologie และเครื่อง RF ตัวใหม่ชื่อ RF ADVANCE เพราะไก่เห็นผลเอง เหมาะกับผู้หญิงทำงานที่ไม่มีเวลาออกกำลังกาย สำหรับผิวหน้า ไก่ชอบทำตัว Filler Treatment ค่ะ ตัวนี้สามารถทำได้โดยที่ไม่ต้องพึ่งศัลยกรรมค่ะ แล้วก็ไม่มีแผลเป็นด้วยค่ะ ทำแล้วก็จะดูดี สวยไปตลอดเลยค่ะ
- q: เพราะอะไรจึงมาเป็นพรีเซ็นเตอร์ให้ที่ Doctor Younger Clinic คะ?
  a: หลังจากมาปรึกษาคุณหมอ แล้วก็มาเป็นลูกค้าอยู่หลายปี ก็เชื่อมั่นในเรื่องของคุณภาพการรักษาและการบริการ พอ Doctor Younger ติดต่อมาให้เป็นพรีเซ็นเตอร์ ก็รีบตอบรับทันทีค่ะ แล้วก็มั่นใจด้วยว่าทุกท่านที่เข้ามารับบริการจะไม่ผิดหวัง
- q: มีทรีทเมนท์ใดบ้างที่ทำเป็นประจำ และอยากแนะนำคนอื่นบ้างคะ?
  a: ทรีทเมนท์ที่ทำประจำจะเป็นคอร์สกระชับสัดส่วน Endermologie และ Medicell ลดน้ำหนักได้จริงๆ เพราะไก่เห็นผลเอง เหมาะกับผู้หญิงทำงานที่ไม่มีเวลาออกกำลังกาย สำหรับผิวหน้า ไก่ชอบทำตัว Filler Treatment ค่ะ ตัวนี้สามารถทำได้โดยที่ไม่ต้องพึ่งศัลยกรรมค่ะ แล้วก็ไม่มีแผลเป็นด้วยค่ะ ทำแล้วก็จะดูดี สวยไปตลอดเลยค่ะ
- q: ประทับใจอะไรใน Doctor Younger Clinic บ้างคะ?
  a: สิ่งที่ประทับใจใน Doctor Younger ก็ประทับใจในเรื่องของคุณภาพ การรักษาของคุณหมอที่นี่ค่ะ ท่านให้คำปรึกษาที่ดี มีความชำนาญสูง แล้วก็มีความจริงใจด้วยค่ะ ส่วนในเรื่องของตัวยา ตัวทรีทเมนท์ทุกตัวก็มีความปลอดภัยสูง ได้รับมาตรฐานระดับสากลค่ะ ราคาก็ไม่แพงเกินไป แล้วก็ในเรื่องของการบริการ พนักงานทุกท่านที่นี่ก็ให้บริการที่ดีมากเลยค่ะ แล้วไว้พบกันที่ Doctor Younger นะคะ
