qa:
- q: มีทรีทเมนท์ใดบ้างที่ทำเป็นประจำ และอยากแนะนำคนอื่นบ้างคะ?
  a: ที่หยาดทำเป็นประจำก็จะมี TKS Laser ค่ะ เป็นเลเซอร์เกี่ยวกับการกำจัดขนถาวร เพราะหยาดเป็นคนที่มีขนตามหน้าแข้งตามมือเยอะ ก็จะใช้ตัวนี้ค่ะ แล้วก็จะมี Aramis Laser ค่ะ Aramis Laser หยาดก็จะทำกับหน้า จะเป็นพวกเสริมสร้างคอลลาเจน แล้วก็จะช่วยให้ผิวหน้าแลดูอ่อนเยาว์ด้วยค่ะ แล้วก็จะมีอีกอันหนึ่งก็คือ Exelo 2 Laser ค่ะ อันนี้ก็จะลบรอยแผลเป็น ลบรอยสิว แล้วก็กระชับรูขุมขนด้วยค่ะ
- q: มีทรีทเมนท์ใดบ้างที่ทำเป็นประจำ และอยากแนะนำคนอื่นบ้างคะ?
