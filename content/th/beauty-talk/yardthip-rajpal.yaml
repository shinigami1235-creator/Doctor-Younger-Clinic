- q: ประทับใจอะไรใน Doctor Younger Clinic บ้างคะ?
  a: ส่วนที่หยาดประทับใจใน Doctor Younger Clinic อย่างแรกก็คือสถานที่ มาแล้วเหมาะกับการพักผ่อน สวยงาม และพี่ๆ ที่ดูแลเราก็น่ารักมาก ให้คำแนะนำ ให้คำปรึกษาอย่างดี คุณหมอก็เป็นผู้เชี่ยวชาญ การรักษามีความปลอดภัยและคุณภาพสูง หยาดก็เลยประทับใจ หวังว่าจะได้เจอกันที่ Doctor Younger นะคะ
