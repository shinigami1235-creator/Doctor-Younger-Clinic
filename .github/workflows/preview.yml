# Builds the preview on every push to main and publishes dist/ to the gh-pages branch,
# which GitHub Pages serves at https://<account>.github.io/Doctor-Younger-Clinic/
name: Build preview
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Copy the clinic's photos into static/media so they load from the preview itself
      - run: python tools/fetch_media.py
        timeout-minutes: 8
        continue-on-error: true
      - run: python build.py --mode preview
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
